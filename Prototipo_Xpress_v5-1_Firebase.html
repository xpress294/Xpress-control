     se lee y se escribe en la colección "clientes" de Firestore, así que

     cualquier otro dispositivo/navegador que abra este mismo archivo. -->

<script>
  // Fija la altura real de pantalla una sola vez (al cargar y al rotar el
  // celular), en vez de depender de 100vh, que en Chrome/Safari móvil
  // cambia cada vez que la barra de direcciones se esconde o aparece al
  // hacer scroll — eso es lo que provocaba que la app "saltara" sola.
  function fijarAlturaApp(){
    document.documentElement.style.setProperty('--app-vh', window.innerHeight + 'px');
  }
  fijarAlturaApp();
  window.addEventListener('orientationchange', () => setTimeout(fijarAlturaApp, 200));
  let ultimoAnchoVentana = window.innerWidth;
  window.addEventListener('resize', () => {
    if(window.innerWidth !== ultimoAnchoVentana){
      ultimoAnchoVentana = window.innerWidth;
      fijarAlturaApp();
    }
  });
</script>

/* ---- Centro de Control Operativo ----

   reales del prototipo (no es una lista fija): cada vez que cambian los
   datos, las alertas se recalculan. */
function calcularAlertasOperativas(){
  const alertas = [];
  const activas = GUIAS.filter(g => !g.eliminada);
  const diasDesde = (fechaStr) => {
    const f = parseFechaGuia(fechaStr);
    if(!f) return null;
    return Math.round((FECHA_REF_HOY - f) / 86400000);
  };

  activas.forEach(g => {
    if(!["Entregado","Finalizado","Devolución"].includes(g.estado)){
      const dias = diasDesde(g.fecha);
      if(dias !== null && dias >= 1){
        alertas.push({ tipo:"Guía detenida más de 24 horas", icon:"🔴", guiaId:g.id,
          mensaje:`Guía ${g.id} (${g.cliente}) lleva ${dias*24}+ horas en estado "${g.estado}" sin avanzar.` });
      }
    }
    if(g.estado === "Asignado a piloto"){
      const dias = diasDesde(g.fecha);
      if(dias !== null && dias >= 1){
        alertas.push({ tipo:"Ruta atrasada", icon:"🔴", guiaId:g.id,
          mensaje:`Guía ${g.id} — ruta "${g.ruta}" con el piloto ${g.piloto} está atrasada.` });
      }
    }
    if(g.urgente && !["Entregado","Finalizado"].includes(g.estado)){
      alertas.push({ tipo:"Entrega Xpress a punto de vencer", icon:"🔴", guiaId:g.id,
        mensaje:`Guía Xpress 24h ${g.id} (${g.cliente}) está a punto de vencer su plazo de entrega.` });
    }
    if((g.escaneos||0) >= 2){
      alertas.push({ tipo:"Paquete escaneado dos veces", icon:"🔴", guiaId:g.id,
        mensaje:`Guía ${g.id} fue escaneada ${g.escaneos} veces — verificar posible duplicado o error de bodega.` });
    }
    if(["Entregado","Finalizado"].includes(g.estado) && !g.fotoEntrega){
      alertas.push({ tipo:"Guía sin fotografía de entrega", icon:"🔴", guiaId:g.id,
        mensaje:`Guía ${g.id} está "${g.estado}" pero no tiene foto de entrega registrada.` });
    }
    if(["Entregado","Finalizado"].includes(g.estado) && !g.firmaEntrega){
      alertas.push({ tipo:"Guía sin firma", icon:"🔴", guiaId:g.id,
        mensaje:`Guía ${g.id} está "${g.estado}" pero no tiene firma del cliente registrada.` });
    }
    const cli = CLIENTES.find(c => c.comercio === g.cliente);
    const esRolAdministrativo = state.role === "Super Administrativo" || state.role === "Administrativo";
    if(cli && esRolAdministrativo && esClienteVip(cli) && !["Entregado","Finalizado","Devolución"].includes(g.estado)){
      alertas.push({ tipo:"Cliente VIP esperando entrega", icon:"🔴", guiaId:g.id,
        mensaje:`Cliente VIP ${cli.comercio} tiene la guía ${g.id} en estado "${g.estado}", aún sin entregar.` });
    }
  });

  EMPLEADOS.filter(e => e.rol === "Piloto").forEach(p => {
    const dias = diasDesde(p.ultimaActividad);
    if(dias !== null && dias >= 1){

        mensaje:`Piloto ${p.nombre} no registra movimiento desde ${p.ultimaActividad}.` });

  });

  return alertas;
}

/* Tarifa de envío y comisión "por determinado": valor por defecto que se
   asigna a todo cliente nuevo. Una vez creado el cliente, solo el
   Super Administrativo puede modificar estos dos valores. */
const TARIFA_ENVIO_DEFAULT = 4.10;
const COMISION_DEFAULT = 2.5;

/* ============ ESTRUCTURA FINANCIERA (Herramientas · Super Administrativo) ============
   Define cómo se compone el valor final que paga el cliente por un paquete/envío:
   tarifa base + seguro sobre el valor declarado + recargos + comisión operativa + IVA.
   Editable únicamente por el Super Administrativo. */
let ESTRUCTURA_FINANCIERA = {
  tarifaBaseEnvio: TARIFA_ENVIO_DEFAULT,   // US$ fijo por envío
  comisionOperativaPct: COMISION_DEFAULT,  // % sobre el subtotal (tarifa + seguro + recargos)
  seguroValorDeclaradoPct: 1.5,            // % sobre el valor declarado del paquete
  recargoXpress24h: 3.00,                  // US$ fijo adicional si el envío es Xpress 24h
  recargoZonaExtendida: 1.50,              // US$ fijo adicional si el destino está fuera del área metropolitana
  ivaPct: 13,                              // % de IVA sobre el subtotal + comisión
};

function calcularValorFinalPaquete(opts){
  const valorDeclarado = Math.max(0, Number(opts.valorDeclarado) || 0);
  const tarifaBase = ESTRUCTURA_FINANCIERA.tarifaBaseEnvio;
  const seguro = valorDeclarado * (ESTRUCTURA_FINANCIERA.seguroValorDeclaradoPct/100);
  const recargoXpress = opts.esXpress ? ESTRUCTURA_FINANCIERA.recargoXpress24h : 0;
  const recargoZona = opts.esZonaExtendida ? ESTRUCTURA_FINANCIERA.recargoZonaExtendida : 0;
  const subtotal = tarifaBase + seguro + recargoXpress + recargoZona;
  const comision = subtotal * (ESTRUCTURA_FINANCIERA.comisionOperativaPct/100);
  const iva = (subtotal + comision) * (ESTRUCTURA_FINANCIERA.ivaPct/100);
  const total = subtotal + comision + iva;
  return { valorDeclarado, tarifaBase, seguro, recargoXpress, recargoZona, subtotal, comision, iva, total };
}

/* ============ SINCRONIZACIÓN DE CLIENTES CON FIRESTORE ============
   CLIENTES ya no vive solo en la memoria del navegador: se guarda en la
   colección "clientes" de Firestore (proyecto xpress-control), y se
   mantiene sincronizado en vivo con onSnapshot. Así, un cliente creado
   en un dispositivo aparece igual en cualquier otro dispositivo/navegador
   que abra este mismo archivo, y el login funciona en todos lados.
   clientesListos pasa a true en cuanto llega la primera respuesta de
   Firestore (vacía o con datos); el login espera a que esto sea true
   para no comparar contra una lista todavía incompleta. */
let clientesListos = false;

function guardarClienteEnFirestore(cliente){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  dbFirestore.collection("clientes").doc(cliente.id).set(cliente).catch(err => {
    console.error("Error guardando cliente en Firestore:", err);
    alert("El cambio se aplicó en esta pantalla, pero no se pudo guardar en la base de datos (revisa tu conexión a internet). Es posible que no se vea reflejado en otros dispositivos.");
  });
}

function iniciarSincronizacionClientes(){
  if(typeof dbFirestore === "undefined" || !dbFirestore){
    clientesListos = true; // sin Firebase disponible, se sigue usando la lista local
    return;
  }
  dbFirestore.collection("clientes").onSnapshot((snapshot) => {
    if(snapshot.empty && !clientesListos){
      // Primera carga y la colección está vacía: subimos los 2 clientes
      // de ejemplo como semilla, para que Firestore quede como fuente
      // real de datos desde el inicio.
      CLIENTES.forEach(c => guardarClienteEnFirestore(c));
      clientesListos = true;
      return;
    }
    const nuevaLista = [];
    snapshot.forEach(doc => nuevaLista.push(doc.data()));
    nuevaLista.sort((a,b) => (a.id||"").localeCompare(b.id||""));
    CLIENTES.length = 0;
    nuevaLista.forEach(c => CLIENTES.push(c));
    const primeraVez = !clientesListos;
    clientesListos = true;
    // Se repinta si es la primera vez que llegan datos (para quitar el aviso
    // de "Conectando..." del login) o si ya hay sesión iniciada (para que
    // pantallas como Clientes reflejen cambios hechos desde otro dispositivo).
    if(typeof state !== "undefined" && (primeraVez || state.role)) render();
  }, (err) => {
    console.error("Error sincronizando clientes con Firestore:", err);
    clientesListos = true; // se deja avanzar con lo que haya en memoria local
  });
}

function iniciarSincronizacionEmpleados(){
  if(typeof dbFirestore === "undefined" || !dbFirestore){
    empleadosListos = true; // sin Firebase disponible, se sigue usando la lista local
    return;
  }
  dbFirestore.collection("empleados").onSnapshot((snapshot) => {
    if(snapshot.empty && !empleadosListos){
      // Primera carga y la colección está vacía: subimos los empleados de
      // ejemplo como semilla, para que Firestore quede como fuente real
      // de datos desde el inicio.
      EMPLEADOS.forEach(e => guardarEmpleadoEnFirestore(e));
      empleadosListos = true;
      return;
    }
    const nuevaLista = [];
    snapshot.forEach(doc => nuevaLista.push(doc.data()));
    nuevaLista.sort((a,b) => (a.id||"").localeCompare(b.id||""));
    EMPLEADOS.length = 0;
    nuevaLista.forEach(e => EMPLEADOS.push(e));
    const primeraVez = !empleadosListos;
    empleadosListos = true;
    if(typeof state !== "undefined" && (primeraVez || state.role)) render();
  }, (err) => {
    console.error("Error sincronizando empleados con Firestore:", err);
    empleadosListos = true; // se deja avanzar con lo que haya en memoria local
  });
}

/* La información de "tienda" (nombre, dirección, número de asesor, Metro Galerías)
   ahora es parte del registro del cliente — se captura al crear el cliente,
   en el apartado que solo ven los administradores. */
function tiendaLabel(c){
  if(!c) return "-";
  return c.comercio + (c.numeroAsesor ? " - " + c.numeroAsesor : "");
}

/* Devuelve el registro de cliente (con su info de tienda) para la cuenta logueada */
function clienteActualObj(){
  return CLIENTES.find(c => c.comercio === CLIENTE_ACTUAL) || null;
}

/* Resuelve el registro de empleado (Super Administrativo / Administrativo / Piloto)
   que representa a la cuenta logueada en este prototipo, según el rol activo. */
function empleadoActualObj(){
  return EMPLEADOS.find(e => e.rol === state.role) || null;
}

/* Nombre del perfil que está creando la guía en este momento: el nombre de la
   tienda si es un Cliente, o el nombre del perfil del usuario administrativo
   (Super Administrativo/Administrativo) si es quien la está generando. */
function creadorActual(){
  if(state.role === "Cliente"){
    const c = clienteActualObj();
    return { nombre: c ? tiendaLabel(c) : CLIENTE_ACTUAL, tipo: "Tienda" };
  }
  const emp = empleadoActualObj();
  return { nombre: emp ? emp.nombre : state.role, tipo: "Usuario administrativo" };
}

/* Texto a mostrar en la columna "Creado por": el nombre del perfil que
   generó la guía, dejando en evidencia si fue una tienda o un usuario
   administrativo. */
function creadoPorTexto(g){
  if(!g.creadoPor) return "-";
  return g.creadoPor + (g.creadoPorTipo ? ` <span style="color:#94a3b8;font-weight:400;">(${g.creadoPorTipo})</span>` : "");
}

/* Resuelve la tienda/cliente para el cual se está creando la guía:
   - Cliente: siempre su propia cuenta.
   - Super Administrativo / Administrativo: el cliente que hayan buscado
     y seleccionado en el buscador de "Crear Guía". */
function tiendaParaCrearGuia(){
  if(state.role === "Cliente") return clienteActualObj();
  return CLIENTES.find(c => c.id === state.crearGuiaTiendaId) || null;
}

/* Genera las <option> del selector de agencia/dirección restringida, usado
   para clientes Metro Galerías y clientes Lockers en Crear Guía. */
function agenciasDireccionOptions(seleccionada){
  const placeholder = `<option value="" ${!seleccionada ? "selected" : ""} disabled>Selecciona una agencia / hub...</option>`;
  const opciones = AGENCIAS_XPRESS.map(a => {
    const label = a.num + " — " + a.nombre + " (" + a.direccion + ")";
    return `<option value="${esc(a.direccion)}" ${seleccionada === a.direccion ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  return placeholder + opciones;
}

/* Catálogo de tipos de punto permitidos para envíos PLUS de clientes Metro
   Galerías. Cada tipo tiene un prefijo fijo; el usuario solo agrega el
   complemento (el nombre propio del lugar), nunca una dirección libre
   completa. Ej.: "Alcaldía" + "San Vicente" -> "Alcaldía de San Vicente".
   "Gasolinera" + "Puma Ateos" -> "Gasolinera Puma Ateos". */
const PUNTOS_PLUS = [
  { value:"Parque", label:"Parque", prefijo:"Parque", conector:"" },
  { value:"Gasolinera", label:"Gasolinera", prefijo:"Gasolinera", conector:"" },
  { value:"Metrocentro", label:"Metrocentro", prefijo:"Metrocentro", conector:"" },
  { value:"Alcaldia", label:"Alcaldía", prefijo:"Alcaldía", conector:"de" },
  { value:"PuntoEncuentro", label:"Punto de encuentro", prefijo:"Punto de encuentro", conector:"" },
  { value:"Rambla", label:"Rambla", prefijo:"Rambla", conector:"" },
];

function puntosPlusOptions(seleccionado){
  const placeholder = `<option value="" ${!seleccionado ? "selected" : ""} disabled>Selecciona el tipo de punto...</option>`;
  const opciones = PUNTOS_PLUS.map(p => `<option value="${p.value}" ${seleccionado === p.value ? "selected" : ""}>${esc(p.label)}</option>`).join("");
  return placeholder + opciones;
}

/* Construye el texto final de la dirección PLUS a partir del tipo de punto
   elegido y el complemento (nombre propio) que escribió el usuario. */
function construirDireccionPuntoPlus(tipoPuntoValue, complemento){
  const punto = PUNTOS_PLUS.find(p => p.value === tipoPuntoValue);
  if(!punto || !complemento) return "";
  const comp = complemento.trim();
  return punto.conector ? `${punto.prefijo} ${punto.conector} ${comp}` : `${punto.prefijo} ${comp}`;
}

/* ---- Ubicación del piloto al momento de marcar "Entregado" ---- */
function ubicacionSimulada(){
  const lat = SV_LAT_MIN + Math.random() * (SV_LAT_MAX - SV_LAT_MIN);
  const lng = SV_LNG_MIN + Math.random() * (SV_LNG_MAX - SV_LNG_MIN);
  return { lat: parseFloat(lat.toFixed(5)), lng: parseFloat(lng.toFixed(5)), real:false };
}
function obtenerUbicacionPiloto(callback){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos => callback({ lat: parseFloat(pos.coords.latitude.toFixed(5)), lng: parseFloat(pos.coords.longitude.toFixed(5)), real:true }),
      () => callback(ubicacionSimulada()),
      { timeout: 4000 }
    );
  } else {
    callback(ubicacionSimulada());
  }
}

/* ---- Asignación automática de recolecciones por cercanía ----
   Cuando un cliente solicita una recolección, el sistema calcula la
   distancia (fórmula de Haversine) entre la tienda y cada piloto
   disponible, y asigna de inmediato al que esté más cerca. */
function distanciaKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function pilotoMasCercano(puntoTienda){
  const pilotos = EMPLEADOS.filter(e => e.rol === "Piloto" && e.disponible && e.ubicacion);
  if(pilotos.length === 0) return null;
  let mejor = null, mejorDist = Infinity;
  pilotos.forEach(p => {
    const d = distanciaKm(puntoTienda, p.ubicacion);
    if(d < mejorDist){ mejorDist = d; mejor = p; }
  });
  return { piloto: mejor, distanciaKm: parseFloat(mejorDist.toFixed(1)) };
}

/* ============ MAPA EN TIEMPO REAL ============
   El prototipo no tiene GPS real de flotilla ni backend con websockets, así
   que la "posición en vivo" del piloto se simula: cada pocos segundos el
   piloto avanza un poco hacia el destino de su próxima entrega, dejando una
   miga de pan (breadcrumb) que se dibuja como la ruta recorrida. Todo esto
   corre en memoria del navegador mientras la pestaña esté abierta. */
const VELOCIDAD_PROMEDIO_KMH = 24; // velocidad promedio asumida para calcular el ETA
const RUTA_TRACKS = {}; // { "Nombre del piloto": [{lat,lng}, ...] } — ruta recorrida simulada
let mapaTiempoRealIntervalId = null;

/* Punto de destino aproximado de una guía: usa la ubicación real de entrega
   si ya fue capturada, y si no, el centro del departamento (con un pequeño
   desplazamiento fijo por guía, para que no todas caigan en el mismo punto). */
function destinoAproximadoGuia(g){
  if(g.ubicacionEntrega) return g.ubicacionEntrega;
  const base = DEPTO_COORDS[g.departamento];
  if(!base) return null;
  let hash = 0;
  for(let i=0;i<g.id.length;i++) hash = (hash * 31 + g.id.charCodeAt(i)) >>> 0;
  const jitterLat = ((hash % 100) / 100 - 0.5) * 0.09;
  const jitterLng = (((hash >> 8) % 100) / 100 - 0.5) * 0.09;
  return { lat: base.lat + jitterLat, lng: base.lng + jitterLng };
}

/* Próxima entrega pendiente de un piloto: la primera guía "Asignado a
   piloto" que se le encuentre, en el orden en que aparecen en GUIAS. */
function proximaEntregaPiloto(nombrePiloto){
  return GUIAS.find(g => g.piloto === nombrePiloto && g.estado === "Asignado a piloto" && !g.eliminada) || null;
}

function etaMinutos(distKm){
  return Math.max(1, Math.round((distKm / VELOCIDAD_PROMEDIO_KMH) * 60));
}

/* Avanza cada piloto activo un poco hacia su próxima entrega y registra el
   punto en su ruta recorrida. Se llama en cada "tick" del mapa en vivo. */
function avanzarPilotosSimulados(){
  EMPLEADOS.filter(e => e.rol === "Piloto" && e.disponible && e.ubicacion).forEach(p => {
    if(!RUTA_TRACKS[p.nombre]) RUTA_TRACKS[p.nombre] = [{ lat:p.ubicacion.lat, lng:p.ubicacion.lng }];
    const entrega = proximaEntregaPiloto(p.nombre);
    const destino = entrega ? destinoAproximadoGuia(entrega) : null;
    if(destino){
      const paso = 0.15; // fracción de la distancia restante que avanza en cada tick
      p.ubicacion = {
        lat: parseFloat((p.ubicacion.lat + (destino.lat - p.ubicacion.lat) * paso).toFixed(5)),
        lng: parseFloat((p.ubicacion.lng + (destino.lng - p.ubicacion.lng) * paso).toFixed(5)),
      };
      p.ultimaActividad = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
    }
    const track = RUTA_TRACKS[p.nombre];
    track.push({ lat:p.ubicacion.lat, lng:p.ubicacion.lng });
    if(track.length > 25) track.shift();
  });
}

/* ── FIX CRÍTICO: el intervalo solo actualiza datos internos (posiciones),
   NUNCA llama render(). El mapa dibuja en requestAnimationFrame dentro de
   su propia función. Así se elimina el re-render masivo que rompía inputs. */
function iniciarSimulacionMapa(){
  if(mapaTiempoRealIntervalId) return;
  mapaTiempoRealIntervalId = setInterval(() => {
    avanzarPilotosSimulados();
    // Solo repintar si la vista activa ES el mapa en tiempo real
    if(state.view === "mapatiempo"){
      const cvs = document.getElementById("mapaCanvas");
      if(cvs) dibujarMapaEnCanvas(cvs); // dibuja sin tocar el DOM del resto de la app
    }
  }, 3000);
}
function detenerSimulacionMapa(){
  if(mapaTiempoRealIntervalId){ clearInterval(mapaTiempoRealIntervalId); mapaTiempoRealIntervalId = null; }
}

function esc(s){ return (s===undefined||s===null) ? "" : String(s); }

function solicitudesPendientes(){

}

function recoleccionesPilotoPendientes(){
  const pendientes = SOLICITUDES_RECOLECCION.filter(s => s.piloto === PILOTO_ACTUAL && s.estado === "Asignada");
  return aplicarFiltroFecha(pendientes, "hoy", null, null, "fecha").length;

/* ---- Registro de cambios de guía + notificación al cliente ----
   Toda función que modifique una guía (estado, edición de datos,
   eliminación, restauración, lote, etc.) debe pasar por aquí para que
   quede constancia en el historial Y se genere la notificación. */
function registrarCambioGuia(guia, accion, de, a, usuario){
  if(!guia) return;
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  if(!HISTORIAL[guia.id]) HISTORIAL[guia.id] = [];
  /* Evidencia de cada movimiento: además de fecha exacta y usuario, se
     guarda la ubicación GPS de quien hizo el cambio y, si aplica (por
     ejemplo al confirmar la entrega), la fotografía asociada. */
  const esEntregaConEvidencia = (a === "Entregado" && guia.ubicacionEntrega);
  const ubicacionMovimiento = esEntregaConEvidencia ? guia.ubicacionEntrega : ubicacionSimulada();
  const fotoMovimiento = esEntregaConEvidencia ? (guia.fotoEntrega || null) : null;
  HISTORIAL[guia.id].push({ fecha:fechaStr, usuario, accion, de: (de===undefined||de===null||de==="") ? "-" : String(de), a: (a===undefined||a===null||a==="") ? "-" : String(a), ubicacion:ubicacionMovimiento, foto:fotoMovimiento });
  crearNotificacionCliente(guia, accion, de, a, usuario, fechaStr);
  return fechaStr;
}

function crearNotificacionCliente(guia, accion, de, a, usuario, fechaStr){
  const cuenta = guia.cuenta || guia.cliente;
  if(!cuenta) return;
  const mensaje = (de && a && de !== a && de !== "-" ) ? `${accion}: ${de} → ${a}` : accion;
  NOTIFICACIONES.unshift({
    id: "N-" + (nextNotifNum++),
    guiaId: guia.id,
    cuenta,
    mensaje,
    fecha: fechaStr || new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" }),
    usuario,
    leida: false,
  });
}

function notificacionesClientePendientes(){
  return NOTIFICACIONES.filter(n => n.cuenta === CLIENTE_ACTUAL && !n.leida).length;
}

/* ---- Eliminar / Restaurar guía (papelera) ----
   El cliente puede eliminar sus propias guías y restaurarlas. En los
   roles administrativos, toda guía eliminada queda visible y disponible
   para recuperar desde el apartado "Papelera" — nunca se borra en firme.
   Una guía ya Entregada o Finalizada no se puede eliminar, para no perder
   el rastro de una entrega que ya se completó. */
const ESTADOS_NO_ELIMINABLES = ["Entregado","Finalizado"];
function guiaEsEliminable(g){ return !ESTADOS_NO_ELIMINABLES.includes(g.estado); }

function eliminarGuia(id){
  const g = GUIAS.find(x => x.id === id);
  if(!g) return;
  if(!guiaEsEliminable(g)){
    alert(`La guía ${id} ya está ${g.estado} y no se puede eliminar.`);
    return;
  }
  if(!confirm(`¿Eliminar la guía ${id}? Podrás restaurarla luego desde la papelera.`)) return;
  const estadoAnterior = g.estado;
  g.eliminada = true;
  g.fechaEliminacion = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  g.eliminadaPor = state.role;
  registrarCambioGuia(g, "Guía eliminada", estadoAnterior, "Eliminada", state.role);
  render();
}

function restaurarGuia(id){
  const g = GUIAS.find(x => x.id === id);
  if(!g) return;
  g.eliminada = false;
  g.fechaEliminacion = null;
  g.eliminadaPor = null;
  registrarCambioGuia(g, "Guía restaurada desde papelera", "Eliminada", g.estado, state.role);
  render();
}

/* ---- Eliminar en lote (barra de selección de la tabla de Guías) ---- */
function eliminarGuiasSeleccionadas(){
  const ids = state.guiasSeleccionadas;
  if(ids.length === 0){ alert("Selecciona al menos una guía para eliminar."); return; }
  const seleccionadas = ids.map(id => GUIAS.find(x => x.id === id)).filter(Boolean);
  const eliminables = seleccionadas.filter(guiaEsEliminable);
  const bloqueadas = seleccionadas.filter(g => !guiaEsEliminable(g));
  if(eliminables.length === 0){
    alert("Las guías seleccionadas ya están Entregadas/Finalizadas, por lo que no se pueden eliminar.");
    return;
  }
  if(!confirm(`¿Eliminar ${eliminables.length} guía(s) seleccionada(s)? Podrás restaurarlas luego desde la papelera.`)) return;
  const fecha = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  eliminables.forEach(g => {
    if(g.eliminada) return;
    const estadoAnterior = g.estado;
    g.eliminada = true;
    g.fechaEliminacion = fecha;
    g.eliminadaPor = state.role;
    registrarCambioGuia(g, "Guía eliminada", estadoAnterior, "Eliminada", state.role);
  });
  if(bloqueadas.length > 0){
    alert(`${bloqueadas.length} guía(s) seleccionada(s) ya están Entregadas/Finalizadas y no se eliminaron.`);
  }
  state.guiasSeleccionadas = [];
  render();
}

/* ---- Filtro de fechas para guías (histórico / hoy / rango) ---- */
function parseFechaGuia(str){
  if(!str || str === "-") return null;
  const m = String(str).match(/^(\d{2})\/(\d{2})\/(\d{2})/);
  if(!m) return null;
  return new Date(2000 + parseInt(m[3],10), parseInt(m[2],10) - 1, parseInt(m[1],10));
}

/* Igual que parseFechaGuia pero conservando hora:minuto, para poder calcular
   cuánto tiempo pasó entre un evento del historial y el siguiente. */
function parseFechaHoraGuia(str){
  if(!str || str === "-") return null;
  const m = String(str).match(/^(\d{2})\/(\d{2})\/(\d{2})(?:\s+(\d{2}):(\d{2}))?/);
  if(!m) return null;
  return new Date(2000 + parseInt(m[3],10), parseInt(m[2],10) - 1, parseInt(m[1],10), m[4]?parseInt(m[4],10):0, m[5]?parseInt(m[5],10):0);
}

/* Convierte una diferencia en milisegundos a un texto corto y legible,
   usado para mostrar el tiempo transcurrido entre estados de una guía. */
function formatDuracion(ms){
  if(ms === null || ms === undefined || ms < 0) return null;
  const min = Math.round(ms / 60000);
  if(min < 1) return "menos de 1 min";
  if(min < 60) return min + " min";
  const horas = Math.floor(min / 60);
  const minRestante = min % 60;
  if(horas < 24) return horas + "h" + (minRestante ? " " + minRestante + "min" : "");
  const dias = Math.floor(horas / 24);
  const horaRestante = horas % 24;
  return dias + "d" + (horaRestante ? " " + horaRestante + "h" : "");
}

/* ---- VIP automático por volumen ----
   Un cliente se marca VIP automáticamente cuando supera las 1000 guías
   creadas en una ventana de los últimos 2 meses (contados desde la fecha
   de referencia del prototipo). Si no llega a ese volumen, no se le agrega
   nada por este medio; sigue siendo VIP solo si el Super Administrativo lo
   forzó manualmente con el switch. */
const VIP_VOLUMEN_MINIMO = 1000;
const VIP_VENTANA_MESES = 2;

function fechaCreacionGuia(g){
  return g.fechaCreacion || parseFechaGuia(g.fecha);
}

function volumenGuiasUltimosMeses(cuenta, meses){
  const limite = new Date(FECHA_REF_HOY.getTime());
  limite.setMonth(limite.getMonth() - meses);
  return GUIAS.filter(g => !g.eliminada && (g.cuenta === cuenta || g.cliente === cuenta)).filter(g => {
    const f = fechaCreacionGuia(g);
    return f && f >= limite && f <= FECHA_REF_HOY;
  }).length;
}

function esClienteVipPorVolumen(cuenta){
  return volumenGuiasUltimosMeses(cuenta, VIP_VENTANA_MESES) > VIP_VOLUMEN_MINIMO;
}

/* Estado VIP final que debe usarse en toda la app: manual (switch) O por volumen. */
function esClienteVip(c){
  if(!c) return false;
  return !!c.vipManual || esClienteVipPorVolumen(c.comercio);
}

function aplicarFiltroFecha(lista, modo, desde, hasta, campoFecha){
  campoFecha = campoFecha || "fecha";
  if(modo === "hoy"){
    /* Se compara contra FECHA_REF_HOY (la fecha "de hoy" simulada del
       prototipo) y no contra la fecha real del dispositivo. Si se usara
       new Date() aquí, en cuanto la fecha real del celular/computadora
       fuera distinta al 17/07/26, todo lo asignado "para hoy" (Mis Rutas,
       Mis Recolecciones, etc.) desaparecería de la lista aunque sí esté
       asignado, porque ninguna fecha coincidiría con el día real. */
    const hoy = new Date(FECHA_REF_HOY.getTime()); hoy.setHours(0,0,0,0);
    return lista.filter(g => {
      const f = parseFechaGuia(g[campoFecha]);
      return f && f.getTime() === hoy.getTime();
    });
  }
  if(modo === "rango"){
    const d = desde ? new Date(desde + "T00:00:00") : null;
    const h = hasta ? new Date(hasta + "T23:59:59") : null;
    return lista.filter(g => {
      const f = parseFechaGuia(g[campoFecha]);
      if(!f) return false;
      if(d && f < d) return false;
      if(h && f > h) return false;
      return true;
    });
  }
  return lista; // "todas" / histórico: sin filtro de fecha
}

function pill(estado){
  const c = ESTADO_COLORS[estado] || { bg:"#f1f5f9", color:"#475569", border:"#e2e8f0" };
  return `<span class="pill" style="background:${c.bg};color:${c.color};border-color:${c.border};"><span class="dot"></span>${esc(estado)}</span>`;
}

function filtrarTexto(v){
  // No se permiten caracteres especiales, símbolos ni caracteres tipográficos.
  return String(v).replace(/[^a-zA-Z0-9À-ÿ\u00f1\u00d1\s]/g, "");
}
function onFiltrarInput(el){
  const pos = el.selectionStart;
  const limpio = filtrarTexto(el.value);
  if(limpio !== el.value){
    el.value = limpio;
  }
}

function val(id){
  const el = document.getElementById(id);
  if(!el) return "";
  return typeof el.value === "string" ? el.value.trim() : el.value;
}

function estadoOptions(list, selected){
  return list.map(e => `<option value="${e}" ${e===selected?'selected':''}>${e}</option>`).join("");
}

/* ---- QR real y escaneable (ISO/IEC 18004), generado con la librería qrcode.js ----
   Antes esta función dibujaba un patrón de pixeles pseudo-aleatorio que solo
   PARECÍA un QR (no era legible por ningún lector). Ahora se devuelve un
   contenedor con el texto a codificar en data-qr-texto; inicializarQRsPendientes()
   lo convierte en un QR real después de insertarse en el documento (los <script>
   no se ejecutan al inyectar HTML con innerHTML, así que la generación se hace
   en un segundo paso).
   DECISIÓN DE NEGOCIO (cambiada a propósito): el QR ahora codifica toda la
   información de la guía (ver datosQrGuia), no solo el número/código de barras.
   Esto permite extraer todos los datos con un lector externo para procesos
   manuales, pero también significa que cualquier persona que escanee el
   paquete con una app de QR normal puede ver esos datos (nombre, teléfono,
   dirección, precio, etc.) — ya no quedan ocultos como antes. */
let __qrAutoId = 0;
function qrCodeSvg(code, size, etiqueta){
  size = size || 92;
  const id = "qr-" + (++__qrAutoId) + "-" + Math.random().toString(36).slice(2,8);
  const textoVisible = etiqueta !== undefined ? etiqueta : code;
  return `<div>
    <div id="${id}" class="qr-real" data-qr-texto="${esc(String(code))}" data-qr-size="${size}" style="width:${size}px;height:${size}px;background:#fff;"></div>
    <div style="font-size:8px;color:#5a6b87;font-family:monospace;margin-top:2px;">${esc(textoVisible)}</div>
  </div>`;
}

/* Empaqueta toda la información de la guía en un solo texto JSON, que es lo
   que queda codificado dentro del QR. Se usa siempre que se genera un QR de
   guía (pantalla, impresión, manifiestos). */
function datosQrGuia(g){
  return JSON.stringify({
    guia: g.id || "-",
    codigo: g.codigoBarra || "-",
    tienda: g.tienda || "-",
    tipoEnvio: g.tipoEnvio || "",
    destinatario: g.nombre || g.cliente || "-",
    telPrimario: g.telPrimario || "",
    telSecundario: g.telSecundario || "",
    direccion: g.direccion || "-",
    municipio: g.municipio || "-",
    departamento: g.departamento || "-",
    bultos: g.bultos || "",
    peso: g.peso || "",
    precio: g.precio || "",
    tipoPago: g.tipoPago || "",
    fragil: g.fragil || "",
    observacion: g.observacion || "",
    fechaEntrega: g.fechaEntrega || g.fecha || g.fechaEntregaEstimada || ""
  });
}

/* Convierte en QR real cada contenedor pendiente (data-qr-texto) que aún no
   se haya generado. Se llama al final de render() y, dentro de ventanas de
   impresión/documentos descargados, en el evento load de esos documentos —
   en ambos casos porque los <script> insertados vía innerHTML no se ejecutan
   solos. Es seguro llamarla varias veces: cada QR ya generado se salta. */
function inicializarQRsPendientes(){
  if(typeof QRCode === "undefined") return;
  document.querySelectorAll("[data-qr-texto]").forEach(function(el){
    if(el.dataset.qrHecho) return;
    el.dataset.qrHecho = "1";
    const texto = el.getAttribute("data-qr-texto");
    const tam = parseInt(el.getAttribute("data-qr-size"), 10) || 92;
    new QRCode(el, { text: texto, width: tam, height: tam, correctLevel: QRCode.CorrectLevel.M });
  });
}

/* Bloque reutilizable que se inserta en cada documento aparte (ventanas de
   impresión, manifiestos descargados) para que también generen QR reales,
   ya que son documentos HTML independientes del documento principal. */
const QR_ENGINE_HTML = `
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
  <script>
    function inicializarQRsPendientes(){
      if(typeof QRCode === "undefined") return;
      document.querySelectorAll("[data-qr-texto]").forEach(function(el){
        if(el.dataset.qrHecho) return;
        el.dataset.qrHecho = "1";
        var texto = el.getAttribute("data-qr-texto");
        var tam = parseInt(el.getAttribute("data-qr-size"), 10) || 92;
        new QRCode(el, { text: texto, width: tam, height: tam, correctLevel: QRCode.CorrectLevel.M });
      });
    }
    window.addEventListener("load", inicializarQRsPendientes);
  <\/script>
`;

          .btn-imprimir{ background:#ff6b35; color:#fff; }
          .btn-cerrar{ background:transparent; color:#cbd2e6; }
          .hoja-guia{ padding:24px; display:flex; justify-content:center; page-break-after:always; }
          .hoja-guia:last-child{ page-break-after:auto; }
          @media print{
            .toolbar{ display:none; }
            body{ background:#fff; }
            .hoja-guia{ padding:0 0 16px 0; }
          }
        </style>
      </head>
      <body>
        <div class="toolbar">
          <span>👁️ Vista previa · ${imprimibles.length} guía(s) para imprimir</span>
          <div>
            <button class="btn-cerrar" onclick="window.close()">✕ Cerrar</button>
            <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir todas</button>
          </div>
        </div>
        ${hojas}
        ${QR_ENGINE_HTML}
      </body>
    </html>
  `);
  ventana.document.close();
  ventana.focus();
}

/* ---- Descargar Excel solo de las guías seleccionadas con el checkbox ---- */
function descargarGuiasSeleccionadas(){
  const ids = state.guiasSeleccionadas;
  if(ids.length === 0){ alert("Selecciona al menos una guía para descargar."); return; }
  const data = GUIAS.filter(g => ids.includes(g.id));
  const filas = data.map(g => `
    <tr>
      <td>${g.id}</td>
      <td>${g.cliente}</td>
      <td>${g.tienda || "-"}</td>
      <td>${g.piloto}</td>
      <td>${g.estado}</td>
      <td>${g.operador}</td>
      <td>${g.creadoPor || "-"}${g.creadoPorTipo ? " (" + g.creadoPorTipo + ")" : ""}</td>
      <td>${g.fecha}</td>
    </tr>
  `).join("");
  const html = `
    <html><head><meta charset="UTF-8"></head>
    <body>
      <table border="1">
        <thead><tr><th>Guía</th><th>Cliente</th><th>Tienda</th><th>Piloto</th><th>Estado</th><th>Operador</th><th>Creado por</th><th>Fecha</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </body></html>`;
  const blob = new Blob([html], { type: "application/vnd.ms-excel" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Guias_Seleccionadas_XpressControl.xls";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============ LOGIN ÚNICO CON CORREO Y CONTRASEÑA ============
   Prototipo sin servidor: una sola pantalla de acceso para todos los
   roles. Se valida el correo/contraseña contra EMPLEADOS (Super
   Administrativo, Administrativo, Piloto) y contra CLIENTES (Cliente),
   y el rol/cuenta correspondiente se determina automáticamente según
   qué registro coincida — el usuario nunca elige el rol a mano. */
function onLoginCorreoInput(v){ state.loginCorreo = v; }
function onLoginClaveInput(v){ state.loginClave = v; }

function intentarLoginUnico(){
  const correoIngresado = (state.loginCorreo || "").trim().toLowerCase();
  const claveIngresada = state.loginClave || "";
  if(!correoIngresado || !claveIngresada){
    state.loginError = "Escribe tu correo y contraseña.";
    render();
    return;
  }
  if(!clientesListos || !empleadosListos){
    state.loginError = "Cargando datos de la base de datos, espera un momento e intenta de nuevo.";
    render();
    return;
  }

  const empleado = EMPLEADOS.find(e =>
    (e.correo || "").toLowerCase() === correoIngresado && (e.password || "") === claveIngresada
  );
  if(empleado){
    state.loginCorreo = "";
    state.loginClave = "";
    state.loginError = "";
    selectRole(empleado.rol);
    return;
  }

  const cliente = CLIENTES.find(c =>
    (c.correo || "").toLowerCase() === correoIngresado && (c.passwordReal || c.password || "") === claveIngresada
  );
  if(cliente){
    CLIENTE_ACTUAL = cliente.comercio;
    state.loginCorreo = "";
    state.loginClave = "";
    state.loginError = "";
    selectRole("Cliente");
    return;
  }

  state.loginError = "Correo o contraseña incorrectos.";
  render();
}

/* ============ RASTREO PÚBLICO DE GUÍA (sin sesión) ============
   Pantalla a la que llega cualquier persona que escanee el QR de una guía
   sin tener acceso al sistema (no es el piloto asignado ni un usuario
   administrador). El QR solo codifica el número/código de guía — nunca
   datos del destinatario — y esta pantalla, a propósito, solo muestra el
   estado general y el destino en grande: nunca el nombre, teléfono,
   dirección exacta, precio, fotos, firmas ni el propio QR de la guía. Esa
   información completa solo se ve dentro del sistema, con sesión iniciada
   y con permiso sobre esa guía (administrador, piloto asignado a la ruta,
   o el cliente dueño de la guía). */
function abrirRastreoPublico(){
  state.rastreoAbierto = true;
  state.rastreoCodigo = "";
  state.rastreoResultado = undefined;
  render();
}

function cerrarRastreoPublico(){
  state.rastreoAbierto = false;
  state.rastreoCodigo = "";
  state.rastreoResultado = undefined;
  render();
}

function onRastreoCodigoInput(v){
  state.rastreoCodigo = v;
}

function buscarGuiaPublica(){
  const codigo = (state.rastreoCodigo || "").trim();
  if(!codigo){ alert("Escribe o escanea el código de la guía."); return; }
  const g = GUIAS.find(x => !x.eliminada && (String(x.id).toLowerCase() === codigo.toLowerCase() || String(x.codigoBarra).toLowerCase() === codigo.toLowerCase()));
  state.rastreoResultado = g || null;
  render();
}

  const r = state.rastreoResultado;
  return `

      </div>

      ${r ? `
        <div class="card pad" style="margin-top:16px;text-align:left;">

          <p style="margin:6px 0 0 0;font-size:13.5px;"><b>Destino:</b> ${esc(r.departamento || "-")}${r.municipio && r.municipio !== "-" ? ", " + esc(r.municipio) : ""}</p>
          <p style="margin:6px 0 0 0;font-size:13.5px;"><b>Fecha estimada de entrega:</b> ${esc(r.fechaEntregaEstimada || r.fechaEntrega || "-")}</p>
          <p class="subtle-note" style="margin-top:12px;">Por seguridad, esta consulta pública no muestra destinatario, teléfono, dirección exacta, precio ni el código QR de la guía. Para ver el detalle completo, inicia sesión con una cuenta autorizada.</p>
        </div>
      ` : ""}
      <button class="btn-link" style="margin-top:18px;width:100%;text-align:center;" onclick="cerrarRastreoPublico()">← Volver al inicio de sesión</button>
    </div>

/* ---- Lógica de la tarjeta "Guías creadas en los últimos [período]" con % de tendencia ---- */
const DASHBOARD_HOY_REF = new Date(2026,6,17); // ancla al "hoy" simulado del prototipo (17/07/26)

function parseFechaGuiaCorta(fechaStr){
  if(!fechaStr || fechaStr === "-") return null;
  const soloFecha = fechaStr.split(" ")[0];
  const partes = soloFecha.split("/");
  if(partes.length !== 3) return null;
  const [d,m,y] = partes.map(n => parseInt(n,10));
  if(!d || !m || !y) return null;
  return new Date(2000+y, m-1, d);
}

function sumarDias(fecha, dias){
  const f = new Date(fecha);
  f.setDate(f.getDate()+dias);
  return f;
}

function inicioDeMes(fecha){ return new Date(fecha.getFullYear(), fecha.getMonth(), 1); }

const PERIODOS_GUIAS_DASHBOARD = {
  hoy:     { label:"Hoy",        dias:1  },
  semana:  { label:"7 días",     dias:7  },
  mes:     { label:"30 días",    dias:30 },
};

function contarGuiasEnRango(inicio, fin){
  return GUIAS.filter(g => {
    if(g.eliminada) return false;
    const f = parseFechaGuiaCorta(g.fecha);
    if(!f) return false;
    return f >= inicio && f <= fin;
  }).length;
}

function calcularTendenciaGuiasCreadas(periodo){
  const cfg = PERIODOS_GUIAS_DASHBOARD[periodo] || PERIODOS_GUIAS_DASHBOARD.hoy;
  const finActual = DASHBOARD_HOY_REF;
  const inicioActual = sumarDias(finActual, -(cfg.dias-1));
  const finAnterior = sumarDias(inicioActual, -1);
  const inicioAnterior = sumarDias(finAnterior, -(cfg.dias-1));

  const actual = contarGuiasEnRango(inicioActual, finActual);
  const anterior = contarGuiasEnRango(inicioAnterior, finAnterior);

  let pct, tendencia;
  if(anterior === 0){
    pct = actual > 0 ? 100 : 0;
    tendencia = actual > 0 ? "up" : "flat";
  } else {
    pct = ((actual - anterior) / anterior) * 100;
    tendencia = pct > 0 ? "up" : (pct < 0 ? "down" : "flat");
  }
  return { actual, anterior, pct: Math.abs(pct), tendencia, label: cfg.label };
}

function cambiarPeriodoGuiasDashboard(valor){
  state.dashboardGuiasPeriodo = valor;
  render();
}

function tarjetaGuiasCreadasDashboard(){
  const periodo = state.dashboardGuiasPeriodo || "hoy";
  const t = calcularTendenciaGuiasCreadas(periodo);
  const flecha = t.tendencia === "up" ? "↗" : (t.tendencia === "down" ? "↘" : "→");
  const texto = t.tendencia === "up" ? "Aumento" : (t.tendencia === "down" ? "Disminución" : "Sin cambio");
  return `
    <div class="card pad kpi-trend-card">
      <div class="kpi-trend-header">
        <p>Guías creadas en los últimos</p>
        <select class="kpi-period-select" onchange="cambiarPeriodoGuiasDashboard(this.value)">
          ${Object.keys(PERIODOS_GUIAS_DASHBOARD).map(k => `<option value="${k}" ${k===periodo?"selected":""}>${PERIODOS_GUIAS_DASHBOARD[k].label}</option>`).join("")}
        </select>
      </div>
      <p class="kpi-value">${t.actual}</p>
      <p class="kpi-trend ${t.tendencia}"><span class="arrow">${flecha}</span> ${t.pct.toFixed(2)}% ${texto}</p>
    </div>
  `;
}

function screenDashboard(){
  const ahora = new Date();
  const hora  = ahora.getHours();
  const saludo = hora < 12 ? "Buenos días" : hora < 18 ? "Buenas tardes" : "Buenas noches";
  const emp    = empleadoActualObj();
  const nombre = emp ? emp.nombre.split(" ")[0] : state.role;

  const todas   = GUIAS.filter(g => !g.eliminada);
  const hoy     = todas.filter(g => g.fecha === "17/07/26");
  const entregadas  = todas.filter(g => g.estado === "Entregado" || g.estado === "Finalizado").length;

function guiasFiltered(filtro){
  const texto = (filtro||"").trim();
  let data = GUIAS.filter(g => !g.eliminada);
  if(texto){
    const tokens = texto.split(/[\n,;]+/).map(t => t.trim()).filter(Boolean);
    if(tokens.length > 1){
      data = data.filter(g => tokens.some(t => g.id.includes(t)));
    } else {
      const t = tokens[0] || texto;
      data = data.filter(g => g.id.includes(t) || g.cliente.toLowerCase().includes(t.toLowerCase()));
    }
  }
  data = aplicarFiltroFecha(data, state.guiaRangoModo, state.guiaFechaDesde, state.guiaFechaHasta);
  return data;
}

function guiasPaginadas(filtro){
  const data = guiasFiltered(filtro===undefined ? state.guiaFiltroActual : filtro);
  const totalPaginas = Math.max(1, Math.ceil(data.length / GUIAS_POR_PAGINA));
  if(state.guiasPagina > totalPaginas) state.guiasPagina = totalPaginas;
  if(state.guiasPagina < 1) state.guiasPagina = 1;
  const inicio = (state.guiasPagina - 1) * GUIAS_POR_PAGINA;
  const pageData = data.slice(inicio, inicio + GUIAS_POR_PAGINA);
  return { data, pageData, totalPaginas, inicio };
}

function guiasRowsHtml(pageData){
  if(pageData.length === 0){
    return `<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:20px 0;">No se encontraron guías con ese criterio.</td></tr>`;

      <td class="checkbox-col"><input type="checkbox" ${state.guiasSeleccionadas.includes(g.id) ? "checked" : ""} onchange="toggleSeleccionGuia('${g.id}')" /></td>
      <td style="font-weight:700;color:#1f2937;">${g.urgente ? '<span title="Xpress 24h — suma importancia">⚡</span> ' : ''}${g.id}</td>
      <td>${g.cliente}</td>
      <td>${g.tienda || "-"}</td>
      <td>${g.piloto}</td>
      <td>
        <select class="estado-select" onchange="cambiarEstadoGuia('${g.id}', this.value)">
          ${estadoOptions(ESTADOS, g.estado)}
        </select>
      </td>
      <td>${g.operador}</td>
      <td>${creadoPorTexto(g)}</td>
      <td style="text-align:right;white-space:nowrap;">
        <button class="btn-link" onclick="selectGuia('${g.id}')">Ver historial →</button>
        ${guiaEsEliminable(g)
          ? `<button class="btn-link" style="color:#dc2626;margin-left:10px;" onclick="eliminarGuia('${g.id}')">🗑️ Eliminar</button>`
          : `<span style="margin-left:10px;color:#94a3b8;font-size:12.5px;" title="Las guías Entregadas/Finalizadas no se pueden eliminar">🔒 Eliminar</span>`}
      </td>

function refreshGuiasTabla(filtro){
  const wrap = document.getElementById("guiasTablaWrap");
  if(wrap) wrap.innerHTML = guiasTablaWrapHtml(filtro===undefined ? state.guiaFiltroActual : filtro);
}

function cambiarPaginaGuias(delta){
  state.guiasPagina += delta;
  refreshGuiasTabla();
}

function toggleSeleccionGuia(id){
  const idx = state.guiasSeleccionadas.indexOf(id);
  if(idx === -1) state.guiasSeleccionadas.push(id);
  else state.guiasSeleccionadas.splice(idx, 1);
  refreshGuiasTabla();
}

function toggleSeleccionarTodasGuiasPagina(checked){
  const { pageData } = guiasPaginadas();
  pageData.forEach(g => {
    const idx = state.guiasSeleccionadas.indexOf(g.id);
    if(checked && idx === -1) state.guiasSeleccionadas.push(g.id);
    if(!checked && idx !== -1) state.guiasSeleccionadas.splice(idx, 1);
  });
  refreshGuiasTabla();
}

function deseleccionarTodasGuias(){
  state.guiasSeleccionadas = [];
  state.guiaAccionMasiva = "";
  refreshGuiasTabla();
}

/* ---- Ejecuta la acción elegida en el filtro de la barra de selección
   (Ver historial / Eliminar / Descargar Excel) sobre las guías marcadas ---- */
function ejecutarAccionMasivaGuias(){
  const accion = state.guiaAccionMasiva;
  if(!accion){
    alert("Selecciona una acción antes de ejecutar.");
    return;
  }
  if(accion === "historial"){
    if(state.guiasSeleccionadas.length !== 1){
      alert("Para ver el historial selecciona una sola guía.");
      return;
    }
    selectGuia(state.guiasSeleccionadas[0]);
    return;
  }
  if(accion === "eliminar"){
    eliminarGuiasSeleccionadas();
    state.guiaAccionMasiva = "";
    return;
  }
  if(accion === "excel"){
    descargarGuiasSeleccionadas();
    return;
  }
}

/* ---- Descargar Excel de Clientes (Super Administrativo / Administrativo) ----

function solicitarDescargaClientes(){
  if(CLIENTES.length === 0){
    alert("No hay clientes registrados todavía.");
    return;

  if(state.role === "Super Administrativo"){
    descargarExcelClientes();
    return;

  const clave = prompt("Ingresa la clave asignada por el Super Administrativo para descargar el Excel de clientes:");
  if(clave === null) return;
  if(clave !== CLAVE_EXPORTACION_CLIENTES){
    alert("❌ Clave incorrecta. Solicítala al Super Administrativo.");
    return;

}

function cambiarClaveExportacionClientes(){

function cambiarEstadoGuia(id, nuevoEstado){
  const g = GUIAS.find(x => x.id === id);
  if(!g) return;
  if(nuevoEstado === "Asignado a piloto" && (!g.piloto || g.piloto === "-")){
    alert("Esta guía todavía no tiene un piloto asignado. Asígnalo primero desde \"Asignación Masiva de Guías\" (Asignar responsable) o editando la guía, y luego cambia el estado.");
    render();
    return;
  }
  const anterior = g.estado;
  g.estado = nuevoEstado;
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  g.fecha = new Date().toLocaleDateString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit" });

  }
  registrarCambioGuia(g, "Cambio de estado", anterior, nuevoEstado, state.role);
  render();
}

function generarLoteDevolucion(){
  const clienteObj = CLIENTES.find(c => c.id === val("lote_tienda"));
  const raw = val("lote_guias");
  const ids = raw.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  if(!clienteObj){
    alert("Selecciona un cliente de la lista.");
    return;
  }
  const tienda = tiendaLabel(clienteObj);
  if(ids.length === 0){
    alert("Ingresa al menos un número de guía.");
    return;
  }
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  const encontrados = [];
  ids.forEach(id => {
    const g = GUIAS.find(x => x.id === id);
    if(g){
      const anterior = g.estado;
      g.estado = "Devolución";
      g.tienda = tienda;
      registrarCambioGuia(g, "Lote de devolución — " + tienda, anterior, "Devolución", state.role);
      encontrados.push(g);
    }
  });
  state.ultimoLoteDevolucion = encontrados;

  /* Por cada cliente distinto incluido en el lote, se genera una nueva guía
     consolidada para poder enviarle de vuelta sus paquetes devueltos. */
  const porCliente = {};
  encontrados.forEach(g => {
    const cuenta = g.cuenta || g.cliente;
    if(!porCliente[cuenta]) porCliente[cuenta] = [];
    porCliente[cuenta].push(g.id);
  });
  const nuevasGuiasDevolucion = [];
  Object.keys(porCliente).forEach(cuenta => {
    const nuevoId = "XC" + state.nextGuiaNum;
    state.nextGuiaNum++;
    const codigoBarra = nuevoId;
    const nueva = {
      id:nuevoId, cliente:cuenta, cuenta:cuenta, estado:"Creado", fecha:fechaStr, fechaEntrega:null,
      operador:state.role, piloto:"-", ruta:"-", codigoBarra,
      fotoEntrega:null, ubicacionEntrega:null, firmaEntrega:null, tienda:tienda,
      nombre:cuenta, direccion:clienteObj.direccion || "-", municipio:"-", fragil:"No",
      departamento:"-", esDevolucionConsolidada:true, guiasIncluidas:porCliente[cuenta],
      eliminada:false, fechaEliminacion:null, eliminadaPor:null,
      creadoPor:creadorActual().nombre, creadoPorTipo:creadorActual().tipo,
    };
    GUIAS.push(nueva);
    HISTORIAL[nuevoId] = [

/* Parser CSV simple que respeta campos entre comillas (por si una dirección
   u otro campo trae una coma dentro). Usado por las cargas masivas. */
function parseCSVLine(line){
  const result = [];
  let cur = "";
  let inQuotes = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else { inQuotes = false; }
      } else {
        cur += ch;
      }
    } else {
      if(ch === '"'){ inQuotes = true; }
      else if(ch === ','){ result.push(cur.trim()); cur = ""; }
      else { cur += ch; }
    }
  }
  result.push(cur.trim());
  return result;
}

function procesarArchivoLoteDevolucion(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const texto = String(e.target.result || "");
    const lineas = texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if(lineas.length < 2){
      alert("El archivo está vacío o no tiene filas de datos debajo del encabezado.");
      return;
    }
    const filas = lineas.slice(1).map(l => parseCSVLine(l));
    ejecutarLoteDevolucionMasivo(filas);
    input.value = "";
  };
  reader.readAsText(file, "UTF-8");
}

function ejecutarLoteDevolucionMasivo(filas){
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  const porCliente = {};
  filas.forEach(fila => {
    const nombreCliente = fila[0];
    const guiaId = fila[1];
    if(!nombreCliente || !guiaId) return;
    if(!porCliente[nombreCliente]) porCliente[nombreCliente] = [];
    porCliente[nombreCliente].push(guiaId);
  });

  const todosEncontrados = [];
  const nuevasGuiasDevolucion = [];
  const clientesNoEncontrados = [];
  const guiasNoEncontradas = [];

  Object.keys(porCliente).forEach(nombreCliente => {
    const idsCliente = porCliente[nombreCliente];
    const clienteObj = CLIENTES.find(c => c.comercio.trim().toLowerCase() === nombreCliente.trim().toLowerCase());
    if(!clienteObj){
      clientesNoEncontrados.push(nombreCliente);
      return;
    }
    const tienda = tiendaLabel(clienteObj);
    const encontrados = [];
    idsCliente.forEach(id => {
      const g = GUIAS.find(x => x.id === id);
      if(g){
        const anterior = g.estado;
        g.estado = "Devolución";
        g.tienda = tienda;
        registrarCambioGuia(g, "Lote de devolución masivo (Excel) — " + tienda, anterior, "Devolución", state.role);
        encontrados.push(g);
        todosEncontrados.push(g);
      } else {
        guiasNoEncontradas.push(id);
      }
    });
    if(encontrados.length > 0){
      const nuevoId = "XC" + state.nextGuiaNum;
      state.nextGuiaNum++;
      const codigoBarra = nuevoId;
      const nueva = {
        id:nuevoId, cliente:clienteObj.comercio, cuenta:clienteObj.comercio, estado:"Creado", fecha:fechaStr, fechaEntrega:null,
        operador:state.role, piloto:"-", ruta:"-", codigoBarra,
        fotoEntrega:null, ubicacionEntrega:null, firmaEntrega:null, tienda:tienda,
        nombre:clienteObj.comercio, direccion:clienteObj.direccion || "-", municipio:"-", fragil:"No",
        departamento:"-", esDevolucionConsolidada:true, guiasIncluidas:encontrados.map(g => g.id),
        eliminada:false, fechaEliminacion:null, eliminadaPor:null,
        creadoPor:creadorActual().nombre, creadoPorTipo:creadorActual().tipo,
      };
      GUIAS.push(nueva);
      HISTORIAL[nuevoId] = [
        { fecha:fechaStr, usuario:state.role, accion:"Guía de devolución generada (lote masivo) para enviar los paquetes de vuelta a " + clienteObj.comercio + " (incluye: " + encontrados.map(g => g.id).join(", ") + ")", de:"-", a:"Creado" }
      ];
      crearNotificacionCliente(nueva, "Se generó una nueva guía de devolución para reenviarte tus paquetes", "-", "Creado", state.role, fechaStr);
      nuevasGuiasDevolucion.push(nueva);
    }
  });

  state.ultimoLoteDevolucion = todosEncontrados;
  state.guiasDevolucionGeneradas = nuevasGuiasDevolucion;
  state.mostrarCreacionMasivaLote = false;

  let msg = `Archivo procesado: ${todosEncontrados.length} guía(s) marcadas como Devolución en ${nuevasGuiasDevolucion.length} cliente(s) distinto(s).`;
  if(clientesNoEncontrados.length > 0){
    msg += `\n\n⚠️ Estos clientes no coinciden con "Clientes" (revisa el nombre exacto): ${clientesNoEncontrados.join(", ")}`;
  }
  if(guiasNoEncontradas.length > 0){
    msg += `\n\n⚠️ Estas guías no existen en el sistema: ${guiasNoEncontradas.join(", ")}`;
  }
  alert(msg);
  render();
}

/* ============ MANIFIESTOS DE CARGA (Piloto firma / Super Administrativo y Administrativo consultan) ============
   Antes de que una ruta salga a reparto se genera un manifiesto que agrupa
   todas las guías que el piloto lleva ese día en esa ruta: total de guías,
   total de paquetes, peso, la firma del piloto y las horas de salida y de
   regreso a bodega. */

/* Agrupa las guías activas por ruta + piloto + fecha (cada combinación es
   una "salida" distinta, aunque el nombre de la ruta se repita otro día). */
function gruposRutaParaManifiesto(){
  const activas = GUIAS.filter(g => !g.eliminada && g.piloto && g.piloto !== "-" && g.ruta && g.ruta !== "-" && g.fecha && g.fecha !== "-");
  const grupos = {};
  activas.forEach(g => {
    const key = `${g.ruta}||${g.piloto}||${g.fecha}`;
    if(!grupos[key]) grupos[key] = { key, ruta:g.ruta, piloto:g.piloto, fecha:g.fecha, guias:[] };
    grupos[key].guias.push(g);
  });
  return Object.values(grupos).sort((a,b) => (parseFechaGuia(b.fecha)||0) - (parseFechaGuia(a.fecha)||0));
}

function manifiestoTotales(guias){
  const totalPaquetes = guias.reduce((a,g) => a + (Number(g.bultos) || 1), 0);
  const pesoTotal = guias.reduce((a,g) => a + (Number(g.peso) || 0), 0);
  return { totalPaquetes, pesoTotal };
}

/* ---- Formato/lógica de colores y precio del MANIFIESTO (bitácora) ----
   Reglas (SOLO visuales, dentro del manifiesto — nunca cambian el estado
   real de la guía en el sistema, ni g.estado ni g.cambioPrecioDepositos):
     • Entregado en sistema        -> sin color, se deja el precio.
     • Devolución en sistema       -> color rojo, se quita el precio.
     • Pendiente en sistema        -> color amarillo, se quita el precio (solo
       en el manifiesto; no afecta g.precio ni el estado real de la guía).
     • Cambio de precio / Depósitos
       en general confirmado       -> color morado, "Revisión manual"
       (tiene prioridad sobre el estado, igual que en la bitácora física).
     • "Sin ingreso": el piloto marcó la guía como Entregado sin escaneo
       (ingreso manual) y esa guía no estaba en el manifiesto firmado al
       salir — se agrega automáticamente al manifiesto y se resalta en
       azul para que quede registrado, pero sigue la misma lógica de
       precio que "Entregado". */
function manifiestoEstiloGuia(g, m){
  const sinIngreso = !!(m && m.guiasSinIngreso && m.guiasSinIngreso.includes(g.id));
  if(g.cambioPrecioDepositos === "Sí"){
    return {
      etiqueta:"Revisión manual", bg:"#f3e8ff", color:"#6b21a8", border:"#e9d5ff",
      precioTexto:"🔍 Revisión manual",
    };
  }
  if(g.estado === "Devolución"){
    return {
      etiqueta:"Devolución", bg:"#fef2f2", color:"#b91c1c", border:"#fecaca",
      precioTexto:"—",
    };
  }
  if(g.estado === "Pendiente"){
    return {
      etiqueta:"Pendiente", bg:"#fffbeb", color:"#b45309", border:"#fde68a",
      precioTexto:"—",
    };
  }
  return {
    etiqueta: sinIngreso ? "Entregado · Sin ingreso" : "Entregado",
    bg: sinIngreso ? "#eff6ff" : null,
    color: sinIngreso ? "#1d4ed8" : null,
    border: sinIngreso ? "#bfdbfe" : null,
    precioTexto: g.precio ? "US$ " + esc(String(g.precio)) : "-",
  };
}

function manifiestoTotalesPrecio(guias, m){
  let totalAReportar = 0;
  let enRevisionManual = 0;
  guias.forEach(g => {
    const est = manifiestoEstiloGuia(g, m);
    if(est.etiqueta === "Revisión manual") enRevisionManual++;
    else if(est.etiqueta !== "Devolución" && est.etiqueta !== "Pendiente") totalAReportar += Number(g.precio) || 0;
  });
  return { totalAReportar, enRevisionManual };
}

function initFirmaManifiestoPad(key){
  const canvas = document.getElementById("firmaManifiestoCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#1e2761";
  let drawing = false;
  let hasStroke = false;

  if(firmaManifiestoTemp[key]){
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = firmaManifiestoTemp[key];
  }

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; hasStroke = true; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){
    if(drawing && hasStroke){
      firmaManifiestoTemp[key] = canvas.toDataURL("image/png");
    }
    drawing = false;
  }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}

function limpiarFirmaManifiesto(key){
  const canvas = document.getElementById("firmaManifiestoCanvas");
  if(canvas) canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
  delete firmaManifiestoTemp[key];
}

function confirmarSalidaManifiesto(key){
  if(state.role !== "Piloto"){
    alert("Solo el piloto asignado puede firmar la salida del manifiesto, desde su propia cuenta.");
    return;
  }
  if(!firmaManifiestoTemp[key]){
    alert("El piloto debe firmar antes de registrar la salida de la ruta.");
    return;
  }
  const grupo = gruposRutaParaManifiesto().find(g => g.key === key);
  if(!grupo){
    alert("Esta ruta ya no tiene guías asignadas.");
    return;
  }
  if(grupo.piloto !== PILOTO_ACTUAL){
    alert("Solo puedes firmar la salida de rutas asignadas a ti.");
    return;
  }
  const { totalPaquetes, pesoTotal } = manifiestoTotales(grupo.guias);
  const num = nextManifiestoNum++;
  const horaActual = new Date().toLocaleString("es-SV", { hour:"2-digit", minute:"2-digit" });
  MANIFIESTOS.push({
    id: "MC-" + String(num).padStart(3,"0"),
    ruta: grupo.ruta,
    piloto: grupo.piloto,
    fecha: grupo.fecha,
    guiaIds: grupo.guias.map(g => g.id),
    guiasSinIngreso: [],
    totalPaquetes, pesoTotal,
    horaSalida: horaActual,
    horaRegreso: null,
    firmaPiloto: firmaManifiestoTemp[key],
    firmaPilotoRegreso: null,
    estado: "En ruta",
  });
  delete firmaManifiestoTemp[key];
  state.manifiestoFirmaAbierto = null;
  render();
}

/* Si el piloto marca una guía como Entregado sin escanear el QR (ingreso
   manual) y esa guía no formaba parte del manifiesto que firmó al salir,
   se agrega automáticamente al manifiesto en ruta del piloto, marcada como
   "Sin ingreso" para que quede registrado que no fue declarada al inicio.
   No cambia el estado real de la guía ni requiere ninguna acción manual. */
function agregarGuiaSinIngresoSiAplica(id){
  if(state.role !== "Piloto") return;
  const m = MANIFIESTOS.find(x => x.piloto === PILOTO_ACTUAL && x.estado === "En ruta");
  if(!m) return;
  if(m.guiaIds.includes(id)) return;
  const g = GUIAS.find(x => x.id === id);
  if(!g) return;
  m.guiaIds.push(id);
  if(!m.guiasSinIngreso) m.guiasSinIngreso = [];
  m.guiasSinIngreso.push(id);
  m.totalPaquetes = (m.totalPaquetes || 0) + (Number(g.bultos) || 1);
  m.pesoTotal = (m.pesoTotal || 0) + (Number(g.peso) || 0);
}

    return;
  }
  const m = MANIFIESTOS.find(x => x.id === id);
  if(!m) return;
  if(m.piloto !== PILOTO_ACTUAL){
    alert("Solo puedes registrar el regreso de tus propios manifiestos.");
    return;
  }
  if(!firmaRegresoManifiestoTemp[id]){
    alert("Debes firmar para confirmar el regreso a bodega.");
    return;
  }
  m.horaRegreso = new Date().toLocaleString("es-SV", { hour:"2-digit", minute:"2-digit" });
  m.firmaPilotoRegreso = firmaRegresoManifiestoTemp[id];
  m.estado = "Cerrado";
  delete firmaRegresoManifiestoTemp[id];
  state.manifiestoRegresoAbierto = null;
  render();
}

function verManifiesto(id){
  const m = MANIFIESTOS.find(x => x.id === id);
  if(!m){ alert("No se encontró el manifiesto."); return; }
  const guias = m.guiaIds.map(gid => GUIAS.find(g => g.id === gid)).filter(Boolean);
  const ventana = window.open("", "_blank", "width=560,height=800");
  if(!ventana){ alert("El navegador bloqueó la ventana. Habilita las ventanas emergentes para este sitio."); return; }
  ventana.document.write(documentoManifiestoHtml(m, guias));
  ventana.document.close();
  ventana.focus();
}

function descargarManifiesto(id){
  if(state.role === "Piloto"){ alert("La descarga de manifiestos está disponible solo para usuarios administradores."); return; }
  const m = MANIFIESTOS.find(x => x.id === id);
  if(!m){ alert("No se encontró el manifiesto."); return; }
  const guias = m.guiaIds.map(gid => GUIAS.find(g => g.id === gid)).filter(Boolean);
  const html = documentoManifiestoHtml(m, guias);
  const blob = new Blob([html], { type:"text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Manifiesto_${m.id}.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const CODIGOS_ASESOR_PALABRAS = ["ENVIO UNICO","PERSONALIZADO","LOCKERS","METROGALERIA"];
const MENSAJE_CODIGO_ASESOR_INVALIDO = "El código de asesor debe ser un número entre 100 y 200, o una de estas palabras: ENVIO UNICO, PERSONALIZADO, LOCKERS, METROGALERIA.";

function filtrarCodigoAsesor(el){
  el.value = el.value.toUpperCase().replace(/[^0-9A-Z ]/g, "");
}

function codigoAsesorValido(valor){
  const v = (valor || "").trim().toUpperCase();
  if(!v) return false;
  if(CODIGOS_ASESOR_PALABRAS.includes(v)) return true;
  if(/^\d+$/.test(v)){
    const n = parseInt(v, 10);
    return n >= 100 && n <= 200;
  }
  return false;
}

function guardarCliente(){
  const comercio = val("c_comercio");
  const telefono = val("c_telefono");
  const correo = val("c_correo");
  const direccion = val("c_direccion");
  const password = val("c_password");
  const numeroAsesor = val("c_asesor").trim().toUpperCase();
  const nombreAsesor = val("c_asesor_nombre");
  const telefonoAsesor = val("c_asesor_telefono");
  if(!comercio || !telefono || !correo || !direccion || !password){
    alert("Completa todos los campos obligatorios.");
    return;
  }
  if(!numeroAsesor){
    alert("Ingresa el código de asesor de la tienda del cliente.");
    return;
  }
  if(!codigoAsesorValido(numeroAsesor)){
    alert(MENSAJE_CODIGO_ASESOR_INVALIDO);
    return;
  }
  if(!nombreAsesor || !telefonoAsesor){
    alert("Ingresa el nombre y el teléfono del asesor para que el cliente pueda contactarlo.");
    return;
  }
  const num = CLIENTES.length + 1;
  const esMetro = state.metrogaleriaTemp === "Sí";
  const esLockers = state.lockersTemp === "Sí";
  const tarifaEnvio = esLockers ? 1.65 : parseFloat(val("c_tarifa"));
  const comision = esLockers ? 0.00 : parseFloat(val("c_comision"));
  const nuevoCliente = {
    id: "C-" + String(num).padStart(3,"0"),
    comercio, telefono, correo, direccion,
    departamento: val("c_departamento"),
    municipio: val("c_municipio"),
    password: "••••••••",
    passwordReal: password,
    numeroAsesor,
    nombreAsesor,
    telefonoAsesor,
    metrogaleria: esMetro,
    lockers: esLockers,
    tarifaEnvio: esMetro ? null : (isNaN(tarifaEnvio) ? TARIFA_ENVIO_DEFAULT : tarifaEnvio),
    comision: esMetro ? null : (isNaN(comision) ? COMISION_DEFAULT : comision),
    vipManual: false,
  };
  CLIENTES.push(nuevoCliente);
  guardarClienteEnFirestore(nuevoCliente);
  state.metrogaleriaTemp = "No";
  state.lockersTemp = "No";
  state.mostrarFormCliente = false;

}

function procesarArchivoClientesMasivo(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const texto = String(e.target.result || "");
    const lineas = texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if(lineas.length < 2){
      alert("El archivo está vacío o no tiene filas de datos debajo del encabezado.");
      return;
    }
    const filas = lineas.slice(1).map(l => parseCSVLine(l));
    crearClientesMasivo(filas);
    input.value = "";
  };
  reader.readAsText(file, "UTF-8");
}

function crearClientesMasivo(filas){
  let creados = 0;
  const errores = [];
  filas.forEach((fila, idx) => {
    const numeroFila = idx + 2; // +2 porque la fila 1 del archivo es el encabezado
    const [
      comercio, telefono, correo, direccion, departamento, municipio,
      codigoAsesorRaw, nombreAsesor, telefonoAsesor,
      metroRaw, lockersRaw, tarifaRaw, comisionRaw, password,
    ] = fila;

    if(!comercio || !telefono || !correo || !direccion || !password){
      errores.push(`Fila ${numeroFila}: faltan campos obligatorios (Comercio, Telefono, Correo, Direccion o Password).`);
      return;
    }
    const codigoAsesor = (codigoAsesorRaw || "").trim().toUpperCase();
    if(!codigoAsesor || !codigoAsesorValido(codigoAsesor)){
      errores.push(`Fila ${numeroFila} (${comercio}): código de asesor inválido. ${MENSAJE_CODIGO_ASESOR_INVALIDO}`);
      return;
    }
    if(!nombreAsesor || !telefonoAsesor){
      errores.push(`Fila ${numeroFila} (${comercio}): falta el nombre o teléfono del asesor.`);
      return;
    }
    const yaExiste = CLIENTES.some(c => c.comercio.trim().toLowerCase() === comercio.trim().toLowerCase());
    if(yaExiste){
      errores.push(`Fila ${numeroFila} (${comercio}): ya existe un cliente con ese nombre de comercio, se omitió.`);
      return;
    }

    const esMetro = ["si","sí"].includes((metroRaw || "").trim().toLowerCase());
    const esLockers = ["si","sí"].includes((lockersRaw || "").trim().toLowerCase());
    const tarifaParsed = parseFloat(tarifaRaw);
    const comisionParsed = parseFloat(comisionRaw);
    const num = CLIENTES.length + 1;
    const nuevoClienteMasivo = {
      id: "C-" + String(num).padStart(3, "0"),
      comercio, telefono, correo, direccion,
      departamento: departamento || "-",
      municipio: municipio || "-",
      password: "••••••••",
      passwordReal: password,
      numeroAsesor: codigoAsesor,
      nombreAsesor, telefonoAsesor,
      metrogaleria: esMetro,
      lockers: esLockers,
      tarifaEnvio: esMetro ? null : (esLockers ? 1.65 : (isNaN(tarifaParsed) ? TARIFA_ENVIO_DEFAULT : tarifaParsed)),
      comision: esMetro ? null : (esLockers ? 0.00 : (isNaN(comisionParsed) ? COMISION_DEFAULT : comisionParsed)),
      vipManual: false,
    };
    CLIENTES.push(nuevoClienteMasivo);
    guardarClienteEnFirestore(nuevoClienteMasivo);
    creados++;
  });

  state.mostrarCreacionMasivaClientes = false;
  let msg = `Archivo procesado: ${creados} cliente(s) creado(s) correctamente.`;
  if(errores.length > 0){
    msg += `\n\n⚠️ ${errores.length} fila(s) con problemas:\n` + errores.join("\n");
  }
  alert(msg);
  render();
}

function generarPasswordAleatoria(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  let pass = "";
  for(let i=0;i<10;i++){
    pass += chars.charAt(Math.floor(Math.random()*chars.length));
  }
  return pass;
}

function confirmarCambioMasivoPasswords(){
  if(EMPLEADOS.length === 0){
    alert("No hay empleados registrados todavía.");
    return;
  }
  const ok = confirm(`¿Generar una nueva contraseña aleatoria para los ${EMPLEADOS.length} empleados? Las contraseñas actuales quedarán reemplazadas.`);
  if(!ok) return;
  EMPLEADOS.forEach(e => { e.password = generarPasswordAleatoria(); guardarEmpleadoEnFirestore(e); });
  state.passwordsRecienGeneradas = true;
  render();
}

function regenerarPasswordEmpleado(id){
  const e = EMPLEADOS.find(x => x.id === id);
  if(!e) return;
  e.password = generarPasswordAleatoria();
  guardarEmpleadoEnFirestore(e);
  state.passwordsRecienGeneradas = true;
  render();
}

/* Guarda un destinatario nuevo en DESTINATARIOS evitando duplicados por nombre
   dentro de la misma tienda/cliente. Se usa tanto al agregarlo manualmente desde
   la pantalla de Destinatarios como automáticamente cada vez que un cliente crea
   una guía (incluyendo Guías Xpress 24/h). tiendaId identifica al dueño, para
   que cada cliente solo pueda ver y usar los destinatarios que él mismo ha
   creado. Solo se guardan los datos que interesan del destinatario: nombre,
   teléfono, dirección, municipio y departamento. */
function guardarDestinatarioSiNuevo(nombre, telefono, direccion, departamento, municipio, tiendaId){
  const limpio = (nombre || "").trim();
  if(!limpio) return false;
  const duenio = tiendaId || null;
  const yaExiste = DESTINATARIOS.some(d => d.tiendaId === duenio && d.nombre.trim().toLowerCase() === limpio.toLowerCase());
  if(yaExiste) return false;
  const num = DESTINATARIOS.length + 1;
  DESTINATARIOS.push({
    id: "D-"+String(num).padStart(3,"0"),
    nombre: limpio,
    telefono: telefono || "",
    direccion: direccion || "",
    departamento: departamento || "",
    municipio: municipio || "",
    tiendaId: duenio,
  });
  return true;
}

/* Patrón horario de referencia (franjas de creación de guías). Sirve de base
   visual mientras el sistema acumula más registros de horas reales de
   creación; se puede sustituir por el conteo real apenas exista suficiente
   volumen de datos en HISTORIAL. */
const PATRON_HORARIO_DEMO = [
  { franja:"6-8h", valor:4 }, { franja:"8-10h", valor:14 }, { franja:"10-12h", valor:22 },
  { franja:"12-14h", valor:18 }, { franja:"14-16h", valor:26 }, { franja:"16-18h", valor:19 },

];

function biKPIs(){
  const activas = GUIAS.filter(g => !g.eliminada);
  const total = activas.length;
  const entregadas = activas.filter(g => ["Entregado","Finalizado"].includes(g.estado)).length;
  const enProceso = activas.filter(g => !["Entregado","Finalizado","Devolución","Creado"].includes(g.estado)).length;
  const devoluciones = activas.filter(g => g.estado === "Devolución").length;
  const tasaEntrega = total ? Math.round((entregadas/total)*100) : 0;
  const clientesActivos = new Set(activas.map(g => g.cliente)).size;
  return { total, entregadas, enProceso, devoluciones, tasaEntrega, clientesActivos };
}

function biVolumenPorFecha(){
  const conteo = {};
  GUIAS.filter(g => !g.eliminada).forEach(g => {
    if(!parseFechaGuia(g.fecha)) return;
    conteo[g.fecha] = (conteo[g.fecha]||0) + 1;
  });
  const fechas = Object.keys(conteo).sort((a,b) => parseFechaGuia(a) - parseFechaGuia(b));
  return fechas.map(f => ({ fecha:f, total:conteo[f] }));
}

/* Pronóstico simple por regresión lineal sobre el histórico diario de guías. */
function biPronosticoEnvios(dias){
  dias = dias || 5;
  const historico = biVolumenPorFecha();
  if(historico.length === 0) return { historico:[], pronostico:[], tendencia:"stable" };
  const valores = historico.map(h => h.total);
  const n = valores.length;
  const sumX = valores.reduce((a,_,i) => a+i, 0);
  const sumY = valores.reduce((a,v) => a+v, 0);
  const sumXY = valores.reduce((a,v,i) => a+v*i, 0);
  const sumX2 = valores.reduce((a,_,i) => a+i*i, 0);
  const denom = (n*sumX2 - sumX*sumX) || 1;
  const m = (n*sumXY - sumX*sumY) / denom;
  const b = (sumY - m*sumX) / n;
  const promedio = sumY / n;
  const ultimaFecha = parseFechaGuia(historico[historico.length-1].fecha);
  const pronostico = [];
  for(let i=1;i<=dias;i++){
    const idx = n - 1 + i;
    let val = Math.round(m*idx + b);
    if(!isFinite(val) || val < Math.round(promedio*0.6)) val = Math.round(promedio*0.6);
    const f = new Date(ultimaFecha);
    f.setDate(f.getDate()+i);
    const fechaStr = `${String(f.getDate()).padStart(2,"0")}/${String(f.getMonth()+1).padStart(2,"0")}/${String(f.getFullYear()).slice(-2)}`;
    pronostico.push({ fecha:fechaStr, total:val });
  }
  const tendencia = m > 0.15 ? "up" : (m < -0.15 ? "down" : "stable");
  return { historico, pronostico, tendencia };
}

function biMapaCalorDepartamentos(){
  const activas = GUIAS.filter(g => !g.eliminada);
  const conteo = {};
  activas.forEach(g => {
    if(!g.departamento || g.departamento === "-") return;
    conteo[g.departamento] = (conteo[g.departamento]||0) + 1;
  });
  return Object.keys(DEPTO_COORDS).map(d => ({ depto:d, total: conteo[d]||0 }));
}

function biCrecimientoClientes(){
  const activas = GUIAS.filter(g => !g.eliminada);
  return CLIENTES.map(c => {
    const guiasCliente = activas.filter(g => g.cliente === c.comercio);
    const total = guiasCliente.length;
    const diasDesde = (fechaStr) => {
      const f = parseFechaGuia(fechaStr);
      if(!f) return null;
      return Math.round((FECHA_REF_HOY - f)/86400000);
    };
    const recientes = guiasCliente.filter(g => { const d = diasDesde(g.fecha); return d !== null && d >= 0 && d <= 1; }).length;
    const previas = guiasCliente.filter(g => { const d = diasDesde(g.fecha); return d !== null && d >= 2 && d <= 3; }).length;
    let crecimiento;
    if(previas === 0) crecimiento = recientes > 0 ? 100 : 0;
    else crecimiento = Math.round(((recientes - previas)/previas)*100);
    return { cliente:c.comercio, vip:esClienteVip(c), total, recientes, previas, crecimiento };
  }).sort((a,b) => b.crecimiento - a.crecimiento || b.total - a.total);
}

function biPronosticoChart(historico, pronostico){
  const items = historico.map(h => ({ label:h.fecha, valor:h.total, tipo:"real" }))
    .concat(pronostico.map(p => ({ label:p.fecha, valor:p.total, tipo:"pronostico" })));
  const width = 640, height = 220, padBottom = 30, padTop = 16;
  const maxV = Math.max(...items.map(i => i.valor), 1);
  const gap = width / items.length;
  const barW = gap * 0.6;
  const bars = items.map((it,i) => {
    const h = (it.valor/maxV) * (height - padBottom - padTop);
    const x = i*gap + (gap-barW)/2;
    const y = height - padBottom - h;
    const color = it.tipo === "real" ? "#1a2247" : "#ff6b35";
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}" opacity="${it.tipo==='real'?1:0.8}"><title>${esc(it.label)}: ${it.valor} guía(s)${it.tipo==="pronostico" ? " · proyectado" : ""}</title></rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${height-12}" font-size="9" fill="#94a3b8" text-anchor="middle">${esc(it.label).slice(0,5)}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="700">${it.valor}</text>
    `;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:100%;display:block;">${bars}</svg>`;
}

function biMapaCalorSvg(datos){

    const { x, y } = toXYMapa(DEPTO_COORDS[d.depto], width, height);
    const r = d.total === 0 ? 5 : 8 + (d.total/maxT)*22;
    let fill = "#cbd5e1";

    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${fill}" fill-opacity="0.82" stroke="#fff" stroke-width="1.5"><title>${esc(d.depto)}: ${d.total} guía(s)</title></circle>`;

/* ============ ESTRUCTURA FINANCIERA (Herramientas · Super Administrativo) ============ */
function guardarEstructuraFinanciera(){
  const val = (id) => parseFloat(document.getElementById(id).value);
  const tarifa = val("ef_tarifa"); const comision = val("ef_comision");
  const seguro = val("ef_seguro"); const xpress = val("ef_xpress");
  const zona = val("ef_zona"); const iva = val("ef_iva");
  ESTRUCTURA_FINANCIERA = {
    tarifaBaseEnvio: isNaN(tarifa) ? ESTRUCTURA_FINANCIERA.tarifaBaseEnvio : tarifa,
    comisionOperativaPct: isNaN(comision) ? ESTRUCTURA_FINANCIERA.comisionOperativaPct : comision,
    seguroValorDeclaradoPct: isNaN(seguro) ? ESTRUCTURA_FINANCIERA.seguroValorDeclaradoPct : seguro,
    recargoXpress24h: isNaN(xpress) ? ESTRUCTURA_FINANCIERA.recargoXpress24h : xpress,
    recargoZonaExtendida: isNaN(zona) ? ESTRUCTURA_FINANCIERA.recargoZonaExtendida : zona,
    ivaPct: isNaN(iva) ? ESTRUCTURA_FINANCIERA.ivaPct : iva,
  };
  state.estructuraFinancieraGuardada = true;
  render();
}

function onSimFinInput(){
  state.simFinValorDeclarado = parseFloat(document.getElementById("ef_sim_valor").value) || 0;
  render();
}
function toggleSimFinXpress(){ state.simFinXpress = !state.simFinXpress; render(); }
function toggleSimFinZona(){ state.simFinZonaExtendida = !state.simFinZonaExtendida; render(); }
