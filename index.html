<!-- Librería real de generación de códigos QR (estándar ISO/IEC 18004): produce
     códigos QR válidos, legibles por cualquier lector/escáner de QR en Android,
     iPhone o lectores dedicados de bodega — no es una imagen decorativa. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- ============ LEAFLET (mapa real, OpenStreetMap) ============
     Mapa interactivo real (no dibujo/SVG): se usa para que el cliente marque
     la ubicación exacta de entrega al crear una guía, y así el sistema pueda
     calcular (fórmula de Haversine) cuál es la agencia/hub de Xpress El
     Salvador más cercana a esa dirección y asignarla automáticamente.
     No requiere API key: las teselas del mapa vienen de OpenStreetMap. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- ============ FIREBASE (Firestore) ============
     Conecta la app a la base de datos real del proyecto "xpress-control".
     A partir de aquí, CLIENTES ya no vive solo en memoria del navegador:
     se lee y se escribe en la colección "clientes" de Firestore, así que
     cualquier cliente que se cree en un dispositivo aparece igual en
     cualquier otro dispositivo/navegador que abra este mismo archivo. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCKdQ7ANvl69GY-711L8bl5x_Ahf_pJOwU",
    authDomain: "xpress-control.firebaseapp.com",
    projectId: "xpress-control",
    storageBucket: "xpress-control.firebasestorage.app",
    messagingSenderId: "134827577462",
    appId: "1:134827577462:web:3ae96d5db57a9028ba8f57",
    measurementId: "G-Y4H1RWESJL"
  };
  firebase.initializeApp(firebaseConfig);
  const dbFirestore = firebase.firestore();
  /* Persistencia offline: sin esto, Firestore solo guarda los datos en
     memoria mientras dura la pestaña abierta, así que si el piloto pierde
     conexión (muy común trabajando en la calle) o cierra y vuelve a abrir
     la app sin internet, no tiene ninguna guía disponible para escanear —
     ni siquiera las que ya se habían sincronizado antes. Con
     enablePersistence(), el navegador guarda una copia local (IndexedDB) de
     todo lo que ya se sincronizó, y esa copia sigue disponible aunque no
     haya internet en ese momento. Una guía creada mientras el dispositivo
     está sin conexión, y que nunca llegó a sincronizarse en él, seguirá sin
     poder encontrarse hasta que recupere conexión — eso no tiene solución
     posible sin internet, pero ya no se pierde todo lo demás. */
  dbFirestore.enablePersistence({ synchronizeTabs: true }).catch(err => {
    if(err.code === "failed-precondition"){
      // Persistencia ya activa en otra pestaña abierta del mismo navegador; no es un error real.
      console.warn("Persistencia offline de Firestore: ya está activa en otra pestaña.");
    }else if(err.code === "unimplemented"){
      console.warn("Este navegador no soporta persistencia offline de Firestore.");
    }else{
      console.error("Error al activar persistencia offline de Firestore:", err);
    }
  });
</script>

<script>
  // Fija la altura real de pantalla una sola vez (al cargar y al rotar el
  // celular), en vez de depender de 100vh, que en Chrome/Safari móvil
  // cambia cada vez que la barra de direcciones se esconde o aparece al
  // hacer scroll — eso es lo que provocaba que la app "saltara" sola.
  function fijarAlturaApp(){
    document.documentElement.style.setProperty('--app-vh', window.innerHeight + 'px');
  }
  fijarAlturaApp();
  window.addEventListener('orientationchange', () => setTimeout(fijarAlturaApp, 200));
  let ultimoAnchoVentana = window.innerWidth;
  window.addEventListener('resize', () => {
    if(window.innerWidth !== ultimoAnchoVentana){
      ultimoAnchoVentana = window.innerWidth;
      fijarAlturaApp();
    }
  });
</script>

/* ---- Sincronización en tiempo real del historial de una guía ----
   Cuando se abre el detalle de una guía, nos suscribimos a su subcolección
   "guias/{id}/historial" en Firestore. Así, si esa misma guía se modifica
   desde otro dispositivo (u otra pestaña), el historial que se ve en
   pantalla se actualiza solo, sin recargar la página. Solo puede haber una
   suscripción activa a la vez; se cierra automáticamente al salir del
   detalle o al abrir otra guía. */
let detenerSincronizacionHistorial = null;

function sincronizarHistorialGuia(guiaId){
  if(detenerSincronizacionHistorial){ detenerSincronizacionHistorial(); detenerSincronizacionHistorial = null; }
  if(typeof dbFirestore === "undefined" || !dbFirestore || !guiaId) return;
  detenerSincronizacionHistorial = dbFirestore.collection("guias").doc(guiaId).collection("historial")
    .orderBy("creadoEn", "asc")
    .onSnapshot((snapshot) => {
      const eventos = snapshot.docs.map(doc => doc.data());
      if(eventos.length > 0){
        HISTORIAL[guiaId] = eventos;
        render();
      }
    }, err => {
      console.error("Error sincronizando historial de la guía:", err);
    });
}

function detenerSincronizacionHistorialActual(){
  if(detenerSincronizacionHistorial){ detenerSincronizacionHistorial(); detenerSincronizacionHistorial = null; }
}

const FECHA_REF_HOY = new Date();

/* "Hoy" en formato corto (17/07/26, para comparar contra guia.fecha) y en
   formato largo en español (viernes 17 de julio de 2026, para saludos y
   encabezados). Antes estos textos estaban escritos a mano y quedaban
   desincronizados de la fecha real en cuanto pasaban los días. */
function formatFechaCortaHoy(d){
  return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getFullYear()).slice(-2);
}
function fechaLargaEs(d){
  const texto = d.toLocaleDateString("es-ES", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
  return texto.charAt(0).toLowerCase() + texto.slice(1);
}
const FECHA_HOY_STR = formatFechaCortaHoy(FECHA_REF_HOY);
const FECHA_HOY_LARGA = fechaLargaEs(FECHA_REF_HOY);

/* ---- Centro de Control Operativo ----
   Motor de alertas calculado en vivo sobre las guías, pilotos y clientes
   reales del prototipo (no es una lista fija): cada vez que cambian los
   datos, las alertas se recalculan. */
function calcularAlertasOperativas(){
  const alertas = [];
  const activas = GUIAS.filter(g => !g.eliminada);
  const diasDesde = (fechaStr) => {
    const f = parseFechaGuia(fechaStr);
    if(!f) return null;
    return Math.round((FECHA_REF_HOY - f) / 86400000);
  };

  activas.forEach(g => {
    if(!["Entregado","Finalizado","Devolución"].includes(g.estado)){
      const dias = diasDesde(g.fecha);
      if(dias !== null && dias >= 1){
        alertas.push({ tipo:"Guía detenida más de 24 horas", icon:"🔴", guiaId:g.id,
          mensaje:`Guía ${g.id} (${g.cliente}) lleva ${dias*24}+ horas en estado "${g.estado}" sin avanzar.` });
      }
    }
    if(g.estado === "Asignado a piloto"){
      const dias = diasDesde(g.fecha);
      if(dias !== null && dias >= 1){
        alertas.push({ tipo:"Ruta atrasada", icon:"🔴", guiaId:g.id,
          mensaje:`Guía ${g.id} — ruta "${g.ruta}" con el piloto ${g.piloto} está atrasada.` });
      }
    }
    if(g.urgente && !["Entregado","Finalizado"].includes(g.estado)){
      alertas.push({ tipo:"Entrega Xpress a punto de vencer", icon:"🔴", guiaId:g.id,
        mensaje:`Guía Xpress 24h ${g.id} (${g.cliente}) está a punto de vencer su plazo de entrega.` });
    }
    if((g.escaneos||0) >= 2){
      alertas.push({ tipo:"Paquete escaneado dos veces", icon:"🔴", guiaId:g.id,
        mensaje:`Guía ${g.id} fue escaneada ${g.escaneos} veces — verificar posible duplicado o error de bodega.` });
    }
    if(["Entregado","Finalizado"].includes(g.estado) && !g.fotoEntrega){
      alertas.push({ tipo:"Guía sin fotografía de entrega", icon:"🔴", guiaId:g.id,
        mensaje:`Guía ${g.id} está "${g.estado}" pero no tiene foto de entrega registrada.` });
    }
    if(["Entregado","Finalizado"].includes(g.estado) && !g.firmaEntrega){
      alertas.push({ tipo:"Guía sin firma", icon:"🔴", guiaId:g.id,
        mensaje:`Guía ${g.id} está "${g.estado}" pero no tiene firma del cliente registrada.` });
    }
    const cli = CLIENTES.find(c => c.comercio === g.cliente);
    const esRolAdministrativo = state.role === "Super Administrativo" || state.role === "Administrativo";
    if(cli && esRolAdministrativo && esClienteVip(cli) && !["Entregado","Finalizado","Devolución"].includes(g.estado)){
      alertas.push({ tipo:"Cliente VIP esperando entrega", icon:"🔴", guiaId:g.id,
        mensaje:`Cliente VIP ${cli.comercio} tiene la guía ${g.id} en estado "${g.estado}", aún sin entregar.` });
    }
  });

  EMPLEADOS.filter(e => e.rol === "Piloto").forEach(p => {
    const dias = diasDesde(p.ultimaActividad);
    if(dias !== null && dias >= 1){
      alertas.push({ tipo:"Piloto sin movimiento", icon:"🔴",
        mensaje:`Piloto ${p.nombre} no registra movimiento desde ${p.ultimaActividad}.` });
    }
  });

  return alertas;
}

/* Tarifa de envío y comisión "por determinado": valor por defecto que se
   asigna a todo cliente nuevo. Una vez creado el cliente, solo el
   Super Administrativo puede modificar estos dos valores. */
const TARIFA_ENVIO_DEFAULT = 4.10;
const COMISION_DEFAULT = 2.5;

/* ============ ESTRUCTURA FINANCIERA (Herramientas · Super Administrativo) ============
   Define cómo se compone el valor final que paga el cliente por un paquete/envío:
   tarifa base + seguro sobre el valor declarado + recargos + comisión operativa + IVA.
   Editable únicamente por el Super Administrativo. */
let ESTRUCTURA_FINANCIERA = {
  tarifaBaseEnvio: TARIFA_ENVIO_DEFAULT,   // US$ fijo por envío
  comisionOperativaPct: COMISION_DEFAULT,  // % sobre el subtotal (tarifa + seguro + recargos)
  seguroValorDeclaradoPct: 1.5,            // % sobre el valor declarado del paquete
  recargoXpress24h: 3.00,                  // US$ fijo adicional si el envío es Xpress 24h
  recargoZonaExtendida: 1.50,              // US$ fijo adicional si el destino está fuera del área metropolitana
  ivaPct: 13,                              // % de IVA sobre el subtotal + comisión
};

/* ============ CONFIGURACIÓN DE SOLICITUDES DE AFILIACIÓN ============
   Número de WhatsApp al que se envían todas las solicitudes de afiliación
   (formulario público, sin sesión, accesible desde la pantalla de Login).
   Editable únicamente por el Super Administrativo, desde Estructura
   Financiera. */

};

/* Registro de solicitudes de afiliación enviadas desde el formulario público
   (incluye la firma digital como dataURL), para que Super Administrativo y
   Administrativo puedan consultarlas dentro del sistema. */
let SOLICITUDES_AFILIACION = [];

function calcularValorFinalPaquete(opts){
  const valorDeclarado = Math.max(0, Number(opts.valorDeclarado) || 0);
  const tarifaBase = ESTRUCTURA_FINANCIERA.tarifaBaseEnvio;
  const seguro = valorDeclarado * (ESTRUCTURA_FINANCIERA.seguroValorDeclaradoPct/100);
  const recargoXpress = opts.esXpress ? ESTRUCTURA_FINANCIERA.recargoXpress24h : 0;
  const recargoZona = opts.esZonaExtendida ? ESTRUCTURA_FINANCIERA.recargoZonaExtendida : 0;
  const subtotal = tarifaBase + seguro + recargoXpress + recargoZona;
  const comision = subtotal * (ESTRUCTURA_FINANCIERA.comisionOperativaPct/100);
  const iva = (subtotal + comision) * (ESTRUCTURA_FINANCIERA.ivaPct/100);
  const total = subtotal + comision + iva;
  return { valorDeclarado, tarifaBase, seguro, recargoXpress, recargoZona, subtotal, comision, iva, total };
}

/* ============ SINCRONIZACIÓN DE CLIENTES CON FIRESTORE ============
   CLIENTES ya no vive solo en la memoria del navegador: se guarda en la
   colección "clientes" de Firestore (proyecto xpress-control), y se
   mantiene sincronizado en vivo con onSnapshot. Así, un cliente creado
   en un dispositivo aparece igual en cualquier otro dispositivo/navegador
   que abra este mismo archivo, y el login funciona en todos lados.
   clientesListos pasa a true en cuanto llega la primera respuesta de
   Firestore (vacía o con datos); el login espera a que esto sea true
   para no comparar contra una lista todavía incompleta. */
let clientesListos = false;

function guardarClienteEnFirestore(cliente){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  dbFirestore.collection("clientes").doc(cliente.id).set(cliente).catch(err => {
    console.error("Error guardando cliente en Firestore:", err);
    alert("El cambio se aplicó en esta pantalla, pero no se pudo guardar en la base de datos (revisa tu conexión a internet). Es posible que no se vea reflejado en otros dispositivos.");
  });
}

function iniciarSincronizacionClientes(){
  if(typeof dbFirestore === "undefined" || !dbFirestore){
    clientesListos = true; // sin Firebase disponible, se sigue usando la lista local
    return;
  }
  dbFirestore.collection("clientes").onSnapshot((snapshot) => {
    if(snapshot.empty && !clientesListos){
      // Primera carga y la colección está vacía: subimos los 2 clientes
      // de ejemplo como semilla, para que Firestore quede como fuente
      // real de datos desde el inicio.
      CLIENTES.forEach(c => guardarClienteEnFirestore(c));
      clientesListos = true;
      return;
    }
    const nuevaLista = [];
    snapshot.forEach(doc => nuevaLista.push(doc.data()));
    nuevaLista.sort((a,b) => (a.id||"").localeCompare(b.id||""));
    CLIENTES.length = 0;
    nuevaLista.forEach(c => CLIENTES.push(c));
    const primeraVez = !clientesListos;
    clientesListos = true;
    // Se repinta si es la primera vez que llegan datos (para quitar el aviso
    // de "Conectando..." del login) o si ya hay sesión iniciada (para que
    // pantallas como Clientes reflejen cambios hechos desde otro dispositivo).
    if(typeof state !== "undefined" && (primeraVez || state.role)) render();
  }, (err) => {
    console.error("Error sincronizando clientes con Firestore:", err);
    clientesListos = true; // se deja avanzar con lo que haya en memoria local
  });
}

    GUIAS.forEach(g => {

let configGeneralLista = false;

function guardarConfigGeneralEnFirestore(){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  dbFirestore.collection("config").doc("general").set({
    estructuraFinanciera: ESTRUCTURA_FINANCIERA,
    configAfiliacion: CONFIG_AFILIACION,
    claveExportacionClientes: CLAVE_EXPORTACION_CLIENTES,
  }).catch(err => {
    console.error("Error guardando configuración general en Firestore:", err);
  });
}

function iniciarSincronizacionConfigGeneral(){
  if(typeof dbFirestore === "undefined" || !dbFirestore){
    configGeneralLista = true;
    return;
  }
  dbFirestore.collection("config").doc("general").onSnapshot((doc) => {
    if(!doc.exists && !configGeneralLista){
      guardarConfigGeneralEnFirestore();
      configGeneralLista = true;
      return;
    }
    const datos = doc.data() || {};
    if(datos.estructuraFinanciera) ESTRUCTURA_FINANCIERA = datos.estructuraFinanciera;
    if(datos.configAfiliacion) CONFIG_AFILIACION = datos.configAfiliacion;
    if(datos.claveExportacionClientes) CLAVE_EXPORTACION_CLIENTES = datos.claveExportacionClientes;
    const primeraVez = !configGeneralLista;
    configGeneralLista = true;
    if(typeof state !== "undefined" && (primeraVez || state.role)) render();
  }, (err) => {
    console.error("Error sincronizando configuración general con Firestore:", err);
    configGeneralLista = true;
  });
}

/* La información de "tienda" (nombre, dirección, número de asesor, Metro Galerías)
   ahora es parte del registro del cliente — se captura al crear el cliente,
   en el apartado que solo ven los administradores. */
function tiendaLabel(c){

  if(!c) return "-";
  return c.comercio + (c.numeroAsesor ? " - " + c.numeroAsesor : "");
}

/* Devuelve el registro de cliente (con su info de tienda) para la cuenta logueada */
function clienteActualObj(){
  return CLIENTES.find(c => c.comercio === CLIENTE_ACTUAL) || null;
}

/* Resuelve el registro de empleado (Super Administrativo / Administrativo / Piloto)
   que representa a la cuenta logueada en este prototipo. Se busca por el ID
   exacto guardado al iniciar sesión (EMPLEADO_ACTUAL_ID) — buscar solo por
   rol (state.role) es incorrecto en cuanto hay más de un empleado con el
   mismo rol, porque siempre encontraría al primero del arreglo sin importar
   quién inició sesión realmente. */
function empleadoActualObj(){
  const porId = EMPLEADOS.find(e => e.id === EMPLEADO_ACTUAL_ID);
  if(porId) return porId;
  return EMPLEADOS.find(e => e.rol === state.role) || null;
}

/* Nombre corto para mostrar en la barra superior: primer nombre del empleado
   logueado (Super Administrativo/Administrativo/Piloto), nombre del comercio
   si es un Cliente, o el rol como respaldo si no hay perfil resuelto. */
function nombreCortoUsuarioActual(){
  if(state.role === "Cliente"){
    const c = clienteActualObj();
    return c ? c.comercio : state.role;
  }
  const emp = empleadoActualObj();
  return emp ? emp.nombre.split(" ")[0] : state.role;
}

/* Nombre del perfil que está creando la guía en este momento: el nombre de la
   tienda si es un Cliente, o el nombre del perfil del usuario administrativo
   (Super Administrativo/Administrativo) si es quien la está generando. */
function creadorActual(){
  if(state.role === "Cliente"){
    const c = clienteActualObj();
    return { nombre: c ? tiendaLabel(c) : CLIENTE_ACTUAL, tipo: "Tienda" };
  }
  const emp = empleadoActualObj();
  return { nombre: emp ? emp.nombre : state.role, tipo: "Usuario administrativo" };
}

/* Texto a mostrar en la columna "Creado por": el nombre del perfil que
   generó la guía, dejando en evidencia si fue una tienda o un usuario
   administrativo. */
function creadoPorTexto(g){
  if(!g.creadoPor) return "-";
  return g.creadoPor + (g.creadoPorTipo ? ` <span style="color:#94a3b8;font-weight:400;">(${g.creadoPorTipo})</span>` : "");
}

/* Resuelve la tienda/cliente para el cual se está creando la guía:
   - Cliente: siempre su propia cuenta.
   - Super Administrativo / Administrativo: el cliente que hayan buscado
     y seleccionado en el buscador de "Crear Guía". */
function tiendaParaCrearGuia(){
  if(state.role === "Cliente") return clienteActualObj();
  return CLIENTES.find(c => c.id === state.crearGuiaTiendaId) || null;
}

/* Contenido dinámico del campo "Dirección del cliente" en Crear Guía: cambia

/* Genera las <option> del selector manual de "Agencia asignada" que solo ven
   los roles administrativos en el detalle de una guía, para asignar o
   corregir a mano la agencia/hub de control de traslado (sin que el Cliente
   la vea nunca). Se identifica por el número de agencia, no por dirección,
   para no chocar con agenciasDireccionOptions. */
function agenciaAsignadaManualOptions(direccionSeleccionada){
  const placeholder = `<option value="" ${!direccionSeleccionada ? "selected" : ""}>— Sin agencia asignada —</option>`;
  const opciones = AGENCIAS_XPRESS.map(a => {

    return `<option value="${esc(a.direccion)}" ${direccionSeleccionada === a.direccion ? "selected" : ""}>${esc(label)}</option>`;

/* Genera las <option> del selector de agencia/dirección restringida, usado
   para clientes Metro Galerías y clientes Lockers en Crear Guía. */
function agenciasDireccionOptions(seleccionada){
  const placeholder = `<option value="" ${!seleccionada ? "selected" : ""} disabled>Selecciona una agencia / hub...</option>`;
  const opciones = AGENCIAS_XPRESS.map(a => {
    const label = a.num + " — " + a.nombre + " (" + a.direccion + ")";
    return `<option value="${esc(a.direccion)}" ${seleccionada === a.direccion ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  return placeholder + opciones;
}

/* Filtra en vivo las opciones del <select id="f_direccion"> (catálogo de
   agencias/hubs) según lo que escriba el usuario en el buscador que se
   muestra para envíos ECO de Metro Galerías. Busca por número, nombre o
   dirección de la agencia. Si la agencia ya seleccionada sigue estando
   dentro de los resultados filtrados, se conserva seleccionada. */
function filtrarAgenciasDireccionGuia(valor){
  const select = document.getElementById("f_direccion");
  if(!select) return;
  const seleccionActual = select.value;
  const q = (valor || "").trim().toLowerCase();
  const lista = q ? AGENCIAS_XPRESS.filter(a =>
    a.nombre.toLowerCase().includes(q) ||
    a.direccion.toLowerCase().includes(q) ||
    a.num.toLowerCase().includes(q)
  ) : AGENCIAS_XPRESS;
  const seSigueViendo = lista.some(a => a.direccion === seleccionActual);
  const placeholder = `<option value="" ${!seSigueViendo ? "selected" : ""} disabled>${lista.length ? "Selecciona una agencia / hub..." : "Sin resultados para tu búsqueda"}</option>`;
  const opciones = lista.map(a => {
    const label = a.num + " — " + a.nombre + " (" + a.direccion + ")";
    return `<option value="${esc(a.direccion)}" ${seSigueViendo && seleccionActual === a.direccion ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  select.innerHTML = placeholder + opciones;
}

/* ============ MAPA REAL EN CREAR GUÍA + ASIGNACIÓN AUTOMÁTICA DE AGENCIA ============
   Para clientes de dirección libre (no Metro Galerías / no Lockers), se
   muestra un mapa real (Leaflet + OpenStreetMap) donde el cliente marca el
   punto exacto de recolección/entrega tocando el mapa. En cuanto hay un
   punto marcado, se calcula con Haversine cuál agencia/hub de
   AGENCIAS_XPRESS queda más cerca y se guarda para asignarse
   automáticamente a la guía al enviarla (ver enviarGuia). */
let mapaDireccionGuiaInstancia = null;
let marcadorDireccionGuia = null;
let marcadorAgenciaGuia = null; // marcador fijo (no editable) que solo señala en el mapa dónde está la agencia/hub más cercana ya asignada; se dibuja para todos los roles, incluido Cliente.

function onDireccionGuiaTexto(valor){
  state.direccionGuiaTexto = valor;
}

/* Texto informativo bajo el mapa: muestra la agencia asignada en cuanto hay
   un punto marcado, o invita a marcar uno mientras tanto. */
function agenciaCercanaInfoHtml(){
  if(!state.direccionGuiaLat || !state.direccionGuiaLng){
    return "Aún no marcas tu ubicación en el mapa: en cuanto lo hagas, el sistema te asignará automáticamente la agencia Xpress más cercana.";
  }
  if(!state.agenciaCercana) return "Calculando la agencia más cercana...";
  return `📍 Agencia asignada automáticamente: <b>${esc(state.agenciaCercana.nombre)}</b> — a ${state.agenciaCercanaDistancia} km de tu ubicación marcada.`;
}

/* Recalcula (Haversine) la agencia más cercana al punto marcado y refresca
   solo el texto informativo, sin re-renderizar todo el mapa. */
function actualizarAgenciaCercanaGuia(lat, lng){
  state.direccionGuiaLat = lat;
  state.direccionGuiaLng = lng;
  const resultado = agenciaMasCercana({ lat, lng });
  state.agenciaCercana = resultado ? resultado.agencia : null;
  state.agenciaCercanaDistancia = resultado ? resultado.distanciaKm : null;
  const info = document.getElementById("agenciaCercanaInfo");
  if(info) info.innerHTML = agenciaCercanaInfoHtml();
  colocarMarcadorAgenciaGuia();
}

/* Dibuja (o actualiza) en el mapa un marcador fijo — sin arrastre, sin click,
   sin popup ni texto — que solo señala visualmente dónde está ubicada la
   agencia/hub ya asignada automáticamente como la más cercana al punto
   marcado. No es editable: ningún usuario puede moverlo ni cambiar la
   asignación desde el mapa, solo ver el punto. Aplica igual para todos los
   roles, incluido el Cliente — lo único que no se muestra a Cliente es el
   texto con el nombre/distancia de la agencia (ver agenciaCercanaInfoHtml). */
function colocarMarcadorAgenciaGuia(){
  if(!mapaDireccionGuiaInstancia) return;
  if(!state.agenciaCercana){
    if(marcadorAgenciaGuia){ mapaDireccionGuiaInstancia.removeLayer(marcadorAgenciaGuia); marcadorAgenciaGuia = null; }
    return;
  }
  const pos = [state.agenciaCercana.lat, state.agenciaCercana.lng];
  if(marcadorAgenciaGuia){
    marcadorAgenciaGuia.setLatLng(pos);
  }else{
    const iconoAgencia = L.divIcon({
      className: "",
      html: '<div style="font-size:22px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));">🏢</div>',
      iconSize: [22,22],
      iconAnchor: [11,20]
    });
    marcadorAgenciaGuia = L.marker(pos, { icon: iconoAgencia, draggable:false, interactive:false, keyboard:false }).addTo(mapaDireccionGuiaInstancia);
  }
}

/* Coloca (o mueve) el marcador del mapa y dispara el recálculo de agencia.
   El punto ya NO lo marca el usuario (ni tocando el mapa ni con el GPS):
   se coloca automáticamente según el Departamento seleccionado (ver
   ubicarDireccionGuiaPorDepartamento) y el marcador no es arrastrable. */
function colocarMarcadorDireccionGuia(lat, lng){
  if(!mapaDireccionGuiaInstancia) return;
  if(marcadorDireccionGuia){
    marcadorDireccionGuia.setLatLng([lat, lng]);
  }else{
    marcadorDireccionGuia = L.marker([lat, lng], { draggable:false, interactive:false, keyboard:false }).addTo(mapaDireccionGuiaInstancia);
  }
  mapaDireccionGuiaInstancia.setView([lat, lng], 14);
  actualizarAgenciaCercanaGuia(lat, lng);
}

/* Ubica automáticamente el punto en el mapa según el Departamento Y
   Municipio seleccionados en el formulario (el usuario ya no marca el punto
   manualmente). Antes solo miraba el Departamento, así que cambiar de
   Municipio dentro del mismo Departamento no movía el punto ni recalculaba
   la agencia — por eso, por ejemplo, una guía para Chalchuapa terminaba
   asignada igual que una para Santa Ana centro. Se llama al iniciar el mapa
   y cada vez que cambia el Departamento o el Municipio en Crear Guía. */
function ubicarDireccionGuiaPorMunicipio(depto, municipio){
  const centro = centroMunicipio(depto, municipio);
  if(centro) colocarMarcadorDireccionGuia(centro.lat, centro.lng);
}
/* Se mantiene por compatibilidad con quien la siga llamando solo con el
   departamento (usa el primer municipio de la lista de ese departamento). */
function ubicarDireccionGuiaPorDepartamento(depto){
  const municipios = DEPTOS_MUNICIPIOS[depto] || [];
  ubicarDireccionGuiaPorMunicipio(depto, municipios[0]);
}

/* Se llama al final de render() cada vez que la pantalla activa es Crear
   Guía y la tienda usa dirección libre. Como el mapa vive dentro de un div
   que se reemplaza por completo en cada render (innerHTML), el mapa de
   Leaflet debe reconstruirse cada vez — por eso se destruye la instancia
   anterior antes de crear una nueva. */
function initMapaDireccionGuia(){
  const el = document.getElementById("mapaDireccionGuia");
  if(!el || typeof L === "undefined") return;
  if(mapaDireccionGuiaInstancia){ mapaDireccionGuiaInstancia.remove(); mapaDireccionGuiaInstancia = null; marcadorDireccionGuia = null; marcadorAgenciaGuia = null; }
  const centro = (state.direccionGuiaLat && state.direccionGuiaLng)
    ? [state.direccionGuiaLat, state.direccionGuiaLng]
    : [13.6929, -89.2182]; // San Salvador por defecto
  mapaDireccionGuiaInstancia = L.map(el, { attributionControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false, touchZoom:false, boxZoom:false }).setView(centro, state.direccionGuiaLat ? 14 : 9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18 }).addTo(mapaDireccionGuiaInstancia);
  if(state.direccionGuiaLat && state.direccionGuiaLng){
    colocarMarcadorDireccionGuia(state.direccionGuiaLat, state.direccionGuiaLng);
  }else{
    const deptoSel = document.getElementById("f_departamento");
    const municipioSel = document.getElementById("f_municipio");
    ubicarDireccionGuiaPorMunicipio(deptoSel ? deptoSel.value : "San Salvador", municipioSel ? municipioSel.value : null);
  }
  setTimeout(() => { if(mapaDireccionGuiaInstancia) mapaDireccionGuiaInstancia.invalidateSize(); }, 150);
}

/* Limpia el estado del mapa de dirección al salir/reiniciar Crear Guía. */
function reiniciarUbicacionDireccionGuia(){
  state.direccionGuiaTexto = "";
  state.direccionGuiaLat = null;
  state.direccionGuiaLng = null;
  state.agenciaCercana = null;
  state.agenciaCercanaDistancia = null;
  if(mapaDireccionGuiaInstancia){ mapaDireccionGuiaInstancia.remove(); mapaDireccionGuiaInstancia = null; marcadorDireccionGuia = null; marcadorAgenciaGuia = null; }
}

/* ---- Ubicación real del dispositivo (GPS del navegador) ----
   Ya no se genera ninguna coordenada simulada/aleatoria: toda ubicación
   que se registra en el sistema proviene de navigator.geolocation. Se
   guarda en caché la última posición real obtenida para poder usarla de
   forma síncrona en los puntos del código que registran movimientos de
   una guía (registrarCambioGuia), sin tener que pedir permiso de nuevo
   en cada paso. */
let ultimaUbicacionReal = null;

function actualizarUbicacionReal(callback){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos => {
        ultimaUbicacionReal = { lat: parseFloat(pos.coords.latitude.toFixed(5)), lng: parseFloat(pos.coords.longitude.toFixed(5)), real:true };
        if(callback) callback(ultimaUbicacionReal);
      },
      () => { if(callback) callback(null); },
      { timeout: 8000, maximumAge: 60000 }
    );
  } else if(callback){
    callback(null);
  }
}
actualizarUbicacionReal(); // se intenta obtener apenas carga la app, para tener ya la ubicación real disponible

function obtenerUbicacionPiloto(callback){
  if(!navigator.geolocation){
    alert("Tu dispositivo o navegador no soporta geolocalización. No es posible registrar la ubicación real de la entrega.");
    callback(null);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const loc = { lat: parseFloat(pos.coords.latitude.toFixed(5)), lng: parseFloat(pos.coords.longitude.toFixed(5)), real:true };
      ultimaUbicacionReal = loc;
      callback(loc);
    },
    () => {
      alert("No se pudo obtener tu ubicación GPS real. Activa el permiso de ubicación en el navegador para poder confirmar la entrega.");
      callback(null);
    },
    { timeout: 8000 }
  );
}

/* ---- Asignación automática de recolecciones por cercanía ----
   Cuando un cliente solicita una recolección, el sistema calcula la
   distancia (fórmula de Haversine) entre la tienda y cada piloto
   disponible, y asigna de inmediato al que esté más cerca. */
function distanciaKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function pilotoMasCercano(puntoTienda){
  if(!puntoTienda) return null;
  const pilotos = EMPLEADOS.filter(e => e.rol === "Piloto" && e.disponible && e.ubicacion);
  if(pilotos.length === 0) return null;
  let mejor = null, mejorDist = Infinity;
  pilotos.forEach(p => {
    const d = distanciaKm(puntoTienda, p.ubicacion);
    if(d < mejorDist){ mejorDist = d; mejor = p; }
  });
  return { piloto: mejor, distanciaKm: parseFloat(mejorDist.toFixed(1)) };
}

/* ---- Asignación automática de AGENCIA por cercanía a la dirección del cliente ----
   Cuando un cliente de dirección libre crea una guía y marca su ubicación en
   el mapa real (o usa su ubicación actual), se calcula con Haversine cuál de
   las agencias/hubs activas de AGENCIAS_XPRESS queda más cerca de ese punto,
   y esa es la que se asigna automáticamente a la guía.
   Las agencias marcadas con excluidaAsignacionAutomatica:true (Santa Ana –
   San Rafael, Santa Ana – El Bosque, MetroGalerías, Ciudad Arce y Acajutla)
   nunca se eligen aquí, aunque sean la más cercana en distancia — siguen
   existiendo en el catálogo para selección manual (por ejemplo, en el
   desplegable de envío ECO), solo quedan fuera de la asignación automática. */
function agenciaMasCercana(punto){
  if(!punto || typeof punto.lat !== "number" || typeof punto.lng !== "number") return null;
  let mejor = null, mejorDist = Infinity;
  AGENCIAS_XPRESS.forEach(a => {
    if(a.excluidaAsignacionAutomatica) return;
    const d = distanciaKm(punto, a);
    if(d < mejorDist){ mejorDist = d; mejor = a; }
  });
  return mejor ? { agencia: mejor, distanciaKm: parseFloat(mejorDist.toFixed(1)) } : null;
}

/* ---- Contador GLOBAL de números de guía (corrige guías duplicadas) ----
   Antes, el siguiente número de guía se sacaba de state.nextGuiaNum, un
   contador que vivía solo en la sesión de cada navegador y siempre
   arrancaba en el mismo valor fijo (100251) cada vez que alguien abría la
   app. Si dos personas creaban una guía casi al mismo tiempo desde
   dispositivos distintos, ambas podían generar el mismo número, y la
   segunda en guardarse sobrescribía a la primera en Firestore (mismo ID de
   documento) — eso es lo que causaba guías con historial mezclado de dos
   clientes distintos bajo un mismo número.
   Ahora el contador se recalcula contra los datos reales cada vez que
   llegan guías desde Firestore (ver recalcularContadorGuias, llamada
   dentro de iniciarSincronizacionGuias), y además cada reserva de número
   revisa que no exista ya esa guía en el arreglo local antes de
   devolverla — si hay choque, salta al siguiente disponible. */
let CONTADOR_GUIAS_SIGUIENTE = 100251;

function recalcularContadorGuias(){
  let maxNum = 100250;
  GUIAS.forEach(g => {
    const n = parseInt(String(g.id || "").replace(/^XC24?/, ""), 10);
    if(!isNaN(n) && n > maxNum) maxNum = n;
  });
  if(maxNum + 1 > CONTADOR_GUIAS_SIGUIENTE) CONTADOR_GUIAS_SIGUIENTE = maxNum + 1;
}

function siguienteNumeroGuiaBase(prefijo){
  prefijo = prefijo || "XC";
  let n = CONTADOR_GUIAS_SIGUIENTE;
  while(GUIAS.some(g => g.id === prefijo + n)) n++;
  CONTADOR_GUIAS_SIGUIENTE = n + 1;
  return n;
}

/* ---- Generador de IDs únicos para catálogos con prefijo + número
   (clientes, destinatarios, empleados, solicitudes de afiliación) ----
   Antes se usaba `<ARREGLO>.length + 1`, que tiene el mismo problema que
   tenían las guías: dos personas creando un cliente/destinatario/empleado
   casi al mismo tiempo desde dispositivos distintos pueden calcular el
   mismo número (cada una ve su propia copia local del arreglo, con la
   misma cantidad de elementos) y uno termina sobrescribiendo al otro en
   Firestore. Ahora se calcula contra el número más alto que realmente
   existe en el arreglo (no contra cuántos elementos tiene localmente) y
   además se verifica que no haya choque antes de devolver el ID. */
function siguienteIdUnico(prefijo, arreglo, digitos){
  digitos = digitos || 3;
  let maxNum = 0;
  arreglo.forEach(item => {
    const n = parseInt(String(item.id || "").replace(prefijo, ""), 10);
    if(!isNaN(n) && n > maxNum) maxNum = n;
  });
  let n = maxNum + 1;
  let id = prefijo + String(n).padStart(digitos, "0");
  while(arreglo.some(item => item.id === id)){
    n++;
    id = prefijo + String(n).padStart(digitos, "0");
  }
  return id;
}

/* Completa la agencia asignada de guías que aún no la tengan (por ejemplo,
   las guías de ejemplo/semilla del prototipo, creadas antes de que este
   campo existiera), usando la ubicación marcada de la guía o, si no hay,
   el centro de su departamento — el mismo criterio de respaldo que usa
   enviarGuia al crear una guía nueva. Se llama una vez al arrancar la app. */
function asignarAgenciasFaltantes(){
  GUIAS.forEach(g => {
    if(g.agenciaAsignada) return;
    const centro = g.ubicacionDireccion || centroMunicipio(g.departamento, g.municipio);
    if(!centro) return;
    const resultado = agenciaMasCercana(centro);
    if(resultado){
      g.agenciaAsignada = resultado.agencia.nombre;
      g.agenciaAsignadaDireccion = resultado.agencia.direccion;
      g.agenciaDistanciaKm = resultado.distanciaKm;
    }
  });
}


/* ============ HELPERS ============
   esc() antes solo convertía a texto sin escapar nada — eso causaba, por
   ejemplo, que el JSON del QR de guías (datosQrGuia) rompiera el atributo
   HTML data-qr-texto en la primera comilla doble que encontraba, dejando
   solo "{" como texto codificado en el QR (por eso el escaneo nunca
   encontraba la guía, sin importar qué se escaneara). Ahora sí escapa los
   caracteres especiales de HTML, tanto para texto como para atributos. */
function esc(s){
  if(s===undefined||s===null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function solicitudesPendientes(){
  return SOLICITUDES_RECOLECCION.filter(s => s.estado === "Pendiente").length;
}

function recoleccionesPilotoPendientes(){
  const pendientes = SOLICITUDES_RECOLECCION.filter(s => s.piloto === PILOTO_ACTUAL && s.estado === "Asignada");
  return aplicarFiltroFecha(pendientes, "hoy", null, null, "fecha").length;
}

/* Resuelve el nombre real del perfil que hizo el cambio, para que el
   historial muestre quién fue exactamente (ej. "Carlos Pérez" en vez de
   solo "Administrativo", o el nombre del comercio en vez de "Cliente").
   Si ya se pasó un nombre específico (piloto, tienda, "Sistema", el
   resultado de una importación, etc.) se respeta tal cual, sin tocarlo. */
function nombrePerfilParaHistorial(usuarioParam){
  const ROLES_GENERICOS = ["Cliente", "Administrativo", "Super Administrativo", "Piloto"];
  if(usuarioParam && !ROLES_GENERICOS.includes(usuarioParam)) return usuarioParam;
  if(state.role === "Cliente"){
    const c = clienteActualObj();
    return c ? c.comercio : (usuarioParam || CLIENTE_ACTUAL || "Cliente");
  }
  if(state.role === "Piloto"){
    return PILOTO_ACTUAL || usuarioParam || "Piloto";
  }
  const emp = empleadoActualObj();
  return emp ? emp.nombre : (usuarioParam || state.role || "Usuario");
}

/* Guarda cada evento del historial en Firestore, en una subcolección propia
   de la guía (guias/{id}/historial), así queda persistido con su fecha,
   hora y el nombre del perfil que hizo el cambio, y se sincroniza en tiempo
   real con cualquier otro dispositivo que tenga abierta esa misma guía. */
function guardarEventoHistorialEnFirestore(guiaId, evento){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  if(!guiaId) return;
  dbFirestore.collection("guias").doc(guiaId).collection("historial").add({
    ...evento,
    creadoEn: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err => {
    console.error("Error guardando evento de historial en Firestore:", err);
  });
}

/* ---- Registro de cambios de guía + notificación al cliente ----
   Toda función que modifique una guía (estado, edición de datos,
   eliminación, restauración, lote, etc.) debe pasar por aquí para que
   quede constancia en el historial Y se genere la notificación. */
function registrarCambioGuia(guia, accion, de, a, usuario){
  if(!guia) return;
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  const usuarioResuelto = nombrePerfilParaHistorial(usuario);
  if(!HISTORIAL[guia.id]) HISTORIAL[guia.id] = [];
  /* Evidencia de cada movimiento: además de fecha exacta y usuario, se
     guarda la ubicación GPS de quien hizo el cambio y, si aplica (por
     ejemplo al confirmar la entrega), la fotografía asociada. */
  const esEntregaConEvidencia = (a === "Entregado" && guia.ubicacionEntrega);
  const ubicacionMovimiento = esEntregaConEvidencia ? guia.ubicacionEntrega : ultimaUbicacionReal;
  const fotoMovimiento = esEntregaConEvidencia ? (guia.fotoEntrega || null) : null;
  const evento = { fecha:fechaStr, usuario:usuarioResuelto, accion, de: (de===undefined||de===null||de==="") ? "-" : String(de), a: (a===undefined||a===null||a==="") ? "-" : String(a), ubicacion:ubicacionMovimiento, foto:fotoMovimiento };
  HISTORIAL[guia.id].push(evento);
  guardarEventoHistorialEnFirestore(guia.id, evento);
  crearNotificacionCliente(guia, accion, de, a, usuarioResuelto, fechaStr);
  guardarGuiaEnFirestore(guia);
  return fechaStr;
}

function crearNotificacionCliente(guia, accion, de, a, usuario, fechaStr){
  const cuenta = guia.cuenta || guia.cliente;
  if(!cuenta) return;
  const mensaje = (de && a && de !== a && de !== "-" ) ? `${accion}: ${de} → ${a}` : accion;
  const notificacion = {
    id: "N-" + (nextNotifNum++),
    guiaId: guia.id,
    cuenta,
    mensaje,
    fecha: fechaStr || new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" }),
    usuario,
    leida: false,
  };
  NOTIFICACIONES.unshift(notificacion);
  guardarNotificacionEnFirestore(notificacion);
}

function notificacionesClientePendientes(){
  return NOTIFICACIONES.filter(n => n.cuenta === CLIENTE_ACTUAL && !n.leida).length;
}

/* ---- Eliminar / Restaurar guía (papelera) ----
   El cliente puede eliminar sus propias guías y restaurarlas. En los
   roles administrativos, toda guía eliminada queda visible y disponible
   para recuperar desde el apartado "Papelera" — nunca se borra en firme.
   Una guía ya Entregada o Finalizada no se puede eliminar, para no perder
   el rastro de una entrega que ya se completó. */
const ESTADOS_NO_ELIMINABLES = ["Entregado","Finalizado"];
function guiaEsEliminable(g){ return !ESTADOS_NO_ELIMINABLES.includes(g.estado); }

function eliminarGuia(id){
  const g = GUIAS.find(x => x.id === id);
  if(!g) return;
  if(!guiaEsEliminable(g)){
    alert(`La guía ${id} ya está ${g.estado} y no se puede eliminar.`);
    return;
  }
  if(!confirm(`¿Eliminar la guía ${id}? Podrás restaurarla luego desde la papelera.`)) return;
  const estadoAnterior = g.estado;
  g.eliminada = true;
  g.fechaEliminacion = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  g.eliminadaPor = state.role;
  registrarCambioGuia(g, "Guía eliminada", estadoAnterior, "Eliminada", state.role);
  render();
}

function restaurarGuia(id){
  const g = GUIAS.find(x => x.id === id);
  if(!g) return;
  g.eliminada = false;
  g.fechaEliminacion = null;
  g.eliminadaPor = null;
  registrarCambioGuia(g, "Guía restaurada desde papelera", "Eliminada", g.estado, state.role);
  render();
}

/* ---- Eliminar en lote (barra de selección de la tabla de Guías) ---- */
function eliminarGuiasSeleccionadas(){
  const ids = state.guiasSeleccionadas;
  if(ids.length === 0){ alert("Selecciona al menos una guía para eliminar."); return; }
  const seleccionadas = ids.map(id => GUIAS.find(x => x.id === id)).filter(Boolean);
  const eliminables = seleccionadas.filter(guiaEsEliminable);
  const bloqueadas = seleccionadas.filter(g => !guiaEsEliminable(g));
  if(eliminables.length === 0){
    alert("Las guías seleccionadas ya están Entregadas/Finalizadas, por lo que no se pueden eliminar.");
    return;
  }
  if(!confirm(`¿Eliminar ${eliminables.length} guía(s) seleccionada(s)? Podrás restaurarlas luego desde la papelera.`)) return;
  const fecha = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  eliminables.forEach(g => {
    if(g.eliminada) return;
    const estadoAnterior = g.estado;
    g.eliminada = true;
    g.fechaEliminacion = fecha;
    g.eliminadaPor = state.role;
    registrarCambioGuia(g, "Guía eliminada", estadoAnterior, "Eliminada", state.role);
  });
  if(bloqueadas.length > 0){
    alert(`${bloqueadas.length} guía(s) seleccionada(s) ya están Entregadas/Finalizadas y no se eliminaron.`);
  }
  state.guiasSeleccionadas = [];
  render();
}

/* ---- Filtro de fechas para guías (histórico / hoy / rango) ---- */
function parseFechaGuia(str){
  if(!str || str === "-") return null;
  const m = String(str).match(/^(\d{2})\/(\d{2})\/(\d{2})/);
  if(!m) return null;
  return new Date(2000 + parseInt(m[3],10), parseInt(m[2],10) - 1, parseInt(m[1],10));
}

/* Igual que parseFechaGuia pero conservando hora:minuto, para poder calcular
   cuánto tiempo pasó entre un evento del historial y el siguiente. */
function parseFechaHoraGuia(str){
  if(!str || str === "-") return null;
  const m = String(str).match(/^(\d{2})\/(\d{2})\/(\d{2})(?:\s+(\d{2}):(\d{2}))?/);
  if(!m) return null;
  return new Date(2000 + parseInt(m[3],10), parseInt(m[2],10) - 1, parseInt(m[1],10), m[4]?parseInt(m[4],10):0, m[5]?parseInt(m[5],10):0);
}

/* Convierte una diferencia en milisegundos a un texto corto y legible,
   usado para mostrar el tiempo transcurrido entre estados de una guía. */
function formatDuracion(ms){
  if(ms === null || ms === undefined || ms < 0) return null;
  const min = Math.round(ms / 60000);
  if(min < 1) return "menos de 1 min";
  if(min < 60) return min + " min";
  const horas = Math.floor(min / 60);
  const minRestante = min % 60;
  if(horas < 24) return horas + "h" + (minRestante ? " " + minRestante + "min" : "");
  const dias = Math.floor(horas / 24);
  const horaRestante = horas % 24;
  return dias + "d" + (horaRestante ? " " + horaRestante + "h" : "");
}

/* ---- VIP automático por volumen ----
   Un cliente se marca VIP automáticamente cuando supera las 1000 guías
   creadas en una ventana de los últimos 2 meses (contados desde la fecha
   de referencia del prototipo). Si no llega a ese volumen, no se le agrega
   nada por este medio; sigue siendo VIP solo si el Super Administrativo lo
   forzó manualmente con el switch. */
const VIP_VOLUMEN_MINIMO = 1000;
const VIP_VENTANA_MESES = 2;

function fechaCreacionGuia(g){
  return g.fechaCreacion || parseFechaGuia(g.fecha);
}

function volumenGuiasUltimosMeses(cuenta, meses){
  const limite = new Date(FECHA_REF_HOY.getTime());
  limite.setMonth(limite.getMonth() - meses);
  return GUIAS.filter(g => !g.eliminada && (g.cuenta === cuenta || g.cliente === cuenta)).filter(g => {
    const f = fechaCreacionGuia(g);
    return f && f >= limite && f <= FECHA_REF_HOY;
  }).length;
}

function esClienteVipPorVolumen(cuenta){
  return volumenGuiasUltimosMeses(cuenta, VIP_VENTANA_MESES) > VIP_VOLUMEN_MINIMO;
}

/* Estado VIP final que debe usarse en toda la app: manual (switch) O por volumen. */
function esClienteVip(c){
  if(!c) return false;
  return !!c.vipManual || esClienteVipPorVolumen(c.comercio);
}

function aplicarFiltroFecha(lista, modo, desde, hasta, campoFecha){
  campoFecha = campoFecha || "fecha";
  if(modo === "hoy"){
    /* Se compara contra FECHA_REF_HOY, que ahora es la fecha real del
       dispositivo (ver definición arriba), así que "hoy" siempre coincide
       con el día real y las guías/recolecciones asignadas "para hoy" (Mis
       Rutas, Mis Recolecciones, etc.) aparecen correctamente sin importar
       qué día sea. */
    const hoy = new Date(FECHA_REF_HOY.getTime()); hoy.setHours(0,0,0,0);
    return lista.filter(g => {
      const f = parseFechaGuia(g[campoFecha]);
      return f && f.getTime() === hoy.getTime();
    });
  }
  if(modo === "rango"){
    const d = desde ? new Date(desde + "T00:00:00") : null;
    const h = hasta ? new Date(hasta + "T23:59:59") : null;
    return lista.filter(g => {
      const f = parseFechaGuia(g[campoFecha]);
      if(!f) return false;
      if(d && f < d) return false;
      if(h && f > h) return false;
      return true;
    });
  }
  return lista; // "todas" / histórico: sin filtro de fecha
}

function pill(estado){
  const c = ESTADO_COLORS[estado] || { bg:"#f1f5f9", color:"#475569", border:"#e2e8f0" };
  return `<span class="pill" style="background:${c.bg};color:${c.color};border-color:${c.border};"><span class="dot"></span>${esc(estado)}</span>`;
}

function filtrarTexto(v){
  // No se permiten caracteres especiales, símbolos ni caracteres tipográficos.
  return String(v).replace(/[^a-zA-Z0-9À-ÿ\u00f1\u00d1\s]/g, "");
}
function onFiltrarInput(el){
  const pos = el.selectionStart;
  const limpio = filtrarTexto(el.value);
  if(limpio !== el.value){
    el.value = limpio;
  }
}

function val(id){
  const el = document.getElementById(id);
  if(!el) return "";
  return typeof el.value === "string" ? el.value.trim() : el.value;
}

function estadoOptions(list, selected){
  return list.map(e => `<option value="${e}" ${e===selected?'selected':''}>${e}</option>`).join("");
}

/* ---- QR real y escaneable (ISO/IEC 18004), generado con la librería qrcode.js ----
   Antes esta función dibujaba un patrón de pixeles pseudo-aleatorio que solo
   PARECÍA un QR (no era legible por ningún lector). Ahora se devuelve un
   contenedor con el texto a codificar en data-qr-texto; inicializarQRsPendientes()
   lo convierte en un QR real después de insertarse en el documento (los <script>
   no se ejecutan al inyectar HTML con innerHTML, así que la generación se hace
   en un segundo paso).
   DECISIÓN DE NEGOCIO (cambiada a propósito): el QR ahora codifica toda la
   información de la guía (ver datosQrGuia), no solo el número/código de barras.
   Esto permite extraer todos los datos con un lector externo para procesos
   manuales, pero también significa que cualquier persona que escanee el
   paquete con una app de QR normal puede ver esos datos (nombre, teléfono,
   dirección, precio, etc.) — ya no quedan ocultos como antes. */

function qrCodeSvg(code, size, etiqueta){
  /* Tamaño mínimo elevado (antes 92px) porque el QR codifica un JSON largo
     (todos los datos de la guía): con textos largos la librería usa una
     versión de QR con muchos módulos, y si el render es chico cada módulo
     mide 1-2px, lo que lo vuelve borroso e ilegible para la cámara del
     celular. A mayor tamaño, cada módulo ocupa más píxeles reales y el
     lector enfoca mejor. También se agrega "padding" blanco (zona de
     silencio) alrededor, requerida por el estándar QR para que cualquier
     lector lo detecte bien. */
  size = size || 92;
  size = Math.max(size, 170);
  const id = "qr-" + (++__qrAutoId) + "-" + Math.random().toString(36).slice(2,8);
  const textoVisible = etiqueta !== undefined ? etiqueta : code;
  return `<div>
    <div id="${id}" class="qr-real" data-qr-texto="${esc(String(code))}" data-qr-size="${size}" style="width:${size}px;height:${size}px;background:#fff;padding:10px;box-sizing:content-box;image-rendering:pixelated;"></div>
    <div style="font-size:8px;color:#5a6b87;font-family:monospace;margin-top:2px;">${esc(textoVisible)}</div>

/* Empaqueta toda la información de la guía en un solo texto JSON, que es lo
   que queda codificado dentro del QR. Se usa siempre que se genera un QR de
   guía (pantalla, impresión, manifiestos). */
function datosQrGuia(g){
  return JSON.stringify({
    guia: g.id || "-",
    codigo: g.codigoBarra || "-",
    tienda: g.tienda || "-",
    tipoEnvio: g.tipoEnvio || "",
    destinatario: g.nombre || g.cliente || "-",
    telPrimario: g.telPrimario || "",
    telSecundario: g.telSecundario || "",
    direccion: g.direccion || "-",
    municipio: g.municipio || "-",
    departamento: g.departamento || "-",
    bultos: g.bultos || "",
    peso: g.peso || "",
    precio: g.precio || "",
    tipoPago: g.tipoPago || "",
    fragil: g.fragil || "",
    observacion: g.observacion || "",
    fechaEntrega: g.fechaEntrega || g.fecha || g.fechaEntregaEstimada || ""
  });
}

/* Convierte en QR real cada contenedor pendiente (data-qr-texto) que aún no
   se haya generado. Se llama al final de render() y, dentro de ventanas de
   impresión/documentos descargados, en el evento load de esos documentos —
   en ambos casos porque los <script> insertados vía innerHTML no se ejecutan
   solos. Es seguro llamarla varias veces: cada QR ya generado se salta. */
/* La librería qrcodejs calcula mal la capacidad (cantidad de "módulos"
   necesarios) cuando el texto tiene tildes o ñ, porque las cuenta mal como
   UTF-8. Esto hace que lance el error de capacidad aunque el texto no sea
   tan largo, con o sin internet. Como el QR solo se usa para que un lector
   recupere los datos (no hace falta que se vea "bonito" con tildes), lo
   más simple y confiable es quitarle los acentos/ñ al texto antes de
   codificarlo. */
function quitarTildesQR(texto){
  return String(texto)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/ñ/g, "n").replace(/Ñ/g, "N");
}

       esta función solo se llama de nuevo cuando hay un re-render. Ahora
       reintentamos automáticamente cada poco tiempo hasta que la librería
       esté disponible, sin depender de que el usuario navegue a otra
       pantalla. */
    if(!window.__qrReintentoProgramado){
      window.__qrReintentoProgramado = true;
      setTimeout(function(){
        window.__qrReintentoProgramado = false;
        inicializarQRsPendientes();
      }, 400);
    }
    return;
  }
  pendientes.forEach(function(el){
    el.dataset.qrHecho = "1";
    const texto = quitarTildesQR(el.getAttribute("data-qr-texto"));
    const tam = parseInt(el.getAttribute("data-qr-size"), 10) || 92;
    /* correctLevel L (antes M): al bajar la redundancia de corrección de
       errores, la librería necesita menos módulos para el mismo texto largo
       (JSON de la guía), así que cada módulo queda más grande y nítido. */
    try{
      new QRCode(el, { text: texto, width: tam, height: tam, correctLevel: QRCode.CorrectLevel.L });
    }catch(err){
      /* Si el JSON de la guía es demasiado largo (por ejemplo una dirección
         u observación muy extensas), la librería puede lanzar un error de
         capacidad y el contenedor queda completamente en blanco, sin avisar
         nada. Antes esto pasaba silenciosamente. Ahora, si falla, probamos
         con una versión recortada del texto para que siempre quede un QR
         visible y escaneable, y si aun así falla mostramos un aviso en vez
         de dejarlo en blanco. */
      console.error("QR: falló con el texto completo, reintentando recortado.", err, texto && texto.length);
      el.innerHTML = "";
      try{
        new QRCode(el, { text: String(texto).slice(0, 300), width: tam, height: tam, correctLevel: QRCode.CorrectLevel.L });
      }catch(err2){
        el.style.display = "flex";
        el.style.alignItems = "center";
        el.style.justifyContent = "center";
        el.style.textAlign = "center";
        el.innerHTML = '<span style="font-size:10px;color:#b00020;">No se pudo generar el QR</span>';
      }
    }
  });
}

/* Bloque reutilizable que se inserta en cada documento aparte (ventanas de
   impresión, manifiestos descargados) para que también generen QR reales,
   ya que son documentos HTML independientes del documento principal. */
const QR_ENGINE_HTML = `
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
  <script>
    function quitarTildesQR(texto){
      return String(texto)
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/ñ/g, "n").replace(/Ñ/g, "N");
    }
    function inicializarQRsPendientes(){
      var pendientes = document.querySelectorAll("[data-qr-texto]:not([data-qr-hecho])");
      if(!pendientes.length) return;
      if(typeof QRCode === "undefined"){
        if(!window.__qrReintentoProgramado){
          window.__qrReintentoProgramado = true;
          setTimeout(function(){
            window.__qrReintentoProgramado = false;
            inicializarQRsPendientes();
          }, 400);
        }
        return;
      }
      pendientes.forEach(function(el){
        el.dataset.qrHecho = "1";
        var texto = quitarTildesQR(el.getAttribute("data-qr-texto"));
        var tam = parseInt(el.getAttribute("data-qr-size"), 10) || 92;
        try{
          new QRCode(el, { text: texto, width: tam, height: tam, correctLevel: QRCode.CorrectLevel.L });
        }catch(err){
          el.innerHTML = "";
          try{
            new QRCode(el, { text: String(texto).slice(0, 300), width: tam, height: tam, correctLevel: QRCode.CorrectLevel.L });
          }catch(err2){
            el.style.display = "flex";
            el.style.alignItems = "center";
            el.style.justifyContent = "center";
            el.style.textAlign = "center";
            el.innerHTML = '<span style="font-size:10px;color:#b00020;">No se pudo generar el QR</span>';
          }
        }
      });
    }
    window.addEventListener("load", inicializarQRsPendientes);
  <\/script>
`;

/* ---- Impresión de varias guías seleccionadas a la vez ---- */
function imprimirGuiasSeleccionadas(){
  const ids = state.guiasSeleccionadas;
  if(ids.length === 0){ alert("Selecciona al menos una guía para imprimir."); return; }
  const guiasSel = GUIAS.filter(g => ids.includes(g.id));
  if(guiasSel.length === 0){ alert("No se encontraron las guías seleccionadas."); return; }
  const bloqueadas = guiasSel.filter(g => ["Entregado","Finalizado"].includes(g.estado));
  const imprimibles = guiasSel.filter(g => !["Entregado","Finalizado"].includes(g.estado));
  if(imprimibles.length === 0){
    alert("Las guías seleccionadas ya están Entregadas/Finalizadas, por lo que la impresión está bloqueada.");
    return;
  }
  if(bloqueadas.length > 0){
    alert(`${bloqueadas.length} guía(s) seleccionada(s) ya están Entregadas/Finalizadas y no se incluirán en la impresión.`);
  }
  imprimibles.forEach(g => registrarCambioGuia(g, "Guía impresa (impresión masiva)", g.estado, g.estado, state.role));
  render();
  const ventana = window.open("", "_blank", "width=520,height=800");
  if(!ventana){ alert("El navegador bloqueó la ventana de impresión. Habilita las ventanas emergentes para este sitio."); return; }

/* ============ LOGIN ÚNICO CON CORREO Y CONTRASEÑA ============
   Prototipo sin servidor: una sola pantalla de acceso para todos los
   roles. Se valida el correo/contraseña contra EMPLEADOS (Super
   Administrativo, Administrativo, Piloto) y contra CLIENTES (Cliente),
   y el rol/cuenta correspondiente se determina automáticamente según
   qué registro coincida — el usuario nunca elige el rol a mano. */
function onLoginCorreoInput(v){ state.loginCorreo = v; }
function onLoginClaveInput(v){ state.loginClave = v; }

function intentarLoginUnico(){
  const correoIngresado = (state.loginCorreo || "").trim().toLowerCase();
  const claveIngresada = state.loginClave || "";
  if(!correoIngresado || !claveIngresada){
    state.loginError = "Escribe tu correo y contraseña.";
    render();
    return;
  }
  if(!clientesListos || !empleadosListos){
    state.loginError = "Cargando datos de la base de datos, espera un momento e intenta de nuevo.";
    render();
    return;
  }

  const empleado = EMPLEADOS.find(e =>
    (e.correo || "").toLowerCase() === correoIngresado && (e.password || "") === claveIngresada
  );
  if(empleado){
    EMPLEADO_ACTUAL_ID = empleado.id;
    if(empleado.rol === "Piloto"){
      PILOTO_ACTUAL = empleado.nombre;
    }
    state.loginCorreo = "";
    state.loginClave = "";
    state.loginError = "";
    selectRole(empleado.rol);
    return;
  }

  const cliente = CLIENTES.find(c =>
    (c.correo || "").toLowerCase() === correoIngresado && (c.passwordReal || c.password || "") === claveIngresada
  );
  if(cliente){
    CLIENTE_ACTUAL = cliente.comercio;
    state.loginCorreo = "";
    state.loginClave = "";
    state.loginError = "";
    selectRole("Cliente");
    return;
  }

  state.loginError = "Correo o contraseña incorrectos.";
  render();
}

function initFirmaAfiliacionPad(){
  const canvas = document.getElementById("firmaAfiliacionCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#1e2761";
  let drawing = false;
  let hasStroke = false;

  if(firmaAfiliacionTemp){
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = firmaAfiliacionTemp;
  }

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; hasStroke = true; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){
    if(drawing && hasStroke){
      firmaAfiliacionTemp = canvas.toDataURL("image/png");
    }
    drawing = false;
  }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}

function limpiarFirmaAfiliacion(){
  const canvas = document.getElementById("firmaAfiliacionCanvas");
  if(canvas) canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
  firmaAfiliacionTemp = null;
}

/* Construye el mensaje de WhatsApp con el resumen de la solicitud (no
   incluye la imagen de la firma, WhatsApp Web/App no permite adjuntarla
   automáticamente desde un enlace wa.me; el asesor la solicita o se
   guarda en el sistema al formalizar el alta). */
function enviarSolicitudAfiliacion(){
  const comercio = val("af_comercio");
  const telefono = val("af_telefono");
  const correo = val("af_correo");
  const direccion = val("af_direccion");
  const contactoNombre = val("af_contacto_nombre");
  const contactoTelefono = val("af_contacto_telefono");
  const necesitaCF = state.afiliacionCreditoFiscal === "Sí";
  const nit = necesitaCF ? val("af_nit") : "";

  if(!comercio || !telefono || !correo || !direccion || !contactoNombre || !contactoTelefono){
    alert("Completa todos los campos obligatorios.");
    return;
  }
  if(necesitaCF && !nit){
    alert("Ingresa el NIT para facturación con crédito fiscal.");
    return;
  }
  if(state.afiliacionAceptaTerminos !== "Sí"){
    alert("Debes aceptar los términos y condiciones de la propuesta comercial.");
    return;
  }
  if(!firmaAfiliacionTemp){
    alert("Firma en el recuadro para aceptar la propuesta comercial.");
    return;
  }

  const lineas = [
    "Nueva solicitud de afiliación — Xpress El Salvador",
    "Comercio: " + comercio,
    "Teléfono: " + telefono,
    "Correo: " + correo,
    "Dirección: " + direccion,
    "Contacto: " + contactoNombre + " (" + contactoTelefono + ")",
    "¿Crédito fiscal?: " + (necesitaCF ? ("Sí — NIT " + nit) : "No"),
    "Términos y condiciones: aceptados con firma digital",
  ];
  const mensaje = encodeURIComponent(lineas.join("\n"));
  const numero = (CONFIG_AFILIACION.whatsapp || "").replace(/\D/g, "");
  const numeroFinal = numero.length === 8 ? "503" + numero : numero;
  window.open("https://wa.me/" + numeroFinal + "?text=" + mensaje, "_blank");

  SOLICITUDES_AFILIACION.unshift({
    id: siguienteIdUnico("AF-", SOLICITUDES_AFILIACION, 4),
    fecha: new Date().toLocaleString("es-SV"),
    comercio, telefono, correo, direccion,
    contactoNombre, contactoTelefono,
    creditoFiscal: necesitaCF, nit,
    firma: firmaAfiliacionTemp,
  });
  guardarSolicitudAfiliacionEnFirestore(SOLICITUDES_AFILIACION[0]);

  state.afiliacionEnviada = true;
  render();
}

/* ---- Lógica de la tarjeta "Guías creadas en los últimos [período]" con % de tendencia ---- */
const DASHBOARD_HOY_REF = FECHA_REF_HOY; // misma fecha real usada en todo el prototipo

function parseFechaGuiaCorta(fechaStr){
  if(!fechaStr || fechaStr === "-") return null;
  const soloFecha = fechaStr.split(" ")[0];
  const partes = soloFecha.split("/");
  if(partes.length !== 3) return null;
  const [d,m,y] = partes.map(n => parseInt(n,10));
  if(!d || !m || !y) return null;
  return new Date(2000+y, m-1, d);
}

function sumarDias(fecha, dias){
  const f = new Date(fecha);
  f.setDate(f.getDate()+dias);
  return f;
}

function inicioDeMes(fecha){ return new Date(fecha.getFullYear(), fecha.getMonth(), 1); }

const PERIODOS_GUIAS_DASHBOARD = {
  hoy:     { label:"Hoy",        dias:1  },
  semana:  { label:"7 días",     dias:7  },
  mes:     { label:"30 días",    dias:30 },
};

function contarGuiasEnRango(inicio, fin){
  return GUIAS.filter(g => {
    if(g.eliminada) return false;
    const f = parseFechaGuiaCorta(g.fecha);
    if(!f) return false;
    return f >= inicio && f <= fin;
  }).length;
}

function calcularTendenciaGuiasCreadas(periodo){
  const cfg = PERIODOS_GUIAS_DASHBOARD[periodo] || PERIODOS_GUIAS_DASHBOARD.hoy;
  const finActual = DASHBOARD_HOY_REF;
  const inicioActual = sumarDias(finActual, -(cfg.dias-1));
  const finAnterior = sumarDias(inicioActual, -1);
  const inicioAnterior = sumarDias(finAnterior, -(cfg.dias-1));

  const actual = contarGuiasEnRango(inicioActual, finActual);
  const anterior = contarGuiasEnRango(inicioAnterior, finAnterior);

  let pct, tendencia;
  if(anterior === 0){
    pct = actual > 0 ? 100 : 0;
    tendencia = actual > 0 ? "up" : "flat";
  } else {
    pct = ((actual - anterior) / anterior) * 100;
    tendencia = pct > 0 ? "up" : (pct < 0 ? "down" : "flat");
  }
  return { actual, anterior, pct: Math.abs(pct), tendencia, label: cfg.label };
}

function cambiarPeriodoGuiasDashboard(valor){
  state.dashboardGuiasPeriodo = valor;
  render();
}

function tarjetaGuiasCreadasDashboard(){
  const periodo = state.dashboardGuiasPeriodo || "hoy";
  const t = calcularTendenciaGuiasCreadas(periodo);
  const flecha = t.tendencia === "up" ? "↗" : (t.tendencia === "down" ? "↘" : "→");
  const texto = t.tendencia === "up" ? "Aumento" : (t.tendencia === "down" ? "Disminución" : "Sin cambio");
  return `
    <div class="card pad kpi-trend-card">
      <div class="kpi-trend-header">
        <p>Guías creadas en los últimos</p>
        <select class="kpi-period-select" onchange="cambiarPeriodoGuiasDashboard(this.value)">
          ${Object.keys(PERIODOS_GUIAS_DASHBOARD).map(k => `<option value="${k}" ${k===periodo?"selected":""}>${PERIODOS_GUIAS_DASHBOARD[k].label}</option>`).join("")}
        </select>
      </div>
      <p class="kpi-value">${t.actual}</p>
      <p class="kpi-trend ${t.tendencia}"><span class="arrow">${flecha}</span> ${t.pct.toFixed(2)}% ${texto}</p>
    </div>
  `;
}

function guiasFiltered(filtro){
  const texto = (filtro||"").trim();
  let data = GUIAS.filter(g => !g.eliminada);
  if(texto){
    const tokens = texto.split(/[\n,;]+/).map(t => t.trim()).filter(Boolean);
    if(tokens.length > 1){
      data = data.filter(g => tokens.some(t => g.id.includes(t)));
    } else {
      const t = tokens[0] || texto;
      data = data.filter(g => g.id.includes(t) || g.cliente.toLowerCase().includes(t.toLowerCase()));
    }
  }
  data = aplicarFiltroFecha(data, state.guiaRangoModo, state.guiaFechaDesde, state.guiaFechaHasta);
  data = data.slice().sort((a,b) => (b.id||"").localeCompare(a.id||""));
  return data;
}

function guiasPaginadas(filtro){
  const data = guiasFiltered(filtro===undefined ? state.guiaFiltroActual : filtro);
  const totalPaginas = Math.max(1, Math.ceil(data.length / GUIAS_POR_PAGINA));
  if(state.guiasPagina > totalPaginas) state.guiasPagina = totalPaginas;
  if(state.guiasPagina < 1) state.guiasPagina = 1;
  const inicio = (state.guiasPagina - 1) * GUIAS_POR_PAGINA;
  const pageData = data.slice(inicio, inicio + GUIAS_POR_PAGINA);
  return { data, pageData, totalPaginas, inicio };
}

function toggleSeleccionarTodasGuiasPagina(checked){
  const { pageData } = guiasPaginadas();
  pageData.forEach(g => {
    const idx = state.guiasSeleccionadas.indexOf(g.id);
    if(checked && idx === -1) state.guiasSeleccionadas.push(g.id);
    if(!checked && idx !== -1) state.guiasSeleccionadas.splice(idx, 1);
  });
  refreshGuiasTabla();
}

  if(accion === "historial"){

      alert("Para ver el historial selecciona una sola guía.");
      return;

    selectGuia(state.guiasSeleccionadas[0]);

  if(accion === "eliminar"){

    state.guiaAccionMasiva = "";

  if(accion === "excel"){
    descargarGuiasSeleccionadas();

function generarLoteDevolucion(){
  const clienteObj = CLIENTES.find(c => c.id === val("lote_tienda"));
  const raw = val("lote_guias");
  const ids = raw.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  if(!clienteObj){
    alert("Selecciona un cliente de la lista.");
    return;
  }
  const tienda = tiendaLabel(clienteObj);
  if(ids.length === 0){
    alert("Ingresa al menos un número de guía.");
    return;
  }
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  const encontrados = [];
  ids.forEach(id => {
    const g = GUIAS.find(x => x.id === id);
    if(g){
      const anterior = g.estado;
      g.estado = "Devolución";
      g.tienda = tienda;
      registrarCambioGuia(g, "Lote de devolución — " + tienda, anterior, "Devolución", state.role);
      encontrados.push(g);
    }
  });
  state.ultimoLoteDevolucion = encontrados;

  /* Por cada cliente distinto incluido en el lote, se genera una nueva guía
     consolidada para poder enviarle de vuelta sus paquetes devueltos. */
  const porCliente = {};
  encontrados.forEach(g => {
    const cuenta = g.cuenta || g.cliente;
    if(!porCliente[cuenta]) porCliente[cuenta] = [];
    porCliente[cuenta].push(g.id);
  });
  const nuevasGuiasDevolucion = [];
  Object.keys(porCliente).forEach(cuenta => {
    const nuevoId = "XC" + siguienteNumeroGuiaBase("XC");
    const codigoBarra = nuevoId;
    const nueva = {
      id:nuevoId, cliente:cuenta, cuenta:cuenta, estado:"Creado", estadoPago:"Por pagar", fecha:fechaStr, fechaEntrega:null,
      operador:state.role, piloto:"-", ruta:"-", codigoBarra,
      fotoEntrega:null, ubicacionEntrega:null, firmaEntrega:null, tienda:tienda,
      nombre:cuenta, direccion:clienteObj.direccion || "-", municipio:"-", fragil:"No",
      departamento:"-", esDevolucionConsolidada:true, guiasIncluidas:porCliente[cuenta],
      eliminada:false, fechaEliminacion:null, eliminadaPor:null,
      creadoPor:creadorActual().nombre, creadoPorTipo:creadorActual().tipo,
    };
    GUIAS.push(nueva);
    guardarGuiaEnFirestore(nueva);
    HISTORIAL[nuevoId] = [
      { fecha:fechaStr, usuario:state.role, accion:"Guía de devolución generada para enviar los paquetes de vuelta a " + cuenta + " (incluye: " + porCliente[cuenta].join(", ") + ")", de:"-", a:"Creado" }
    ];
    crearNotificacionCliente(nueva, "Se generó una nueva guía de devolución para reenviarte tus paquetes", "-", "Creado", state.role, fechaStr);
    nuevasGuiasDevolucion.push(nueva);
  });
  state.guiasDevolucionGeneradas = nuevasGuiasDevolucion;

  const noEncontrados = ids.length - encontrados.length;
  alert(`Lote procesado: ${encontrados.length} guía(s) marcadas como Devolución para "${tienda}". Se generó/generaron ${nuevasGuiasDevolucion.length} guía(s) de devolución para reenviar los paquetes al cliente.${noEncontrados > 0 ? " " + noEncontrados + " número(s) no se encontraron en el sistema." : ""}`);
  render();
}

function descargarPlantillaLoteDevolucion(){
  const encabezado = "Cliente,Guia\n";
  const nombreEjemplo = CLIENTES.length > 0 ? CLIENTES[0].comercio : "Empresa ABC";
  const ejemplo = `${nombreEjemplo},XC100245\n${nombreEjemplo},XC100246\n`;
  const contenido = "\uFEFF" + encabezado + ejemplo; // BOM para tildes en Excel
  const blob = new Blob([contenido], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Plantilla_Lote_Devolucion.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Parser CSV simple que respeta campos entre comillas (por si una dirección
   u otro campo trae una coma dentro). Usado por las cargas masivas. */
function parseCSVLine(line){
  const result = [];
  let cur = "";
  let inQuotes = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else { inQuotes = false; }
      } else {
        cur += ch;
      }
    } else {
      if(ch === '"'){ inQuotes = true; }
      else if(ch === ','){ result.push(cur.trim()); cur = ""; }
      else { cur += ch; }
    }
  }
  result.push(cur.trim());
  return result;
}

function procesarArchivoLoteDevolucion(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const texto = String(e.target.result || "");
    const lineas = texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if(lineas.length < 2){
      alert("El archivo está vacío o no tiene filas de datos debajo del encabezado.");
      return;
    }
    const filas = lineas.slice(1).map(l => parseCSVLine(l));
    ejecutarLoteDevolucionMasivo(filas);
    input.value = "";
  };
  reader.readAsText(file, "UTF-8");
}

function ejecutarLoteDevolucionMasivo(filas){
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  const porCliente = {};
  filas.forEach(fila => {
    const nombreCliente = fila[0];
    const guiaId = fila[1];
    if(!nombreCliente || !guiaId) return;
    if(!porCliente[nombreCliente]) porCliente[nombreCliente] = [];
    porCliente[nombreCliente].push(guiaId);
  });

  const todosEncontrados = [];
  const nuevasGuiasDevolucion = [];
  const clientesNoEncontrados = [];
  const guiasNoEncontradas = [];

  Object.keys(porCliente).forEach(nombreCliente => {
    const idsCliente = porCliente[nombreCliente];
    const clienteObj = CLIENTES.find(c => c.comercio.trim().toLowerCase() === nombreCliente.trim().toLowerCase());
    if(!clienteObj){
      clientesNoEncontrados.push(nombreCliente);
      return;
    }
    const tienda = tiendaLabel(clienteObj);
    const encontrados = [];
    idsCliente.forEach(id => {
      const g = GUIAS.find(x => x.id === id);
      if(g){
        const anterior = g.estado;
        g.estado = "Devolución";
        g.tienda = tienda;
        registrarCambioGuia(g, "Lote de devolución masivo (Excel) — " + tienda, anterior, "Devolución", state.role);
        encontrados.push(g);
        todosEncontrados.push(g);
      } else {
        guiasNoEncontradas.push(id);
      }
    });
    if(encontrados.length > 0){
      const nuevoId = "XC" + siguienteNumeroGuiaBase("XC");
      const codigoBarra = nuevoId;
      const nueva = {
        id:nuevoId, cliente:clienteObj.comercio, cuenta:clienteObj.comercio, estado:"Creado", estadoPago:"Por pagar", fecha:fechaStr, fechaEntrega:null,
        operador:state.role, piloto:"-", ruta:"-", codigoBarra,
        fotoEntrega:null, ubicacionEntrega:null, firmaEntrega:null, tienda:tienda,
        nombre:clienteObj.comercio, direccion:clienteObj.direccion || "-", municipio:"-", fragil:"No",
        departamento:"-", esDevolucionConsolidada:true, guiasIncluidas:encontrados.map(g => g.id),
        eliminada:false, fechaEliminacion:null, eliminadaPor:null,
        creadoPor:creadorActual().nombre, creadoPorTipo:creadorActual().tipo,
      };
      GUIAS.push(nueva);
      guardarGuiaEnFirestore(nueva);
      HISTORIAL[nuevoId] = [
        { fecha:fechaStr, usuario:state.role, accion:"Guía de devolución generada (lote masivo) para enviar los paquetes de vuelta a " + clienteObj.comercio + " (incluye: " + encontrados.map(g => g.id).join(", ") + ")", de:"-", a:"Creado" }
      ];
      crearNotificacionCliente(nueva, "Se generó una nueva guía de devolución para reenviarte tus paquetes", "-", "Creado", state.role, fechaStr);
      nuevasGuiasDevolucion.push(nueva);
    }
  });

  state.ultimoLoteDevolucion = todosEncontrados;
  state.guiasDevolucionGeneradas = nuevasGuiasDevolucion;
  state.mostrarCreacionMasivaLote = false;

  let msg = `Archivo procesado: ${todosEncontrados.length} guía(s) marcadas como Devolución en ${nuevasGuiasDevolucion.length} cliente(s) distinto(s).`;
  if(clientesNoEncontrados.length > 0){
    msg += `\n\n⚠️ Estos clientes no coinciden con "Clientes" (revisa el nombre exacto): ${clientesNoEncontrados.join(", ")}`;
  }
  if(guiasNoEncontradas.length > 0){
    msg += `\n\n⚠️ Estas guías no existen en el sistema: ${guiasNoEncontradas.join(", ")}`;
  }
  alert(msg);
  render();
}

function clientesFiltrados(){
  const textoCrudo = (state.clienteFiltroTexto || "").trim();
  const deptos = state.clienteFiltroDeptos;
  const tokens = textoCrudo ? textoCrudo.split(/[\n,;]+/).map(t => t.trim().toLowerCase()).filter(Boolean) : [];
  let data = CLIENTES.slice().sort((a,b) => (b.id||"").localeCompare(a.id||"")).filter(c => {
    if(deptos.length > 0 && !deptos.includes(c.departamento)) return false;
    if(tokens.length === 0) return true;
    const campos = [c.comercio, c.correo, c.telefono, c.numeroAsesor, c.nombreAsesor, c.municipio];
    return tokens.some(t => campos.some(v => (v || "").toString().toLowerCase().includes(t)));
  });
  data = aplicarFiltroFecha(data, state.clienteRangoModo, state.clienteFechaDesde, state.clienteFechaHasta, "fechaRegistro");
  return data;
}
