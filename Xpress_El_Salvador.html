/* ---- Lógica de la tarjeta "Guías creadas en los últimos [período]" con % de tendencia ---- */
const DASHBOARD_HOY_REF = FECHA_REF_HOY; // misma fecha real usada en todo el prototipo

function parseFechaGuiaCorta(fechaStr){
  if(!fechaStr || fechaStr === "-") return null;
  const soloFecha = fechaStr.split(" ")[0];
  const partes = soloFecha.split("/");
  if(partes.length !== 3) return null;
  const [d,m,y] = partes.map(n => parseInt(n,10));
  if(!d || !m || !y) return null;
  return new Date(2000+y, m-1, d);
}

function sumarDias(fecha, dias){
  const f = new Date(fecha);
  f.setDate(f.getDate()+dias);
  return f;
}

function inicioDeMes(fecha){ return new Date(fecha.getFullYear(), fecha.getMonth(), 1); }

const PERIODOS_GUIAS_DASHBOARD = {
  hoy:     { label:"Hoy",        dias:1  },
  semana:  { label:"7 días",     dias:7  },
  mes:     { label:"30 días",    dias:30 },
};

function contarGuiasEnRango(inicio, fin){
  return GUIAS.filter(g => {
    if(g.eliminada) return false;
    const f = parseFechaGuiaCorta(g.fecha);
    if(!f) return false;
    return f >= inicio && f <= fin;
  }).length;
}

function calcularTendenciaGuiasCreadas(periodo){
  const cfg = PERIODOS_GUIAS_DASHBOARD[periodo] || PERIODOS_GUIAS_DASHBOARD.hoy;
  const finActual = DASHBOARD_HOY_REF;
  const inicioActual = sumarDias(finActual, -(cfg.dias-1));
  const finAnterior = sumarDias(inicioActual, -1);
  const inicioAnterior = sumarDias(finAnterior, -(cfg.dias-1));

  const actual = contarGuiasEnRango(inicioActual, finActual);
  const anterior = contarGuiasEnRango(inicioAnterior, finAnterior);

  let pct, tendencia;
  if(anterior === 0){
    pct = actual > 0 ? 100 : 0;
    tendencia = actual > 0 ? "up" : "flat";
  } else {
    pct = ((actual - anterior) / anterior) * 100;
    tendencia = pct > 0 ? "up" : (pct < 0 ? "down" : "flat");
  }
  return { actual, anterior, pct: Math.abs(pct), tendencia, label: cfg.label };
}

function cambiarPeriodoGuiasDashboard(valor){
  state.dashboardGuiasPeriodo = valor;
  render();
}

function tarjetaGuiasCreadasDashboard(){
  const periodo = state.dashboardGuiasPeriodo || "hoy";
  const t = calcularTendenciaGuiasCreadas(periodo);
  const flecha = t.tendencia === "up" ? "↗" : (t.tendencia === "down" ? "↘" : "→");
  const texto = t.tendencia === "up" ? "Aumento" : (t.tendencia === "down" ? "Disminución" : "Sin cambio");
  return `
    <div class="card pad kpi-trend-card">
      <div class="kpi-trend-header">
        <p>Guías creadas en los últimos</p>
        <select class="kpi-period-select" onchange="cambiarPeriodoGuiasDashboard(this.value)">
          ${Object.keys(PERIODOS_GUIAS_DASHBOARD).map(k => `<option value="${k}" ${k===periodo?"selected":""}>${PERIODOS_GUIAS_DASHBOARD[k].label}</option>`).join("")}
        </select>
      </div>
      <p class="kpi-value">${t.actual}</p>
      <p class="kpi-trend ${t.tendencia}"><span class="arrow">${flecha}</span> ${t.pct.toFixed(2)}% ${texto}</p>
    </div>
  `;
}

/* ============ KPIs del Dashboard (Admin) vía consultas count() de Firestore ============
   Antes, los 4 KPIs principales y el desglose de "guías de hoy" se calculaban
   recorriendo TODO el arreglo GUIAS en memoria — lo que exigía que ya hubiera
   bajado la colección completa (el listener de iniciarSincronizacionGuiasAdmin).
   Ahora se piden con consultas count() de Firestore (query.count().get()): el
   conteo se calcula del lado del servidor sobre los documentos reales en cada
   consulta. No es un contador guardado a mano que se pueda desincronizar con el
   tiempo (como pasaría con FieldValue.increment en un campo tan volátil como
   "estado") — siempre refleja los datos reales en el momento en que se pide.
   No es un listener en vivo: se vuelve a pedir cada vez que se entra al
   Dashboard (ver navigate()), igual que ya hace el mapa de calor con
   cargarMapaCalorAgregado().
   El desglose "guías de hoy por estado" sí trae documentos reales (con
   where("fecha","==",FECHA_HOY_STR)), pero el volumen está acotado a lo creado
   hoy, no a toda la colección histórica.
   Nota para producción: estas consultas combinan "eliminada" con "estado" (o con
   "fecha"), así que Firestore probablemente pida crear índices compuestos la
   primera vez que corran contra la base real — el error en la consola del
   navegador trae un enlace directo para crearlos con un clic desde Firebase
   Console. Mientras tanto (o si count() fallara por cualquier motivo), se cae
   automáticamente al cálculo local de siempre como respaldo. */
let DASHBOARD_KPIS_ADMIN = null; // null = todavía no se pidió a Firestore
let dashboardKpisCargando = false;

function cargarKpisDashboardAdmin(){
  if(!dbFirestore || dashboardKpisCargando) return;
  dashboardKpisCargando = true;
  const col = dbFirestore.collection("guias");
  const enProcesoEstados = ["En bodega","Recolectado","Asignado a ruta PM","Recibido en bodega final","Asignado a piloto"];
  Promise.all([
    col.where("eliminada","==",false).count().get(),
    col.where("eliminada","==",false).where("estado","in",["Entregado","Finalizado"]).count().get(),
    col.where("eliminada","==",false).where("estado","in",enProcesoEstados).count().get(),
    col.where("eliminada","==",false).where("estado","==","Pendiente").count().get(),
    col.where("eliminada","==",false).where("estado","==","Devolución").count().get(),
    col.where("eliminada","==",false).where("fecha","==",FECHA_HOY_STR).get(),
  ]).then(([totalSnap, entregadasSnap, enProcesoSnap, pendientesSnap, devolucionesSnap, hoySnap]) => {
    const hoyDocs = hoySnap.docs.map(d => d.data());
    const hoyEstados = {};
    hoyDocs.forEach(g => { hoyEstados[g.estado] = (hoyEstados[g.estado]||0)+1; });
    DASHBOARD_KPIS_ADMIN = {
      total: totalSnap.data().count,
      entregadas: entregadasSnap.data().count,
      enProceso: enProcesoSnap.data().count,
      pendientes: pendientesSnap.data().count,
      devoluciones: devolucionesSnap.data().count,
      hoyTotal: hoyDocs.length,
      hoyEstados,
    };
    dashboardKpisCargando = false;
    render();
  }).catch(err => {
    console.error("Error cargando los KPIs del dashboard con count():", err);
    console.error("Si el error menciona un índice ('requires an index'), abre el enlace que trae el propio error para crearlo en Firebase Console.");
    dashboardKpisCargando = false;
    // Se queda en null a propósito: kpisDashboardAdmin() cae al cálculo local de respaldo.
  });
}

function kpisDashboardAdmin(){
  if(dbFirestore && DASHBOARD_KPIS_ADMIN !== null) return DASHBOARD_KPIS_ADMIN;
  if(dbFirestore && !dashboardKpisCargando) cargarKpisDashboardAdmin();
  // Mientras llega la respuesta de Firestore (o si no hay Firebase disponible),
  // se usa el cálculo local de siempre con lo que ya esté en GUIAS — mismo
  // patrón de respaldo que biMapaCalorDepartamentos().
  const todasLocal = GUIAS.filter(g => !g.eliminada);
  const hoyLocal = todasLocal.filter(g => g.fecha === FECHA_HOY_STR);
  const hoyEstadosLocal = {};
  hoyLocal.forEach(g => { hoyEstadosLocal[g.estado] = (hoyEstadosLocal[g.estado]||0)+1; });
  return {
    total: todasLocal.length,
    entregadas: todasLocal.filter(g => g.estado === "Entregado" || g.estado === "Finalizado").length,
    enProceso: todasLocal.filter(g => ["En bodega","Recolectado","Asignado a ruta PM","Recibido en bodega final","Asignado a piloto"].includes(g.estado)).length,
    pendientes: todasLocal.filter(g => g.estado === "Pendiente").length,
    devoluciones: todasLocal.filter(g => g.estado === "Devolución").length,
    hoyTotal: hoyLocal.length,
    hoyEstados: hoyEstadosLocal,
  };
}

/* ============ "Pilotos en campo" (Dashboard) vía consulta dirigida ============
   Antes se calculaba filtrando TODO GUIAS por piloto — necesitaba la colección
   completa en memoria. Las guías "en ruta ahora" (estado "Asignado a piloto")
   son, por naturaleza, un conjunto acotado por la operación del día a día (no
   crece con el historial completo de la empresa), así que se puede pedir con
   una sola consulta dirigida — where("estado","==","Asignado a piloto") — sin
   descargar el resto de la colección. Un solo filtro de igualdad: no necesita
   índice compuesto. No es un listener en vivo: se vuelve a pedir cada vez que
   se entra al Dashboard, igual que los KPIs de arriba. */
let PILOTOS_EN_RUTA_ADMIN = null; // null = todavía no se pidió a Firestore
let pilotosEnRutaCargando = false;

function cargarPilotosEnRutaAdmin(){
  if(!dbFirestore || pilotosEnRutaCargando) return;
  pilotosEnRutaCargando = true;
  dbFirestore.collection("guias").where("estado","==","Asignado a piloto").get()
    .then(snap => {
      const conteo = {};
      snap.forEach(doc => {
        const g = doc.data();
        if(g.eliminada) return;
        conteo[g.piloto] = (conteo[g.piloto]||0) + 1;
      });
      PILOTOS_EN_RUTA_ADMIN = conteo;
      pilotosEnRutaCargando = false;
      render();
    })
    .catch(err => {
      console.error("Error cargando pilotos en ruta:", err);
      pilotosEnRutaCargando = false;
      // Se queda en null: guiasEnRutaPiloto() cae al cálculo local de respaldo.
    });
}

function guiasEnRutaPiloto(nombrePiloto){
  if(dbFirestore && PILOTOS_EN_RUTA_ADMIN !== null) return PILOTOS_EN_RUTA_ADMIN[nombrePiloto] || 0;
  if(dbFirestore && !pilotosEnRutaCargando) cargarPilotosEnRutaAdmin();
  // Respaldo mientras llega Firestore (o si no hay Firebase disponible): cálculo
  // local con lo que ya esté en GUIAS.
  return GUIAS.filter(g => !g.eliminada && g.piloto === nombrePiloto && g.estado === "Asignado a piloto").length;
}

/* Descarga en Excel las alertas activas del Centro de Control Operativo,
   respetando el filtro de fecha elegido (Histórico / Fecha actual / Rango). */
function descargarExcelAlertasOperativas(){
  const alertas = calcularAlertasOperativas();
  if(alertas.length === 0){ mostrarNotificacion("No hay alertas activas para descargar con el filtro actual."); return; }
  const filas = alertas.map(a => `
    <tr>
      <td>${esc(a.tipo)}</td>
      <td>${esc(a.guiaId || "-")}</td>
      <td>${esc(a.mensaje)}</td>
    </tr>
  `).join("");
  const html = `
    <html><head><meta charset="UTF-8"></head>
    <body>
      <table border="1">
        <thead><tr><th>Tipo de alerta</th><th>Guía</th><th>Mensaje</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </body></html>`;
  const blob = new Blob([html], { type: "application/vnd.ms-excel" });
  const url = URL.createObjectURL(blob);

  a.download = "Alertas_ControlOperativo_XpressControl.xls";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============ GUÍAS (Super Administrativo / Administrativo) ============
   Nota: GUIAS (Admin) solo tiene activas en tiempo real. Finalizadas se
   obtienen por paginación, búsqueda por ID (guiasExtraCache) o filtro de
   fecha "hoy" (guiasFechaCache desde Firestore). */
function guiasFiltered(filtro){
  const texto = (filtro||"").trim();
  // Unimos activas + búsqueda por ID + cache de fecha ("hoy")
  const mapa = new Map();
  GUIAS.filter(g => !g.eliminada).forEach(g => mapa.set(g.id, g));
  (state.guiasExtraCache || []).filter(g => !g.eliminada).forEach(g => {
    if(!mapa.has(g.id)) mapa.set(g.id, g);
  });
  (state.guiasFechaCache || []).filter(g => !g.eliminada).forEach(g => {
    if(!mapa.has(g.id)) mapa.set(g.id, g);
  });
  let data = Array.from(mapa.values());
  if(texto){
    const tokens = texto.split(/[\n,;]+/).map(t => t.trim()).filter(Boolean);
    if(tokens.length > 1){
      data = data.filter(g => tokens.some(t => g.id.includes(t)));
    } else {
      const t = tokens[0] || texto;
      data = data.filter(g => g.id.includes(t) || (g.cliente || "").toLowerCase().includes(t.toLowerCase()));
    }
  }
  data = aplicarFiltroFecha(data, state.guiaRangoModo, state.guiaFechaDesde, state.guiaFechaHasta);
  if(state.guiaRangoModo === "enruta"){
    // Guías con movimiento del piloto exactamente en la fecha seleccionada
    // (no se incluyen guías cuyo último movimiento quedó registrado en
    // otro día, aunque el piloto siga apareciendo como responsable).
    const fechaSel = state.guiaFechaEnRuta ? formatFechaCorta(new Date(state.guiaFechaEnRuta + "T00:00:00")) : FECHA_HOY_STR;
    data = data.filter(g => g.piloto && g.piloto !== "-" && g.fecha === fechaSel);
  }
  if(state.guiaPilotoEnRuta){
    data = data.filter(g => g.piloto === state.guiaPilotoEnRuta);
  }
  data = data.slice().sort((a,b) => (b.id||"").localeCompare(a.id||""));
  return data;
}

/* Carga en guiasFechaCache las guías de una fecha concreta (campo "fecha"
   en texto dd/mm/aa). Usado cuando Admin elige filtro "hoy", para no
   perder las Entregadas/Finalizadas de ese día. */
async function asegurarGuiasFechaEnCache(fechaStr){
  if(!dbFirestore || !fechaStr) return;
  const key = "fecha:" + fechaStr;
  // Ya se pidió esta fecha en esta sesión (aunque haya 0 resultados)
  if(state.guiasFechaCacheKey === key) return;
  try{
    const snap = await dbFirestore.collection("guias")
      .where("eliminada", "==", false)
      .where("fecha", "==", fechaStr)
      .get();
    state.guiasFechaCache = snap.docs.map(d => d.data());
    state.guiasFechaCacheKey = key;
    refreshGuiasTabla();
  }catch(err){
    console.error("Error cargando guías del día desde Firestore:", err);
    console.error("Si pide un índice, abre el enlace del error en Firebase Console.");
  }
}

/* Si el texto de búsqueda parece un número de guía (XC… / XC24…) y no está
   en la lista local de activas, lo pedimos puntualmente a Firestore y lo
   guardamos en guiasExtraCache para que aparezca en la tabla. Así el Admin
   puede seguir encontrando guías ya finalizadas escribiendo su número. */
async function completarGuiaPorBusquedaSiFalta(texto){
  if(!dbFirestore || !texto) return;
  const tokens = texto.split(/[\n,;]+/).map(t => t.trim()).filter(Boolean);
  const idsABuscar = tokens.filter(t => /^XC\d+/i.test(t));
  if(idsABuscar.length === 0) return;
  let agregadas = 0;
  for(const id of idsABuscar){
    const yaLocal = GUIAS.some(g => g.id === id) || (state.guiasExtraCache || []).some(g => g.id === id);
    if(yaLocal) continue;
    try{
      const snap = await dbFirestore.collection("guias").doc(id).get();
      if(snap.exists){
        state.guiasExtraCache = state.guiasExtraCache || [];
        state.guiasExtraCache.push(snap.data());
        agregadas++;
      }
    }catch(err){
      console.warn("No se pudo traer la guía " + id + " bajo demanda:", err);
    }
  }
  if(agregadas > 0) refreshGuiasTabla(texto);
}

/* ============ Paginación real de la tabla de Guías contra Firestore ============
   El modo "por defecto" (sin texto de búsqueda, sin filtro de piloto, rango
   "todas") sí se puede pedir paginado de verdad a Firestore: ordenado por
   id descendente, de a GUIAS_POR_PAGINA (25) documentos por página, con
   cursores — nunca se descarga el resto de la colección solo para mostrar
   esta tabla.
   La búsqueda de texto libre, el filtro por piloto y los rangos de fecha
   (hoy/rango/en ruta) se quedan con el comportamiento anterior (filtran
   sobre GUIAS ya en memoria): Firestore no permite "contiene texto" ni
   comparar por rango sobre el campo "fecha" tal como está guardado
   (texto "dd/mm/aa", no ordenable como fecha real). Ver la conversación
   sobre esto: es una limitación real de Firestore, no algo pendiente de
   implementar. */
function usaPaginacionRealGuias(){
  return !!dbFirestore
    && !state.guiasFirestoreError
    && !(state.guiaFiltroActual && state.guiaFiltroActual.trim())
    && state.guiaRangoModo === "todas"
    && !state.guiaPilotoEnRuta;
}

function reiniciarPaginacionRealGuias(){
  state.guiasFirestorePagina = null;
  state.guiasFirestoreCargando = false;
  state.guiasFirestoreCursores = [null];
  state.guiasFirestoreHayMas = true;
  state.guiasFirestoreError = false; // al reiniciar (cambiar filtro, refrescar) le damos otra oportunidad a la consulta real
}

async function cargarPaginaGuiasFirestore(direccion){
  if(!dbFirestore) return;
  state.guiasFirestoreCargando = true;
  refreshGuiasTabla();
  try{
    let query = dbFirestore.collection("guias").where("eliminada","==",false).orderBy("id","desc").limit(GUIAS_POR_PAGINA);
    if(direccion === "siguiente"){
      const cursorActual = state.guiasFirestoreCursores[state.guiasFirestoreCursores.length - 1];
      if(cursorActual) query = query.startAfter(cursorActual);
    } else if(direccion === "anterior"){
      state.guiasFirestoreCursores.pop(); // quita el cursor de la página actual
      const cursorPrevio = state.guiasFirestoreCursores[state.guiasFirestoreCursores.length - 1];
      if(cursorPrevio) query = query.startAfter(cursorPrevio);
    } else {
      state.guiasFirestoreCursores = [null];
    }
    const snap = await query.get();
    state.guiasFirestorePagina = snap.docs.map(d => d.data());
    state.guiasFirestoreHayMas = snap.docs.length === GUIAS_POR_PAGINA;
    if(direccion !== "anterior" && snap.docs.length > 0){
      state.guiasFirestoreCursores.push(snap.docs[snap.docs.length - 1]);
    }
  }catch(err){
    console.error("Error paginando guías en Firestore:", err);
    console.error("Código:", err && err.code, "| Mensaje:", err && err.message);
    state.guiasFirestorePagina = null;
    state.guiasFirestoreError = true; // evita reintentar la misma consulta en loop; guiasPaginadas() cae al camino local (GUIAS en memoria)
  }
  state.guiasFirestoreCargando = false;
  refreshGuiasTabla();
}

function guiasPaginadas(filtro){
  if(usaPaginacionRealGuias()){
    if(state.guiasFirestorePagina === null && !state.guiasFirestoreCargando){
      cargarPaginaGuiasFirestore("inicio");
    }
    const pageData = state.guiasFirestorePagina || [];
    const inicio = (state.guiasPagina - 1) * GUIAS_POR_PAGINA;
    return { data: pageData, pageData, totalPaginas: null, inicio, real:true };
  }
  const data = guiasFiltered(filtro===undefined ? state.guiaFiltroActual : filtro);
  const totalPaginas = Math.max(1, Math.ceil(data.length / GUIAS_POR_PAGINA));
  if(state.guiasPagina > totalPaginas) state.guiasPagina = totalPaginas;
  if(state.guiasPagina < 1) state.guiasPagina = 1;
  const inicio = (state.guiasPagina - 1) * GUIAS_POR_PAGINA;
  const pageData = data.slice(inicio, inicio + GUIAS_POR_PAGINA);
  return { data, pageData, totalPaginas, inicio };
}

   disponibles (Administrativos y Pilotos) agrupados, para que sea fácil
   encontrar al correcto y no equivocarse al asignarlo. */
function responsableMasivoHtml(){
  const administrativos = EMPLEADOS.filter(e => e.rol === "Administrativo" || e.rol === "Super Administrativo");
  const pilotos = EMPLEADOS.filter(e => e.rol === "Piloto");
  return `

      <input type="text" id="buscadorResponsableMasivo" placeholder="🔍 Buscar responsable..." oninput="filtrarResponsableMasivo(this.value)" style="width:auto;" />

        <option value="" ${state.guiaAccionMasivaResponsable===""?"selected":""}>Asignar responsable (opcional)...</option>
        ${administrativos.length ? `<optgroup label="🗂️ Administrativos">
          ${administrativos.map(e => `<option value="Administrativo|${esc(e.nombre)}" ${state.guiaAccionMasivaResponsable===("Administrativo|"+e.nombre)?"selected":""}>${esc(e.nombre)}</option>`).join("")}
        </optgroup>` : ""}
        ${pilotos.length ? `<optgroup label="🛵 Pilotos">
          ${pilotos.map(e => `<option value="Piloto|${esc(e.nombre)}" ${state.guiaAccionMasivaResponsable===("Piloto|"+e.nombre)?"selected":""}>${esc(e.nombre)}${e.disponible===false?" (no disponible)":""}</option>`).join("")}
        </optgroup>` : ""}
      </select>
    </div>
  `;
}

/* Filtra en vivo las opciones del selector de responsable según lo que se
   escriba en el buscador, sin tocar el optgroup vacío que sirve de placeholder. */
function filtrarResponsableMasivo(texto){
  const select = document.getElementById("guiaAccionMasivaResponsableSelect");
  if(!select) return;
  const q = texto.trim().toLowerCase();
  Array.from(select.querySelectorAll("optgroup")).forEach(grupo => {
    let algunoVisible = false;
    Array.from(grupo.querySelectorAll("option")).forEach(opt => {
      const coincide = opt.textContent.toLowerCase().includes(q);
      opt.style.display = coincide ? "" : "none";
      if(coincide) algunoVisible = true;
    });
    grupo.style.display = algunoVisible ? "" : "none";
  });
}

/* ---- Aplica un cambio de estado a todas las guías marcadas en la tabla,
   respetando la misma validación que el cambio individual (por ejemplo,
   exigir piloto asignado antes de pasar a "Asignado a piloto"). ---- */
function cambiarEstadoGuiasSeleccionadas(nuevoEstado, responsable){
  const ids = state.guiasSeleccionadas;
  if(ids.length === 0){ mostrarNotificacion("Selecciona al menos una guía."); return; }
  if(!nuevoEstado){ mostrarNotificacion("Selecciona el nuevo estado antes de ejecutar."); return; }
  const [responsableTipo, responsableNombre] = responsable ? responsable.split("|") : ["", ""];
  const seleccionadas = ids.map(id => buscarGuiaLocal(id)).filter(Boolean);
  const tendraPiloto = g => responsableTipo === "Piloto" || (g.piloto && g.piloto !== "-");
  const sinPiloto = nuevoEstado === "Asignado a piloto" ? seleccionadas.filter(g => !tendraPiloto(g)) : [];
  const aplicables = seleccionadas.filter(g => !(nuevoEstado === "Asignado a piloto" && !tendraPiloto(g)));
  if(aplicables.length === 0){
    mostrarNotificacion("Ninguna de las guías seleccionadas tiene piloto asignado. Elige un piloto en \"Asignar responsable\" o asígnalo primero.");
    return;
  }
  const textoResponsable = responsableNombre ? ` y asignar a ${responsableNombre}` : "";
  if(!confirm(`¿Cambiar el estado de ${aplicables.length} guía(s) seleccionada(s) a "${nuevoEstado}"${textoResponsable}?`)) return;
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  aplicables.forEach(g => {
    const anterior = g.estado;
    g.estado = nuevoEstado;
    g.fecha = new Date().toLocaleDateString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit" });
    if(responsableTipo === "Piloto"){
      g.piloto = responsableNombre;
      const pilotoObj = EMPLEADOS.find(e => e.nombre === responsableNombre && e.rol === "Piloto");
      g.pilotoId = pilotoObj ? pilotoObj.id : g.pilotoId;
    }
    if(responsableTipo === "Administrativo") g.operador = responsableNombre;
    if(nuevoEstado === "Entregado" && !g.fechaEntrega) g.fechaEntrega = fechaStr;
    if(nuevoEstado === "Finalizado") g.estadoPago = "Pagado";
    registrarCambioGuia(g, accionParaEstado(nuevoEstado) + " (cambio masivo)", anterior, nuevoEstado, state.role);
  });
  if(sinPiloto.length > 0){
    mostrarNotificacion(`${sinPiloto.length} guía(s) no tenían piloto asignado y no se actualizaron.`);
  }
  state.guiasSeleccionadas = [];
  state.guiaAccionMasiva = "";
  state.guiaAccionMasivaEstadoDestino = "";
  state.guiaAccionMasivaResponsable = "";
  render();
}

/* ---- Ejecuta la acción elegida en el filtro de la barra de selección
   (Ver historial / Eliminar / Descargar Excel) sobre las guías marcadas ---- */
function ejecutarAccionMasivaGuias(){
  const accion = state.guiaAccionMasiva;
  if(!accion){
    mostrarNotificacion("Selecciona una acción antes de ejecutar.");
    return;
  }
  if(accion === "historial"){
    if(state.guiasSeleccionadas.length !== 1){
      mostrarNotificacion("Para ver el historial selecciona una sola guía.");
      return;
    }
    selectGuia(state.guiasSeleccionadas[0]);
    return;
  }
  if(accion === "cambiar_estado"){
    cambiarEstadoGuiasSeleccionadas(state.guiaAccionMasivaEstadoDestino, state.guiaAccionMasivaResponsable);
    return;
  }
  if(accion === "excel"){
    descargarGuiasSeleccionadas();
    return;
  }
  if(accion === "eliminar"){
    eliminarGuiasSeleccionadas();
    state.guiaAccionMasiva = "";
    return;
  }
}

/* ---- Descargar Excel (se genera como tabla HTML que Excel abre nativamente) ----
   Para Admin, si el filtro es "histórico" sin búsqueda de texto, se pide el
   listado a Firestore por páginas (ya no depende solo de las activas en memoria).
   Con búsqueda/filtros locales se usa guiasFiltered como antes. */
async function descargarExcelGuias(){
  const btn = document.getElementById("btnDescargarExcelGuias");
  if(btn){ btn.disabled = true; btn.textContent = "⏳ Generando Excel..."; }
  try{
    let data = [];
    const filtroTexto = (state.guiaFiltroActual || "").trim();
    const esAdmin = state.role === "Super Administrativo" || state.role === "Administrativo";
    const puedeHistoricoFirestore = !!dbFirestore && esAdmin && !filtroTexto
      && state.guiaRangoModo === "todas" && !state.guiaPilotoEnRuta;
    const puedeHoyFirestore = !!dbFirestore && esAdmin && !filtroTexto
      && state.guiaRangoModo === "hoy" && !state.guiaPilotoEnRuta;

    if(puedeHistoricoFirestore){
      mostrarNotificacion("⏳ Descargando histórico de guías desde la nube…");
      data = await cargarTodasGuiasNoEliminadasFirestore();
    } else if(puedeHoyFirestore){
      mostrarNotificacion("⏳ Descargando guías de hoy desde la nube…");
      await asegurarGuiasFechaEnCache(FECHA_HOY_STR);
      data = guiasFiltered(filtroTexto);
    } else {
      data = guiasFiltered(filtroTexto);
    }

    if(data.length === 0){
      mostrarNotificacion("No hay guías para exportar con el filtro actual.");
      return;
    }
    const filas = data.map((g,i) => filaExcelGuiaPlantilla(g, i+1));
    const html = tablaExcelDesdePlantilla(PLANTILLA_EXCEL_GUIAS_HEADERS, filas);
    const blob = new Blob([html], { type: "application/vnd.ms-excel" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Guias_XpressControl.xls";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    mostrarNotificacion("✅ Excel generado: " + data.length + " guía(s).");
  }catch(err){
    console.error("Error generando Excel de guías:", err);
    mostrarNotificacion("❌ No se pudo generar el Excel. Revisa la consola o tu conexión.");
  }finally{
    if(btn){
      btn.disabled = false;
      btn.textContent = "⬇ Descargar Excel (" + textoFiltroFechaGuias() + ")";
    }
  }
}

/* Descarga todas las guías no eliminadas desde Firestore, de a 500 docs,
   para el Excel histórico del Admin. No usa el listener en vivo. */
async function cargarTodasGuiasNoEliminadasFirestore(){
  if(!dbFirestore) return [];
  const TAM = 500;
  const todas = [];
  let ultimo = null;
  for(;;){
    let q = dbFirestore.collection("guias")
      .where("eliminada", "==", false)
      .orderBy("id", "desc")
      .limit(TAM);
    if(ultimo) q = q.startAfter(ultimo);
    const snap = await q.get();
    if(snap.empty) break;
    snap.docs.forEach(d => todas.push(d.data()));
    ultimo = snap.docs[snap.docs.length - 1];
    if(snap.docs.length < TAM) break;
    // Tope de seguridad: evita descargas enormes accidentales (ajusta si hace falta)
    if(todas.length >= 20000){
      console.warn("Excel histórico: se alcanzó el tope de 20.000 guías.");
      mostrarNotificacion("⚠️ Se exportaron las primeras 20.000 guías (tope de seguridad).");
      break;
    }
  }
  return todas;
}

/* ---- Descargar Excel de Clientes (Super Administrativo / Administrativo) ----
   Super Administrativo: descarga directa, sin pedir contraseña.
   Administrativo: se le pide la clave que el Super Administrativo haya asignado. */
function solicitarDescargaClientes(){
  if(CLIENTES.length === 0){
    mostrarNotificacion("No hay clientes registrados todavía.");
    return;
  }
  if(state.role === "Super Administrativo"){
    descargarExcelClientes();
    return;
  }
  const clave = prompt("Ingresa la clave asignada por el Super Administrativo para descargar el Excel de clientes:");
  if(clave === null) return;
  // La clave se consulta en el momento (get() puntual), no se lee de una
  // variable ya sincronizada de forma pasiva desde el arranque de la app.
  obtenerClaveExportacionClientes().then((claveActual) => {
    if(clave !== claveActual){
      mostrarNotificacion("❌ Clave incorrecta. Solicítala al Super Administrativo.");
      return;
    }
    descargarExcelClientes();
  });
}

function cambiarClaveExportacionClientes(){
  obtenerClaveExportacionClientes().then((claveActual) => {
    const nueva = prompt("Nueva clave para que el rol Administrativo pueda descargar el Excel de clientes:", claveActual);
    if(nueva === null) return;
    if(!nueva.trim()){
      mostrarNotificacion("La clave no puede quedar vacía.");
      return;
    }
    guardarClaveExportacionClientes(nueva.trim());
    mostrarNotificacion("✅ Clave actualizada. Compártela solo con el(los) empleado(s) de rol Administrativo.");
  });
}

function descargarExcelClientes(){
  const filas = CLIENTES.map(c => `
    <tr>
      <td>${c.id}</td>
      <td>${c.comercio}</td>
      <td>${c.telefono}</td>
      <td>${c.correo}</td>
      <td>${c.direccion}</td>
      <td>${c.departamento}</td>
      <td>${c.municipio}</td>
      <td>${c.numeroAsesor || "-"}</td>
      <td>${c.nombreAsesor || "-"}</td>
      <td>${c.telefonoAsesor || "-"}</td>
      <td>${c.metrogaleria ? "Sí" : "No"}</td>
      <td>${c.lockers ? "Sí" : "No"}</td>
      <td>${c.metrogaleria ? "No aplica" : (c.tarifaEnvio ?? TARIFA_ENVIO_DEFAULT).toFixed(2)}</td>
      <td>${c.metrogaleria ? "No aplica" : (c.comision ?? COMISION_DEFAULT)}</td>
    </tr>
  `).join("");
  const html = `
    <html><head><meta charset="UTF-8"></head>
    <body>
      <table border="1">
        <thead><tr><th>ID</th><th>Comercio / Cliente</th><th>Teléfono</th><th>Correo</th><th>Dirección</th><th>Departamento</th><th>Municipio</th><th>N° de asesor</th><th>Asesor</th><th>Tel. asesor</th><th>Metro Galerías</th><th>Lockers</th><th>Tarifa de envío (US$)</th><th>Comisión (%)</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </body></html>`;
  const blob = new Blob([html], { type: "application/vnd.ms-excel" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Clientes_XpressControl.xls";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function cambiarEstadoGuia(id, nuevoEstado){
  const g = buscarGuiaLocal(id);
  if(!g) return;
  if(nuevoEstado === "Asignado a piloto" && (!g.piloto || g.piloto === "-")){
    mostrarNotificacion("Esta guía todavía no tiene un piloto asignado. Asígnalo primero desde \"Asignación Masiva de Guías\" (Asignar responsable) o editando la guía, y luego cambia el estado.");
    render();
    return;
  }
  const anterior = g.estado;
  g.estado = nuevoEstado;
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  g.fecha = new Date().toLocaleDateString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit" });
  if(nuevoEstado === "Entregado" && !g.fechaEntrega){
    g.fechaEntrega = fechaStr;
  }
  if(nuevoEstado === "Finalizado"){
    g.estadoPago = "Pagado";
  }
  registrarCambioGuia(g, accionParaEstado(nuevoEstado), anterior, nuevoEstado, state.role);
  render();
}

               necesario para saber cuál es el evento más antiguo ("Guía creada")
               y para calcular la duración respecto al movimiento anterior real. */

                ${duracion ? `<div class="usuario">⏱ ${duracion} después del movimiento anterior</div>` : ""}

            </div>
          `; }).join("")}

      ` : ""}
    </div>
  `;
}

/* Cuando se genera una guía de devolución o de reenvío CONSOLIDADA (una guía
   nueva que agrupa varias guías existentes de un mismo cliente), antes se
   tomaban la dirección, el municipio y el departamento directamente del
   perfil del cliente en CLIENTES. Si ese perfil nunca tuvo esos datos
   completados, la guía consolidada nacía con "-" en esos tres campos, aun
   cuando las guías originales que agrupa sí tenían una dirección real. Ahora,
   si el perfil del cliente no trae esos datos, se usan los de la guía más
   reciente entre las que se están agrupando (las que sí tienen ese dato), y
   solo se cae en "-" si de verdad no hay ningún dato disponible en ningún
   lado. */
function direccionClienteConRespaldo(clienteObj, guiasReferencia){
  const candidatas = (guiasReferencia || []).filter(Boolean);
  const direccionRespaldo = candidatas.find(g => g.direccion && g.direccion !== "-");
  const municipioRespaldo = candidatas.find(g => g.municipio && g.municipio !== "-");
  const departamentoRespaldo = candidatas.find(g => g.departamento && g.departamento !== "-");
  return {
    direccion: clienteObj.direccion || (direccionRespaldo ? direccionRespaldo.direccion : "-"),
    municipio: clienteObj.municipio || (municipioRespaldo ? municipioRespaldo.municipio : "-"),
    departamento: clienteObj.departamento || (departamentoRespaldo ? departamentoRespaldo.departamento : "-"),
  };
}

/* ---- Reparar guías dañadas (sin dirección/municipio/departamento) ----
   Botón manual, para roles administrativos, que recorre TODAS las guías ya
   guardadas y completa dirección/municipio/departamento en las que quedaron
   con "-" (normalmente guías de devolución/reenvío consolidadas generadas
   antes de esta corrección, cuando el perfil del cliente no tenía esos
   datos). Usa el mismo respaldo que ahora se aplica al crearlas: primero
   intenta las guías que esa guía agrupa (guiasIncluidas) y, si no hay nada
   ahí, cualquier otra guía existente de la misma cuenta. Deja registrado en
   el historial de cada guía reparada qué cambió. */
function repararGuiasSinDireccion(){
  let reparadas = 0;
  GUIAS.forEach(g => {
    if(g.eliminada) return;
    const faltaDireccion = !g.direccion || g.direccion === "-";
    const faltaMunicipio = !g.municipio || g.municipio === "-";
    const faltaDepartamento = !g.departamento || g.departamento === "-";
    if(!faltaDireccion && !faltaMunicipio && !faltaDepartamento) return;

    const clienteObj = CLIENTES.find(c => c.comercio === g.cuenta || c.comercio === g.cliente) || {};
    const guiasIncluidasRef = (g.guiasIncluidas || []).map(id => GUIAS.find(x => x.id === id)).filter(Boolean);
    const otrasGuiasCuenta = GUIAS.filter(x => x !== g && !x.eliminada && (x.cuenta === g.cuenta || x.cliente === g.cliente));
    const respaldo = direccionClienteConRespaldo(clienteObj, guiasIncluidasRef.concat(otrasGuiasCuenta));

    const cambios = [];
    if(faltaDireccion && respaldo.direccion !== "-"){ cambios.push(["Dirección del cliente", g.direccion || "-", respaldo.direccion]); g.direccion = respaldo.direccion; }
    if(faltaMunicipio && respaldo.municipio !== "-"){ cambios.push(["Municipio", g.municipio || "-", respaldo.municipio]); g.municipio = respaldo.municipio; }
    if(faltaDepartamento && respaldo.departamento !== "-"){ cambios.push(["Departamento", g.departamento || "-", respaldo.departamento]); g.departamento = respaldo.departamento; incrementarAgregadoDepartamento(respaldo.departamento, 1); }

    if(cambios.length > 0){
      cambios.forEach(([campo, antes, despues]) => {
        registrarCambioGuia(g, "Reparación automática: " + campo, antes, despues, state.role);
      });
      guardarGuiaEnFirestore(g);
      reparadas++;
    }
  });
  return reparadas;
}

function ejecutarReparacionGuiasDanadas(){
  const n = repararGuiasSinDireccion();
  render();
  mostrarNotificacion(n > 0
    ? `Se repararon ${n} guía(s): se completó su dirección, municipio o departamento a partir de otra guía de la misma cuenta.`
    : "No se encontraron guías con dirección, municipio o departamento incompletos para reparar.");
}

async function generarLoteDevolucion(){
  const clienteObj = CLIENTES.find(c => c.id === val("lote_tienda"));
  const raw = val("lote_guias");
  const ids = raw.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  if(!clienteObj){
    mostrarNotificacion("Selecciona un cliente de la lista.");
    return;
  }
  const tienda = tiendaLabel(clienteObj);
  if(ids.length === 0){
    mostrarNotificacion("Ingresa al menos un número de guía.");
    return;
  }
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  const mapaGuias = await buscarGuiasPorIds(ids);
  const encontrados = [];
  ids.forEach(id => {
    const g = mapaGuias[id];
    if(g){
      const anterior = g.estado;
      g.estado = "Devolución";
      g.tienda = tienda;
      registrarCambioGuia(g, "Lote de devolución — " + tienda, anterior, "Devolución", state.role);
      encontrados.push(g);
    }
  });
  state.ultimoLoteDevolucion = encontrados;

  /* Por cada cliente distinto incluido en el lote, se genera una nueva guía
     consolidada para poder enviarle de vuelta sus paquetes devueltos. */
  const porCliente = {};
  encontrados.forEach(g => {
    const cuenta = g.cuenta || g.cliente;
    if(!porCliente[cuenta]) porCliente[cuenta] = [];
    porCliente[cuenta].push(g.id);
  });
  const nuevasGuiasDevolucion = [];
  Object.keys(porCliente).forEach(cuenta => {
    const nuevoId = "XC" + siguienteNumeroGuiaBase("XC");
    const codigoBarra = nuevoId;
    const guiasDelCliente = porCliente[cuenta].map(id => mapaGuias[id]);
    const respaldo = direccionClienteConRespaldo(clienteObj, guiasDelCliente);
    const nueva = {
      id:nuevoId, cliente:cuenta, cuenta:cuenta, estado:"Creado", estadoPago:"Por pagar", fecha:fechaStr, fechaEntrega:null,
      operador:state.role, piloto:"-", ruta:"-", codigoBarra,
      fotoEntrega:null, ubicacionEntrega:null, firmaEntrega:null, tienda:tienda,
      nombre:cuenta, direccion:respaldo.direccion, municipio:respaldo.municipio, fragil:"No",
      departamento:respaldo.departamento, esDevolucionConsolidada:true, guiasIncluidas:porCliente[cuenta],
      eliminada:false, fechaEliminacion:null, eliminadaPor:null,
      creadoPor:creadorActual().nombre, creadoPorTipo:creadorActual().tipo,
    };
    GUIAS.push(nueva);
    guardarGuiaEnFirestore(nueva);
    incrementarAgregadoDepartamento(nueva.departamento, 1);
    HISTORIAL[nuevoId] = [
      { fecha:fechaStr, usuario:state.role, accion:"Guía de devolución generada para enviar los paquetes de vuelta a " + cuenta + " (incluye: " + porCliente[cuenta].join(", ") + ")", de:"-", a:"Creado" }
    ];
    crearNotificacionCliente(nueva, "Se generó una nueva guía de devolución para reenviarte tus paquetes", "-", "Creado", state.role, fechaStr);
    nuevasGuiasDevolucion.push(nueva);
  });
  state.guiasDevolucionGeneradas = nuevasGuiasDevolucion;

  const noEncontrados = ids.length - encontrados.length;
  mostrarNotificacion(`Lote procesado: ${encontrados.length} guía(s) marcadas como Devolución para "${tienda}". Se generó/generaron ${nuevasGuiasDevolucion.length} guía(s) de devolución para reenviar los paquetes al cliente.${noEncontrados > 0 ? " " + noEncontrados + " número(s) no se encontraron en el sistema." : ""}`);
  render();
}

/* Parser CSV simple que respeta campos entre comillas (por si una dirección
   u otro campo trae una coma dentro). Usado por las cargas masivas. */
function parseCSVLine(line){
  const result = [];
  let cur = "";
  let inQuotes = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else { inQuotes = false; }
      } else {
        cur += ch;
      }
    } else {
      if(ch === '"'){ inQuotes = true; }
      else if(ch === ','){ result.push(cur.trim()); cur = ""; }
      else { cur += ch; }
    }
  }
  result.push(cur.trim());
  return result;
}

function procesarArchivoLoteDevolucion(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const texto = String(e.target.result || "");
    const lineas = texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if(lineas.length < 2){
      mostrarNotificacion("El archivo está vacío o no tiene filas de datos debajo del encabezado.");
      return;
    }
    const filas = lineas.slice(1).map(l => parseCSVLine(l));
    ejecutarLoteDevolucionMasivo(filas);
    input.value = "";
  };
  reader.readAsText(file, "UTF-8");
}

async function ejecutarLoteDevolucionMasivo(filas){
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  const porCliente = {};
  filas.forEach(fila => {
    const nombreCliente = fila[0];
    const guiaId = fila[1];
    if(!nombreCliente || !guiaId) return;
    if(!porCliente[nombreCliente]) porCliente[nombreCliente] = [];
    porCliente[nombreCliente].push(guiaId);
  });

  const todosLosIds = Object.values(porCliente).flat();
  const mapaGuias = await buscarGuiasPorIds(todosLosIds);

  const todosEncontrados = [];
  const nuevasGuiasDevolucion = [];
  const clientesNoEncontrados = [];
  const guiasNoEncontradas = [];

  Object.keys(porCliente).forEach(nombreCliente => {
    const idsCliente = porCliente[nombreCliente];
    const clienteObj = CLIENTES.find(c => c.comercio.trim().toLowerCase() === nombreCliente.trim().toLowerCase());
    if(!clienteObj){
      clientesNoEncontrados.push(nombreCliente);
      return;
    }
    const tienda = tiendaLabel(clienteObj);
    const encontrados = [];
    idsCliente.forEach(id => {
      const g = mapaGuias[id];
      if(g){
        const anterior = g.estado;
        g.estado = "Devolución";
        g.tienda = tienda;
        registrarCambioGuia(g, "Lote de devolución masivo (Excel) — " + tienda, anterior, "Devolución", state.role);
        encontrados.push(g);
        todosEncontrados.push(g);
      } else {
        guiasNoEncontradas.push(id);
      }
    });
    if(encontrados.length > 0){
      const nuevoId = "XC" + siguienteNumeroGuiaBase("XC");
      const codigoBarra = nuevoId;
      const respaldo = direccionClienteConRespaldo(clienteObj, encontrados);
      const nueva = {
        id:nuevoId, cliente:clienteObj.comercio, cuenta:clienteObj.comercio, estado:"Creado", estadoPago:"Por pagar", fecha:fechaStr, fechaEntrega:null,
        operador:state.role, piloto:"-", ruta:"-", codigoBarra,
        fotoEntrega:null, ubicacionEntrega:null, firmaEntrega:null, tienda:tienda,
        nombre:clienteObj.comercio, direccion:respaldo.direccion, municipio:respaldo.municipio, fragil:"No",
        departamento:respaldo.departamento, esDevolucionConsolidada:true, guiasIncluidas:encontrados.map(g => g.id),
        eliminada:false, fechaEliminacion:null, eliminadaPor:null,
        creadoPor:creadorActual().nombre, creadoPorTipo:creadorActual().tipo,
      };
      GUIAS.push(nueva);
      guardarGuiaEnFirestore(nueva);
      incrementarAgregadoDepartamento(nueva.departamento, 1);
      HISTORIAL[nuevoId] = [
        { fecha:fechaStr, usuario:state.role, accion:"Guía de devolución generada (lote masivo) para enviar los paquetes de vuelta a " + clienteObj.comercio + " (incluye: " + encontrados.map(g => g.id).join(", ") + ")", de:"-", a:"Creado" }
      ];
      crearNotificacionCliente(nueva, "Se generó una nueva guía de devolución para reenviarte tus paquetes", "-", "Creado", state.role, fechaStr);
      nuevasGuiasDevolucion.push(nueva);
    }
  });

  state.ultimoLoteDevolucion = todosEncontrados;
  state.guiasDevolucionGeneradas = nuevasGuiasDevolucion;
  state.mostrarCreacionMasivaLote = false;

  let msg = `Archivo procesado: ${todosEncontrados.length} guía(s) marcadas como Devolución en ${nuevasGuiasDevolucion.length} cliente(s) distinto(s).`;
  if(clientesNoEncontrados.length > 0){
    msg += `\n\n⚠️ Estos clientes no coinciden con "Clientes" (revisa el nombre exacto): ${clientesNoEncontrados.join(", ")}`;
  }
  if(guiasNoEncontradas.length > 0){
    msg += `\n\n⚠️ Estas guías no existen en el sistema: ${guiasNoEncontradas.join(", ")}`;
  }
  mostrarNotificacion(msg);
  render();
}

/* Registra el cargo único de $4.10 por lote, asociado al cliente. */
function registrarCargoLoteCambio(tienda, idsGuias, fechaStr){
  const cargo = {
    id: "CC" + Date.now() + Math.floor(Math.random()*1000),
    tienda, monto: -4.10, fecha: fechaStr, fechaOrden: Date.now(),
    guiasIncluidas: idsGuias, registradoPor: state.role,
  };
  CARGOS_CAMBIOS.push(cargo);
  guardarCargoCambioEnFirestore(cargo);
  return cargo;
}

async function generarLoteCambio(){
  const clienteObj = CLIENTES.find(c => c.id === val("cambio_tienda"));
  const raw = val("cambio_guias");
  const ids = raw.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  if(!clienteObj){
    mostrarNotificacion("Selecciona un cliente de la lista.");
    return;
  }
  const tienda = tiendaLabel(clienteObj);
  if(ids.length === 0){
    mostrarNotificacion("Ingresa al menos un número de guía.");
    return;
  }
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  const mapaGuias = await buscarGuiasPorIds(ids);
  const encontrados = [];
  ids.forEach(id => {
    const g = mapaGuias[id];
    if(g){
      /* No se modifica g.estado: la guía conserva el estado que ya tenía,
         solo queda registrado en su historial que tuvo un cambio realizado. */
      registrarCambioGuia(g, "Cambio realizado — " + tienda, g.estado, g.estado, state.role);
      encontrados.push(g);
    }
  });
  state.ultimoLoteCambio = encontrados;

  /* Por cada cliente distinto incluido en el lote, se genera una nueva guía
     consolidada para poder reenviarle sus paquetes con el cambio realizado. */
  const porCliente = {};
  encontrados.forEach(g => {
    const cuenta = g.cuenta || g.cliente;
    if(!porCliente[cuenta]) porCliente[cuenta] = [];
    porCliente[cuenta].push(g.id);
  });
  const nuevasGuiasCambio = [];
  Object.keys(porCliente).forEach(cuenta => {
    const nuevoId = "XC" + siguienteNumeroGuiaBase("XC");
    const codigoBarra = nuevoId;
    const guiasDelCliente = porCliente[cuenta].map(id => mapaGuias[id]);
    const respaldo = direccionClienteConRespaldo(clienteObj, guiasDelCliente);
    const nueva = {
      id:nuevoId, cliente:cuenta, cuenta:cuenta, estado:"Creado", estadoPago:"Por pagar", fecha:fechaStr, fechaEntrega:null,
      operador:state.role, piloto:"-", ruta:"-", codigoBarra,
      fotoEntrega:null, ubicacionEntrega:null, firmaEntrega:null, tienda:tienda,
      nombre:cuenta, direccion:respaldo.direccion, municipio:respaldo.municipio, fragil:"No",
      departamento:respaldo.departamento, esCambioConsolidado:true, guiasIncluidas:porCliente[cuenta],
      eliminada:false, fechaEliminacion:null, eliminadaPor:null,
      creadoPor:creadorActual().nombre, creadoPorTipo:creadorActual().tipo,
    };
    GUIAS.push(nueva);
    guardarGuiaEnFirestore(nueva);
    incrementarAgregadoDepartamento(nueva.departamento, 1);
    HISTORIAL[nuevoId] = [
      { fecha:fechaStr, usuario:state.role, accion:"Guía de reenvío generada por cambio realizado para " + cuenta + " (incluye: " + porCliente[cuenta].join(", ") + ")", de:"-", a:"Creado" }
    ];
    crearNotificacionCliente(nueva, "Se generó una nueva guía de reenvío por un cambio realizado", "-", "Creado", state.role, fechaStr);
    nuevasGuiasCambio.push(nueva);
  });
  state.guiasCambioGeneradas = nuevasGuiasCambio;

  const cargo = registrarCargoLoteCambio(tienda, encontrados.map(g => g.id), fechaStr);

  const noEncontrados = ids.length - encontrados.length;
  mostrarNotificacion(`Lote procesado: ${encontrados.length} guía(s) marcadas con cambio realizado para "${tienda}" (conservan su estado actual). Se generó/generaron ${nuevasGuiasCambio.length} guía(s) de reenvío. Se generó un cargo único de $${cargo.monto.toFixed(2)} para este lote.${noEncontrados > 0 ? " " + noEncontrados + " número(s) no se encontraron en el sistema." : ""}`);
  // Nota: cargo.monto es negativo (-4.10) por diseño para este tipo de lote; toFixed(2) ya imprime el signo "-" correctamente.
  render();
}

function procesarArchivoLoteCambio(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const texto = String(e.target.result || "");
    const lineas = texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if(lineas.length < 2){
      mostrarNotificacion("El archivo está vacío o no tiene filas de datos debajo del encabezado.");
      return;
    }
    const filas = lineas.slice(1).map(l => parseCSVLine(l));
    ejecutarLoteCambioMasivo(filas);
    input.value = "";
  };
  reader.readAsText(file, "UTF-8");
}

async function ejecutarLoteCambioMasivo(filas){
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  const porCliente = {};
  filas.forEach(fila => {
    const nombreCliente = fila[0];
    const guiaId = fila[1];
    if(!nombreCliente || !guiaId) return;
    if(!porCliente[nombreCliente]) porCliente[nombreCliente] = [];
    porCliente[nombreCliente].push(guiaId);
  });

  const todosLosIds = Object.values(porCliente).flat();
  const mapaGuias = await buscarGuiasPorIds(todosLosIds);

  const todosEncontrados = [];
  const nuevasGuiasCambio = [];
  const clientesNoEncontrados = [];
  const guiasNoEncontradas = [];
  const cargosGenerados = [];

  Object.keys(porCliente).forEach(nombreCliente => {
    const idsCliente = porCliente[nombreCliente];
    const clienteObj = CLIENTES.find(c => c.comercio.trim().toLowerCase() === nombreCliente.trim().toLowerCase());
    if(!clienteObj){
      clientesNoEncontrados.push(nombreCliente);
      return;
    }
    const tienda = tiendaLabel(clienteObj);
    const encontrados = [];
    idsCliente.forEach(id => {
      const g = mapaGuias[id];
      if(g){
        registrarCambioGuia(g, "Lote de cambio realizado masivo (Excel) — " + tienda, g.estado, g.estado, state.role);
        encontrados.push(g);
        todosEncontrados.push(g);
      } else {
        guiasNoEncontradas.push(id);
      }
    });
    if(encontrados.length > 0){
      const nuevoId = "XC" + siguienteNumeroGuiaBase("XC");
      const codigoBarra = nuevoId;
      const respaldo = direccionClienteConRespaldo(clienteObj, encontrados);
      const nueva = {
        id:nuevoId, cliente:clienteObj.comercio, cuenta:clienteObj.comercio, estado:"Creado", estadoPago:"Por pagar", fecha:fechaStr, fechaEntrega:null,
        operador:state.role, piloto:"-", ruta:"-", codigoBarra,
        fotoEntrega:null, ubicacionEntrega:null, firmaEntrega:null, tienda:tienda,
        nombre:clienteObj.comercio, direccion:respaldo.direccion, municipio:respaldo.municipio, fragil:"No",
        departamento:respaldo.departamento, esCambioConsolidado:true, guiasIncluidas:encontrados.map(g => g.id),
        eliminada:false, fechaEliminacion:null, eliminadaPor:null,
        creadoPor:creadorActual().nombre, creadoPorTipo:creadorActual().tipo,
      };
      GUIAS.push(nueva);
      guardarGuiaEnFirestore(nueva);
      incrementarAgregadoDepartamento(nueva.departamento, 1);
      HISTORIAL[nuevoId] = [
        { fecha:fechaStr, usuario:state.role, accion:"Guía de reenvío generada (lote masivo) por cambio realizado para " + clienteObj.comercio + " (incluye: " + encontrados.map(g => g.id).join(", ") + ")", de:"-", a:"Creado" }
      ];
      crearNotificacionCliente(nueva, "Se generó una nueva guía de reenvío por un cambio realizado", "-", "Creado", state.role, fechaStr);
      nuevasGuiasCambio.push(nueva);
      cargosGenerados.push(registrarCargoLoteCambio(tienda, encontrados.map(g => g.id), fechaStr));
    }
  });

  state.ultimoLoteCambio = todosEncontrados;
  state.guiasCambioGeneradas = nuevasGuiasCambio;
  state.mostrarCreacionMasivaLoteCambio = false;

  const totalCargos = cargosGenerados.reduce((s,c) => s + c.monto, 0);
  let msg = `Archivo procesado: ${todosEncontrados.length} guía(s) marcadas con cambio realizado en ${nuevasGuiasCambio.length} cliente(s) distinto(s). Se generaron ${cargosGenerados.length} cargo(s) por un total de $${totalCargos.toFixed(2)}.`;
  if(clientesNoEncontrados.length > 0){
    msg += `\n\n⚠️ Estos clientes no coinciden con "Clientes" (revisa el nombre exacto): ${clientesNoEncontrados.join(", ")}`;
  }
  if(guiasNoEncontradas.length > 0){
    msg += `\n\n⚠️ Estas guías no existen en el sistema: ${guiasNoEncontradas.join(", ")}`;
  }
  mostrarNotificacion(msg);
  render();
}

      </div>
      <div id="masivoResultado"></div>
    </div>
  `;

async function asignarEstadoMasivo(estado){
  const raw = val("masivoGuias");
  const ids = raw.split("\n").map(s => s.trim()).filter(Boolean);
  let encontrados = 0;
  for(const id of ids){
    let g = buscarGuiaLocal(id);
    if(!g && dbFirestore && /^XC/i.test(id)){
      try{
        const snap = await dbFirestore.collection("guias").doc(id).get();
        if(snap.exists){
          g = snap.data();
          state.guiasExtraCache = state.guiasExtraCache || [];
          if(!state.guiasExtraCache.some(x => x.id === g.id)) state.guiasExtraCache.push(g);
        }
      }catch(err){ console.warn("No se pudo traer la guía " + id + ":", err); }
    }
    if(g){
      const anterior = g.estado;
      g.estado = estado;
      registrarCambioGuia(g, accionParaEstado(estado) + " (asignación masiva BIT)", anterior, estado, state.role);
      encontrados++;
    }
  }
  const resultado = document.getElementById("masivoResultado");
  if(resultado){
    resultado.innerHTML = `<p class="stat-note">Se procesaron ${ids.length} números · ${encontrados} guía(s) actualizadas a "${estado}".</p>`;
  }
  if(encontrados > 0) render();
}

async function asignarResponsableMasivoGuias(){
  const raw = val("masivoGuias2");
  const ids = raw.split("\n").map(s => s.trim()).filter(Boolean);
  if(ids.length === 0){
    mostrarNotificacion("Pega al menos un número de guía en el cuadro de arriba.");
    return;
  }
  const selectEl = document.getElementById("masivoResponsable");
  const valorSel = selectEl ? selectEl.value : "";
  if(!valorSel){
    mostrarNotificacion("Selecciona un usuario Administrativo o Piloto de la lista para asignar.");
    return;
  }
  const [rolSel, nombreSel] = valorSel.split("|");
  const fechaHoy = new Date().toLocaleDateString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit" });
  let encontrados = 0;
  const noEncontrados = [];
  for(const id of ids){
    let g = buscarGuiaLocal(id);
    if(!g && dbFirestore && /^XC/i.test(id)){
      try{
        const snap = await dbFirestore.collection("guias").doc(id).get();
        if(snap.exists){
          g = snap.data();
          state.guiasExtraCache = state.guiasExtraCache || [];
          if(!state.guiasExtraCache.some(x => x.id === g.id)) state.guiasExtraCache.push(g);
        }
      }catch(err){ console.warn("No se pudo traer la guía " + id + ":", err); }
    }
    if(g){
      g.fecha = fechaHoy;
      if(rolSel === "Piloto"){
        const anterior = g.piloto;
        g.piloto = nombreSel;
        const pilotoObj = EMPLEADOS.find(e => e.nombre === nombreSel && e.rol === "Piloto");
        g.pilotoId = pilotoObj ? pilotoObj.id : g.pilotoId;
        registrarCambioGuia(g, "Asignación masiva de piloto", anterior, nombreSel, state.role);
      } else {
        const anterior = g.operador;
        g.operador = nombreSel;
        registrarCambioGuia(g, "Asignación masiva de operador", anterior, nombreSel, state.role);
      }
      encontrados++;
    } else {
      noEncontrados.push(id);
    }
  }
  const resultado = document.getElementById("masivoResultado2");
  if(resultado){
    const mensaje = `Se procesaron ${ids.length} números · ${encontrados} guía(s) asignadas correctamente a ${rolSel === "Piloto" ? "piloto" : "operador"} <b>${esc(nombreSel)}</b>.`;
    resultado.innerHTML = resultadoMasivoGuiasHtml(mensaje, noEncontrados);
  }
  if(encontrados > 0) render();
}

async function asignarEstadoMasivoGuias(estado){
  const raw = val("masivoGuias2");
  const ids = raw.split("\n").map(s => s.trim()).filter(Boolean);
  if(ids.length === 0){
    mostrarNotificacion("Pega al menos un número de guía en el cuadro de arriba.");
    return;
  }

  const selectEl = document.getElementById("masivoResponsable");
  const valorSel = selectEl ? selectEl.value : "";
  const [rolSel, nombreSel] = valorSel ? valorSel.split("|") : [null, null];

  if(estado === "Asignado a piloto" && rolSel !== "Piloto"){
    mostrarNotificacion("Para usar el estado \"Asignado a piloto\" primero selecciona el piloto en \"Asignar responsable\" (arriba) y vuelve a intentarlo.");
    return;
  }

  const fechaHoy = new Date().toLocaleDateString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit" });
  let encontrados = 0;
  const noEncontrados = [];
  for(const id of ids){
    let g = buscarGuiaLocal(id);
    if(!g && dbFirestore && /^XC/i.test(id)){
      try{
        const snap = await dbFirestore.collection("guias").doc(id).get();
        if(snap.exists){
          g = snap.data();
          state.guiasExtraCache = state.guiasExtraCache || [];
          if(!state.guiasExtraCache.some(x => x.id === g.id)) state.guiasExtraCache.push(g);
        }
      }catch(err){ console.warn("No se pudo traer la guía " + id + ":", err); }
    }
    if(g){
      const anterior = g.estado;
      g.estado = estado;
      g.fecha = fechaHoy;
      if(estado === "Asignado a piloto"){
        g.piloto = nombreSel;
        const pilotoObj = EMPLEADOS.find(e => e.nombre === nombreSel && e.rol === "Piloto");
        g.pilotoId = pilotoObj ? pilotoObj.id : g.pilotoId;
        if(!g.ruta || g.ruta === "-") g.ruta = "Ruta del día - " + nombreSel;
      } else if(rolSel === "Administrativo" && nombreSel){
        g.operador = nombreSel;
      }
      if(estado === "Finalizado"){
        g.estadoPago = "Pagado";
      }
      registrarCambioGuia(g, accionParaEstado(estado) + " (asignación masiva)", anterior, estado, state.role);
      encontrados++;
    } else {
      noEncontrados.push(id);
    }
  }
  const resultado = document.getElementById("masivoResultado2");
  if(resultado){
    const mensaje = `Se procesaron ${ids.length} número(s) · ${encontrados} guía(s) actualizadas correctamente a "${estado}"${estado === "Asignado a piloto" ? ` y quedaron en la ruta de hoy del piloto <b>${esc(nombreSel)}</b>` : ""}.`;
    resultado.innerHTML = resultadoMasivoGuiasHtml(mensaje, noEncontrados);
  }
  if(encontrados > 0) render();
}

function clientesFiltrados(){
  const textoCrudo = (state.clienteFiltroTexto || "").trim();
  const deptos = state.clienteFiltroDeptos;
  const tipoEspecial = state.clienteFiltroTipoEspecial || "todos";
  const vip = state.clienteFiltroVip || "todos";
  const tokens = textoCrudo ? textoCrudo.split(/[\n,;]+/).map(t => t.trim().toLowerCase()).filter(Boolean) : [];
  let data = CLIENTES.slice().sort((a,b) => (b.id||"").localeCompare(a.id||"")).filter(c => {
    if(deptos.length > 0 && !deptos.includes(c.departamento)) return false;
    if(tipoEspecial === "metrogaleria" && !c.metrogaleria) return false;
    if(tipoEspecial === "lockers" && !c.lockers) return false;
    if(tipoEspecial === "no" && (c.metrogaleria || c.lockers)) return false;
    if(vip === "si" && !esClienteVip(c)) return false;
    if(vip === "no" && esClienteVip(c)) return false;
    if(tokens.length === 0) return true;
    const campos = [c.comercio, c.correo, c.telefono, c.numeroAsesor, c.nombreAsesor, c.municipio];
    return tokens.some(t => campos.some(v => (v || "").toString().toLowerCase().includes(t)));
  });
  data = aplicarFiltroFecha(data, state.clienteRangoModo, state.clienteFechaDesde, state.clienteFechaHasta, "fechaRegistro");
  return data;
}

        <div class="field" id="campo_comision" style="${state.metrogaleriaTemp === "Sí" ? "display:none;" : ""}">
          <label>Comisión (%)</label>
          <input id="c_comision" type="number" min="0" step="0.1" value="${state.lockersTemp === "Sí" ? "0.00" : COMISION_DEFAULT}" ${(state.role !== "Super Administrativo" || state.lockersTemp === "Sí") ? "disabled" : ""} />

        </div>
      </div>
      <button class="btn btn-navy" style="margin-top:14px;" onclick="guardarCliente()">💾 Guardar cliente</button>
    </div>` : ""}
    <div class="card pad">
      <div class="search-box">
        🔎 <input id="clienteFiltro" type="text" placeholder="Buscar por comercio, correo, teléfono, asesor o código de asesor..." value="${esc(state.clienteFiltroTexto)}" oninput="onClienteFiltro(this.value)" />
        <button class="btn-link" style="white-space:nowrap;" onclick="toggleBusquedaMultipleClientes()">${state.clienteBusquedaMultipleAbierta ? "✖ Cerrar" : "🔎 Buscar varios clientes"}</button>
      </div>
      ${state.clienteBusquedaMultipleAbierta ? `
      <div class="multi-search-wrap">
        <div class="field full">
          <label>Pega varios comercios, correos o teléfonos (uno por línea o separados por coma)</label>
          <textarea id="clienteFiltroMultiple" rows="4" placeholder="Empresa ABC&#10;Empresa XYZ&#10;Nike"></textarea>
        </div>
        <button class="btn btn-navy" style="margin-top:10px;" onclick="buscarClientesMultiple()">Buscar</button>
        <button class="btn btn-outline" style="margin-top:10px;" onclick="limpiarBusquedaMultipleClientes()">Limpiar</button>
      </div>` : ""}

        <div class="field">
          <label>Filtrar por fecha de registro</label>
          <select id="clienteRangoModo" onchange="onClienteRangoModo(this.value)">
            <option value="todas" ${state.clienteRangoModo==='todas'?'selected':''}>Histórico (todos)</option>
            <option value="hoy" ${state.clienteRangoModo==='hoy'?'selected':''}>Fecha actual (hoy)</option>
            <option value="rango" ${state.clienteRangoModo==='rango'?'selected':''}>Rango de fechas</option>
          </select>
        </div>
        ${state.clienteRangoModo==='rango' ? `
        <div class="field">
          <label>Desde</label>
          <input type="date" id="clienteFechaDesde" value="${state.clienteFechaDesde||''}" onchange="onClienteRangoFecha()" />
        </div>
        <div class="field">
          <label>Hasta</label>
          <input type="date" id="clienteFechaHasta" value="${state.clienteFechaHasta||''}" onchange="onClienteRangoFecha()" />
        </div>
        ` : ""}
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <div class="multiselect">
          <button type="button" class="multiselect-toggle" onclick="toggleClienteMultiselect(${!state.clienteMultiselectAbierto})">
            🏷️ Departamento ${state.clienteFiltroDeptos.length > 0 ? `<span class="count">${state.clienteFiltroDeptos.length}</span>` : ""}
          </button>
          ${state.clienteMultiselectAbierto ? `
          <div class="multiselect-panel">
            ${Object.keys(DEPTOS_MUNICIPIOS).map(depto => `
              <label>
                <input type="checkbox" ${state.clienteFiltroDeptos.includes(depto) ? "checked" : ""} onchange="toggleClienteDepto('${depto}')" />
                ${depto}
              </label>

            <div class="msel-footer">
              <button type="button" class="btn-link" onclick="limpiarClienteDeptos()">Limpiar</button>
              <button type="button" class="btn-link" onclick="toggleClienteMultiselect(false)">Listo</button>
            </div>
          </div>` : ""}

        <div class="field" style="margin:0;min-width:150px;">
          <select id="clienteFiltroTipoEspecial" onchange="onClienteFiltroTipoEspecial(this.value)">
            <option value="todos" ${state.clienteFiltroTipoEspecial==='todos'?'selected':''}>Tipo especial: Todos</option>
            <option value="no" ${state.clienteFiltroTipoEspecial==='no'?'selected':''}>Sin tipo especial</option>
            <option value="metrogaleria" ${state.clienteFiltroTipoEspecial==='metrogaleria'?'selected':''}>🏬 Metro Galerías</option>
            <option value="lockers" ${state.clienteFiltroTipoEspecial==='lockers'?'selected':''}>📦 Lockers</option>
          </select>
        </div>
        ${(state.role === "Super Administrativo" || state.role === "Administrativo") ? `
        <div class="field" style="margin:0;min-width:120px;">
          <select id="clienteFiltroVip" onchange="onClienteFiltroVip(this.value)">
            <option value="todos" ${state.clienteFiltroVip==='todos'?'selected':''}>VIP: Todos</option>
            <option value="si" ${state.clienteFiltroVip==='si'?'selected':''}>Solo VIP</option>
            <option value="no" ${state.clienteFiltroVip==='no'?'selected':''}>No VIP</option>
          </select>

        ${(state.clienteFiltroTexto || state.clienteFiltroDeptos.length > 0 || state.clienteRangoModo !== 'todas' || state.clienteFiltroTipoEspecial !== 'todos' || state.clienteFiltroVip !== 'todos') ? `<button class="btn-link" onclick="limpiarFiltrosClientes()">✖ Quitar filtros</button>` : ""}

    </div>
    <p class="subtle-note">Solo el rol Super Administrativo puede generar o regenerar las contraseñas de los clientes.</p>
  `;
}

function clientesTablaWrapHtml(){
  const lista = clientesFiltrados();
  const esRolAdmin = state.role === "Super Administrativo" || state.role === "Administrativo";
  const colCount = 10;
  return `
    <p style="font-size:12px;color:#94a3b8;margin:0 0 10px 0;">${lista.length} de ${CLIENTES.length} cliente(s)</p>
    <table>
      <thead><tr><th>ID</th><th>Comercio / Cliente</th><th>Teléfono</th><th>Correo</th><th>Departamento — Municipio</th><th>N° de asesor</th><th>Asesor</th><th>Tel. asesor</th><th>Tarifa de envío</th><th>Rol</th><th></th></tr></thead>
      <tbody>
        ${lista.length === 0 ? `<tr><td colspan="${colCount}" style="color:#94a3b8;padding:16px 0;">No se encontraron clientes con esos filtros.</td></tr>` : lista.map(c => {
          const tipoEspecialTexto = c.metrogaleria ? "🏬 Metro Galerías" : (c.lockers ? "📦 Lockers" : "Sin tipo especial");
          return `
          <tr>
            <td style="color:#94a3b8;">${esc(c.id)}</td>
            <td style="font-weight:700;color:var(--navy);cursor:pointer;text-decoration:underline;text-decoration-color:transparent;" onclick="verDetalleCliente('${esc(c.id)}')" title="Ver información completa">
              ${esc(c.comercio)}
              ${esRolAdmin && esClienteVip(c) ? '<span class="pill" style="background:#fef3c7;color:#92400e;border-color:#fde68a;margin-left:6px;"><span class="dot"></span>VIP</span>' : ""}
            </td>
            <td>${esc(c.telefono)}</td>
            <td>${esc(c.correo)}</td>
            <td>${esc(c.departamento)} — ${esc(c.municipio)}</td>
            <td>${esc(c.numeroAsesor || "—")} 🔒</td>
            <td>${esc(c.nombreAsesor || "—")}</td>
            <td>${esc(c.telefonoAsesor || "—")}</td>
            <td>${c.metrogaleria ? '<span style="color:#94a3b8;">No aplica</span>' : `$${(c.tarifaEnvio ?? TARIFA_ENVIO_DEFAULT).toFixed(2)} 🔒`}</td>
            <td><span class="badge-role">Cliente</span></td>
            <td style="text-align:right;">
              <details class="row-menu">
                <summary class="btn-link" style="cursor:pointer;list-style:none;font-size:18px;font-weight:800;">⋮</summary>
                <div class="row-menu-panel">
                  <div style="padding:8px 10px;font-size:12px;color:#94a3b8;border-bottom:1px solid var(--border);">
                    Comisión: ${c.metrogaleria ? "No aplica" : `${c.comision ?? COMISION_DEFAULT}%`} · ${tipoEspecialTexto}
                  </div>
                  ${state.role === "Super Administrativo" ? `
                    <button class="btn-link" onclick="cambiarNumeroAsesorCliente('${c.id}')">🔓 N° asesor</button>
                    ${(c.metrogaleria || c.lockers) ? "" : `
                    <button class="btn-link" onclick="cambiarTarifaCliente('${c.id}')">🔓 Tarifa</button>
                    <button class="btn-link" onclick="cambiarComisionCliente('${c.id}')">🔓 Comisión</button>
                    `}
                    <button class="btn-link" onclick="regenerarPasswordCliente('${c.id}')">📧 Restablecer contraseña</button>
                    <div style="display:flex;align-items:center;gap:8px;margin:6px 10px;">
                      <label class="vip-switch" title="${c.vipManual ? 'Quitar VIP manual' : 'Marcar VIP manualmente'}">
                        <input type="checkbox" ${c.vipManual ? "checked" : ""} onchange="toggleVipManualCliente('${c.id}')" />
                        <span class="slider"></span>
                      </label>
                      <span style="font-size:12px;color:var(--gray);">VIP manual</span>
                    </div>
                    ${esClienteVipPorVolumen(c.comercio) && !c.vipManual ? `<div style="font-size:10.5px;color:#94a3b8;padding:0 10px 6px;">Ya es VIP por volumen (+${VIP_VOLUMEN_MINIMO} guías/${VIP_VENTANA_MESES}m)</div>` : ""}
                  ` : ""}
                  ${esRolAdmin ? `
                    <button class="btn-link" onclick="abrirEdicionCliente('${c.id}')">✏️ Editar</button>
                  ` : ""}
                </div>
              </details>
            </td>
          </tr>
        `;}).join("")}
      </tbody>
    </table>
    ${state.clienteDetalleId ? renderDetalleClienteCard() : ""}
