/* ---- Ubicación real del dispositivo (GPS del navegador) ----
   Ya no se genera ninguna coordenada simulada/aleatoria: toda ubicación
   que se registra en el sistema proviene de navigator.geolocation. Se
   guarda en caché la última posición real obtenida para poder usarla de
   forma síncrona en los puntos del código que registran movimientos de
   una guía (registrarCambioGuia), sin tener que pedir permiso de nuevo
   en cada paso. */
let ultimaUbicacionReal = null;
let watchIdUbicacionPiloto = null; // id del watchPosition activo mientras hay sesión de Piloto

/* Mientras haya sesión activa de Piloto, cada vez que llega una lectura
   GPS nueva se refleja en su registro dentro de EMPLEADOS. Así
   pilotoMasCercano() siempre compara contra dónde está el piloto AHORA,
   no contra el punto fijo con el que se creó su cuenta. */
function sincronizarUbicacionPilotoEnEmpleados(loc){
  if(!loc || state.role !== "Piloto" || !EMPLEADO_ACTUAL_ID) return;
  const emp = EMPLEADOS.find(e => e.id === EMPLEADO_ACTUAL_ID && e.rol === "Piloto");
  if(emp) emp.ubicacion = { lat: loc.lat, lng: loc.lng };
}

/* Inicia el seguimiento continuo de GPS del piloto (watchPosition, no una
   sola lectura). Se llama al iniciar sesión como Piloto y al restaurar una
   sesión guardada. Si el navegador no tiene permiso de ubicación, el piloto
   simplemente se queda con la última posición conocida (o la de fábrica). */
function iniciarSeguimientoUbicacionPiloto(){
  if(!navigator.geolocation || watchIdUbicacionPiloto !== null) return;
  watchIdUbicacionPiloto = navigator.geolocation.watchPosition(
    pos => {
      ultimaUbicacionReal = { lat: parseFloat(pos.coords.latitude.toFixed(5)), lng: parseFloat(pos.coords.longitude.toFixed(5)), real:true };
      sincronizarUbicacionPilotoEnEmpleados(ultimaUbicacionReal);
    },
    () => { /* permiso denegado o GPS no disponible: no se actualiza, se mantiene el último valor conocido */ },
    { enableHighAccuracy:true, maximumAge:30000, timeout:15000 }
  );
}
function detenerSeguimientoUbicacionPiloto(){
  if(watchIdUbicacionPiloto !== null && navigator.geolocation){
    navigator.geolocation.clearWatch(watchIdUbicacionPiloto);
    watchIdUbicacionPiloto = null;
  }
}

function actualizarUbicacionReal(callback){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos => {
        ultimaUbicacionReal = { lat: parseFloat(pos.coords.latitude.toFixed(5)), lng: parseFloat(pos.coords.longitude.toFixed(5)), real:true };
        sincronizarUbicacionPilotoEnEmpleados(ultimaUbicacionReal);
        if(callback) callback(ultimaUbicacionReal);
      },
      () => { if(callback) callback(null); },
      { timeout: 8000, maximumAge: 60000 }
    );
  } else if(callback){
    callback(null);
  }
}
actualizarUbicacionReal(); // se intenta obtener apenas carga la app, para tener ya la ubicación real disponible

function obtenerUbicacionPiloto(callback){
  if(!navigator.geolocation){
    mostrarNotificacion("Tu dispositivo o navegador no soporta geolocalización. No es posible registrar la ubicación real de la entrega.");
    callback(null);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const loc = { lat: parseFloat(pos.coords.latitude.toFixed(5)), lng: parseFloat(pos.coords.longitude.toFixed(5)), real:true };
      ultimaUbicacionReal = loc;
      sincronizarUbicacionPilotoEnEmpleados(loc);
      callback(loc);
    },
    () => {
      mostrarNotificacion("No se pudo obtener tu ubicación GPS real. Activa el permiso de ubicación en el navegador para poder confirmar la entrega.");
      callback(null);
    },
    { timeout: 8000 }
  );
}

/* ---- Asignación automática de recolecciones por cercanía ----
   Cuando un cliente solicita una recolección, el sistema calcula la
   distancia (fórmula de Haversine) entre la tienda y cada piloto
   disponible, y asigna de inmediato al que esté más cerca. */
function distanciaKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function pilotoMasCercano(puntoTienda){
  if(!puntoTienda) return null;
  const pilotos = EMPLEADOS.filter(e => e.rol === "Piloto" && e.disponible && e.ubicacion);
  if(pilotos.length === 0) return null;
  let mejor = null, mejorDist = Infinity;
  pilotos.forEach(p => {
    const d = distanciaKm(puntoTienda, p.ubicacion);
    if(d < mejorDist){ mejorDist = d; mejor = p; }
  });
  return { piloto: mejor, distanciaKm: parseFloat(mejorDist.toFixed(1)) };
}

/* ---- Asignación automática de AGENCIA por cercanía a la dirección del cliente ----
   Cuando un cliente de dirección libre crea una guía y marca su ubicación en
   el mapa real (o usa su ubicación actual), se calcula con Haversine cuál de
   las agencias/hubs activas de AGENCIAS_XPRESS queda más cerca de ese punto,
   y esa es la que se asigna automáticamente a la guía.
   Las agencias marcadas con excluidaAsignacionAutomatica:true (Santa Ana –
   San Rafael, Santa Ana – El Bosque, MetroGalerías, Ciudad Arce y Acajutla)
   nunca se eligen aquí, aunque sean la más cercana en distancia — siguen
   existiendo en el catálogo para selección manual (por ejemplo, en el
   desplegable de envío ECO), solo quedan fuera de la asignación automática. */
function agenciaMasCercana(punto){
  if(!punto || typeof punto.lat !== "number" || typeof punto.lng !== "number") return null;
  let mejor = null, mejorDist = Infinity;
  AGENCIAS_XPRESS.forEach(a => {
    if(a.excluidaAsignacionAutomatica) return;
    const d = distanciaKm(punto, a);
    if(d < mejorDist){ mejorDist = d; mejor = a; }
  });
  return mejor ? { agencia: mejor, distanciaKm: parseFloat(mejorDist.toFixed(1)) } : null;
}

/* ---- Detecta si un punto ES una agencia física (no solo "cerca de") ----
   Regla de negocio: si la guía/recolección se originó justo en la
   ubicación de una agencia/hub Xpress (el paquete ya está físicamente ahí,
   por ejemplo un cliente Metro Galerías/Lockers, o alguien que lo dejó en
   el mostrador), NUNCA debe asignarse un piloto — no hay nada que ir a
   recoger. Se usa un radio pequeño (150 m) para cubrir imprecisión de GPS,
   no para "la agencia más cercana en general" (eso es agenciaMasCercana). */
const RADIO_ES_AGENCIA_KM = 0.15;
function ubicacionEsAgencia(punto){
  if(!punto || typeof punto.lat !== "number" || typeof punto.lng !== "number") return false;
  return AGENCIAS_XPRESS.some(a => distanciaKm(punto, a) <= RADIO_ES_AGENCIA_KM);
}

/* ---- Generación del folio de guía (sin contador compartido) ----
   Antes esta sección tenía un contador GLOBAL (CONTADOR_GUIAS_SIGUIENTE)
   que vivía en un documento de Firestore y se recalculaba contra los
   datos reales. Eso corrigió el bug original de duplicados, pero un
   único documento contador tiene un techo real de escrituras por segundo
   en Firestore (~1/seg de forma sostenida) sin importar cuántas guías
   existan en total — con picos altos de creación simultánea desde varias
   agencias o integraciones, ese contador se vuelve el cuello de botella.
   Ahora el folio se genera sin ninguna coordinación compartida: hora
   actual en segundos, en base 36 (completa, sin recortar — así nunca se
   repite entre segundos distintos) más 2 caracteres al azar, para folio
   total de 10 caracteres (ej. "XCTJ81IVP1"). Probado hasta ~50 guías
   creadas en el mismo segundo exacto sin choques; empieza a fallar cerca
   de 100/segundo — si el volumen real algún día se acerca a eso, hay que
   alargar la parte al azar (cambiar el 4 por un número mayor en el
   slice() de abajo). Cada creación de guía es independiente de todas las
   demás — no depende de ningún documento ni contador compartido. */
function siguienteNumeroGuiaBase(prefijo){
  const marcaTiempo = Math.floor(Date.now()/1000).toString(36).toUpperCase();
  const azar = Math.random().toString(36).slice(2, 4).toUpperCase();
  return marcaTiempo + azar;
}

/* ---- Generador de IDs únicos para catálogos con prefijo + número
   (clientes, destinatarios, empleados, solicitudes de afiliación) ----
   Antes se usaba `<ARREGLO>.length + 1`, que tiene el mismo problema que
   tenían las guías: dos personas creando un cliente/destinatario/empleado
   casi al mismo tiempo desde dispositivos distintos pueden calcular el
   mismo número (cada una ve su propia copia local del arreglo, con la
   misma cantidad de elementos) y uno termina sobrescribiendo al otro en
   Firestore. Ahora se calcula contra el número más alto que realmente
   existe en el arreglo (no contra cuántos elementos tiene localmente) y
   además se verifica que no haya choque antes de devolver el ID. */
function siguienteIdUnico(prefijo, arreglo, digitos){
  digitos = digitos || 3;
  let maxNum = 0;
  arreglo.forEach(item => {
    const n = parseInt(String(item.id || "").replace(prefijo, ""), 10);
    if(!isNaN(n) && n > maxNum) maxNum = n;
  });
  let n = maxNum + 1;
  let id = prefijo + String(n).padStart(digitos, "0");
  while(arreglo.some(item => item.id === id)){
    n++;
    id = prefijo + String(n).padStart(digitos, "0");
  }
  return id;
}

/* Completa la agencia asignada de guías que aún no la tengan (por ejemplo,
   las guías de ejemplo/semilla del prototipo, creadas antes de que este
   campo existiera), usando la ubicación marcada de la guía o, si no hay,
   el centro de su departamento — el mismo criterio de respaldo que usa
   enviarGuia al crear una guía nueva. Se llama una vez al arrancar la app. */
function asignarAgenciasFaltantes(){
  GUIAS.forEach(g => {
    if(g.agenciaAsignada) return;
    const centro = g.ubicacionDireccion || centroMunicipio(g.departamento, g.municipio);
    if(!centro) return;
    const resultado = agenciaMasCercana(centro);
    if(resultado){
      g.agenciaAsignada = resultado.agencia.nombre;
      g.agenciaAsignadaDireccion = resultado.agencia.direccion;
      g.agenciaDistanciaKm = resultado.distanciaKm;
    }
  });
}


/* ============ HELPERS ============
   esc() antes solo convertía a texto sin escapar nada — eso causaba, por
   ejemplo, que el JSON del QR de guías (datosQrGuia) rompiera el atributo
   HTML data-qr-texto en la primera comilla doble que encontraba, dejando
   solo "{" como texto codificado en el QR (por eso el escaneo nunca
   encontraba la guía, sin importar qué se escaneara). Ahora sí escapa los
   caracteres especiales de HTML, tanto para texto como para atributos. */
function esc(s){
  if(s===undefined||s===null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function solicitudesPendientes(){
  return SOLICITUDES_RECOLECCION.filter(s => s.estado === "Pendiente").length;
}

function recoleccionesPilotoPendientes(){
  const pendientes = SOLICITUDES_RECOLECCION.filter(s => s.piloto === PILOTO_ACTUAL && s.estado === "Asignada");
  return aplicarFiltroFecha(pendientes, "hoy", null, null, "fecha").length;
}

/* Resuelve el nombre real del perfil que hizo el cambio, para que el
   historial muestre quién fue exactamente (ej. "Carlos Pérez" en vez de
   solo "Administrativo", o el nombre del comercio en vez de "Cliente").
   Si ya se pasó un nombre específico (piloto, tienda, "Sistema", el
   resultado de una importación, etc.) se respeta tal cual, sin tocarlo. */
/* Busca en el historial de una guía quién confirmó la entrega (el piloto que
   la trajo en la mano), aunque la guía nunca haya quedado formalmente
   "Asignada a piloto" en el campo g.piloto. Si no hay evento de entrega en
   el historial, cae de vuelta al campo g.piloto (o "-" si tampoco existe). */
function pilotoQueEntrego(g){
  const eventos = HISTORIAL[g.id] || [];
  const evEntrega = [...eventos].reverse().find(e => (e.accion || "").toLowerCase().startsWith("entrega confirmada"));
  if(evEntrega && evEntrega.usuario) return evEntrega.usuario;
  return g.piloto && g.piloto !== "-" ? g.piloto : "-";
}

function nombrePerfilParaHistorial(usuarioParam){
  const ROLES_GENERICOS = ["Cliente", "Administrativo", "Super Administrativo", "Piloto"];
  if(usuarioParam && !ROLES_GENERICOS.includes(usuarioParam)) return usuarioParam;
  if(state.role === "Cliente"){
    const c = clienteActualObj();
    return c ? c.comercio : (usuarioParam || CLIENTE_ACTUAL || "Cliente");
  }
  if(state.role === "Piloto"){
    return PILOTO_ACTUAL || usuarioParam || "Piloto";
  }
  const emp = empleadoActualObj();
  return emp ? emp.nombre : (usuarioParam || state.role || "Usuario");
}

/* Guarda cada evento del historial en Firestore, en una subcolección propia
   de la guía (guias/{id}/historial), así queda persistido con su fecha,
   hora y el nombre del perfil que hizo el cambio, y se sincroniza en tiempo
   real con cualquier otro dispositivo que tenga abierta esa misma guía. */
function guardarEventoHistorialEnFirestore(guiaId, evento){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  if(!guiaId) return;
  dbFirestore.collection("guias").doc(guiaId).collection("historial").add({
    ...evento,
    creadoEn: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err => {
    console.error("Error guardando evento de historial en Firestore:", err);
  });
}

/* ---- Registro de cambios de guía + notificación al cliente ----
   Toda función que modifique una guía (estado, edición de datos,
   eliminación, restauración, lote, etc.) debe pasar por aquí para que
   quede constancia en el historial Y se genere la notificación. */
function registrarCambioGuia(guia, accion, de, a, usuario){
  if(!guia) return;
  const fechaStr = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  const usuarioResuelto = nombrePerfilParaHistorial(usuario);
  if(!HISTORIAL[guia.id]) HISTORIAL[guia.id] = [];
  /* Evidencia de cada movimiento: además de fecha exacta y usuario, se
     guarda la ubicación GPS de quien hizo el cambio y, si aplica (por
     ejemplo al confirmar la entrega), la fotografía asociada. */
  const esEntregaConEvidencia = (a === "Entregado" && guia.ubicacionEntrega);
  const ubicacionMovimiento = esEntregaConEvidencia ? guia.ubicacionEntrega : ultimaUbicacionReal;
  const fotoMovimiento = esEntregaConEvidencia ? (guia.fotoEntrega || null) : null;
  const evento = { fecha:fechaStr, usuario:usuarioResuelto, accion, de: (de===undefined||de===null||de==="") ? "-" : String(de), a: (a===undefined||a===null||a==="") ? "-" : String(a), ubicacion:ubicacionMovimiento, foto:fotoMovimiento };
  HISTORIAL[guia.id].push(evento);
  guardarEventoHistorialEnFirestore(guia.id, evento);
  crearNotificacionCliente(guia, accion, de, a, usuarioResuelto, fechaStr);
  guardarGuiaEnFirestore(guia);
  return fechaStr;
}

function crearNotificacionCliente(guia, accion, de, a, usuario, fechaStr){
  const cuenta = guia.cuenta || guia.cliente;
  if(!cuenta) return;
  const mensaje = (de && a && de !== a && de !== "-" ) ? `${accion}: ${de} → ${a}` : accion;
  const notificacion = {
    id: "N-" + (nextNotifNum++),
    guiaId: guia.id,
    cuenta,
    mensaje,
    fecha: fechaStr || new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" }),
    usuario,
    leida: false,
  };
  NOTIFICACIONES.unshift(notificacion);
  guardarNotificacionEnFirestore(notificacion);
}

function notificacionesClientePendientes(){
  return NOTIFICACIONES.filter(n => n.cuenta === CLIENTE_ACTUAL && !n.leida).length;
}

/* ---- Eliminar / Restaurar guía (papelera) ----
   El cliente puede eliminar sus propias guías y restaurarlas. En los
   roles administrativos, toda guía eliminada queda visible y disponible
   para recuperar desde el apartado "Papelera" — nunca se borra en firme.
   Una guía ya Entregada o Finalizada no se puede eliminar, para no perder
   el rastro de una entrega que ya se completó. */
const ESTADOS_NO_ELIMINABLES = ["Entregado","Finalizado"];
function guiaEsEliminable(g){ return !ESTADOS_NO_ELIMINABLES.includes(g.estado); }

function eliminarGuia(id){
  const g = buscarGuiaLocal(id);
  if(!g) return;
  if(!guiaEsEliminable(g)){
    mostrarNotificacion(`La guía ${id} ya está ${g.estado} y no se puede eliminar.`);
    return;
  }
  if(!confirm(`¿Eliminar la guía ${id}? Podrás restaurarla luego desde la papelera.`)) return;
  const estadoAnterior = g.estado;
  g.eliminada = true;
  g.fechaEliminacion = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  g.eliminadaPor = state.role;
  registrarCambioGuia(g, "Guía eliminada", estadoAnterior, "Eliminada", state.role);
  PAPELERA_ADMIN = null; // se volverá a pedir a Firestore la próxima vez que se entre a la papelera
  if(state.guiasFirestorePagina){
    state.guiasFirestorePagina = state.guiasFirestorePagina.filter(x => x.id !== id);
  }
  if(state.guiasExtraCache){
    state.guiasExtraCache = state.guiasExtraCache.filter(x => x.id !== id);
  }
  render();
}

/* g puede venir de GUIAS (activas), guiasExtraCache, página paginada o
   PAPELERA_ADMIN — se busca en todas las fuentes locales. */
function restaurarGuia(id){
  const g = buscarGuiaLocal(id);
  if(!g) return;
  g.eliminada = false;
  g.fechaEliminacion = null;
  g.eliminadaPor = null;
  registrarCambioGuia(g, "Guía restaurada desde papelera", "Eliminada", g.estado, state.role);
  PAPELERA_ADMIN = null; // se volverá a pedir a Firestore la próxima vez que se entre a la papelera
  render();
}

/* ---- Eliminar en lote (barra de selección de la tabla de Guías) ---- */
function eliminarGuiasSeleccionadas(){
  const ids = state.guiasSeleccionadas;
  if(ids.length === 0){ mostrarNotificacion("Selecciona al menos una guía para eliminar."); return; }
  const seleccionadas = ids.map(id => buscarGuiaLocal(id)).filter(Boolean);
  const eliminables = seleccionadas.filter(guiaEsEliminable);
  const bloqueadas = seleccionadas.filter(g => !guiaEsEliminable(g));
  if(eliminables.length === 0){
    mostrarNotificacion("Las guías seleccionadas ya están Entregadas/Finalizadas, por lo que no se pueden eliminar.");
    return;
  }
  if(!confirm(`¿Eliminar ${eliminables.length} guía(s) seleccionada(s)? Podrás restaurarlas luego desde la papelera.`)) return;
  const fecha = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  eliminables.forEach(g => {
    if(g.eliminada) return;
    const estadoAnterior = g.estado;
    g.eliminada = true;
    g.fechaEliminacion = fecha;
    g.eliminadaPor = state.role;
    registrarCambioGuia(g, "Guía eliminada", estadoAnterior, "Eliminada", state.role);
  });
  if(bloqueadas.length > 0){
    mostrarNotificacion(`${bloqueadas.length} guía(s) seleccionada(s) ya están Entregadas/Finalizadas y no se eliminaron.`);
  }
  PAPELERA_ADMIN = null; // se volverá a pedir a Firestore la próxima vez que se entre a la papelera
  if(state.guiasFirestorePagina){
    const idsEliminados = eliminables.map(g => g.id);
    state.guiasFirestorePagina = state.guiasFirestorePagina.filter(x => !idsEliminados.includes(x.id));
  }
  state.guiasSeleccionadas = [];
  render();
}

/* ---- Filtro de fechas para guías (histórico / hoy / rango) ---- */
function parseFechaGuia(str){
  if(!str || str === "-") return null;
  const m = String(str).match(/^(\d{2})\/(\d{2})\/(\d{2})/);
  if(!m) return null;
  return new Date(2000 + parseInt(m[3],10), parseInt(m[2],10) - 1, parseInt(m[1],10));
}

/* Igual que parseFechaGuia pero conservando hora:minuto, para poder calcular
   cuánto tiempo pasó entre un evento del historial y el siguiente. */
function parseFechaHoraGuia(str){
  if(!str || str === "-") return null;
  const m = String(str).match(/^(\d{2})\/(\d{2})\/(\d{2})(?:\s+(\d{2}):(\d{2}))?/);
  if(!m) return null;
  return new Date(2000 + parseInt(m[3],10), parseInt(m[2],10) - 1, parseInt(m[1],10), m[4]?parseInt(m[4],10):0, m[5]?parseInt(m[5],10):0);
}

/* Convierte una diferencia en milisegundos a un texto corto y legible,
   usado para mostrar el tiempo transcurrido entre estados de una guía. */
function formatDuracion(ms){
  if(ms === null || ms === undefined || ms < 0) return null;
  const min = Math.round(ms / 60000);
  if(min < 1) return "menos de 1 min";
  if(min < 60) return min + " min";
  const horas = Math.floor(min / 60);
  const minRestante = min % 60;
  if(horas < 24) return horas + "h" + (minRestante ? " " + minRestante + "min" : "");
  const dias = Math.floor(horas / 24);
  const horaRestante = horas % 24;
  return dias + "d" + (horaRestante ? " " + horaRestante + "h" : "");
}

/* ---- VIP automático por volumen ----
   Un cliente se marca VIP automáticamente cuando supera las 1000 guías
   creadas en una ventana de los últimos 2 meses (contados desde la fecha
   de referencia del prototipo). Si no llega a ese volumen, no se le agrega
   nada por este medio; sigue siendo VIP solo si el Super Administrativo lo
   forzó manualmente con el switch. */
const VIP_VOLUMEN_MINIMO = 1000;
const VIP_VENTANA_MESES = 2;

function fechaCreacionGuia(g){
  /* g.fechaCreacion se guarda como Date de JavaScript al crear la guía,
     pero una vez que esa guía viaja por Firestore (se guarda y se vuelve a
     sincronizar mediante onSnapshot → doc.data()), Firestore lo devuelve
     como un objeto Timestamp propio (con método toDate()), NO como un
     Date normal. Antes esto causaba "fechaCreacion.toLocaleDateString is
     not a function" en cualquier guía que ya hubiera pasado por ese
     ciclo — es decir, cualquier guía que no fuera recién creada en esa
     misma sesión. Aquí se detecta ese caso y se convierte. */
  const f = g.fechaCreacion;
  if(f && typeof f.toDate === "function") return f.toDate();
  return f || parseFechaGuia(g.fecha);
}

function volumenGuiasUltimosMeses(cuenta, meses){
  const limite = new Date(FECHA_REF_HOY.getTime());
  limite.setMonth(limite.getMonth() - meses);
  return GUIAS.filter(g => !g.eliminada && (g.cuenta === cuenta || g.cliente === cuenta)).filter(g => {
    const f = fechaCreacionGuia(g);
    return f && f >= limite && f <= FECHA_REF_HOY;
  }).length;
}

function esClienteVipPorVolumen(cuenta){
  return volumenGuiasUltimosMeses(cuenta, VIP_VENTANA_MESES) > VIP_VOLUMEN_MINIMO;
}

/* Estado VIP final que debe usarse en toda la app: manual (switch) O por volumen. */
function esClienteVip(c){
  if(!c) return false;
  return !!c.vipManual || esClienteVipPorVolumen(c.comercio);
}

function aplicarFiltroFecha(lista, modo, desde, hasta, campoFecha){
  campoFecha = campoFecha || "fecha";
  if(modo === "hoy"){
    /* Se compara contra FECHA_REF_HOY, que ahora es la fecha real del
       dispositivo (ver definición arriba), así que "hoy" siempre coincide
       con el día real y las guías/recolecciones asignadas "para hoy" (Mis
       Rutas, Mis Recolecciones, etc.) aparecen correctamente sin importar
       qué día sea. */
    const hoy = new Date(FECHA_REF_HOY.getTime()); hoy.setHours(0,0,0,0);
    return lista.filter(g => {
      const f = parseFechaGuia(g[campoFecha]);
      return f && f.getTime() === hoy.getTime();
    });
  }
  if(modo === "rango"){
    const d = desde ? new Date(desde + "T00:00:00") : null;
    const h = hasta ? new Date(hasta + "T23:59:59") : null;
    return lista.filter(g => {
      const f = parseFechaGuia(g[campoFecha]);
      if(!f) return false;
      if(d && f < d) return false;
      if(h && f > h) return false;
      return true;
    });
  }
  return lista; // "todas" / histórico: sin filtro de fecha
}

function pill(estado){
  const c = ESTADO_COLORS[estado] || { bg:"#f1f5f9", color:"#475569", border:"#e2e8f0" };
  return `<span class="pill" style="background:${c.bg};color:${c.color};border-color:${c.border};"><span class="dot"></span>${esc(estado)}</span>`;
}

function filtrarTexto(v){
  // No se permiten caracteres especiales, símbolos ni caracteres tipográficos.
  return String(v).replace(/[^a-zA-Z0-9À-ÿ\u00f1\u00d1\s]/g, "");
}
function onFiltrarInput(el){
  const pos = el.selectionStart;
  const limpio = filtrarTexto(el.value);
  if(limpio !== el.value){
    el.value = limpio;
  }
}

/* Avisa en vivo, mientras el usuario escribe, si ya existe un cliente/comercio
   con ese mismo nombre — sin esperar a que intente guardar el formulario. */
function onComercioNombreInput(el){
  const aviso = document.getElementById("c_comercio_aviso");
  if(!aviso) return;
  const nombre = el.value.trim().toLowerCase();
  const existe = nombre.length > 0 && CLIENTES.some(c => c.comercio.trim().toLowerCase() === nombre);
  aviso.style.display = existe ? "block" : "none";
}

function val(id){
  const el = document.getElementById(id);
  if(!el) return "";
  return typeof el.value === "string" ? el.value.trim() : el.value;
}

function numeroEstado(estado){
  const idx = ESTADOS.indexOf(estado);
  return idx === -1 ? "" : String(idx + 1).padStart(2, "0");
}

/* Texto "01 - Creado" para mostrar en el historial de movimientos; si el
   valor no es uno de los estados del flujo (ej. "Eliminada"), se muestra tal cual. */
function estadoConNumeroTexto(estado){
  const n = numeroEstado(estado);
  return n ? `${n} - ${estado}` : estado;
}

function estadoOptions(list, selected){
  return list.map(e => `<option value="${e}" ${e===selected?'selected':''}>${numeroEstado(e)} - ${e}</option>`).join("");
}

/* ---- QR real y escaneable (ISO/IEC 18004), generado con la librería qrcode.js ----
   Antes esta función dibujaba un patrón de pixeles pseudo-aleatorio que solo
   PARECÍA un QR (no era legible por ningún lector). Ahora se devuelve un
   contenedor con el texto a codificar en data-qr-texto; inicializarQRsPendientes()

let __qrAutoId = 0;
function qrCodeSvg(code, size, etiqueta){
  /* Tamaño mínimo elevado (antes 92px) porque el QR codifica un JSON largo
     (todos los datos de la guía): con textos largos la librería usa una
     versión de QR con muchos módulos, y si el render es chico cada módulo
     mide 1-2px, lo que lo vuelve borroso e ilegible para la cámara del
     celular. A mayor tamaño, cada módulo ocupa más píxeles reales y el
     lector enfoca mejor. También se agrega "padding" blanco (zona de
     silencio) alrededor, requerida por el estándar QR para que cualquier
     lector lo detecte bien. */
  size = size || 92;
  size = Math.max(size, 170);
  const id = "qr-" + (++__qrAutoId) + "-" + Math.random().toString(36).slice(2,8);
  const textoVisible = etiqueta !== undefined ? etiqueta : code;
  return `<div>
    <div id="${id}" class="qr-real" data-qr-texto="${esc(String(code))}" data-qr-size="${size}" style="width:${size}px;height:${size}px;background:#fff;padding:10px;box-sizing:content-box;image-rendering:pixelated;"></div>
    <div style="font-size:8px;color:#5a6b87;font-family:monospace;margin-top:2px;">${esc(textoVisible)}</div>
  </div>`;
}

/* El QR solo necesita traer el número de guía (y el código de barras como
   respaldo) porque al escanearlo (ver extraerCodigoGuiaDeTexto /
   procesarCodigoEscaneado) el sistema busca la guía completa en la base de
   datos ya cargada — el resto de los campos (destinatario, dirección,
   teléfonos, observación, etc.) nunca se leen del QR. Antes se metía toda
   esa información dentro del JSON del QR sin necesidad, y en guías con
   direcciones u observaciones largas eso hacía que el texto no cupiera en
   el QR ("code length overflow"), dejando el QR en blanco. Con un payload
   mínimo como este, el QR nunca vuelve a desbordar por longitud. */
function datosQrGuia(g){
  return JSON.stringify({
    guia: g.id || "-",
    codigo: g.codigoBarra || "-"
  });
}

/* Convierte en QR real cada contenedor pendiente (data-qr-texto) que aún no
   se haya generado. Se llama al final de render() y, dentro de ventanas de
   impresión/documentos descargados, en el evento load de esos documentos —
   en ambos casos porque los <script> insertados vía innerHTML no se ejecutan
   solos. Es seguro llamarla varias veces: cada QR ya generado se salta. */
/* La librería qrcodejs calcula mal la capacidad (cantidad de "módulos"
   necesarios) cuando el texto tiene tildes o ñ, porque las cuenta mal como
   UTF-8. Esto hace que lance el error de capacidad aunque el texto no sea
   tan largo, con o sin internet. Como el QR solo se usa para que un lector
   recupere los datos (no hace falta que se vea "bonito" con tildes), lo
   más simple y confiable es quitarle los acentos/ñ al texto antes de
   codificarlo. */
function quitarTildesQR(texto){
  return String(texto)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/ñ/g, "n").replace(/Ñ/g, "N");
}

  pendientes.forEach(function(el){
    el.dataset.qrHecho = "1";
    const texto = quitarTildesQR(el.getAttribute("data-qr-texto"));
    const tam = parseInt(el.getAttribute("data-qr-size"), 10) || 92;
    /* correctLevel L (antes M): al bajar la redundancia de corrección de
       errores, la librería necesita menos módulos para el mismo texto largo
       (JSON de la guía), así que cada módulo queda más grande y nítido. */
    try{
      new QRCode(el, { text: texto, width: tam, height: tam, correctLevel: QRCode.CorrectLevel.L });
    }catch(err){
      /* Si el JSON de la guía es demasiado largo (por ejemplo una dirección
         u observación muy extensas), la librería puede lanzar un error de
         capacidad y el contenedor queda completamente en blanco, sin avisar
         nada. Antes esto pasaba silenciosamente. Ahora, si falla, probamos
         con una versión recortada del texto para que siempre quede un QR
         visible y escaneable, y si aun así falla mostramos un aviso en vez
         de dejarlo en blanco. */
      console.error("QR: falló con el texto completo, reintentando recortado.", err, texto && texto.length);
      el.innerHTML = "";
      try{
        new QRCode(el, { text: String(texto).slice(0, 300), width: tam, height: tam, correctLevel: QRCode.CorrectLevel.L });
      }catch(err2){
        console.error("QR: también falló con el texto recortado.", err2, "typeof QRCode:", typeof QRCode, "tam:", tam);
        el.style.display = "flex";
        el.style.alignItems = "center";
        el.style.justifyContent = "center";
        el.style.textAlign = "center";
        el.style.flexDirection = "column";
        el.style.gap = "4px";
        el.style.padding = "6px";
        el.innerHTML = '<span style="font-size:10px;color:#b00020;">No se pudo generar el QR</span>'
          + '<span style="font-size:8px;color:#b00020;word-break:break-word;">' + esc((err2 && err2.message) || String(err2)) + '</span>';
      }
    }
  });
}

/* Bloque reutilizable que se inserta en cada documento aparte (ventanas de
   impresión, manifiestos descargados) para que también generen QR reales,
   ya que son documentos HTML independientes del documento principal. */
const QR_ENGINE_HTML = `
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
  <script>
    function quitarTildesQR(texto){
      return String(texto)
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/ñ/g, "n").replace(/Ñ/g, "N");
    }
    function inicializarQRsPendientes(){
      var pendientes = document.querySelectorAll("[data-qr-texto]:not([data-qr-hecho])");
      if(!pendientes.length) return;
      if(typeof QRCode === "undefined"){
        if(!window.__qrReintentoProgramado){
          window.__qrReintentoProgramado = true;
          setTimeout(function(){
            window.__qrReintentoProgramado = false;
            inicializarQRsPendientes();
          }, 400);
        }
        return;
      }
      pendientes.forEach(function(el){
        el.dataset.qrHecho = "1";
        var texto = quitarTildesQR(el.getAttribute("data-qr-texto"));
        var tam = parseInt(el.getAttribute("data-qr-size"), 10) || 92;
        try{
          new QRCode(el, { text: texto, width: tam, height: tam, correctLevel: QRCode.CorrectLevel.L });
        }catch(err){
          el.innerHTML = "";
          try{
            new QRCode(el, { text: String(texto).slice(0, 300), width: tam, height: tam, correctLevel: QRCode.CorrectLevel.L });
          }catch(err2){
            var msg2 = String((err2 && err2.message) || err2).replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; });
            el.style.display = "flex";
            el.style.alignItems = "center";
            el.style.justifyContent = "center";
            el.style.textAlign = "center";
            el.style.flexDirection = "column";
            el.style.gap = "4px";
            el.style.padding = "6px";
            el.innerHTML = '<span style="font-size:10px;color:#b00020;">No se pudo generar el QR</span>'
              + '<span style="font-size:8px;color:#b00020;word-break:break-word;">' + msg2 + '</span>';
          }
        }
      });
    }
    window.addEventListener("load", inicializarQRsPendientes);
  <\/script>
`;

/* ---- Plantilla estándar de información de guía (se usa tanto en pantalla como al imprimir) ----
   Formato alineado a la guía en papel: folio, tienda (+ tipo de envío si es Metro
   Galerías), destinatario con teléfonos, destino en grande, datos del paquete
   (bultos/peso/precio/tipo de pago), ¿frágil?, observación, QR y fecha de entrega.
   Todos los campos son opcionales en el render: una guía de devolución consolidada,
   por ejemplo, no trae teléfonos ni bultos/peso/precio, y esas líneas simplemente
   se omiten en vez de mostrarse vacías.

   El segundo parámetro (modoImpresion) activa la versión a color, pensada para la
   hoja impresa: encabezado navy/naranja de marca y un recuadro de destino resaltado.
   En esa versión NO se incluye la nota de firma del cliente (la firma se captura
   digitalmente hasta la entrega y no debe aparecer en el papel impreso). */
function plantillaGuiaInfoHtml(g, modoImpresion, bultoActual, totalBultos){
  /* Etiqueta "1/2, 2/2..." cuando la guía tiene 2 o más bultos. Es una sola
     guía con un solo número: bultoActual/totalBultos vienen del loop de
     impresión (una hoja por cada bulto de la misma guía, ver imprimirGuia),
     y si no se llama desde ese loop, se usa g.bultos como total con el
     bulto 1 por defecto. */
  /* Logo propio de la tienda/cliente (si lo subió desde "Mi Perfil" o el
     panel admin lo cargó por él). Se busca por nombre de comercio, pero
     g.tienda puede venir en dos formatos según cómo se creó la guía:
     el nombre exacto del comercio ("Tienda Central") o con el número de
     asesor pegado, vía tiendaLabel() ("Yiyi store - 102"). Se intentan
     ambas coincidencias para no perder el logo en ningún caso. */
  const clienteTiendaGuia = CLIENTES.find(cl =>
    cl.comercio === g.tienda || tiendaLabel(cl) === g.tienda
  );
  const logoTiendaGuia = clienteTiendaGuia && clienteTiendaGuia.logo ? clienteTiendaGuia.logo : null;

  const totalBultosCalc = totalBultos || (parseInt(g.bultos, 10) > 0 ? parseInt(g.bultos, 10) : 1);
  const bultoActualCalc = bultoActual || 1;
  const bultoBadgeTxt = totalBultosCalc > 1 ? `${bultoActualCalc}/${totalBultosCalc}` : "";
  /* Texto para la línea "Bultos:" de "Datos del paquete": misma posición y
     total que ya se muestra en la insignia de arriba, así ambos datos
     siempre coinciden ("Bulto 1/3" arriba y "Bultos: 1 de 3" abajo). */
  const bultosTxt = totalBultosCalc > 1
    ? `${bultoActualCalc} de ${totalBultosCalc}`
    : (g.bultos != null && g.bultos !== "" ? String(g.bultos) : null);
  /* Fecha en que se creó la guía (no confundir con g.fecha, que se
     sobrescribe con la fecha del último movimiento/estado). Se usa
     fechaCreacionGuia(), que toma g.fechaCreacion si existe y, si no
     (guías antiguas que no traían ese campo), cae de vuelta a g.fecha. */
  const fechaCreacionDate = fechaCreacionGuia(g);
  const fechaCreacionTxt = fechaCreacionDate
    ? fechaCreacionDate.toLocaleDateString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit" })
    : null;
  const destinatario = g.nombre || g.cliente || "-";
  const direccion = g.direccion || "-";
  const esFragil = g.fragil === "Sí";
  const fragilTxt = esFragil ? "⚠ Sí, frágil" : "No";
  const municipio = g.municipio && g.municipio !== "-" ? g.municipio : "-";
  const departamento = g.departamento && g.departamento !== "-" ? g.departamento : "-";
  const fechaEntrega = g.fechaEntrega || (g.fecha && g.fecha !== "-" ? g.fecha : null) || (g.fechaEntregaEstimada ? "Estimada: " + g.fechaEntregaEstimada : "Pendiente");

  /* El teléfono del destinatario ya NO se muestra en la guía visible (ni en
     pantalla ni en la hoja impresa), por seguridad/privacidad. Sigue viajando
     dentro del QR (ver datosQrGuia) para que el piloto lo vea al escanearlo. */

  const paqueteFilas = [];
  if(bultosTxt) paqueteFilas.push(`<b>Bultos:</b> ${esc(bultosTxt)}`);
  if(g.peso) paqueteFilas.push(`<b>Peso:</b> ${esc(String(g.peso))} lb`);
  /* El precio ya NO se muestra en la guía visible (ni en pantalla ni en la
     hoja impresa), por seguridad/privacidad. Sigue viajando dentro del QR
     (ver datosQrGuia) para que el piloto lo vea al escanear. */

  const tipoPagoTxt = g.tipoPago ? `${g.tipoPago === "Efectivo" ? "💵" : "🏦"} ${esc(g.tipoPago)}` : "";

  if(!modoImpresion){
    // ---- Versión simple para pantalla (vista de guía / etiqueta, tarjetas, etc.) ----

    const campos = [];
    campos.push(`<div class="detail-item"><label>Tienda</label><div>${esc(g.tienda || "-")}</div></div>`);

    campos.push(`<div class="detail-item"><label>Destinatario</label><div>${esc(destinatario)}</div></div>`);
    campos.push(`<div class="detail-item full" style="grid-column:1/-1;"><label>Dirección</label><div>${esc(direccion)}</div></div>`);
    campos.push(`<div class="detail-item"><label>Municipio</label><div>${esc(municipio)}</div></div>`);

    if(bultosTxt) campos.push(`<div class="detail-item"><label>Bultos</label><div>${esc(bultosTxt)}</div></div>`);
    if(g.peso) campos.push(`<div class="detail-item"><label>Peso</label><div>${esc(String(g.peso))} lb</div></div>`);
    campos.push(`<div class="detail-item"><label>¿Frágil?</label><div>${fragilTxt}</div></div>`);

    if(g.observacion) campos.push(`<div class="detail-item full" style="grid-column:1/-1;"><label>Observación</label><div>${esc(g.observacion)}</div></div>`);
    return `

            ${fechaCreacionTxt ? `<div style="font-size:10.5px;color:#94a3b8;margin-top:1px;">Creada: ${esc(fechaCreacionTxt)}</div>` : ""}
          </div>
        </div>
        ${g.urgente ? `<div style="margin-top:10px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:.02em;">⚡ XPRESS 24H — ENTREGA DE SUMA IMPORTANCIA</div>` : ""}
        ${logoTiendaGuia ? `<div style="display:flex;align-items:center;gap:8px;margin-top:10px;"><img src="${logoTiendaGuia}" alt="Logo ${esc(g.tienda || "")}" style="height:20px;width:20px;object-fit:contain;border-radius:4px;background:#fff;border:1px solid #e5e9f2;" /></div>` : ""}
        <div class="detail-grid" style="margin-top:${logoTiendaGuia ? "4" : "14"}px;">${campos.join("")}</div>
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);text-align:center;">${qrCodeSvg(datosQrGuia(g), 110, g.codigoBarra)}</div>
        <div style="margin-top:10px;font-size:10.5px;color:#94a3b8;font-style:italic;line-height:1.4;text-align:center;">La firma no se solicita aquí: el piloto la captura al confirmar la entrega del paquete.</div>
      </div>
    `;
  }

  // ---- Versión a color para la hoja de impresión ----
  /* Antes "Bultos/Peso", "¿Frágil?", "Tipo de pago" y "Agencia asignada" eran
     4 bloques de texto independientes, cada uno en su propia línea — se
     sentía muy cargado de letras en el papel. Ahora se agrupan en una sola
     fila de pastillas cortas (chips), mucho más rápida de leer de un vistazo
     y que ocupa bastante menos espacio vertical. */
  const metaChipsColor = [];
  const chipColor = (texto, colores, grande) => `<span style="display:inline-flex;align-items:center;gap:4px;${colores}border-radius:20px;${grande ? "padding:6px 15px;font-size:14px;font-weight:800;" : "padding:4px 11px;font-size:11.5px;font-weight:700;"}white-space:nowrap;">${texto}</span>`;
  if(bultosTxt) metaChipsColor.push(chipColor(`📦 Bultos: ${esc(bultosTxt)}`, "background:#f5f7fb;color:#1e2433;border:1px solid #e5e9f2;"));
  if(g.peso) metaChipsColor.push(chipColor(`⚖️ ${esc(String(g.peso))} lb`, "background:#f5f7fb;color:#1e2433;border:1px solid #e5e9f2;"));
  if(tipoPagoTxt) metaChipsColor.push(chipColor(tipoPagoTxt, "background:#f5f7fb;color:#1e2433;border:1px solid #e5e9f2;"));
  metaChipsColor.push(esFragil

    : chipColor("No frágil", "background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;", true));
  if(g.agenciaAsignada) metaChipsColor.push(chipColor(`🏢 ${esc(g.agenciaAsignada)}`, "background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;", true));
  const metaChipsColorHtml = metaChipsColor.length ? `

          <div style="font-size:12.5px;color:#374151;margin-top:2px;">${esc(direccion)}</div>
        </div>

        <div style="margin-top:14px;background:#1a2247;border-radius:8px;padding:12px 14px;">
          <div style="font-size:9.5px;color:#a9b2cc;text-transform:uppercase;letter-spacing:.08em;font-weight:700;">Destino</div>
          <div style="font-size:21px;font-weight:800;color:#ffffff;line-height:1.25;margin-top:2px;">${esc(municipio)}<br/>${esc(departamento)}</div>
        </div>

        ${metaChipsColorHtml}

        <div style="margin-top:16px;display:flex;justify-content:center;border-top:1px dashed #e5e9f2;padding-top:14px;">
          ${qrCodeSvg(datosQrGuia(g), 110, g.codigoBarra)}
        </div>
      </div>
      <div style="background:#f5f7fb;border-top:2px solid #ff6b35;padding:6px 18px;font-size:9.5px;color:#94a3b8;text-align:center;">${g.urgente ? '<b style="color:#b91c1c;">⚡ Entrega de suma importancia — priorizar en ruta</b> · ' : ''}Xpress El Salvador · Documento generado por el sistema</div>
    </div>
  `;

function imprimirGuia(id){
  const g = buscarGuiaLocal(id);
  if(!g){ mostrarNotificacion("No se encontró la guía."); return; }
  if(["Entregado","Finalizado"].includes(g.estado)){
    mostrarNotificacion("Esta guía ya fue Entregada/Finalizada, por lo que la impresión está bloqueada.");
    return;
  }
  const ventana = window.open("", "_blank", "width=480,height=780");
  if(!ventana){ mostrarNotificacion("El navegador bloqueó la ventana de impresión. Habilita las ventanas emergentes para este sitio."); return; }
  /* Deja constancia en el Historial de movimientos de quién imprimió la
     guía y cuándo — antes la impresión no dejaba ningún rastro. */
  registrarCambioGuia(g, "Guía impresa", g.estado, g.estado, state.role || g.creadoPor);
  render();
  /* Si la guía tiene 2 o más bultos, se genera una hoja/etiqueta por cada
     bulto, numerada "1/N, 2/N..." para poder pegar una etiqueta distinta
     en cada paquete físico. Si tiene 1 bulto (o no trae el dato), se
     imprime una sola hoja, igual que antes. */
  const totalBultosImp = parseInt(g.bultos, 10) > 0 ? parseInt(g.bultos, 10) : 1;
  const hojasBultos = Array.from({ length: totalBultosImp }, (_, i) =>
    `<div class="hoja-guia">${plantillaGuiaInfoHtml(g, true, i + 1, totalBultosImp)}</div>`
  ).join("");
  ventana.document.write(documentoImpresionGuiasHtml({
    titulo: `Guía ${g.id}`,
    leyenda: `👁️ Vista previa antes de imprimir${totalBultosImp > 1 ? ` · ${totalBultosImp} bultos` : ""}`,
    hojasHtml: hojasBultos,
  }));

}

/* ---- Impresión de varias guías a la vez (reutilizable): abre la ventana
   con vista previa y una hoja por cada guía (o por cada bulto de esa
   guía, si aplica), con el título/leyenda ajustados al total real de
   hojas. Se usa tanto para "Imprimir seleccionadas" como para imprimir de
   una vez todas las guías generadas por un envío con varios bultos. ---- */
function abrirVentanaImpresionGuias(imprimibles, tituloVentana){
  const ventana = window.open("", "_blank", "width=480,height=780");
  if(!ventana){ mostrarNotificacion("El navegador bloqueó la ventana de impresión. Habilita las ventanas emergentes para este sitio."); return; }
  /* Cada guía se expande a una hoja por bulto (1/N, 2/N...) cuando tiene
     2 o más, igual que en la impresión individual. */
  let totalHojas = 0;
  const hojas = imprimibles.map(g => {
    const totalBultosG = parseInt(g.bultos, 10) > 0 ? parseInt(g.bultos, 10) : 1;
    totalHojas += totalBultosG;
    return Array.from({ length: totalBultosG }, (_, i) =>
      `<div class="hoja-guia">${plantillaGuiaInfoHtml(g, true, i + 1, totalBultosG)}</div>`
    ).join("");
  }).join("");
  ventana.document.write(documentoImpresionGuiasHtml({
    titulo: tituloVentana || `Impresión de ${imprimibles.length} guía(s)`,
    leyenda: `👁️ Vista previa · ${imprimibles.length} guía(s)${totalHojas !== imprimibles.length ? ` · ${totalHojas} etiqueta(s) de bulto` : ""} para imprimir`,
    hojasHtml: hojas,
  }));
  ventana.document.close();
  ventana.focus();
}

    indice,                                    // #
    "",                                        // ORDEN ID
    g.tienda || g.cuenta || "-",               // EMISOR

    g.agenciaAsignada || "-",                  // DESDE

/* ============ LOGIN ÚNICO CON CORREO Y CONTRASEÑA ============
   Prototipo sin servidor: una sola pantalla de acceso para todos los
   roles. Se valida el correo/contraseña contra EMPLEADOS (Super
   Administrativo, Administrativo, Piloto) y contra CLIENTES (Cliente),
   y el rol/cuenta correspondiente se determina automáticamente según
   qué registro coincida — el usuario nunca elige el rol a mano. */
function onLoginCorreoInput(v){ state.loginCorreo = v; }
function onLoginClaveInput(v){ state.loginClave = v; }

/* Alterna type="password"/"text" del campo de contraseña del login
   directamente en el DOM (sin pasar por render()), para no perder el
   foco ni la posición del cursor mientras la persona está escribiendo. */
function toggleMostrarClaveLogin(){
  const input = document.getElementById('loginClaveInput');
  const btn = document.getElementById('toggleClaveLoginBtn');
  if(!input) return;
  const mostrando = input.type === 'text';
  input.type = mostrando ? 'password' : 'text';
  if(btn) btn.textContent = mostrando ? '👁️' : '🙈';
  input.focus();
}

/* Dado el rol + refId que viene del documento usuarios/{uid}, ubica el
   perfil correspondiente ya sincronizado localmente (CLIENTES/EMPLEADOS) y
   deja la app en el estado que selectRole() espera encontrar. Se separó de
   intentarLoginUnico() porque también lo usa la restauración automática de
   sesión (onAuthStateChanged, más abajo). Devuelve true si pudo ubicar el
   perfil, false si no (cuenta de Auth válida pero sin perfil de negocio
   correspondiente — no debería pasar en uso normal). */
function aplicarPerfilPorRol(role, refId){
  if(role === "Cliente"){
    const cliente = CLIENTES.find(c => c.id === refId);
    if(!cliente) return false;
    CLIENTE_ACTUAL = cliente.comercio;
    return true;
  }
  if(role === "Piloto" || role === "Administrativo" || role === "Super Administrativo"){
    const empleado = EMPLEADOS.find(e => e.id === refId && e.rol === role);
    if(!empleado) return false;
    EMPLEADO_ACTUAL_ID = empleado.id;
    if(role === "Piloto") PILOTO_ACTUAL = empleado.nombre;
    return true;
  }
  return false;
}

function intentarLoginUnico(){
  const correoIngresado = (state.loginCorreo || "").trim().toLowerCase();
  const claveIngresada = state.loginClave || "";
  if(!correoIngresado || !claveIngresada){
    state.loginError = "Escribe tu correo y contraseña.";
    render();
    return;
  }
  if(!firebaseAuth){
    state.loginError = "No se pudo conectar con el sistema de autenticación. Revisa tu conexión e intenta de nuevo.";
    render();
    return;
  }
  if(!clientesListos || !empleadosListos){
    state.loginError = "Cargando datos de la base de datos, espera un momento e intenta de nuevo.";
    render();
    return;
  }

  state.loginCargando = true;
  state.loginError = "";
  render();

  firebaseAuth.signInWithEmailAndPassword(correoIngresado, claveIngresada)
    .then(cred => obtenerUsuarioRol(cred.user.uid))
    .then(datosUsuario => {
      const ok = aplicarPerfilPorRol(datosUsuario.role, datosUsuario.refId);
      state.loginCargando = false;
      if(!ok){
        state.loginError = "Tu cuenta no tiene un perfil válido asignado. Contacta a un administrador.";
        firebaseAuth.signOut();
        render();
        return;
      }
      state.loginCorreo = "";
      state.loginClave = "";
      state.loginError = "";
      selectRole(datosUsuario.role);
    })
    .catch(err => {
      state.loginCargando = false;
      console.error("Error de login:", err);
      state.loginError = mensajeErrorAuth(err);
      render();
    });
}

function solicitarRestablecerClave(){
  const correoIngresado = (state.loginCorreo || "").trim().toLowerCase();
  if(!correoIngresado){
    mostrarNotificacion("Escribe tu correo en el campo de arriba primero, y luego presiona este enlace.");
    return;
  }
  if(!firebaseAuth){
    mostrarNotificacion("No se pudo conectar con el sistema de autenticación.");
    return;
  }
  firebaseAuth.sendPasswordResetEmail(correoIngresado)
    .then(() => mostrarNotificacion("Te enviamos un correo a " + correoIngresado + " con instrucciones para restablecer tu contraseña."))
    .catch(err => {
      console.error("Error enviando correo de restablecimiento:", err);
      // Por seguridad, Firebase a veces reporta auth/user-not-found; no conviene
      // revelar si un correo existe o no en el sistema.
      mostrarNotificacion("Si el correo está registrado, te llegarán las instrucciones en unos minutos.");
    });
}

/* ============ RASTREO PÚBLICO DE GUÍA (sin sesión) ============
   Pantalla a la que llega cualquier persona que escanee el QR de una guía

   estado general y el destino en grande: nunca el nombre, teléfono,
   dirección exacta, precio, fotos, firmas ni el propio QR de la guía. Esa
   información completa solo se ve dentro del sistema, con sesión iniciada
   y con permiso sobre esa guía (administrador, piloto asignado a la ruta,
   o el cliente dueño de la guía). */
function abrirRastreoPublico(){

  render();
}

function cerrarRastreoPublico(){

function onRastreoCodigoInput(v){
  state.rastreoCodigo = v;
}

/* Antes buscaba dentro del arreglo GUIAS ya descargado por completo por
   el listener global. Ahora que ese listener global ya no corre para
   quien no ha iniciado sesión (ver el bloque "SINCRONIZACIÓN DE GUÍAS
   CON FIRESTORE"), esta búsqueda pública pide directamente el único
   documento que necesita: primero por id exacto (1 lectura), y si no
   coincide, por código de barra (hasta 1 lectura más) — nunca descarga
   el resto de la colección.
   Nota: la coincidencia por id deja de ser insensible a mayúsculas como
   antes (Firestore compara el id del documento tal cual); se normaliza a
   mayúsculas porque así se generan los IDs (prefijo "XC" + número), pero
   si en algún momento se permiten IDs con formato distinto habría que
   revisar esto. */
async function buscarGuiaPublica(){
  const codigo = (state.rastreoCodigo || "").trim();
  if(!codigo){ mostrarNotificacion("Escribe o escanea el código de la guía."); return; }
  state.rastreoBuscando = true;
  state.rastreoResultado = undefined;
  render();
  let g = null;
  if(dbFirestore){
    try{
      const porId = await dbFirestore.collection("guias").doc(codigo.toUpperCase()).get();
      if(porId.exists && !porId.data().eliminada){
        g = porId.data();
      } else {
        const porBarra = await dbFirestore.collection("guias").where("codigoBarra","==",codigo).limit(1).get();
        if(!porBarra.empty && !porBarra.docs[0].data().eliminada) g = porBarra.docs[0].data();
      }
    }catch(err){
      console.error("Error buscando guía pública en Firestore:", err);
    }
  }
  state.rastreoBuscando = false;
  state.rastreoResultado = g || null;
  /* Se suscribe (en tiempo real) al historial de esa guía para poder
     mostrar la línea de tiempo de estados en la consulta pública. La
     pantalla pública solo lee fecha + estado nuevo de cada evento — nunca
     la acción textual, el usuario que la hizo, la ubicación ni la foto,
     que sí pueden contener información sensible. */
  if(g) sincronizarHistorialGuia(g.id);
  else detenerSincronizacionHistorialActual();
  render();
}

/* Genera y comparte el enlace directo de rastreo público de una guía
   (?rastreo=CODIGO), para que el operador se lo pueda mandar al cliente
   por WhatsApp/SMS sin que la otra persona tenga que escribir el código a
   mano. Usa el share sheet nativo si está disponible; si no, copia el
   enlace al portapapeles; y como último recurso lo muestra en un prompt
   para copiarlo manualmente. */
function compartirEnlaceRastreo(id){
  if(!id) return;
  const url = window.location.origin + window.location.pathname + "?rastreo=" + encodeURIComponent(id);
  const texto = "Rastrea tu guía " + id + " aquí:";
  if(navigator.share){
    navigator.share({ title: "Rastrear guía " + id, text: texto, url }).catch(() => {});
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(() => {
      mostrarNotificacion("Enlace de rastreo copiado:\n" + url);
    }).catch(() => {
      prompt("Copia este enlace de rastreo:", url);
    });
    return;
  }
  prompt("Copia este enlace de rastreo:", url);
}

  return `

          ${(() => {
            /* Línea de tiempo pública: solo transiciones REALES de estado.
               HISTORIAL[r.id] registra muchos tipos de eventos aparte de

               de los estados válidos del flujo de guía. También se
               eliminan repeticiones consecutivas del mismo estado. */
            const eventosCrudos = (HISTORIAL[r.id] || []).filter(ev =>
              ev.a && ev.a !== "-" && ev.de !== ev.a && ESTADOS.includes(ev.a)
            );
            const eventos = [];
            eventosCrudos.forEach(ev => {
              const anterior = eventos[eventos.length - 1];
              if(!anterior || anterior.a !== ev.a) eventos.push(ev);
            });
            if(eventos.length === 0) return "";
            return `
            <div style="margin-top:14px;border-top:1px solid #eef0f5;padding-top:12px;">
              <p class="subtle-note" style="margin:0 0 8px 0;">Progreso de la guía</p>
              ${eventos.map(ev => `
                <div style="display:flex;gap:8px;font-size:12.5px;padding:4px 0;">
                  <span style="color:#94a3b8;min-width:90px;">${esc(ev.fecha || "-")}</span>
                  <span style="font-weight:600;">${esc(ev.a)}</span>
                </div>
              `).join("")}
            </div>`;
          })()}
          <p class="subtle-note" style="margin-top:12px;">Por seguridad, esta consulta pública no muestra destinatario, teléfono, dirección exacta, precio ni el código QR de la guía. Para ver el detalle completo, inicia sesión con una cuenta autorizada.</p>
        </div>
      ` : ""}
      <button class="btn-link" style="margin-top:18px;width:100%;text-align:center;color:#fff;" onclick="cerrarRastreoPublico()">← Volver al inicio de sesión</button>
    </div>
  </div>`;
}

/* ============ SOLICITUD DE AFILIACIÓN (pública, sin sesión) ============
   Formulario accesible desde la pantalla de Login para que un comercio
   nuevo solicite afiliarse. Muestra un resumen de la propuesta comercial
   (servicios, tarifas y condiciones) — sin la parte de firma del cliente
   ni los datos del asesor, ya que aquí se reemplaza por una firma digital
   propia del solicitante. Al enviar, se abre WhatsApp con el número
   configurado en CONFIG_AFILIACION (editable solo por el Super
   Administrativo desde Estructura Financiera) con el resumen de la
   solicitud. La firma digital solo se habilita cuando el solicitante
   responde "Sí" a la aceptación de términos. */
let firmaAfiliacionTemp = null; // dataURL temporal de la firma mientras se llena el formulario

/* dataURLs temporales de las fotos de documentos mientras se llena el formulario.
   DUI (frente/reverso) siempre se piden; NIT (frente/reverso) solo si el
   solicitante indicó que necesita crédito fiscal. */
let fotosAfiliacionTemp = { duiFrente: null, duiReverso: null, nitFrente: null, nitReverso: null };

const AFILIACION_CAMPOS_IDS = ["af_comercio","af_telefono","af_correo","af_direccion","af_contacto_nombre","af_contacto_telefono","af_nit"];

/* Guarda en el estado lo que el usuario ya escribió en el formulario,
   para que no se pierda cuando la pantalla se vuelve a dibujar (por
   ejemplo al tocar "Sí, acepto" o "Sí, crédito fiscal"). */
function guardarCamposAfiliacion(){
  AFILIACION_CAMPOS_IDS.forEach(id => {
    const el = document.getElementById(id);
    if(el) state[id] = el.value;
  });
}

function limpiarCamposAfiliacionState(){
  AFILIACION_CAMPOS_IDS.forEach(id => { state[id] = ""; });
}

function abrirSolicitudAfiliacion(){
  state.afiliacionAbierta = true;
  state.afiliacionCreditoFiscal = "No";
  state.afiliacionAceptaTerminos = "No";
  state.afiliacionEnviada = false;
  limpiarCamposAfiliacionState();
  firmaAfiliacionTemp = null;
  fotosAfiliacionTemp = { duiFrente: null, duiReverso: null, nitFrente: null, nitReverso: null };
  render();
}

function cerrarSolicitudAfiliacion(){
  state.afiliacionAbierta = false;
  state.afiliacionCreditoFiscal = "No";
  state.afiliacionAceptaTerminos = "No";
  state.afiliacionEnviada = false;
  limpiarCamposAfiliacionState();
  firmaAfiliacionTemp = null;
  fotosAfiliacionTemp = { duiFrente: null, duiReverso: null, nitFrente: null, nitReverso: null };
  render();
}

/* Lee la foto elegida (DUI o NIT, frente o reverso) y la guarda en el
   estado temporal para mostrarla como vista previa y enviarla junto con
   la solicitud. campo es una de: duiFrente, duiReverso, nitFrente, nitReverso. */
function leerFotoAfiliacion(campo, input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type || !file.type.startsWith("image/")){
    mostrarNotificacion("El archivo debe ser una imagen (foto o captura).");
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    fotosAfiliacionTemp[campo] = e.target.result;
    render();
  };
  reader.onerror = () => mostrarNotificacion("No se pudo leer la imagen. Intenta de nuevo.");
  reader.readAsDataURL(file);
}

function setAfiliacionCreditoFiscal(value){
  guardarCamposAfiliacion();
  state.afiliacionCreditoFiscal = value;
  render();
}

function setAfiliacionAceptaTerminos(value){
  guardarCamposAfiliacion();
  state.afiliacionAceptaTerminos = value;
  firmaAfiliacionTemp = null;
  render();
}

function initFirmaAfiliacionPad(){
  const canvas = document.getElementById("firmaAfiliacionCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#1e2761";
  let drawing = false;
  let hasStroke = false;

  if(firmaAfiliacionTemp){
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = firmaAfiliacionTemp;
  }

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; hasStroke = true; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){
    if(drawing && hasStroke){
      firmaAfiliacionTemp = canvas.toDataURL("image/png");
    }
    drawing = false;
  }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}

function limpiarFirmaAfiliacion(){
  const canvas = document.getElementById("firmaAfiliacionCanvas");
  if(canvas) canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
  firmaAfiliacionTemp = null;
}

/* ============ GENERADOR DE PDF PROFESIONAL DE LA SOLICITUD ============
   Arma la Solicitud de Afiliación como un documento PDF de varias páginas
   con encabezado/pie de página de marca, los datos del comercio, la
   propuesta comercial completa (servicios, tarifas, seguros, condiciones),
   la declaración de aceptación, y como anexo final las fotos de DUI/NIT
   y la firma digital. Usa únicamente jsPDF (sin plugins adicionales) para
   no depender de más CDNs. */
function generarPdfSolicitudAfiliacion(datos){
  const { comercio, telefono, correo, direccion, contactoNombre, contactoTelefono, necesitaCF, nit, fotos, firma, fecha } = datos;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter", compress: true });

  const PAGE_W = doc.internal.pageSize.getWidth();
  const PAGE_H = doc.internal.pageSize.getHeight();
  const MARGIN = 44;
  const CONTENT_W = PAGE_W - MARGIN * 2;
  const BOTTOM_LIMIT = PAGE_H - 52;
  const NAVY = [30, 39, 97];
  const GRAY_TEXT = [75, 85, 99];
  const GRAY_HEAD = [55, 65, 81];
  const LIGHT_FILL = [243, 244, 246];
  const ZEBRA_FILL = [248, 250, 252];
  const BORDER = [226, 232, 240];
  const MUTED = [148, 163, 184];

  let y = 0;

  function drawHeader(isCover){
    const bandH = isCover ? 96 : 46;
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.rect(0, 0, PAGE_W, bandH, "F");
    try{ doc.addImage(LOGO_XPRESS_SALVADOR, "PNG", MARGIN, isCover ? 20 : 9, isCover ? 150 : 84, isCover ? 40 : 22.4); }catch(e){}
    doc.setTextColor(255, 255, 255);
    if(isCover){
      doc.setFont("helvetica", "bold");
      doc.setFontSize(13);
      doc.text("SOLICITUD DE AFILIACIÓN", PAGE_W - MARGIN, 42, { align: "right" });
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9.5);
      doc.text("Servicio de paquetería y mensajería — El Salvador", PAGE_W - MARGIN, 58, { align: "right" });
      doc.setFontSize(9);
      doc.text("Fecha: " + fecha, PAGE_W - MARGIN, 74, { align: "right" });
    } else {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.text("Xpress El Salvador — Solicitud de Afiliación", PAGE_W - MARGIN, 28, { align: "right" });
    }
    return bandH + (isCover ? 30 : 22);
  }

  function newPage(){
    doc.addPage();
    y = drawHeader(false);
  }

  function ensureSpace(h){
    if(y + h > BOTTOM_LIMIT){ newPage(); }
  }

  function sectionTitle(text){
    ensureSpace(28);
    doc.setFillColor(LIGHT_FILL[0], LIGHT_FILL[1], LIGHT_FILL[2]);
    doc.rect(MARGIN, y - 13, CONTENT_W, 21, "F");
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.rect(MARGIN, y - 13, 3, 21, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11.5);
    doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.text(text, MARGIN + 10, y + 2);
    y += 28;
  }

  function subTitle(text){
    ensureSpace(18);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.setTextColor(GRAY_HEAD[0], GRAY_HEAD[1], GRAY_HEAD[2]);
    doc.text(text, MARGIN, y);
    y += 14;
  }

  function paragraph(text, opts){
    opts = opts || {};
    doc.setFont("helvetica", opts.italic ? "italic" : "normal");
    doc.setFontSize(9.3);
    doc.setTextColor(GRAY_TEXT[0], GRAY_TEXT[1], GRAY_TEXT[2]);
    const lines = doc.splitTextToSize(text, CONTENT_W);
    lines.forEach((line) => {
      ensureSpace(13);
      doc.text(line, MARGIN, y);
      y += 12.5;
    });
    y += 5;
  }

  function bulletList(items){
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9.3);
    doc.setTextColor(GRAY_TEXT[0], GRAY_TEXT[1], GRAY_TEXT[2]);
    items.forEach((it) => {
      const lines = doc.splitTextToSize(it, CONTENT_W - 14);
      ensureSpace(12.5 * lines.length + 2);
      doc.text("•", MARGIN, y);
      doc.text(lines, MARGIN + 12, y);
      y += 12.5 * lines.length;
    });
    y += 6;
  }

  function drawTable(headers, rows, colWidths){
    ensureSpace(24);
    let x = MARGIN;
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.rect(MARGIN, y - 13, CONTENT_W, 21, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8.6);
    doc.setTextColor(255, 255, 255);
    headers.forEach((h, i) => {
      doc.text(h, x + 5, y + 2);
      x += colWidths[i];
    });
    y += 21;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.3);
    rows.forEach((row, ridx) => {
      const cellLines = row.map((cell, i) => doc.splitTextToSize(cell, colWidths[i] - 10));
      const maxLines = Math.max.apply(null, cellLines.map((l) => l.length));
      const rowH = maxLines * 10.5 + 10;
      ensureSpace(rowH);
      if(ridx % 2 === 1){
        doc.setFillColor(ZEBRA_FILL[0], ZEBRA_FILL[1], ZEBRA_FILL[2]);
        doc.rect(MARGIN, y - 9, CONTENT_W, rowH, "F");
      }

      });
      y += rowH;
    });
    y += 10;
  }

  function dataField(label, value){
    ensureSpace(16);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.6);
    doc.setTextColor(GRAY_HEAD[0], GRAY_HEAD[1], GRAY_HEAD[2]);

    doc.setTextColor(20, 20, 20);
    const lines = doc.splitTextToSize(String(value || "-"), CONTENT_W - 140);
    doc.text(lines, MARGIN + 140, y);

  function addImageBlock(titulo, dataUrl, maxW, maxH){
    if(!dataUrl) return;
    ensureSpace(maxH + 30);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.8);
    doc.setTextColor(GRAY_HEAD[0], GRAY_HEAD[1], GRAY_HEAD[2]);

  }

  /* ---------- Página de portada: datos del solicitante ---------- */

  subTitle("Servicios y tarifas");

/* Al enviar la solicitud, se genera el PDF completo (datos + fotos + firma)
   y se intenta compartir directamente como archivo adjunto a WhatsApp usando
   la Web Share API (funciona en celulares Android/iPhone: aparece WhatsApp
   en el menú "Compartir"). Si el navegador no soporta compartir archivos
   (por ejemplo, en computadora), el PDF se descarga automáticamente y se
   abre WhatsApp con un mensaje pidiendo adjuntarlo manualmente, ya que
   WhatsApp Web/App no permite adjuntar archivos automáticamente desde un
   enlace wa.me. */
function enviarSolicitudAfiliacion(){
  const comercio = val("af_comercio");
  const telefono = val("af_telefono");
  const correo = val("af_correo");
  const direccion = val("af_direccion");
  const contactoNombre = val("af_contacto_nombre");
  const contactoTelefono = val("af_contacto_telefono");
  const necesitaCF = state.afiliacionCreditoFiscal === "Sí";
  const nit = necesitaCF ? val("af_nit") : "";

  if(!comercio || !telefono || !correo || !direccion || !contactoNombre || !contactoTelefono){
    mostrarNotificacion("Completa todos los campos obligatorios.");
    return;
  }
  if(necesitaCF && !nit){
    mostrarNotificacion("Ingresa el NIT para facturación con crédito fiscal.");
    return;
  }
  if(!fotosAfiliacionTemp.duiFrente || !fotosAfiliacionTemp.duiReverso){
    mostrarNotificacion("Sube la foto del DUI, lado frente y lado reverso.");
    return;
  }
  if(necesitaCF && (!fotosAfiliacionTemp.nitFrente || !fotosAfiliacionTemp.nitReverso)){
    mostrarNotificacion("Como solicitaste crédito fiscal, sube la foto del NIT, lado frente y lado reverso.");
    return;
  }
  if(state.afiliacionAceptaTerminos !== "Sí"){
    mostrarNotificacion("Debes aceptar los términos y condiciones de la propuesta comercial.");
    return;
  }
  if(!firmaAfiliacionTemp){
    mostrarNotificacion("Firma en el recuadro para aceptar la propuesta comercial.");
    return;
  }

  const fechaSolicitud = new Date().toLocaleString("es-SV");
  const nombreArchivo = "Solicitud_Afiliacion_" + comercio.replace(/[^a-zA-Z0-9]+/g, "_") + ".pdf";
  const numero = (CONFIG_AFILIACION.whatsapp || "").replace(/\D/g, "");
  const numeroFinal = numero.length === 8 ? "503" + numero : numero;
  const mensajeCorto = encodeURIComponent(
    "Nueva solicitud de afiliación — Xpress El Salvador\nComercio: " + comercio + "\n(Solicitud completa adjunta en PDF)"
  );

  try{
    const doc = generarPdfSolicitudAfiliacion({
      comercio, telefono, correo, direccion, contactoNombre, contactoTelefono,
      necesitaCF, nit, fotos: fotosAfiliacionTemp, firma: firmaAfiliacionTemp, fecha: fechaSolicitud
    });
    const blobPdf = doc.output("blob");
    const archivoPdf = new File([blobPdf], nombreArchivo, { type: "application/pdf" });

    if(navigator.canShare && navigator.canShare({ files: [archivoPdf] })){
      // Celular: abre el menú nativo "Compartir" con el PDF ya adjunto;
      // el usuario elige WhatsApp y listo, se envía como archivo.
      navigator.share({
        files: [archivoPdf],
        title: "Solicitud de Afiliación — " + comercio,
        text: "Nueva solicitud de afiliación — Xpress El Salvador\nComercio: " + comercio,
      }).catch(() => {});
    } else {
      // Computadora u otro navegador sin soporte de compartir archivos:
      // se descarga el PDF y se abre WhatsApp para adjuntarlo a mano.
      doc.save(nombreArchivo);
      mostrarNotificacion("Se descargó el PDF de la solicitud (" + nombreArchivo + "). Se abrirá WhatsApp: adjunta ese archivo al chat.");
      window.open("https://wa.me/" + numeroFinal + "?text=" + mensajeCorto, "_blank");
    }
  } catch(e){
    console.error("Error generando el PDF de la solicitud de afiliación:", e);
    mostrarNotificacion("No se pudo generar el PDF, se enviará el resumen por WhatsApp como texto.");
    const lineas = [
      "Nueva solicitud de afiliación — Xpress El Salvador",
      "Comercio: " + comercio,
      "Teléfono: " + telefono,
      "Correo: " + correo,
      "Dirección: " + direccion,
      "Contacto: " + contactoNombre + " (" + contactoTelefono + ")",
      "¿Crédito fiscal?: " + (necesitaCF ? ("Sí — NIT " + nit) : "No"),
      "Documentos adjuntos: DUI (frente y reverso)" + (necesitaCF ? " y NIT (frente y reverso)" : ""),
      "Términos y condiciones: aceptados con firma digital",
    ];
    window.open("https://wa.me/" + numeroFinal + "?text=" + encodeURIComponent(lineas.join("\n")), "_blank");
  }

  SOLICITUDES_AFILIACION.unshift({
    id: siguienteIdUnico("AF-", SOLICITUDES_AFILIACION, 4),
    fecha: fechaSolicitud,
    comercio, telefono, correo, direccion,
    contactoNombre, contactoTelefono,
    creditoFiscal: necesitaCF, nit,
    duiFrente: fotosAfiliacionTemp.duiFrente,
    duiReverso: fotosAfiliacionTemp.duiReverso,
    nitFrente: necesitaCF ? fotosAfiliacionTemp.nitFrente : null,
    nitReverso: necesitaCF ? fotosAfiliacionTemp.nitReverso : null,
    firma: firmaAfiliacionTemp,
    estado: "Pendiente",
    descargada: false,
  });
  guardarSolicitudAfiliacionEnFirestore(SOLICITUDES_AFILIACION[0]);

  state.afiliacionEnviada = true;
  render();
}
