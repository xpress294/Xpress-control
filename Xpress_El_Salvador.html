function onCambioEstadoPiloto(id, nuevoEstado){
  if(!nuevoEstado) return;
  if(nuevoEstado === "Entregado"){
    state.entregaGuiaId = id;
    render();
  } else {
    cambiarEstadoGuia(id, nuevoEstado);
  }
}

function leerFotoEntrega(id, input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    fotoEntregaTemp[id] = e.target.result;
    render();
  };
  reader.readAsDataURL(file);
}

function onCambioPrecioTemp(id, valor){
  cambioPrecioTemp[id] = valor;
}

function leerDocumentoIdentidad(id, input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    documentoIdentidadTemp[id] = e.target.result;
    render();
  };
  reader.readAsDataURL(file);
}

function cancelarEntregaForm(){
  const id = state.entregaGuiaId;
  delete fotoEntregaTemp[id];
  delete firmaEntregaTemp[id];
  delete cambioPrecioTemp[id];
  delete documentoIdentidadTemp[id];
  state.entregaGuiaId = null;
  render();
}

function confirmarEntrega(id){
  const g = GUIAS.find(x => x.id === id);
  if(!fotoEntregaTemp[id]){
    mostrarNotificacion("Debes adjuntar una foto de entrega antes de confirmar.");
    return;
  }
  if(!firmaEntregaTemp[id]){
    mostrarNotificacion("Debes solicitar la firma del cliente antes de confirmar la entrega.");
    return;
  }
  if(!cambioPrecioTemp[id]){
    mostrarNotificacion("Debes responder \"Cambio de precio, Depósitos en general\" (Sí/No) antes de confirmar la entrega.");
    return;
  }
  if(g && paqueteValorCero(g) && !documentoIdentidadTemp[id]){
    mostrarNotificacion("Este paquete viene a valor $0.00: debes fotografiar el documento de identidad de quien recibe antes de confirmar la entrega.");
    return;
  }
  obtenerUbicacionPiloto((loc) => {
    if(!loc) return; // sin GPS real no se puede confirmar la entrega; el aviso ya se mostró
    if(g){
      g.fotoEntrega = fotoEntregaTemp[id];
      g.ubicacionEntrega = loc;
      g.firmaEntrega = firmaEntregaTemp[id];
      g.cambioPrecioDepositos = cambioPrecioTemp[id];
      if(documentoIdentidadTemp[id]) g.documentoIdentidad = documentoIdentidadTemp[id];
      const usuarioEntrega = state.role || g.piloto;
      registrarCambioGuia(g, "Entrega confirmada con foto y firma del cliente", g.estado, g.estado, usuarioEntrega);
      if(cambioPrecioTemp[id] === "Sí"){
        registrarCambioGuia(g, "Cambio de precio / depósito registrado en la entrega", "-", "Sí", usuarioEntrega);
      }
      if(documentoIdentidadTemp[id]){
        registrarCambioGuia(g, "Documento de identidad adjuntado (paquete a valor $0.00)", "-", "Adjuntado", usuarioEntrega);
      }
    }
    delete fotoEntregaTemp[id];
    delete firmaEntregaTemp[id];
    delete cambioPrecioTemp[id];
    delete documentoIdentidadTemp[id];
    state.entregaGuiaId = null;
    agregarGuiaSinIngresoSiAplica(id);
    cambiarEstadoGuia(id, "Entregado");
  });
}

function guardarSolicitudRecoleccion(){
  const vehiculo = val("sr_vehiculo");
  const notas = val("sr_notas");
  const tienda = clienteActualObj();
  if(!tienda){
    mostrarNotificacion("Tu cuenta no tiene datos de tienda registrados.");
    return;
  }
  const hoy = new Date();
  const fechaStr = formatFechaCortaHoy(hoy) + " " + String(hoy.getHours()).padStart(2,"0") + ":" + String(hoy.getMinutes()).padStart(2,"0");
  const id = "SR-" + String(nextSolicitudNum).padStart(3,"0");
  nextSolicitudNum++;

  /* Ubicación de la tienda: se guarda en el cliente la primera vez que
     solicita, para que las próximas solicitudes usen el mismo punto. */
  if(!tienda.ubicacion){ tienda.ubicacion = ultimaUbicacionReal; }
  const creadaEnAgencia = ubicacionEsAgencia(tienda.ubicacion);
  const resultado = creadaEnAgencia ? null : pilotoMasCercano(tienda.ubicacion);

  SOLICITUDES_RECOLECCION.unshift({
    id, cliente:CLIENTE_ACTUAL, tienda:tiendaLabel(tienda), direccion:tienda.direccion || "-", vehiculo, notas, fecha:fechaStr,
    estado: creadaEnAgencia ? "En agencia" : (resultado ? "Asignada" : "Pendiente"),
    piloto: resultado ? resultado.piloto.nombre : null,
    distanciaKm: resultado ? resultado.distanciaKm : null,
  });
  guardarSolicitudRecoleccionEnFirestore(SOLICITUDES_RECOLECCION[0]);
  state.solicitudEnviada = true;
  state.solicitudCreadaEnAgencia = creadaEnAgencia;
  state.solicitudPilotoAsignado = resultado ? resultado.piloto.nombre : null;
  state.solicitudDistanciaAsignada = resultado ? resultado.distanciaKm : null;
  render();
}

/* ============ SOLICITUDES DE RECOLECCIÓN (Super Administrativo / Administrativo) ============
   El piloto se asigna automáticamente por cercanía en cuanto el cliente
   crea la solicitud (ver guardarSolicitudRecoleccion). Por eso esta
   pantalla ya no pide asignar manualmente:
   - Administrativo: solo puede VER qué piloto quedó asignado a cada guía/recolección.
   - Super Administrativo: además puede reasignar manualmente si hace falta corregir algo. */
function solicitudesRecoleccionFiltradas(lista){
  const texto = (state.solicitudFiltroTexto || "").trim().toLowerCase();
  if(!texto) return lista;
  return lista.filter(s => {
    const campos = [s.cliente, s.tienda, s.id, s.piloto];
    return campos.some(v => (v || "").toString().toLowerCase().includes(texto));
  });
}

function asignarPilotoSolicitud(id){
  if(state.role !== "Super Administrativo"){
    mostrarNotificacion("Solo el Super Administrativo puede reasignar manualmente un piloto.");
    return;
  }
  const piloto = val("piloto_" + id);
  const s = SOLICITUDES_RECOLECCION.find(x => x.id === id);
  if(s){
    const pilotoAnterior = s.piloto || "(sin asignar)";
    s.piloto = piloto;
    s.estado = "Asignada";
    s.distanciaKm = null; // reasignación manual: ya no refleja distancia calculada
    guardarSolicitudRecoleccionEnFirestore(s);
    if(s.guiaId){
      const g = GUIAS.find(x => x.id === s.guiaId);
      if(g) registrarCambioGuia(g, "Piloto reasignado manualmente para recolección", pilotoAnterior, piloto, state.role);
    }
  }
  render();
}

function clienteResultadosParaGuiaHtml(valor){
  const q = (valor || "").trim().toLowerCase();
  const resultados = (q ? CLIENTES.filter(c =>
    c.comercio.toLowerCase().includes(q) ||
    (c.correo || "").toLowerCase().includes(q) ||
    (c.numeroAsesor || "").toLowerCase().includes(q)
  ) : CLIENTES.slice()).sort((a, b) => {
    // Más reciente primero: se ordena por fecha de registro descendente
    // y, si coinciden, por ID descendente (los ID más nuevos son mayores).
    const fa = parseFechaGuia(a.fechaRegistro);
    const fb = parseFechaGuia(b.fechaRegistro);
    if(fa && fb && fa.getTime() !== fb.getTime()) return fb.getTime() - fa.getTime();
    if(fa && !fb) return -1;
    if(!fa && fb) return 1;
    return (b.id || "").localeCompare(a.id || "");
  });
  if(resultados.length === 0){
    return '<p style="color:#94a3b8;font-size:13.5px;">No se encontraron clientes con ese criterio.</p>';
  }
  return `
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${resultados.map(c => `
        <div class="stack-card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div>
            <span class="stack-id">${c.id}</span><br/>
            <b>${esc(c.comercio)}</b>
            <div style="font-size:12px;color:var(--gray);">${esc(c.correo || "-")} · N° asesor ${c.numeroAsesor || "—"}${c.metrogaleria ? " · 🏬 Metro Galerías" : (c.lockers ? " · 📦 Lockers" : "")}</div>
          </div>
          <button class="btn btn-navy" onclick="seleccionarClienteParaGuia('${c.id}')">Elegir</button>
        </div>
      `).join("")}
    </div>`;
}

/* ---- Firma del cliente (signature pad) — se solicita al piloto al confirmar la entrega ---- */
function initFirmaEntregaPad(id){
  const canvas = document.getElementById("firmaEntregaCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#1e2761";
  let drawing = false;
  let hasStroke = false;

  // Si ya había una firma capturada para esta guía (por ejemplo, tras adjuntar la foto
  // y volver a renderizar la pantalla), la restauramos para no perder el trazo del cliente.
  if(firmaEntregaTemp[id]){
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = firmaEntregaTemp[id];
  }

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; hasStroke = true; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){
    if(drawing && hasStroke){
      firmaEntregaTemp[id] = canvas.toDataURL("image/png");
    }
    drawing = false;
  }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}

function limpiarFirmaEntrega(id){
  const canvas = document.getElementById("firmaEntregaCanvas");
  if(canvas) canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
  delete firmaEntregaTemp[id];
}

/* ---- Fecha de entrega estimada ----
   Guías normales: entre 1 y 3 días desde la creación.
   Guías Xpress 24/h: dentro de las próximas 24 horas. */
function sumarDiasFecha(fecha, dias){
  const d = new Date(fecha.getTime());
  d.setDate(d.getDate() + dias);
  return d;
}
function formatFechaCorta(d){
  return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getFullYear()).slice(-2);
}
function calcularFechaEntregaEstimada(esUrgente){
  if(esUrgente){
    return { texto: formatFechaCorta(sumarDiasFecha(FECHA_REF_HOY, 1)) + " (en menos de 24 horas)", urgente: true };
  }
  const desde = formatFechaCorta(sumarDiasFecha(FECHA_REF_HOY, 1));
  const hasta = formatFechaCorta(sumarDiasFecha(FECHA_REF_HOY, 3));
  return { texto: desde + " – " + hasta, urgente: false };
}

function enviarGuia(urgente){
  const nombre = val("f_nombre");
  const telPrimario = val("f_telPrimario");
  const bultos = val("f_bultos");
  const peso = val("f_peso");
  const precio = val("f_precio");
  const tienda = tiendaParaCrearGuia();
  if(!tienda){
    mostrarNotificacion("Selecciona un cliente para poder crear la guía.");
    return;
  }
  let tipoEnvio = null;
  if(tienda.metrogaleria){
    tipoEnvio = val("f_tipoEnvio");
    if(!tipoEnvio){
      mostrarNotificacion("Selecciona el tipo de envío (ECO / PLUS / NRM) para esta tienda Metro Galerías.");
      return;
    }
  }

  /* En envíos PLUS de Metro Galerías, la dirección no viene de un solo
     campo: se arma a partir del tipo de punto elegido (Parque, Gasolinera,
     Metrocentro, Alcaldía, Centro Comercial El Encuentro o Rambla) más el complemento
     (nombre propio) que escribió el usuario. */
  let direccion;
  if(tienda.metrogaleria && tipoEnvio === "PLUS"){
    const tipoPunto = val("f_plusTipoPunto");
    const complemento = val("f_plusComplemento");
    if(!tipoPunto || !complemento){
      mostrarNotificacion("Para envío PLUS selecciona el tipo de punto (Parque, Gasolinera, Metrocentro, Alcaldía, Centro Comercial El Encuentro o Rambla) y escribe el complemento del nombre del lugar.");
      return;
    }
    direccion = construirDireccionPuntoPlus(tipoPunto, complemento);
  }else{
    direccion = val("f_direccion");
  }

  if(!nombre || !telPrimario || !direccion || !bultos || !peso || !precio){
    mostrarNotificacion("Por favor completa los campos obligatorios: nombre, teléfono primario, dirección, bultos, peso y precio.");
    return;
  }

  /* El precio del paquete solo puede ser positivo o cero. Si por algún medio
     (pegar texto, autocompletar, etc.) llega un valor negativo, se bloquea
     la creación de la guía en vez de dejarlo continuar. */
  const precioNum = parseFloat(precio);
  if(isNaN(precioNum) || precioNum < 0){
    mostrarNotificacion("El precio del paquete no puede ser negativo. Escribe un valor de 0 o mayor.");
    return;
  }

  const esUrgente = urgente === true;
  const prefijoId = esUrgente ? "XC24" : "XC";
  const fechaEntregaEstimada = calcularFechaEntregaEstimada(esUrgente);

  /* Agencia más cercana asignada automáticamente:
     - Si la tienda es Metro Galerías o Lockers, la dirección YA ES una
       agencia del catálogo (se eligió directamente), así que se asigna esa
       misma, a 0 km.
     - Si es dirección libre, se usa el punto que el cliente marcó en el
       mapa real (o su ubicación GPS). Si por alguna razón no marcó ningún
       punto, se usa como respaldo el centro del departamento seleccionado,
       para que la guía siempre quede con una agencia asignada. */
  let agenciaInfo = null;
  if(tienda.metrogaleria || tienda.lockers){
    const agenciaCatalogo = AGENCIAS_XPRESS.find(a => a.direccion === direccion);
    if(agenciaCatalogo) agenciaInfo = { agencia: agenciaCatalogo, distanciaKm: 0 };
  }else if(state.direccionGuiaLat && state.direccionGuiaLng){
    agenciaInfo = agenciaMasCercana({ lat: state.direccionGuiaLat, lng: state.direccionGuiaLng });
  }else{
    const centro = centroMunicipio(val("f_departamento"), val("f_municipio"));
    if(centro) agenciaInfo = agenciaMasCercana(centro);
  }

  /* ---- Una sola guía, con la cantidad de bultos indicada ----
     Antes, si "Cantidad de bultos" era 2 o más, aquí se generaban varias
     guías independientes (una por bulto), cada una con su propio número de
     guía — lo cual llevaba a que, por ejemplo, un bulto quedara
     "Entregado" y otro no, como si fueran envíos distintos. Ahora se crea
     UNA sola guía con un solo número, y la cantidad de bultos queda
     guardada en g.bultos. Al imprimir, esa cantidad se usa para generar
     una hoja/etiqueta por bulto, numerada "1/N, 2/N..." de forma
     consecutiva (ver imprimirGuia/abrirVentanaImpresionGuias), pero sigue
     siendo una sola guía: un solo estado, un solo precio, un solo
     historial. */
  const totalBultosNum = parseInt(bultos, 10) > 0 ? parseInt(bultos, 10) : 1;

  const departamentoGuia = val("f_departamento");
  const municipioGuia = val("f_municipio");
  const telSecundarioGuia = val("f_telSecundario");
  const observacionGuia = val("f_observacion");
  const fragilGuia = state.fragilTemp;
  const tipoPagoGuia = state.pagoTemp;
  const creador = creadorActual();

  const numeroBase = siguienteNumeroGuiaBase(prefijoId);
  const nuevoId = prefijoId + numeroBase;
  const guia = {
    id: nuevoId,
    cliente: nombre,
    cuenta: tienda.comercio,
    clienteId: tienda.id, // id estable (C-00X) del cliente dueño de la guía; lo usan las Firestore Security Rules para validar propiedad (antes solo existía "cuenta", un nombre visible que no sirve para reglas de seguridad confiables)
    estado: "Creado",
    estadoPago: "Por pagar",
    fecha: "-",
    fechaEntrega: null,
    fechaEntregaEstimada: fechaEntregaEstimada.texto,
    fechaCreacion: new Date(FECHA_REF_HOY.getTime()),
    operador: "-",
    piloto: "-",
    ruta: "-",
    codigoBarra: nuevoId,
    fotoEntrega: null,
    ubicacionEntrega: null,
    firmaEntrega: null,
    tienda: tiendaLabel(tienda),
    tipoEnvio,
    urgente: esUrgente,
    nombre, telPrimario,
    telSecundario: telSecundarioGuia,
    direccion,
    ubicacionDireccion: (state.direccionGuiaLat && state.direccionGuiaLng) ? { lat: state.direccionGuiaLat, lng: state.direccionGuiaLng } : null,
    agenciaAsignada: agenciaInfo ? agenciaInfo.agencia.nombre : null,
    agenciaAsignadaDireccion: agenciaInfo ? agenciaInfo.agencia.direccion : null,
    agenciaDistanciaKm: agenciaInfo ? agenciaInfo.distanciaKm : null,
    departamento: departamentoGuia,
    municipio: municipioGuia,
    bultos: totalBultosNum,
    peso, precio,
    fragil: fragilGuia,
    tipoPago: tipoPagoGuia,
    observacion: observacionGuia,
    eliminada: false,
    fechaEliminacion: null,
    eliminadaPor: null,
    creadoPor: creador.nombre,
    creadoPorTipo: creador.tipo,
  };
  /* Registra el primer movimiento del historial ("Guía creada") con la
     fecha y hora reales en que se generó — antes la guía nacía sin ningún
     evento, por lo que "Fecha de creación" quedaba en "-" y el Historial de
     movimientos aparecía vacío hasta el primer cambio de estado. La misma
     fecha/hora que devuelve el registro se guarda también en g.fecha para
     que las listas y reportes que leen ese campo directamente la muestren. */
  guia.fecha = registrarCambioGuia(guia, "Guía creada", "-", "Creado", guia.creadoPor);
  GUIAS.push(guia);
  guardarGuiaEnFirestore(guia);
  incrementarAgregadoDepartamento(guia.departamento, 1);

  guardarDestinatarioSiNuevo(nombre, telPrimario, direccion, departamentoGuia, municipioGuia, tienda.id);
  state.crearGuiaData = guia;
  state.cambios = [];
  state.editMode = false;
  state.fragilTemp = "No";
  state.pagoTemp = "Efectivo";
  state.tipoEnvioTemp = "ECO";
  state.busquedaAgenciaDireccionGuia = "";
  reiniciarUbicacionDireccionGuia();

  /* Al crear la guía se genera automáticamente UNA solicitud de recolección
     para el envío (ya no depende de que el cliente entre aparte a
     "Solicitar Recolección"), y siempre se asigna buscando al piloto
     disponible más cercano a la tienda. */
  const solicitud = generarRecoleccionAutomatica(tienda, guia, direccion);
  state.crearGuiaPilotoAsignado = solicitud.piloto;
  state.crearGuiaDistanciaAsignada = solicitud.distanciaKm;
  state.crearGuiaCreadaEnAgencia = solicitud.creadaEnAgencia;

  render();
}

/* Genera (o reutiliza la ubicación guardada de) la tienda y busca siempre al
   piloto disponible más cercano mediante pilotoMasCercano (Haversine). Si no
   hay ninguno disponible en ese momento, la solicitud queda "Pendiente" para
   que Super Administrativo la asigne manualmente en cuanto haya uno libre. */
function generarRecoleccionAutomatica(tienda, guia, direccionEntrega){
  if(!tienda.ubicacion){ tienda.ubicacion = ultimaUbicacionReal; }
  const creadaEnAgencia = ubicacionEsAgencia(tienda.ubicacion);
  const resultado = creadaEnAgencia ? null : pilotoMasCercano(tienda.ubicacion);

  const hoy = new Date();
  const fechaStr = formatFechaCortaHoy(hoy) + " " + String(hoy.getHours()).padStart(2,"0") + ":" + String(hoy.getMinutes()).padStart(2,"0");
  const id = "SR-" + String(nextSolicitudNum).padStart(3,"0");
  nextSolicitudNum++;

  SOLICITUDES_RECOLECCION.unshift({
    id, cliente: tienda.comercio, tienda: tiendaLabel(tienda), direccion: tienda.direccion || direccionEntrega || "-",
    vehiculo: "Vehículo", notas: creadaEnAgencia
      ? `Guía ${guia.id} creada directamente en una agencia Xpress: no requiere piloto.`
      : `Recolección generada automáticamente al crear la guía ${guia.id}.`,
    fecha: fechaStr,
    estado: creadaEnAgencia ? "En agencia" : (resultado ? "Asignada" : "Pendiente"),
    piloto: resultado ? resultado.piloto.nombre : null,
    distanciaKm: resultado ? resultado.distanciaKm : null,
    guiaId: guia.id,
    creadaEnAgencia,
  });
  guardarSolicitudRecoleccionEnFirestore(SOLICITUDES_RECOLECCION[0]);

  guia.solicitudRecoleccionId = id;
  return {
    piloto: resultado ? resultado.piloto.nombre : null,
    distanciaKm: resultado ? resultado.distanciaKm : null,
    creadaEnAgencia,
  };
}

/* ---- Resumen + edición con historial de cambios ---- */
const CAMPOS_GUIA = [
  ["nombre","Nombre del cliente","text"],
  ["telPrimario","Teléfono primario","tel"],
  ["telSecundario","Teléfono secundario","tel"],

/* ============ PERSISTENCIA DE SESIÓN (localStorage) ============
   Antes, la sesión vivía solo en memoria (variable "state"), así que al
   cerrar la pestaña o el navegador se perdía y volvía a pedir login.
   Ahora se guarda el rol activo (y la cuenta de cliente, si aplica) en
   localStorage, y se restaura automáticamente la próxima vez que se abra
   la app — hasta que el usuario presione "Cambiar de rol" (logout). */
const SESION_STORAGE_KEY = "xpress_sesion_activa";

function guardarSesionActiva(){
  try{
    if(!state.role){
      localStorage.removeItem(SESION_STORAGE_KEY);
      return;
    }
    localStorage.setItem(SESION_STORAGE_KEY, JSON.stringify({
      role: state.role,
      clienteActual: state.role === "Cliente" ? CLIENTE_ACTUAL : null,
      pilotoActual: state.role === "Piloto" ? PILOTO_ACTUAL : null,
      empleadoActualId: (state.role === "Administrativo" || state.role === "Super Administrativo" || state.role === "Piloto") ? EMPLEADO_ACTUAL_ID : null,
    }));
  }catch(e){ /* si el navegador bloquea localStorage (modo privado, etc.), la sesión simplemente no persiste entre pestañas */ }
}

function borrarSesionActiva(){
  try{ localStorage.removeItem(SESION_STORAGE_KEY); }catch(e){ /* nada que hacer */ }
}

let sesionRestauroIntentado = false;

/* ============ RESTAURACIÓN DE SESIÓN VÍA FIREBASE AUTH ============
   Antes esto vivía completo en localStorage: se guardaba el rol y el
   nombre/id de la cuenta "a mano" (guardarSesionActiva más arriba), y para
   restaurar la sesión bastaba con leer ese JSON sin volver a comprobar
   nada con un servidor — cualquiera podía escribir directamente en
   localStorage (`xpress_sesion_activa`) un rol de Administrativo y
   entrar sin contraseña. Ahora la fuente de verdad es
   firebase.auth().onAuthStateChanged(): Firebase decide si el token de
   sesión guardado (seguro, no la contraseña) sigue siendo válido, y solo
   entonces se busca el rol real en Firestore (usuarios/{uid}) — no en algo
   que el propio navegador podría haber alterado. guardarSesionActiva()/
   SESION_STORAGE_KEY se conservan solo como una versión más ligera para
   no parpadear a la pantalla de login mientras Firebase Auth resuelve
   (unos milisegundos) al recargar la página; el rol real siempre se
   reconfirma contra Firestore antes de dar acceso a cualquier dato. */
function restaurarSesionDesdeAuth(user){
  if(sesionRestauroIntentado) return;
  if(!clientesListos || !empleadosListos) return;
  sesionRestauroIntentado = true;
  if(!user){
    borrarSesionActiva();
    if(state.role){ state.role = null; render(); }
    return;
  }
  obtenerUsuarioRol(user.uid)
    .then(datosUsuario => {
      const ok = aplicarPerfilPorRol(datosUsuario.role, datosUsuario.refId);
      if(!ok){
        console.error("Sesión de Auth válida pero sin perfil de negocio correspondiente (usuarios/" + user.uid + ").");
        firebaseAuth.signOut();
        return;
      }
      selectRole(datosUsuario.role);
    })
    .catch(err => {
      console.error("No se pudo restaurar la sesión:", err);
      firebaseAuth.signOut();
    });
}

if(firebaseAuth){
  firebaseAuth.onAuthStateChanged(user => {
    // clientesListos/empleadosListos puede que aún no estén listos cuando
    // dispara este evento (llega apenas se conecta Firebase); render()
    // vuelve a intentar la restauración en cada ciclo hasta que ambas
    // condiciones se cumplan (ver intentarRestaurarSesionSiCorresponde).
    restaurarSesionDesdeAuth(user);
  });
}

/* Se llama en cada render(): reintenta la restauración de sesión mientras
   no se haya resuelto todavía (por ejemplo si onAuthStateChanged disparó
   antes de que CLIENTES/EMPLEADOS terminaran de sincronizar). */
function intentarRestaurarSesionSiCorresponde(){
  if(state.role || sesionRestauroIntentado) return;
  if(!clientesListos || !empleadosListos) return;
  if(!firebaseAuth){ sesionRestauroIntentado = true; return; }
  const user = firebaseAuth.currentUser;
  if(user === null && !firebaseAuth._authResuelto) return; // esperar a onAuthStateChanged en vez de asumir "sin sesión" antes de tiempo
  restaurarSesionDesdeAuth(user);
}

/* Antes esta función solo leía de GUIAS, que siempre tenía todo en
   memoria por el listener global. Ahora primero revisa si la guía ya
   está disponible localmente (para Cliente/Piloto, que solo sincronizan
   su propio subconjunto, o mientras el admin siga con el listener
   completo); si no la encuentra ahí, la pide puntualmente a Firestore
   con .doc(id).get() — 1 sola lectura — en vez de asumir que hace falta
   descargar el resto de la colección para poder ver el detalle. */
async function selectGuia(id){
  state.selectedGuia = id; state.sidebarAbierto = false; state.detalleEditMode = false; state.detalleHistorialAbierto = false;
  state.detalleGuiaCache = null;
  state.detalleGuiaCargando = false;
  let g = buscarGuiaLocal(id);
  if(!g && dbFirestore){
    state.detalleGuiaCargando = true;
    render();
    try{
      const snap = await dbFirestore.collection("guias").doc(id).get();
      if(snap.exists){
        g = snap.data();
        // Guardar en cache de búsqueda para no volver a pedirla de inmediato
        state.guiasExtraCache = state.guiasExtraCache || [];
        if(!state.guiasExtraCache.some(x => x.id === g.id)) state.guiasExtraCache.push(g);
      }
    }catch(err){
      console.error("Error pidiendo el detalle de la guía a Firestore:", err);
    }
    state.detalleGuiaCargando = false;
    state.detalleGuiaCache = g || null;
  }
  /* No suscribirse al historial de una guía que no pertenece a la cuenta del
     Cliente actual: además de no mostrarse (ver screenDetalleGuia), así se
     evita también pedirlo a Firestore. */
  const esGuiaPropia = !g || state.role !== "Cliente" || g.cuenta === CLIENTE_ACTUAL;
  if(esGuiaPropia){ sincronizarHistorialGuia(id); } else { detenerSincronizacionHistorialActual(); }
  render();
}

   siempre disponible aquí para poder recuperarla; nunca se borra en firme.
   Igual que el reporte de entregas sin piloto: se pide a Firestore solo
   las guías con eliminada == true (1 consulta filtrada, no toda la
   colección), y se refresca cada vez que se entra a esta pantalla (ver
   navigate()). Mientras llega la respuesta, o si no hay Firebase
   disponible, se usa lo que ya haya en memoria como respaldo. */
let PAPELERA_ADMIN = null; // null = todavía no se pidió a Firestore
let papeleraCargando = false;

function cargarPapeleraAdmin(){
  if(!dbFirestore || papeleraCargando) return;
  papeleraCargando = true;
  dbFirestore.collection("guias").where("eliminada","==",true).get()
    .then(snap => {
      PAPELERA_ADMIN = snap.docs.map(d => d.data());
      papeleraCargando = false;
      render();
    })
    .catch(err => {
      console.error("Error cargando la papelera:", err);
      papeleraCargando = false;

}

   Limpia el número (quita guiones/espacios) y le antepone el código de
   El Salvador (503) cuando el número viene en formato local de 8 dígitos. */
function whatsappLink(telefono){
  const digits = (telefono || "").replace(/\D/g, "");
  if(!digits) return null;
  const numeroFinal = digits.length === 8 ? "503" + digits : digits;
  return "https://wa.me/" + numeroFinal;
}

    cuentaId: obj.id,
    usuario: tipo === "cliente" ? obj.comercio : obj.nombre,
    rol: state.role,
    campo, detalle,
    fecha: fechaStr,
    estado: "Pendiente",
  });
  guardarSolicitudPerfilEnFirestore(SOLICITUDES_PERFIL[SOLICITUDES_PERFIL.length - 1]);
  state.mostrarFormPerfil = false;
  state.perfilSolicitudEnviada = true;
  render();
}

/* Antes, la pantalla de Solicitudes de Perfil solo dejaba marcar la
   solicitud como "Atendida", pero no había ningún botón que llevara a
   donde realmente se puede cambiar el dato pedido — el administrador
   tenía que ir a buscar manualmente al cliente en la pantalla de
   Clientes. Este botón navega directo a la ficha del cliente (o, si la
   solicitud viene de un empleado, a Empleados) y la abre para editar. */
function irAEditarClienteDesdeSolicitud(cuentaId){
  const cliente = CLIENTES.find(c => c.id === cuentaId);
  if(cliente){
    navigate("clientes");
    abrirEdicionCliente(cuentaId);
    return;
  }
  const empleado = EMPLEADOS.find(e => e.id === cuentaId);
  if(empleado){
    navigate("empleados");
    abrirEdicionEmpleado(cuentaId);
    return;
  }
  mostrarNotificacion("No se encontró la cuenta que generó esta solicitud (puede haber sido eliminada).");
}

/* ============ RELOJ Y CALENDARIO EN VIVO ============
   Detecta la fecha y hora REALES del dispositivo donde el usuario
   inició sesión (usando el reloj del propio navegador/celular, con
   su huso horario local) y las muestra en un widget propio que se
   actualiza solo, cada segundo, sin necesidad de recargar ni volver
   a renderizar toda la app.
   Nota: FECHA_REF_HOY (la fecha "de hoy" que usa la lógica interna del
   prototipo para sus filtros y alertas) también se calcula a partir de la
   fecha real del dispositivo — ver su definición arriba — así que coincide
   con lo que muestra este reloj/calendario visual. */
const DIAS_SEMANA_ES = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function formatearFechaDispositivo(d){
  return `${DIAS_SEMANA_ES[d.getDay()]}, ${d.getDate()} de ${MESES_ES[d.getMonth()]} de ${d.getFullYear()}`;
}
function formatearHoraDispositivo(d){
  return d.toLocaleTimeString("es-SV", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
}
function actualizarRelojDispositivo(){
  const ahora = new Date(); // hora real del dispositivo (huso horario local)
  const fechaTxt = formatearFechaDispositivo(ahora);
  const horaTxt = formatearHoraDispositivo(ahora);
  document.querySelectorAll(".js-reloj-fecha").forEach(el => { el.textContent = fechaTxt; });
  document.querySelectorAll(".js-reloj-hora").forEach(el => { el.textContent = horaTxt; });
}
actualizarRelojDispositivo();
setInterval(actualizarRelojDispositivo, 1000);

/* Red de seguridad para diagnosticar fallos "silenciosos": si algo truena
   en cualquier parte de la app (por ejemplo al crear/ver/imprimir una
   guía) y por alguna razón no se ve en la consola del navegador, esto
   muestra una alerta en pantalla con el mensaje real del error, para no
   depender de que alguien tenga F12 abierto para reportarlo. */
window.addEventListener("error", function(e){
  const msg = e.message || "";
  if(/failed to fetch|networkerror|network request failed|script error|resizeobserver/i.test(msg)){
    console.warn("⚠️ Error filtrado (no crítico):", msg);
    return;
  }
  alert("⚠️ Error en la app:\n" + (msg || "Error desconocido") + (e.filename ? ("\n(línea " + e.lineno + ")") : ""));
});
window.addEventListener("unhandledrejection", function(e){
  const msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
  // Los hipos de red (LTE débil, cambio de red, etc.) hacen que Firebase
  // dispare "Failed to fetch" / "NetworkError" internamente; los listeners
  // en tiempo real se reconectan solos cuando vuelve la señal, así que no
  // vale la pena interrumpir con una alerta bloqueante por esto — solo se
  // deja registrado en consola para quien esté depurando.
  if(/failed to fetch|networkerror|network request failed/i.test(msg)){
    console.warn("⚠️ Error de red (probablemente transitorio, no se muestra alerta):", msg);
    return;
  }
  alert("⚠️ Error en la app (promesa):\n" + msg);
});

/* ============ Enlace directo de rastreo público (?rastreo=CODIGO) ============
   Si la app se abre con ese parámetro en la URL (por ejemplo, un enlace
   compartido por WhatsApp desde el detalle de una guía), se abre
   automáticamente la pantalla pública de "Rastrear guía" con el código ya
   cargado y la búsqueda hecha, sin que la persona tenga que escribir nada
   ni iniciar sesión. buscarGuiaPublica() ahora consulta Firestore
   directamente (ver ese comentario), así que no depende de que ningún
   listener global haya terminado de descargar datos primero. */
(function abrirRastreoDesdeUrl(){
  try{
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get("rastreo");
    if(codigo){
      state.rastreoAbierto = true;
      state.rastreoCodigo = codigo;
    }
  }catch(err){
    console.error("No se pudo leer el parámetro de rastreo de la URL:", err);
  }
})();

iniciarSincronizacionClientes();
iniciarSincronizacionEmpleados();
/* El listener de guías YA NO arranca aquí de forma incondicional: ahora
   se arranca con el alcance correcto (completo para admin, filtrado para
   Cliente/Piloto) desde selectRole() cuando alguien inicia sesión a mano,
   y desde intentarRestaurarSesionSiCorresponde() cuando se restaura una
   sesión guardada al recargar la página. No hace falta ninguna llamada
   adicional aquí. */
iniciarSincronizacionCargosCambios();
iniciarSincronizacionDestinatarios();
iniciarSincronizacionSolicitudesRecoleccion();
/* El listener de notificaciones YA NO arranca aquí de forma incondicional:
   ahora se arranca solo con sesión de Cliente activa (ver selectRole),
   igual que el de guías. Antes cualquier visitante sin sesión (incluida
   la pantalla pública de login/rastreo/afiliación) descargaba las
   notificaciones de TODOS los clientes. */
iniciarSincronizacionSolicitudesAfiliacion();
iniciarSincronizacionSolicitudesPerfil();
iniciarSincronizacionConfigGeneral();
if(state.rastreoAbierto && state.rastreoCodigo){
  buscarGuiaPublica(); // consulta puntual directa a Firestore, no depende de GUIAS
}
/* Cierra cualquier menú de fila (⋮) abierto cuando se abre otro o se hace clic fuera. */
document.addEventListener("toggle", (e) => {
  if(!e.target.matches || !e.target.matches(".row-menu")) return;
  if(!e.target.open) return;
  document.querySelectorAll(".row-menu[open]").forEach(d => { if(d !== e.target) d.open = false; });
}, true);
document.addEventListener("click", (e) => {
  document.querySelectorAll(".row-menu[open]").forEach(d => { if(!d.contains(e.target)) d.open = false; });
});

render();
</script>
