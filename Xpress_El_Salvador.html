<!-- ============ FIREBASE (Firestore) ============
     Conecta la app a la base de datos real del proyecto "xpress-control".
     A partir de aquí, CLIENTES ya no vive solo en memoria del navegador:
     se lee y se escribe en la colección "clientes" de Firestore, así que
     cualquier cliente que se cree en un dispositivo aparece igual en
     cualquier otro dispositivo/navegador que abra este mismo archivo. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCKdQ7ANvl69GY-711L8bl5x_Ahf_pJOwU",
    authDomain: "xpress-control.firebaseapp.com",
    projectId: "xpress-control",
    storageBucket: "xpress-control.firebasestorage.app",
    messagingSenderId: "134827577462",
    appId: "1:134827577462:web:3ae96d5db57a9028ba8f57",
    measurementId: "G-Y4H1RWESJL"
  };
  /* Si esta inicialización falla por cualquier motivo (el operador de datos
     móviles bloquea gstatic.com, modo ahorro de datos, sin internet en ese
     instante, CDN caído, etc.), antes "dbFirestore" quedaba en un estado
     roto ("zona muerta temporal" de JavaScript): el resto del código
     comprueba si Firestore está disponible con "typeof dbFirestore ===
     'undefined'", y ese chequeo -que debería ser inofensivo- en realidad
     lanzaba un error real cuando dbFirestore nunca llegó a asignarse. Como
     esa comprobación ocurre DENTRO de botones como "Ver historial" o
     "Imprimir" (antes de mostrar cualquier cambio en pantalla), el efecto
     visible era que el botón "no hacía nada" — sin ningún error visible
     para quien lo usa. Ahora "dbFirestore" se declara con un valor inicial
     (null) ANTES de intentar conectarse, y solo se reemplaza si la
     conexión tiene éxito; si falla, el resto de la app sigue funcionando
     con la lista de guías local, tal como ya estaba pensado para cuando no
     hay Firebase disponible. */
  let dbFirestore = null;
  try{
    firebase.initializeApp(firebaseConfig);
    dbFirestore = firebase.firestore();
    /* Persistencia offline: sin esto, Firestore solo guarda los datos en
       memoria mientras dura la pestaña abierta, así que si el piloto pierde
       conexión (muy común trabajando en la calle) o cierra y vuelve a abrir
       la app sin internet, no tiene ninguna guía disponible para escanear —
       ni siquiera las que ya se habían sincronizado antes. Con
       enablePersistence(), el navegador guarda una copia local (IndexedDB) de
       todo lo que ya se sincronizó, y esa copia sigue disponible aunque no
       haya internet en ese momento. Una guía creada mientras el dispositivo
       está sin conexión, y que nunca llegó a sincronizarse en él, seguirá sin
       poder encontrarse hasta que recupere conexión — eso no tiene solución
       posible sin internet, pero ya no se pierde todo lo demás. */
    dbFirestore.enablePersistence({ synchronizeTabs: true }).catch(err => {
      if(err.code === "failed-precondition"){
        // Persistencia ya activa en otra pestaña abierta del mismo navegador; no es un error real.
        console.warn("Persistencia offline de Firestore: ya está activa en otra pestaña.");
      }else if(err.code === "unimplemented"){
        console.warn("Este navegador no soporta persistencia offline de Firestore.");
      }else{
        console.error("Error al activar persistencia offline de Firestore:", err);
      }
    });
  }catch(err){
    console.error("No se pudo inicializar Firebase/Firestore; la app sigue funcionando con los datos locales de este dispositivo.", err);
    dbFirestore = null;
  }

  /* ============ AUTENTICACIÓN REAL (Firebase Auth) ============
     Antes, "iniciar sesión" comparaba la clave escrita contra el campo
     password/passwordReal guardado tal cual (texto plano) en los documentos
     de clientes/empleados — cualquiera con la URL podía abrir la consola del
     navegador, leer esos documentos vía onSnapshot, y ver TODAS las
     contraseñas reales de clientes y empleados. Ahora el login pasa por
     Firebase Authentication (signInWithEmailAndPassword): la contraseña
     nunca se guarda en Firestore ni se compara a mano, y Firebase la
     verifica del lado del servidor de Google. El documento en Firestore ya
     no necesita (ni debe) tener el campo password/passwordReal.
     setPersistence(LOCAL) reemplaza el viejo mecanismo que guardaba el
     correo y la contraseña en texto plano en localStorage
     (preguntarGuardarCredenciales): Firebase guarda un token de sesión
     seguro y renovable, nunca la contraseña en sí, y restaura la sesión
     sola la próxima vez que se abra la app (ver onAuthStateChanged más
     abajo, junto a intentarRestaurarSesionSiCorresponde). */
  let firebaseAuth = null;
  try{
    firebaseAuth = firebase.auth();
    firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(err => {
      console.warn("No se pudo fijar la persistencia de sesión de Firebase Auth:", err);
    });
  }catch(err){
    console.error("No se pudo inicializar Firebase Auth; el login no funcionará hasta que esto se resuelva.", err);
    firebaseAuth = null;
  }

  /* App secundaria de Firebase SOLO para crear cuentas nuevas (clientes y
     empleados) sin cerrar la sesión de quien las está creando. Es una
     limitación conocida del SDK de cliente de Firebase Auth:
     createUserWithEmailAndPassword() inicia sesión automáticamente como el
     usuario recién creado en la instancia donde se llama — si se usara la
     app principal, el Super Administrativo que está creando un cliente
     nuevo terminaría con la sesión del cliente nuevo en vez de la suya. Se
     crea la cuenta en esta segunda instancia (que nadie más usa) y de
     inmediato se cierra sesión ahí mismo, dejando intacta la sesión
     principal del admin. */
  function crearUsuarioAuthSinCerrarSesion(correo, password){
    if(!firebaseAuth) return Promise.reject(new Error("Firebase Auth no está disponible."));
    let secApp = firebase.apps.find(a => a.name === "Secundaria");
    if(!secApp){
      secApp = firebase.initializeApp(firebaseConfig, "Secundaria");
    }
    const secAuth = secApp.auth();
    return secAuth.createUserWithEmailAndPassword(correo, password).then(cred => {
      const uid = cred.user.uid;
      return secAuth.signOut().then(() => uid);
    });
  }

  /* Traduce los códigos de error de Firebase Auth a mensajes en español
     entendibles para quien usa la app (por defecto vienen en inglés y con
     jerga técnica). */
  function mensajeErrorAuth(err){
    const code = err && err.code;
    const mapa = {
      "auth/wrong-password": "Correo o contraseña incorrectos.",
      "auth/user-not-found": "Correo o contraseña incorrectos.",
      "auth/invalid-credential": "Correo o contraseña incorrectos.",
      "auth/invalid-email": "El correo no tiene un formato válido.",
      "auth/too-many-requests": "Demasiados intentos fallidos. Espera unos minutos e intenta de nuevo.",
      "auth/network-request-failed": "No hay conexión a internet en este momento.",
      "auth/email-already-in-use": "Ya existe una cuenta con ese correo.",
      "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
      "auth/user-disabled": "Esta cuenta está deshabilitada.",
    };
    return mapa[code] || ("Ocurrió un error de autenticación (" + (code || "desconocido") + ").");
  }
</script>

<script>
  // Fija la altura real de pantalla una sola vez (al cargar y al rotar el
  // celular), en vez de depender de 100vh, que en Chrome/Safari móvil
  // cambia cada vez que la barra de direcciones se esconde o aparece al
  // hacer scroll — eso es lo que provocaba que la app "saltara" sola.
  function fijarAlturaApp(){
    document.documentElement.style.setProperty('--app-vh', window.innerHeight + 'px');
  }
  fijarAlturaApp();
  window.addEventListener('orientationchange', () => setTimeout(fijarAlturaApp, 200));
  let ultimoAnchoVentana = window.innerWidth;
  window.addEventListener('resize', () => {
    if(window.innerWidth !== ultimoAnchoVentana){
      ultimoAnchoVentana = window.innerWidth;
      fijarAlturaApp();
    }
  });
</script>

<div id="app"></div>

<script>
/* ============ CONSTANTES DE NEGOCIO ============ */
/* Marca de versión visible al final de la pantalla de Login (abajo del todo).
   Sirve para confirmar, sin duda alguna, si el navegador está mostrando el
   archivo más reciente o una copia vieja en caché: cada vez que se entrega
   una nueva versión del prototipo, este texto cambia. */
const VERSION_BUILD = "2026-08-10.15 (auditoria: XSS residual en recolecciones y dashboard)";

const ESTADOS = [
  "Creado",
  "Recolectado",
  "En bodega",
  "Asignado a ruta PM",
  "Recibido en bodega final",
  "Asignado a piloto",
  "Entregado",
  "Pendiente",
  "Devolución",
  "Finalizado",
];
const PILOTO_ESTADOS = ["Entregado","Pendiente","Devolución"];

/* Texto descriptivo que se guarda en el historial de la guía según el estado
   nuevo al que se pasa (en vez del genérico "Cambio de estado"), sin importar
   si el cambio se hizo de forma individual o en un lote masivo. */
const ACCION_POR_ESTADO = {
  "Creado": "Guía creada",
  "Recolectado": "Paquete recolectado",
  "En bodega": "Ingreso a bodega",
  "Asignado a ruta PM": "Asignado a ruta PM",
  "Recibido en bodega final": "Recibido en bodega final",
  "Asignado a piloto": "Asignado a piloto para reparto",
  "Entregado": "Entrega confirmada",
  "Pendiente": "Marcado como pendiente",
  "Devolución": "Marcado en devolución",
  "Finalizado": "Guía finalizada",
};
function accionParaEstado(nuevoEstado){
  return ACCION_POR_ESTADO[nuevoEstado] || ("Cambio de estado a " + nuevoEstado);
}

const ESTADO_COLORS = {
  "Creado": { bg:"#fffbeb", color:"#b45309", border:"#fde68a" },
  "Recolectado": { bg:"#fff7ed", color:"#c2410c", border:"#fed7aa" },
  "En bodega": { bg:"#eff6ff", color:"#1d4ed8", border:"#bfdbfe" },
  "Asignado a ruta PM": { bg:"#eef2ff", color:"#4338ca", border:"#c7d2fe" },
  "Recibido en bodega final": { bg:"#faf5ff", color:"#7e22ce", border:"#e9d5ff" },
  "Asignado a piloto": { bg:"#ecfeff", color:"#0e7490", border:"#a5f3fc" },
  "Entregado": { bg:"#ecfdf5", color:"#047857", border:"#a7f3d0" },
  "Pendiente": { bg:"#fffbeb", color:"#b45309", border:"#fde68a" },
  "Devolución": { bg:"#fef2f2", color:"#b91c1c", border:"#fecaca" },
  "Finalizado": { bg:"#f0fdf4", color:"#166534", border:"#bbf7d0" },
};

/* Estado del pago de la guía: nace en "Por pagar" al crearse y pasa a
   "Pagado" automáticamente cuando la guía se marca como "Finalizado"
   (ver cambiarEstadoGuia). Visible para los roles administrativos en la
   vista de Guías. */
const ESTADO_PAGO_COLORS = {
  "Por pagar": { bg:"#fef2f2", color:"#b91c1c", border:"#fecaca" },
  "Pagado": { bg:"#f0fdf4", color:"#166534", border:"#bbf7d0" },
};
function pillPago(estadoPago){
  const ep = estadoPago || "Por pagar";
  const c = ESTADO_PAGO_COLORS[ep] || { bg:"#f1f5f9", color:"#475569", border:"#e2e8f0" };
  return `<span class="pill" style="background:${c.bg};color:${c.color};border-color:${c.border};"><span class="dot"></span>${esc(ep.toUpperCase())}</span>`;
}

/* Insignia "📦 N bultos": se muestra junto al número de guía en listas,
   tarjetas y el detalle cuando un envío tiene 2 o más bultos, para que sea
   evidente de un vistazo que esa guía agrupa varios paquetes físicos (cada
   uno con su propia etiqueta 1/N, 2/N... al imprimir, ver imprimirGuia).
   Con 1 bulto o sin el dato no se muestra nada. */
function bultoBadgeInline(g){
  const n = parseInt(g && g.bultos, 10);
  if(!(n > 1)) return "";

}

/* ---- Sincronización en tiempo real del historial de una guía ----
   Cuando se abre el detalle de una guía, nos suscribimos a su subcolección
   "guias/{id}/historial" en Firestore. Así, si esa misma guía se modifica
   desde otro dispositivo (u otra pestaña), el historial que se ve en
   pantalla se actualiza solo, sin recargar la página. Solo puede haber una
   suscripción activa a la vez; se cierra automáticamente al salir del
   detalle o al abrir otra guía. */
let detenerSincronizacionHistorial = null;

function sincronizarHistorialGuia(guiaId){
  if(detenerSincronizacionHistorial){ detenerSincronizacionHistorial(); detenerSincronizacionHistorial = null; }
  if(typeof dbFirestore === "undefined" || !dbFirestore || !guiaId) return;
  detenerSincronizacionHistorial = dbFirestore.collection("guias").doc(guiaId).collection("historial")
    .orderBy("creadoEn", "asc")
    .onSnapshot((snapshot) => {
      const eventos = snapshot.docs.map(doc => doc.data());
      if(eventos.length > 0){
        HISTORIAL[guiaId] = eventos;
        render();
      }
    }, err => {
      console.error("Error sincronizando historial de la guía:", err);
    });
}

function detenerSincronizacionHistorialActual(){
  if(detenerSincronizacionHistorial){ detenerSincronizacionHistorial(); detenerSincronizacionHistorial = null; }
}

/* ============ NOTIFICACIONES NO BLOQUEANTES (toast) ============
   Reemplaza los alert() nativos usados para mensajes de validación y
   feedback ("completa este campo", "clave incorrecta", "lote procesado",
   etc.). El alert() nativo congela TODA la pestaña hasta que alguien lo
   cierra a mano; eso es especialmente molesto para un piloto en la calle
   con conexión intermitente, que puede quedar con la app "trabada" en un
   mensaje mientras intenta seguir su ruta. mostrarNotificacion() en cambio
   muestra un aviso apilable que se retira solo (o se cierra con la X) sin
   bloquear el resto de la interfaz.
   Los dos manejadores globales de errores inesperados (window.onerror /
   unhandledrejection, más abajo en el archivo) sí se dejan con alert()
   nativo a propósito: son la "red de seguridad" para crashes donde el DOM
   de la app puede no estar en condiciones de pintar un toast, así que
   conviene el mecanismo más básico y confiable del navegador. */
let notifContainerEl = null;
function obtenerNotifContainer(){
  if(notifContainerEl && document.body && document.body.contains(notifContainerEl)) return notifContainerEl;
  notifContainerEl = document.createElement("div");
  notifContainerEl.id = "notif-container";
  notifContainerEl.setAttribute("aria-live", "polite");
  document.body.appendChild(notifContainerEl);
  return notifContainerEl;
}

function tipoNotificacionDesdeMensaje(mensaje){
  const m = String(mensaje);
  if(m.startsWith("❌")) return "error";
  if(m.startsWith("✅")) return "exito";
  if(m.startsWith("⚠️") || m.startsWith("⚠")) return "advertencia";
  return "info";
}

function mostrarNotificacion(mensaje, tipoForzado){
  try{
    const cont = obtenerNotifContainer();
    const tipo = tipoForzado || tipoNotificacionDesdeMensaje(mensaje);
    const iconos = { error:"❌", exito:"✅", advertencia:"⚠️", info:"ℹ️" };
    const texto = String(mensaje);
    const duracionMs = Math.min(10000, Math.max(3500, texto.length * 70));

    const toast = document.createElement("div");
    toast.className = "notif-toast notif-" + tipo;

    const spanIcono = document.createElement("span");
    spanIcono.className = "notif-icono";
    spanIcono.textContent = iconos[tipo] || "ℹ️";

    const spanTexto = document.createElement("span");
    spanTexto.className = "notif-texto";
    spanTexto.textContent = texto;

    const btnCerrar = document.createElement("button");
    btnCerrar.type = "button";
    btnCerrar.className = "notif-cerrar";
    btnCerrar.setAttribute("aria-label", "Cerrar");
    btnCerrar.textContent = "✕";

    toast.appendChild(spanIcono);
    toast.appendChild(spanTexto);
    toast.appendChild(btnCerrar);

    let cerrado = false;
    const cerrar = () => {
      if(cerrado) return;
      cerrado = true;
      toast.classList.add("notif-saliendo");
      setTimeout(() => toast.remove(), 200);
    };
    btnCerrar.addEventListener("click", cerrar);

    cont.appendChild(toast);
    setTimeout(cerrar, duracionMs);
  }catch(e){
    // Último recurso: si por lo que sea el DOM no está listo o algo falla,
    // no queremos que el mensaje se pierda en silencio.
    console.error("No se pudo mostrar la notificación, usando alert() de respaldo:", e);
    window.alert(mensaje);
  }
}

/* Fecha de referencia ("hoy"), usada por el Centro de Control Operativo para
   calcular tiempos detenidos, rutas atrasadas, fecha de creación de guías
   nuevas, entregas estimadas, etc. Antes quedaba fija en una fecha simulada
   del prototipo (17/07/26); ahora se toma la fecha real del dispositivo, así
   que coincide con las fechas reales que ya se registran en el historial de
   cada guía. */
const FECHA_REF_HOY = new Date();

/* "Hoy" en formato corto (17/07/26, para comparar contra guia.fecha) y en
   formato largo en español (viernes 17 de julio de 2026, para saludos y
   encabezados). Antes estos textos estaban escritos a mano y quedaban
   desincronizados de la fecha real en cuanto pasaban los días. */
function formatFechaCortaHoy(d){
  return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getFullYear()).slice(-2);
}
function fechaLargaEs(d){
  const texto = d.toLocaleDateString("es-ES", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
  return texto.charAt(0).toLowerCase() + texto.slice(1);
}
const FECHA_HOY_STR = formatFechaCortaHoy(FECHA_REF_HOY);
const FECHA_HOY_LARGA = fechaLargaEs(FECHA_REF_HOY);

/* ============ Datos base para las alertas operativas, vía consultas dirigidas ============
   Antes, calcularAlertasOperativas() arrancaba con
   `GUIAS.filter(g => !g.eliminada)` — TODA la colección. Ahora se piden solo
   dos conjuntos acotados a Firestore:
     1) "Activas": guías no eliminadas en cualquier estado que NO sea
        Entregado/Finalizado — este conjunto es operativo (lo que sigue en
        curso hoy), no crece con el historial completo de la empresa.
     2) "Terminales recientes": guías Entregado/Finalizado de los ÚLTIMOS 14
        DÍAS ÚNICAMENTE — se usan solo para las 2 reglas que auditan foto/firma
        de entrega. Se acota a propósito: auditar TODO el historial de
        entregas de la empresa para siempre no escala (es justo el problema
        original). Firestore no permite filtrar el campo "fecha" por rango
        (se guarda como texto "dd/mm/aa", no es ordenable como fecha real —
        ver nota en guiasPaginadas), así que se compara con una lista
        explícita de los últimos 14 días vía el operador "in".
   Efecto secundario menor: la regla "Paquete escaneado dos veces" ya no
   revisa guías Entregadas/Finalizadas fuera de los últimos 14 días (antes sí,
   sin límite) — una alerta de doble escaneo sobre una entrega ya finalizada
   hace mucho tiempo no es accionable de todas formas.
   No es un listener en vivo: se vuelve a pedir cada vez que se entra al
   Centro de Control Operativo o al Dashboard (ver navigate()). Mientras llega
   la respuesta (o si Firestore no está disponible), se usa el cálculo local
   de siempre como respaldo. */
const ESTADOS_ACTIVOS_ALERTAS = ESTADOS.filter(e => !["Entregado","Finalizado"].includes(e));

function ultimosNDiasStr(n){
  const dias = [];
  for(let i = 0; i < n; i++) dias.push(formatFechaCortaHoy(sumarDiasFecha(FECHA_REF_HOY, -i)));
  return dias;
}

let DATOS_ALERTAS_ADMIN = null; // null = todavía no se pidió a Firestore
let datosAlertasCargando = false;

function cargarDatosAlertasAdmin(){
  if(!dbFirestore || datosAlertasCargando) return;
  datosAlertasCargando = true;
  const col = dbFirestore.collection("guias");
  const dias14 = ultimosNDiasStr(14);
  Promise.all([
    col.where("estado","in",ESTADOS_ACTIVOS_ALERTAS).get(),
    col.where("estado","==","Entregado").where("fecha","in",dias14).get(),
    col.where("estado","==","Finalizado").where("fecha","in",dias14).get(),
  ]).then(([activasSnap, entregadasSnap, finalizadasSnap]) => {
    const activas = activasSnap.docs.map(d => d.data()).filter(g => !g.eliminada);
    const terminalesRecientes = [
      ...entregadasSnap.docs.map(d => d.data()),
      ...finalizadasSnap.docs.map(d => d.data()),
    ].filter(g => !g.eliminada);
    DATOS_ALERTAS_ADMIN = { activas, terminalesRecientes };
    datosAlertasCargando = false;
    render();
  }).catch(err => {
    console.error("Error cargando datos para alertas operativas:", err);
    console.error("Si el error menciona un índice ('requires an index'), abre el enlace que trae el propio error para crearlo en Firebase Console.");
    datosAlertasCargando = false;
    // Se queda en null a propósito: datosBaseAlertas() cae al cálculo local de respaldo.
  });
}

function datosBaseAlertas(){
  if(dbFirestore && DATOS_ALERTAS_ADMIN !== null) return DATOS_ALERTAS_ADMIN;
  if(dbFirestore && !datosAlertasCargando) cargarDatosAlertasAdmin();
  // Respaldo local mientras llega Firestore (o sin Firebase disponible): mismo
  // criterio, calculado con lo que ya esté en GUIAS.
  const todasLocal = GUIAS.filter(g => !g.eliminada);
  const dias14Local = ultimosNDiasStr(14);
  return {
    activas: todasLocal.filter(g => ESTADOS_ACTIVOS_ALERTAS.includes(g.estado)),
    terminalesRecientes: todasLocal.filter(g => ["Entregado","Finalizado"].includes(g.estado) && dias14Local.includes(g.fecha)),
  };
}

/* ---- Centro de Control Operativo ----
   Motor de alertas calculado en vivo sobre las guías, pilotos y clientes
   reales del prototipo (no es una lista fija): cada vez que cambian los
   datos, las alertas se recalculan. */
function calcularAlertasOperativas(){
  const alertas = [];
  const datosBase = datosBaseAlertas();
  let activas = [...datosBase.activas, ...datosBase.terminalesRecientes];
  activas = aplicarFiltroFecha(activas, state.controlOpRangoModo, state.controlOpFechaDesde, state.controlOpFechaHasta);
  const diasDesde = (fechaStr) => {
    const f = parseFechaGuia(fechaStr);
    if(!f) return null;
    return Math.round((FECHA_REF_HOY - f) / 86400000);
  };

  /* Núcleo del flujo de asignación/logística (antes de llegar a un
     resultado final como Entregado/Pendiente/Devolución). Si una guía pasa
     de un estado a otro dentro de este núcleo saltándose uno o más pasos
     intermedios (ej. de "Creado" directo a "Asignado a piloto"), se marca
     como alerta para que se revise si fue un error de captura. */
  const NUCLEO_FLUJO = ESTADOS.slice(0, 6); // Creado..Asignado a piloto

  activas.forEach(g => {
    if(!["Entregado","Finalizado","Devolución"].includes(g.estado)){
      const dias = diasDesde(g.fecha);
      if(dias !== null && dias >= 1){
        alertas.push({ tipo:"Guía detenida más de 24 horas", icon:"🔴", guiaId:g.id,
          mensaje:`Guía ${g.id} (${g.cliente}) lleva ${dias*24}+ horas en estado "${g.estado}" sin avanzar.` });
      }
    }
    if(g.estado === "Asignado a piloto"){
      const dias = diasDesde(g.fecha);
      if(dias !== null && dias >= 1){
        alertas.push({ tipo:"Ruta atrasada", icon:"🔴", guiaId:g.id,
          mensaje:`Guía ${g.id} — ruta "${g.ruta}" con el piloto ${g.piloto} está atrasada.` });
      }
    }
    if(g.urgente && !["Entregado","Finalizado"].includes(g.estado)){
      alertas.push({ tipo:"Entrega Xpress a punto de vencer", icon:"🔴", guiaId:g.id,
        mensaje:`Guía Xpress 24h ${g.id} (${g.cliente}) está a punto de vencer su plazo de entrega.` });
    }
    if((g.escaneos||0) >= 2){
      alertas.push({ tipo:"Paquete escaneado dos veces", icon:"🔴", guiaId:g.id,
        mensaje:`Guía ${g.id} fue escaneada ${g.escaneos} veces — verificar posible duplicado o error de bodega.` });
    }
    if(["Entregado","Finalizado"].includes(g.estado) && !g.fotoEntrega){
      alertas.push({ tipo:"Guía sin fotografía de entrega", icon:"🔴", guiaId:g.id,
        mensaje:`Guía ${g.id} está "${g.estado}" pero no tiene foto de entrega registrada.` });
    }
    if(["Entregado","Finalizado"].includes(g.estado) && !g.firmaEntrega){
      alertas.push({ tipo:"Guía sin firma", icon:"🔴", guiaId:g.id,
        mensaje:`Guía ${g.id} está "${g.estado}" pero no tiene firma del cliente registrada.` });
    }
    const cli = CLIENTES.find(c => c.comercio === g.cliente);
    const esRolAdministrativo = state.role === "Super Administrativo" || state.role === "Administrativo";
    if(cli && esRolAdministrativo && esClienteVip(cli) && !["Entregado","Finalizado","Devolución"].includes(g.estado)){
      alertas.push({ tipo:"Cliente VIP esperando entrega", icon:"🔴", guiaId:g.id,
        mensaje:`Cliente VIP ${cli.comercio} tiene la guía ${g.id} en estado "${g.estado}", aún sin entregar.` });
    }
    (HISTORIAL[g.id] || []).forEach(e => {
      const idxDe = NUCLEO_FLUJO.indexOf(e.de);
      const idxA = NUCLEO_FLUJO.indexOf(e.a);
      if(idxDe !== -1 && idxA !== -1 && idxA - idxDe > 1){
        const saltados = NUCLEO_FLUJO.slice(idxDe + 1, idxA).join(", ");
        alertas.push({ tipo:"Guía saltó un estado del flujo", icon:"🟠", guiaId:g.id,
          mensaje:`Guía ${g.id} pasó de "${e.de}" a "${e.a}" saltándose: ${saltados}.` });
      }
    });
  });

  EMPLEADOS.filter(e => e.rol === "Piloto").forEach(p => {
    const dias = diasDesde(p.ultimaActividad);
    if(dias !== null && dias >= 1){
      alertas.push({ tipo:"Piloto sin movimiento", icon:"🔴",
        mensaje:`Piloto ${p.nombre} no registra movimiento desde ${p.ultimaActividad}.` });
    }
  });

  return alertas;
}

function calcularValorFinalPaquete(opts){
  const valorDeclarado = Math.max(0, Number(opts.valorDeclarado) || 0);
  const tarifaBase = ESTRUCTURA_FINANCIERA.tarifaBaseEnvio;
  const seguro = valorDeclarado * (ESTRUCTURA_FINANCIERA.seguroValorDeclaradoPct/100);
  const recargoXpress = opts.esXpress ? ESTRUCTURA_FINANCIERA.recargoXpress24h : 0;
  const recargoZona = opts.esZonaExtendida ? ESTRUCTURA_FINANCIERA.recargoZonaExtendida : 0;
  const subtotal = tarifaBase + seguro + recargoXpress + recargoZona;
  const comision = subtotal * (ESTRUCTURA_FINANCIERA.comisionOperativaPct/100);
  const iva = (subtotal + comision) * (ESTRUCTURA_FINANCIERA.ivaPct/100);
  const total = subtotal + comision + iva;
  return { valorDeclarado, tarifaBase, seguro, recargoXpress, recargoZona, subtotal, comision, iva, total };
}

/* ============ SINCRONIZACIÓN DE CLIENTES CON FIRESTORE ============
   CLIENTES ya no vive solo en la memoria del navegador: se guarda en la
   colección "clientes" de Firestore (proyecto xpress-control), y se
   mantiene sincronizado en vivo con onSnapshot. Así, un cliente creado
   en un dispositivo aparece igual en cualquier otro dispositivo/navegador
   que abra este mismo archivo, y el login funciona en todos lados.
   clientesListos pasa a true en cuanto llega la primera respuesta de
   Firestore (vacía o con datos); el login espera a que esto sea true
   para no comparar contra una lista todavía incompleta. */
let clientesListos = false;

function guardarClienteEnFirestore(cliente){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  dbFirestore.collection("clientes").doc(cliente.id).set(cliente).catch(err => {
    console.error("Error guardando cliente en Firestore:", err);
    mostrarNotificacion("El cambio se aplicó en esta pantalla, pero no se pudo guardar en la base de datos (revisa tu conexión a internet). Es posible que no se vea reflejado en otros dispositivos.");

/* ============ MAPA uid de Firebase Auth -> rol y perfil (Firestore) ============
   Colección nueva "usuarios/{uid}": el id del documento es el uid que
   Firebase Auth le asigna a la cuenta (no el C-00X / E-00X del negocio).
   Guarda solo lo mínimo para saber, después de iniciar sesión, quién es
   esa persona dentro de la app: su rol y el id de su perfil de
   cliente/empleado. Las Firestore Security Rules usan este documento para
   decidir qué puede leer/escribir cada quien (ver firestore.rules). */
function guardarUsuarioRol(uid, role, refId){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return Promise.resolve();
  return dbFirestore.collection("usuarios").doc(uid).set({ role, refId }).catch(err => {
    console.error("Error guardando el rol del usuario en Firestore:", err);
    throw err;
  });
}

function obtenerUsuarioRol(uid){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return Promise.reject(new Error("Firestore no disponible."));
  return dbFirestore.collection("usuarios").doc(uid).get().then(snap => {
    if(!snap.exists) throw new Error("No existe un perfil de rol para esta cuenta (usuarios/" + uid + ").");
    return snap.data();
  });
}

/* Guarda ÚNICAMENTE el campo "logo" del cliente (con merge:true), en vez de
   sobrescribir el documento completo como hace guardarClienteEnFirestore().
   Motivo: si dos sesiones tocan el mismo cliente casi al mismo tiempo (por
   ejemplo, el cliente sube su logo mientras un Administrativo le está
   corrigiendo otro dato), un guardado con set(cliente) completo desde una
   copia local desactualizada puede revertir el campo que acaba de cambiar
   el otro. Al guardar solo {logo:...} con merge, el resto de campos del
   documento no se toca, así que el logo queda reflejado de forma
   consistente y en tiempo real para todas las sesiones sin pisar otros
   cambios concurrentes. */
function guardarLogoClienteEnFirestore(id, logo){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  dbFirestore.collection("clientes").doc(id).set({ logo }, { merge:true }).catch(err => {
    console.error("Error guardando logo del cliente en Firestore:", err);
    mostrarNotificacion("El logo se aplicó en esta pantalla, pero no se pudo guardar en la base de datos (revisa tu conexión a internet). Es posible que no se vea reflejado en otros dispositivos.");
  });
}

/* ============ LOGO DEL CLIENTE ============
   Permite que cada cliente suba el logo de su negocio, el cual se muestra
   en su perfil ("Mi Perfil") y en las guías de envío (pantalla e impresión).
   La imagen se redimensiona/comprime en el navegador antes de guardarse
   (máx. 300px de lado, JPEG) para no exceder el límite de tamaño de un
   documento de Firestore y para que cargue rápido en todos lados. */
function procesarImagenLogoArchivo(file, callback){
  if(!file) return;
  if(!file.type || !file.type.startsWith("image/")){
    mostrarNotificacion("El archivo debe ser una imagen (PNG o JPG).");
    return;
  }
  if(file.size > 5 * 1024 * 1024){
    mostrarNotificacion("La imagen es muy pesada (máx. 5MB). Elige una más liviana.");
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 300;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => mostrarNotificacion("No se pudo leer la imagen. Intenta con otro archivo.");
    img.src = e.target.result;
  };
  reader.onerror = () => mostrarNotificacion("No se pudo leer el archivo.");
  reader.readAsDataURL(file);
}

function iniciarSincronizacionClientes(){
  if(typeof dbFirestore === "undefined" || !dbFirestore){
    clientesListos = true; // sin Firebase disponible, se sigue usando la lista local
    return;
  }
  dbFirestore.collection("clientes").onSnapshot((snapshot) => {
    if(snapshot.empty && !clientesListos){
      // NO sembrar datos de ejemplo en producción: si la colección está
      // vacía se respeta. Antes esto reescribía Nike/Adidas/etc. y podía
      // confundirse con pérdida de clientes reales.
      console.warn("Colección clientes vacía en Firestore (no se siembran ejemplos).");
      CLIENTES.length = 0;
      clientesListos = true;
      if(typeof state !== "undefined" && state.role) render();
      return;
    }
    const nuevaLista = [];
    snapshot.forEach(doc => nuevaLista.push(doc.data()));
    nuevaLista.sort((a,b) => (a.id||"").localeCompare(b.id||""));
    CLIENTES.length = 0;
    nuevaLista.forEach(c => CLIENTES.push(c));
    /* Autocorrección: clientes que ya existían en Firestore antes de que se
       capturara "creadoPor" y la hora de creación quedan con esos campos
       vacíos ("—" en el detalle). Se completan aquí mismo con un valor
       razonable y se vuelven a guardar, para que quede consistente en
       todos los dispositivos sin tener que editarlos uno por uno. */
    CLIENTES.forEach(c => {
      let corregido = false;
      if(!c.creadoPor){
        c.creadoPor = "Super Administrativo";
        corregido = true;
      }
      if(!c.fechaRegistro){
        c.fechaRegistro = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
        corregido = true;
      }
      if(corregido) guardarClienteEnFirestore(c);
    });
    const primeraVez = !clientesListos;
    clientesListos = true;
    // Se repinta si es la primera vez que llegan datos (para quitar el aviso
    // de "Conectando..." del login) o si ya hay sesión iniciada (para que
    // pantallas como Clientes reflejen cambios hechos desde otro dispositivo).
    if(typeof state !== "undefined" && (primeraVez || state.role)) render();
  }, (err) => {
    console.error("Error sincronizando clientes con Firestore:", err);
    clientesListos = true; // se deja avanzar con lo que haya en memoria local
  });
}

   importar quién había iniciado sesión. Eso es lo que vuelve la app
   inservible con volumen real.

   Ahora la sincronización se hace por alcance, según el rol de la sesión
   activa (ver selectRole y logout, donde se arranca/detiene):
     - Super Administrativo / Administrativo: siguen viendo la colección
       completa por ahora (iniciarSincronizacionGuiasAdmin) — necesitan

       esto con reportes pre-calculados (siguiente paso del plan), pero al
       menos ya no corre para Cliente ni Piloto, que son la mayoría de las

     - Piloto: solo escucha las guías que tiene asignadas (where piloto ==

   cerrar sesión o cambiar de rol (detenerSincronizacionGuiasActual), para
   no dejar suscripciones huérfanas escuchando datos que ya no corresponden

/* ---- Buscar varias guías por id, con Firestore como respaldo ----
   Usado por los lotes de devolución/cambio consolidado: un admin pega o
   sube una lista de números de guía que pueden no estar en memoria local
   (por ejemplo, si son de hace tiempo o de otra cuenta). Antes se asumía
   que GUIAS ya tenía todo. Ahora primero busca en memoria y, si no la
   encuentra, la pide puntualmente con .doc(id).get() — 1 lectura por
   guía que realmente haga falta, en vez de necesitar la colección
   completa descargada de antemano. Las que sí se piden a Firestore se
   agregan a GUIAS para que el resto del flujo (registrarCambioGuia, etc.)
   funcione exactamente igual que antes. */
async function buscarGuiasPorIds(ids){
  const resultado = {};
  await Promise.all(ids.map(async id => {
    let g = GUIAS.find(x => x.id === id);
    if(!g && dbFirestore){
      try{
        const snap = await dbFirestore.collection("guias").doc(id).get();
        if(snap.exists){
          g = snap.data();
          GUIAS.push(g);
        }
      }catch(err){
        console.error("Error buscando la guía " + id + " en Firestore:", err);
      }
    }
    resultado[id] = g;
  }));
  return resultado;
}


/* ---- Contador pre-calculado por departamento (mapa de calor) ----
   El mapa de calor necesita "cuántas guías hay por departamento" cruzando
   TODA la colección — a diferencia de los reportes anteriores, esto no se
   puede pedir filtrado con where(), porque Firestore no permite traer solo
   un campo sin descargar el documento completo. La única forma de que
   esto no cueste una lectura por cada guía que exista es mantener un
   contador aparte, actualizado en cada punto donde cambia el departamento
   de una guía (creación, y el respaldo que lo completa si faltaba — ver
   repararGuiasSinDireccion). FieldValue.increment() hace el incremento de
   forma atómica en el servidor, así que no hay condición de carrera aunque
   varias agencias creen guías al mismo tiempo — cada escritura es a su
   propio campo dentro del documento, no compite por un valor que primero
   haya que leer.
   Documento: agregados/porDepartamento — un campo por departamento. */
function incrementarAgregadoDepartamento(departamento, delta){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  if(!departamento || departamento === "-") return;
  const inc = firebase.firestore.FieldValue.increment(delta);
  dbFirestore.collection("agregados").doc("porDepartamento").set({ [departamento]: inc }, { merge:true })
    .catch(err => console.error("Error actualizando el contador de departamento:", err));
}

  const nuevaLista = [];

  nuevaLista.sort((a,b) => (a.id||"").localeCompare(b.id||""));
  GUIAS.length = 0;
  nuevaLista.forEach(g => GUIAS.push(g));
  if(esVistaCompleta){
    /* Auto-corrección: cualquier guía que haya quedado en "Finalizado" con
       estadoPago distinto de "Pagado" se corrige aquí mismo y se vuelve a
       guardar, para que quede consistente en todos los dispositivos sin
       tener que tocarla manualmente. */
    GUIAS.forEach(g => {
      if(g.estado === "Finalizado" && g.estadoPago !== "Pagado"){
        g.estadoPago = "Pagado";
        guardarGuiaEnFirestore(g);
      }
    });
    if(typeof asignarAgenciasFaltantes === "function") asignarAgenciasFaltantes();
  }
  const primeraVez = !guiasListos;
  guiasListos = true;
  if(typeof state !== "undefined" && (primeraVez || state.role)) render();
}

/* ============ SINCRONIZACIÓN DE NOTIFICACIONES AL CLIENTE ============

   arrancaba incondicionalmente al cargar la página (última línea del
   archivo), incluso antes de iniciar sesión. Eso tenía dos problemas:
     1) Escala: NOTIFICACIONES crece con cada evento de cada guía (varias
        notificaciones por guía), así que con volumen real esto se vuelve
        tan pesado como el problema original de GUIAS.
     2) Privacidad: cualquier persona que abriera la pantalla de login
        (sin sesión, incluida la de rastreo público o afiliación) recibía
        en su navegador las notificaciones de TODOS los clientes, porque
        el filtro por cuenta (ver notificacionesClientePendientes /
        screenNotificaciones) se aplicaba solo del lado del cliente sobre
        datos que ya habían llegado completos.
   Ahora, igual que con GUIAS, la sincronización solo arranca cuando hay
   sesión de Cliente activa, y se filtra directamente en la consulta con
   where("cuenta","==",cuenta) — nunca se descargan notificaciones de
   otras cuentas. Se detiene explícitamente al cerrar sesión o cambiar de
   rol (ver selectRole/logout), igual que unsubscribeGuias. */

let unsubscribeNotificaciones = null;

function guardarNotificacionEnFirestore(n){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  if(!n || !n.id) return;
  dbFirestore.collection("notificaciones").doc(n.id).set(n).catch(err => {
    console.error("Error guardando notificación en Firestore:", err);
  });

function iniciarSincronizacionNotificacionesCliente(cuenta){

  if(typeof dbFirestore === "undefined" || !dbFirestore){

  }
  if(!cuenta){ notificacionesListas = true; return; }
  unsubscribeNotificaciones = dbFirestore.collection("notificaciones")
    .where("cuenta","==",cuenta)
    .onSnapshot((snapshot) => {
      const nuevaLista = [];
      snapshot.forEach(doc => nuevaLista.push(doc.data()));
      nuevaLista.sort((a,b) => (a.fecha||"").localeCompare(b.fecha||"")).reverse();
      NOTIFICACIONES.length = 0;
      nuevaLista.forEach(n => NOTIFICACIONES.push(n));
      const primeraVez = !notificacionesListas;
      notificacionesListas = true;
      if(typeof state !== "undefined" && (primeraVez || state.role)) render();
    }, (err) => {
      console.error("Error sincronizando notificaciones con Firestore:", err);
      notificacionesListas = true;
    });
}

/* Detiene el listener de notificaciones activo (si lo hay) y limpia el
   arreglo local, para que no queden datos de la cuenta anterior visibles
   ni una suscripción corriendo de más al cambiar de rol o cerrar sesión. */
function detenerSincronizacionNotificacionesActual(){
  if(unsubscribeNotificaciones){
    unsubscribeNotificaciones();
    unsubscribeNotificaciones = null;
  }
  NOTIFICACIONES.length = 0;
  notificacionesListas = false;
}

   sincronizarla de forma pasiva a cada sesión que abre la app. */
let configGeneralLista = false;

/* ============ CLAVE DE EXPORTACIÓN DE CLIENTES (documento aparte) ============
   A propósito vive en su propio documento, separado de "config/general", y
   se consulta con get() puntual (no onSnapshot) solo en el momento en que
   alguien de rol Administrativo o Super Administrativo la necesita. Así se
   evita que la clave viaje en texto plano hacia toda sesión que abre la app
   (Cliente, Piloto, etc.), que era el problema original. */
const CLAVE_EXPORTACION_POR_DEFECTO = "Xpress2026";

function obtenerClaveExportacionClientes(){
  if(typeof dbFirestore === "undefined" || !dbFirestore){
    return Promise.resolve(CLAVE_EXPORTACION_CLIENTES || CLAVE_EXPORTACION_POR_DEFECTO);
  }
  return dbFirestore.collection("config").doc("exportacion_clientes").get()
    .then((doc) => {
      if(doc.exists && doc.data() && doc.data().clave){
        CLAVE_EXPORTACION_CLIENTES = doc.data().clave;
      } else {
        CLAVE_EXPORTACION_CLIENTES = CLAVE_EXPORTACION_POR_DEFECTO;
      }
      return CLAVE_EXPORTACION_CLIENTES;
    })
    .catch((err) => {
      console.error("Error consultando la clave de exportación de clientes:", err);
      return CLAVE_EXPORTACION_CLIENTES || CLAVE_EXPORTACION_POR_DEFECTO;
    });
}

function guardarClaveExportacionClientes(nuevaClave){
  CLAVE_EXPORTACION_CLIENTES = nuevaClave;
  if(typeof dbFirestore === "undefined" || !dbFirestore) return Promise.resolve();
  return dbFirestore.collection("config").doc("exportacion_clientes").set({
    clave: nuevaClave,
  }).catch(err => {
    console.error("Error guardando la clave de exportación de clientes en Firestore:", err);
  });
}

/* La información de "tienda" (nombre, dirección, número de asesor, Metro Galerías)
   ahora es parte del registro del cliente — se captura al crear el cliente,
   en el apartado que solo ven los administradores. */
function tiendaLabel(c){

  if(!c) return "-";
  return c.comercio + (c.numeroAsesor ? " - " + c.numeroAsesor : "");
}

/* Devuelve el registro de cliente (con su info de tienda) para la cuenta logueada */
function clienteActualObj(){
  return CLIENTES.find(c => c.comercio === CLIENTE_ACTUAL) || null;
}

/* Resuelve el registro de empleado (Super Administrativo / Administrativo / Piloto)
   que representa a la cuenta logueada en este prototipo. Se busca por el ID
   exacto guardado al iniciar sesión (EMPLEADO_ACTUAL_ID) — buscar solo por
   rol (state.role) es incorrecto en cuanto hay más de un empleado con el
   mismo rol, porque siempre encontraría al primero del arreglo sin importar
   quién inició sesión realmente. */
function empleadoActualObj(){
  const porId = EMPLEADOS.find(e => e.id === EMPLEADO_ACTUAL_ID);
  if(porId) return porId;
  return EMPLEADOS.find(e => e.rol === state.role) || null;
}

/* Nombre corto para mostrar en la barra superior: primer nombre del empleado
   logueado (Super Administrativo/Administrativo/Piloto), nombre del comercio
   si es un Cliente, o el rol como respaldo si no hay perfil resuelto. */
function nombreCortoUsuarioActual(){
  if(state.role === "Cliente"){
    const c = clienteActualObj();
    return c ? c.comercio : state.role;
  }
  const emp = empleadoActualObj();
  return emp ? emp.nombre.split(" ")[0] : state.role;
}

/* Iniciales (1-2 letras) para el avatar del panel de sesión activa del menú
   lateral: iniciales del nombre del comercio si es un Cliente, o iniciales
   del nombre completo del empleado logueado. */
function inicialesUsuarioActual(){
  let base = "";
  if(state.role === "Cliente"){
    const c = clienteActualObj();
    base = c ? c.comercio : state.role;
  }else{
    const emp = empleadoActualObj();
    base = emp ? emp.nombre : state.role;
  }
  const partes = base.trim().split(/\s+/).filter(Boolean);
  if(partes.length === 0) return "?";
  if(partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
  return (partes[0][0] + partes[1][0]).toUpperCase();
}

/* Nombre del perfil que está creando la guía en este momento: el nombre de la
   tienda si es un Cliente, o el nombre del perfil del usuario administrativo
   (Super Administrativo/Administrativo) si es quien la está generando. */
function creadorActual(){
  if(state.role === "Cliente"){
    const c = clienteActualObj();
    return { nombre: c ? tiendaLabel(c) : CLIENTE_ACTUAL, tipo: "Tienda" };
  }
  const emp = empleadoActualObj();
  return { nombre: emp ? emp.nombre : state.role, tipo: "Usuario administrativo" };
}

/* Texto a mostrar en la columna "Creado por": el nombre del perfil que
   generó la guía, dejando en evidencia si fue una tienda o un usuario
   administrativo. */
function creadoPorTexto(g){
  if(!g.creadoPor) return "-";
  return esc(g.creadoPor) + (g.creadoPorTipo ? ` <span style="color:#94a3b8;font-weight:400;">(${esc(g.creadoPorTipo)})</span>` : "");
}

/* Resuelve la tienda/cliente para el cual se está creando la guía:
   - Cliente: siempre su propia cuenta.
   - Super Administrativo / Administrativo: el cliente que hayan buscado
     y seleccionado en el buscador de "Crear Guía". */
function tiendaParaCrearGuia(){
  if(state.role === "Cliente") return clienteActualObj();
  return CLIENTES.find(c => c.id === state.crearGuiaTiendaId) || null;
}

/* Contenido dinámico del campo "Dirección del cliente" en Crear Guía: cambia
   según si la tienda es Metro Galerías (y su tipo de envío ECO/PLUS/NRM) o
   Lockers. Se separa en su propia función para poder actualizar solo este
   pedazo del formulario (sin re-renderizar toda la pantalla y borrar lo que
   el usuario ya escribió en los demás campos). */
function campoDireccionGuiaDinamicoHtml(tiendaSel){
  if(tiendaSel && tiendaSel.metrogaleria && state.tipoEnvioTemp === "PLUS"){
    return `
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select id="f_plusTipoPunto" style="flex:1;min-width:160px;">${puntosPlusOptions("")}</select>
        <input id="f_plusComplemento" type="text" placeholder="Ej. San Vicente / Puma Ateos" style="flex:1;min-width:160px;" />
      </div>
      <small class="hint">Envío PLUS: solo puedes elegir el tipo de punto (Parque, Gasolinera, Metrocentro, Alcaldía, Centro Comercial El Encuentro o Rambla) y escribir el complemento del nombre — no una dirección libre. Ej.: "Alcaldía de San Vicente", "Gasolinera Puma Ateos". Indica también el municipio y departamento abajo.</small>
    `;
  }
  if(tiendaSel && tiendaSel.metrogaleria && state.tipoEnvioTemp === "ECO"){
    return `
      <div class="search-box" style="margin-bottom:8px;display:flex;align-items:center;gap:6px;">
        <span>🔎</span>
        <input type="text" id="f_direccionBusqueda" placeholder="Buscar agencia / hub por nombre o dirección..." value="${esc(state.busquedaAgenciaDireccionGuia || "")}" oninput="filtrarAgenciasDireccionGuia(this.value)" style="flex:1;" />
        <button type="button" class="btn-link" onclick="limpiarBusquedaAgenciasDireccionGuia()">✕ Ver todas</button>
      </div>
      <select id="f_direccion">${opcionesAgenciasFiltradas("", state.busquedaAgenciaDireccionGuia || "")}</select>
      <small class="hint">Envío ECO: solo puedes seleccionar una de las agencias/hubs del catálogo (${AGENCIAS_XPRESS.length} disponibles), no se permite escribir una dirección libre. Usa el buscador para encontrarla más rápido o toca "Ver todas" para quitar el filtro.</small>
    `;
  }
  if(tiendaSel && (tiendaSel.metrogaleria || tiendaSel.lockers)){
    return `
      <select id="f_direccion">${agenciasDireccionOptions("")}</select>
      <small class="hint">${tiendaSel.metrogaleria ? "Esta tienda es Metro Galerías" : "Esta tienda es Lockers"}: solo puedes seleccionar una de las agencias/hubs del catálogo, no se permite escribir una dirección libre.</small>
    `;
  }
  return `
    <textarea id="f_direccion" rows="2" placeholder="Dirección exacta de recolección o entrega" oninput="onDireccionGuiaTexto(this.value)">${esc(state.direccionGuiaTexto || "")}</textarea>
    <small class="hint" style="display:block;margin-top:8px;">El punto en el mapa se ubica automáticamente según el Departamento seleccionado abajo — no se marca manualmente.</small>
    <div id="mapaDireccionGuia" style="height:220px;border-radius:10px;overflow:hidden;margin-top:10px;border:1px solid var(--border);background:var(--offwhite);"></div>
  `;
  /* Nota: el texto "Agencia asignada automáticamente..." ya NO se muestra
     aquí para ningún rol (ni Cliente ni administrativos) mientras se crea
     la guía. El cálculo por cercanía (agenciaMasCercana) se sigue haciendo
     y guardando en segundo plano al enviar la guía (ver enviarGuia); el
     control de qué agencia queda asignada se revisa/corrige después, ya
     creada la guía, desde el detalle (campo "Agencia asignada" que solo ven
     los roles administrativos — ver screenEditarGuiaDetalleForm). */
}

/* Genera las <option> del selector manual de "Agencia asignada" que solo ven
   los roles administrativos en el detalle de una guía, para asignar o
   corregir a mano la agencia/hub de control de traslado (sin que el Cliente
   la vea nunca). Se identifica por el número de agencia, no por dirección,
   para no chocar con agenciasDireccionOptions. */
function agenciaAsignadaManualOptions(direccionSeleccionada){
  const placeholder = `<option value="" ${!direccionSeleccionada ? "selected" : ""}>— Sin agencia asignada —</option>`;
  const opciones = AGENCIAS_XPRESS.map(a => {
    const label = a.num + " — " + a.nombre + " (" + a.direccion + ")";
    return `<option value="${esc(a.direccion)}" ${direccionSeleccionada === a.direccion ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  return placeholder + opciones;
}

/* Genera las <option> del selector de agencia/dirección restringida, usado
   para clientes Metro Galerías y clientes Lockers en Crear Guía. */
function agenciasDireccionOptions(seleccionada){
  const placeholder = `<option value="" ${!seleccionada ? "selected" : ""} disabled>Selecciona una agencia / hub...</option>`;
  const opciones = AGENCIAS_XPRESS.map(a => {
    const label = a.num + " — " + a.nombre + " (" + a.direccion + ")";
    return `<option value="${esc(a.direccion)}" ${seleccionada === a.direccion ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  return placeholder + opciones;
}

/* Filtra en vivo las opciones del <select id="f_direccion"> (catálogo de
   agencias/hubs) según lo que escriba el usuario en el buscador que se
   muestra para envíos ECO de Metro Galerías. Busca por número, nombre o
   dirección de la agencia. Si la agencia ya seleccionada sigue estando
   dentro de los resultados filtrados, se conserva seleccionada. */
/* Limpia el campo de búsqueda de agencias/hubs (botón "✕ Ver todas") y
   restaura el <select id="f_direccion"> a la lista completa de las 37
   agencias, sin perder la que ya estuviera seleccionada. */
function limpiarBusquedaAgenciasDireccionGuia(){
  const input = document.getElementById("f_direccionBusqueda");
  if(input) input.value = "";
  filtrarAgenciasDireccionGuia("");
}

/* Genera las <option> del catálogo de agencias/hubs ya filtradas por texto
   de búsqueda. Se usa tanto al escribir en el buscador (filtrarAgenciasDireccionGuia)
   como al construir el HTML inicial del campo (campoDireccionGuiaDinamicoHtml),
   para que un re-render disparado por Firestore (sincronización de guías,
   clientes, notificaciones, etc. — ver iniciarSincronizacionGuias y similares)
   respete el filtro que el usuario ya había escrito, en vez de volver a
   mostrar siempre las 37 agencias sin filtrar. */
function opcionesAgenciasFiltradas(seleccionada, textoBusqueda){
  const q = (textoBusqueda || "").trim().toLowerCase();
  const lista = q ? AGENCIAS_XPRESS.filter(a =>
    a.nombre.toLowerCase().includes(q) ||
    a.direccion.toLowerCase().includes(q) ||
    a.num.toLowerCase().includes(q)
  ) : AGENCIAS_XPRESS;
  const seSigueViendo = lista.some(a => a.direccion === seleccionada);
  const placeholder = `<option value="" ${!seSigueViendo ? "selected" : ""} disabled>${lista.length ? "Selecciona una agencia / hub..." : "Sin resultados para tu búsqueda"}</option>`;
  const opciones = lista.map(a => {
    const label = a.num + " — " + a.nombre + " (" + a.direccion + ")";
    return `<option value="${esc(a.direccion)}" ${seSigueViendo && seleccionada === a.direccion ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  return placeholder + opciones;
}

function filtrarAgenciasDireccionGuia(valor){
  /* Se guarda en state (no solo en el DOM) para que, si mientras el usuario
     está escribiendo llega una actualización en vivo de Firestore que fuerza
     un render() completo de la pantalla, el campo de búsqueda y la lista
     filtrada se reconstruyan igual — antes se perdía el filtro y volvían a
     aparecer las 37 agencias aunque el texto siguiera escrito en el input. */
  state.busquedaAgenciaDireccionGuia = valor || "";
  const select = document.getElementById("f_direccion");
  if(!select) return;
  select.innerHTML = opcionesAgenciasFiltradas(select.value, valor);
}

/* ============ MAPA REAL EN CREAR GUÍA + ASIGNACIÓN AUTOMÁTICA DE AGENCIA ============
   Para clientes de dirección libre (no Metro Galerías / no Lockers), se
   muestra un mapa real (Leaflet + OpenStreetMap) donde el cliente marca el
   punto exacto de recolección/entrega tocando el mapa. En cuanto hay un
   punto marcado, se calcula con Haversine cuál agencia/hub de
   AGENCIAS_XPRESS queda más cerca y se guarda para asignarse
   automáticamente a la guía al enviarla (ver enviarGuia). */
let mapaDireccionGuiaInstancia = null;
let marcadorDireccionGuia = null;
let marcadorAgenciaGuia = null; // marcador fijo (no editable) que solo señala en el mapa dónde está la agencia/hub más cercana ya asignada; se dibuja para todos los roles, incluido Cliente.

function onDireccionGuiaTexto(valor){
  state.direccionGuiaTexto = valor;
}

/* Texto informativo bajo el mapa: muestra la agencia asignada en cuanto hay
   un punto marcado, o invita a marcar uno mientras tanto. */
function agenciaCercanaInfoHtml(){
  if(!state.direccionGuiaLat || !state.direccionGuiaLng){
    return "Aún no marcas tu ubicación en el mapa: en cuanto lo hagas, el sistema te asignará automáticamente la agencia Xpress más cercana.";
  }
  if(!state.agenciaCercana) return "Calculando la agencia más cercana...";
  return `📍 Agencia asignada automáticamente: <b>${esc(state.agenciaCercana.nombre)}</b> — a ${state.agenciaCercanaDistancia} km de tu ubicación marcada.`;
}

/* Recalcula (Haversine) la agencia más cercana al punto marcado y refresca
   solo el texto informativo, sin re-renderizar todo el mapa. */
function actualizarAgenciaCercanaGuia(lat, lng){
  state.direccionGuiaLat = lat;
  state.direccionGuiaLng = lng;
  const resultado = agenciaMasCercana({ lat, lng });
  state.agenciaCercana = resultado ? resultado.agencia : null;
  state.agenciaCercanaDistancia = resultado ? resultado.distanciaKm : null;
  const info = document.getElementById("agenciaCercanaInfo");
  if(info) info.innerHTML = agenciaCercanaInfoHtml();
  colocarMarcadorAgenciaGuia();
}

/* Dibuja (o actualiza) en el mapa un marcador fijo — sin arrastre, sin click,
   sin popup ni texto — que solo señala visualmente dónde está ubicada la
   agencia/hub ya asignada automáticamente como la más cercana al punto
   marcado. No es editable: ningún usuario puede moverlo ni cambiar la
   asignación desde el mapa, solo ver el punto. Aplica igual para todos los
   roles, incluido el Cliente — lo único que no se muestra a Cliente es el
   texto con el nombre/distancia de la agencia (ver agenciaCercanaInfoHtml). */
function colocarMarcadorAgenciaGuia(){
  if(!mapaDireccionGuiaInstancia) return;
  if(!state.agenciaCercana){
    if(marcadorAgenciaGuia){ mapaDireccionGuiaInstancia.removeLayer(marcadorAgenciaGuia); marcadorAgenciaGuia = null; }
    return;
  }
  const pos = [state.agenciaCercana.lat, state.agenciaCercana.lng];
  if(marcadorAgenciaGuia){
    marcadorAgenciaGuia.setLatLng(pos);
  }else{
    const iconoAgencia = L.divIcon({
      className: "",
      html: '<div style="font-size:22px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));">🏢</div>',
      iconSize: [22,22],
      iconAnchor: [11,20]
    });
    marcadorAgenciaGuia = L.marker(pos, { icon: iconoAgencia, draggable:false, interactive:false, keyboard:false }).addTo(mapaDireccionGuiaInstancia);
  }
}

/* Coloca (o mueve) el marcador del mapa y dispara el recálculo de agencia.
   El punto ya NO lo marca el usuario (ni tocando el mapa ni con el GPS):
   se coloca automáticamente según el Departamento seleccionado (ver
   ubicarDireccionGuiaPorDepartamento) y el marcador no es arrastrable. */
function colocarMarcadorDireccionGuia(lat, lng){
  if(!mapaDireccionGuiaInstancia) return;
  if(marcadorDireccionGuia){
    marcadorDireccionGuia.setLatLng([lat, lng]);
  }else{
    marcadorDireccionGuia = L.marker([lat, lng], { draggable:false, interactive:false, keyboard:false }).addTo(mapaDireccionGuiaInstancia);
  }
  mapaDireccionGuiaInstancia.setView([lat, lng], 14);
  actualizarAgenciaCercanaGuia(lat, lng);
}

/* Ubica automáticamente el punto en el mapa según el Departamento Y
   Municipio seleccionados en el formulario (el usuario ya no marca el punto
   manualmente). Antes solo miraba el Departamento, así que cambiar de
   Municipio dentro del mismo Departamento no movía el punto ni recalculaba
   la agencia — por eso, por ejemplo, una guía para Chalchuapa terminaba
   asignada igual que una para Santa Ana centro. Se llama al iniciar el mapa
   y cada vez que cambia el Departamento o el Municipio en Crear Guía. */
function ubicarDireccionGuiaPorMunicipio(depto, municipio){
  const centro = centroMunicipio(depto, municipio);
  if(centro) colocarMarcadorDireccionGuia(centro.lat, centro.lng);
}
/* Se mantiene por compatibilidad con quien la siga llamando solo con el
   departamento (usa el primer municipio de la lista de ese departamento). */
function ubicarDireccionGuiaPorDepartamento(depto){
  const municipios = DEPTOS_MUNICIPIOS[depto] || [];
  ubicarDireccionGuiaPorMunicipio(depto, municipios[0]);
}

/* Se llama al final de render() cada vez que la pantalla activa es Crear
   Guía y la tienda usa dirección libre. Como el mapa vive dentro de un div
   que se reemplaza por completo en cada render (innerHTML), el mapa de
   Leaflet debe reconstruirse cada vez — por eso se destruye la instancia
   anterior antes de crear una nueva. */
function initMapaDireccionGuia(){
  const el = document.getElementById("mapaDireccionGuia");
  if(!el || typeof L === "undefined") return;
  if(mapaDireccionGuiaInstancia){ mapaDireccionGuiaInstancia.remove(); mapaDireccionGuiaInstancia = null; marcadorDireccionGuia = null; marcadorAgenciaGuia = null; }
  const centro = (state.direccionGuiaLat && state.direccionGuiaLng)
    ? [state.direccionGuiaLat, state.direccionGuiaLng]
    : [13.6929, -89.2182]; // San Salvador por defecto
  mapaDireccionGuiaInstancia = L.map(el, { attributionControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false, touchZoom:false, boxZoom:false }).setView(centro, state.direccionGuiaLat ? 14 : 9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18 }).addTo(mapaDireccionGuiaInstancia);
  if(state.direccionGuiaLat && state.direccionGuiaLng){
    colocarMarcadorDireccionGuia(state.direccionGuiaLat, state.direccionGuiaLng);
  }else{
    const deptoSel = document.getElementById("f_departamento");
    const municipioSel = document.getElementById("f_municipio");
    ubicarDireccionGuiaPorMunicipio(deptoSel ? deptoSel.value : "San Salvador", municipioSel ? municipioSel.value : null);
  }
  setTimeout(() => { if(mapaDireccionGuiaInstancia) mapaDireccionGuiaInstancia.invalidateSize(); }, 150);
}

/* Limpia el estado del mapa de dirección al salir/reiniciar Crear Guía. */
function reiniciarUbicacionDireccionGuia(){
  state.direccionGuiaTexto = "";
  state.direccionGuiaLat = null;
  state.direccionGuiaLng = null;
  state.agenciaCercana = null;
  state.agenciaCercanaDistancia = null;
  if(mapaDireccionGuiaInstancia){ mapaDireccionGuiaInstancia.remove(); mapaDireccionGuiaInstancia = null; marcadorDireccionGuia = null; marcadorAgenciaGuia = null; }
}

/* Construye el texto final de la dirección PLUS a partir del tipo de punto
   elegido y el complemento (nombre propio) que escribió el usuario. */
function construirDireccionPuntoPlus(tipoPuntoValue, complemento){
  const punto = PUNTOS_PLUS.find(p => p.value === tipoPuntoValue);
  if(!punto || !complemento) return "";
  const comp = complemento.trim();
  return punto.conector ? `${punto.prefijo} ${punto.conector} ${comp}` : `${punto.prefijo} ${comp}`;
}

function paqueteValorCero(g){
