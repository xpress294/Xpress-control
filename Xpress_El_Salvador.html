  `;
}

function verDetalleCliente(id){
  state.clienteDetalleId = id;
  state.clienteEditandoId = null;
  const cont = document.getElementById("clientesTablaWrap");
  if(cont) cont.innerHTML = clientesTablaWrapHtml();
}
function cerrarDetalleCliente(){
  state.clienteDetalleId = null;
  const cont = document.getElementById("clientesTablaWrap");
  if(cont) cont.innerHTML = clientesTablaWrapHtml();
}

function renderDetalleClienteCard(){
  const c = CLIENTES.find(x => x.id === state.clienteDetalleId);
  if(!c) return "";
  const esRolAdmin = state.role === "Super Administrativo" || state.role === "Administrativo";

  const fila = (label, valor) => `
    <div class="detail-item"><label>${label}</label><div>${valor === null || valor === undefined || valor === "" ? "—" : valor}</div></div>
  `;

  return `
    <div class="card pad" style="margin-top:16px;max-width:760px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:44px;height:44px;border-radius:9px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f8fafc;flex-shrink:0;">
            ${c.logo ? `<img src="${c.logo}" alt="Logo" style="width:100%;height:100%;object-fit:contain;" />` : `<span style="font-size:16px;">🏪</span>`}
          </div>
          <p style="margin:0;font-size:15px;font-weight:800;color:var(--navy);">${esc(c.comercio)}</p>
        </div>
        <button class="btn-link" onclick="cerrarDetalleCliente()">✖ Cerrar</button>
      </div>

      <p style="margin:0 0 8px 0;font-size:12.5px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;">Datos personales</p>
      <div class="detail-grid">
        ${fila("Comercio / Cliente", esc(c.comercio))}
        ${fila("ID", esc(c.id))}
        ${fila("Teléfono", esc(c.telefono))}
        ${fila("Correo", esc(c.correo))}
        ${fila("Fecha de registro", esc(c.fechaRegistro))}
      </div>

      <p style="margin:18px 0 8px 0;font-size:12.5px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;">Historial</p>
      <div class="detail-grid">
        ${fila("Creado el", esc(c.fechaRegistro))}
        ${fila("Creado por", c.creadoPor ? esc(c.creadoPor) : "—")}
      </div>

      <p style="margin:18px 0 8px 0;font-size:12.5px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;">Dirección</p>
      <div class="detail-grid">
        ${fila("Departamento", esc(c.departamento))}
        ${fila("Municipio", esc(c.municipio))}
        ${fila("Dirección exacta", esc(c.direccion))}
      </div>

      <p style="margin:18px 0 8px 0;font-size:12.5px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;">Otros datos</p>
      <div class="detail-grid">
        ${fila("N° de asesor", c.numeroAsesor ? esc(c.numeroAsesor) + " 🔒" : "—")}
        ${fila("Asesor", esc(c.nombreAsesor))}
        ${fila("Tel. asesor", esc(c.telefonoAsesor))}
        ${fila("Tarifa de envío", c.metrogaleria ? "No aplica" : "$" + (c.tarifaEnvio ?? TARIFA_ENVIO_DEFAULT).toFixed(2) + " 🔒")}
        ${fila("Comisión", c.metrogaleria ? "No aplica" : (c.comision ?? COMISION_DEFAULT) + "% 🔒")}
        ${fila("Tipo especial", c.metrogaleria ? "🏬 Metro Galerías" : (c.lockers ? "📦 Lockers" : "No"))}
        ${esRolAdmin ? fila("VIP", esClienteVip(c) ? "Sí" : "No") : ""}
        ${fila("Rol", "Cliente")}
      </div>

      <div style="display:flex;gap:10px;margin-top:16px;">
        ${esRolAdmin ? `<button class="btn btn-navy" onclick="cerrarDetalleCliente();abrirEdicionCliente('${c.id}')">✏️ Editar</button>` : ""}
        <button class="btn btn-outline" onclick="cerrarDetalleCliente()">Cerrar</button>
      </div>
    </div>
  `;
}

function abrirEdicionCliente(id){
  state.clienteDetalleId = null;
  state.clienteEditandoId = id;
  state.clienteEditMotivoForzado = "";
  const cont = document.getElementById("clientesTablaWrap");
  if(cont) cont.innerHTML = clientesTablaWrapHtml();
}
function cerrarEdicionCliente(){
  state.clienteEditandoId = null;
  const cont = document.getElementById("clientesTablaWrap");
  if(cont) cont.innerHTML = clientesTablaWrapHtml();
}

function renderEditarClienteCard(){
  const c = CLIENTES.find(x => x.id === state.clienteEditandoId);
  if(!c) return "";
  const esRolAdmin = state.role === "Super Administrativo" || state.role === "Administrativo";

  const primerDeptoCliente = Object.keys(DEPTOS_MUNICIPIOS)[6]; // San Salvador por defecto
  const deptoActualCliente = DEPTOS_MUNICIPIOS[c.departamento] ? c.departamento : primerDeptoCliente;
  const camposHtml = (deshabilitado) => `
    <div class="form-grid">
      <div class="field full">
        <label>Nombre del comercio o cliente</label>
        <input id="ce_comercio" type="text" value="${esc(c.comercio)}" ${deshabilitado ? "disabled" : ""} />
      </div>
      <div class="field">
        <label>Teléfono</label>
        <input id="ce_telefono" type="tel" value="${esc(c.telefono)}" ${deshabilitado ? "disabled" : ""} />
      </div>
      <div class="field">
        <label>Correo</label>
        <input id="ce_correo" type="email" value="${esc(c.correo)}" ${deshabilitado ? "disabled" : ""} />
      </div>
      <div class="field full">
        <label>Dirección</label>
        <textarea id="ce_direccion" rows="2" ${deshabilitado ? "disabled" : ""}>${esc(c.direccion)}</textarea>
      </div>
      <div class="field">
        <label>Departamento</label>
        <select id="ce_departamento" onchange="onDepartamentoChange('ce_departamento','ce_municipio')" ${deshabilitado ? "disabled" : ""}>${departamentoOptions(deptoActualCliente)}</select>
      </div>
      <div class="field">
        <label>Municipio</label>
        <select id="ce_municipio" ${deshabilitado ? "disabled" : ""}>${municipioOptions(deptoActualCliente, c.municipio)}</select>
      </div>
      ${!c.metrogaleria ? `
      <div class="field">
        <label>Nombre del asesor</label>
        <input id="ce_asesor_nombre" type="text" value="${esc(c.nombreAsesor)}" ${deshabilitado ? "disabled" : ""} />
      </div>
      <div class="field">
        <label>Teléfono del asesor</label>
        <input id="ce_asesor_telefono" type="tel" value="${esc(c.telefonoAsesor)}" ${deshabilitado ? "disabled" : ""} />
      </div>
      ` : ""}
      <div class="field">
        <label>N° de asesor</label>
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="text" value="${esc(c.numeroAsesor || "—")}" disabled />
          ${state.role === "Super Administrativo" ? `<button type="button" class="btn-link" style="white-space:nowrap;" onclick="cambiarNumeroAsesorCliente('${c.id}')">🔓 Cambiar</button>` : `<span title="Solo el Super Administrativo puede cambiarlo">🔒</span>`}
        </div>
      </div>
      ${!c.metrogaleria ? `
      <div class="field">
        <label>Comisión (%)</label>
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="text" value="${esc(String(c.comision ?? COMISION_DEFAULT))}%" disabled />
          ${state.role === "Super Administrativo" ? `<button type="button" class="btn-link" style="white-space:nowrap;" onclick="cambiarComisionCliente('${c.id}')">🔓 Cambiar</button>` : `<span title="Solo el Super Administrativo puede cambiarla">🔒</span>`}
        </div>
      </div>
      ` : ""}
    </div>
  `;

  const logoHtml = esRolAdmin ? `
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border);">
      <div style="width:64px;height:64px;border-radius:9px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f8fafc;flex-shrink:0;">
        ${c.logo ? `<img src="${c.logo}" alt="Logo" style="width:100%;height:100%;object-fit:contain;" />` : `<span style="font-size:11px;color:#94a3b8;">Sin logo</span>`}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <label class="btn btn-outline" style="cursor:pointer;display:inline-block;">
          📤 ${c.logo ? "Cambiar logo" : "Subir logo"}
          <input type="file" accept="image/*" style="display:none;" onchange="subirLogoClienteAdmin(this,'${c.id}')" />
        </label>
        ${c.logo ? `<button class="btn-link" style="color:#dc2626;" onclick="quitarLogoClienteAdmin('${c.id}')">🗑️ Quitar logo</button>` : ""}
      </div>
    </div>` : "";

  return `
    <div class="card pad" style="margin-top:16px;max-width:760px;">
      <p style="margin:0 0 14px 0;font-size:13px;color:#64748b;">Editando <strong>${esc(c.comercio)}</strong></p>
      ${logoHtml}
      ${camposHtml(!esRolAdmin)}
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn btn-navy" onclick="guardarEdicionCliente()">💾 Guardar cambios</button>
        <button class="btn btn-outline" onclick="cerrarEdicionCliente()">Cancelar</button>
      </div>
    </div>
  `;
}

function leerCamposEdicionCliente(c){
  c.comercio = val("ce_comercio") || c.comercio;
  c.telefono = val("ce_telefono") || c.telefono;
  c.correo = val("ce_correo") || c.correo;
  c.direccion = val("ce_direccion") || c.direccion;
  c.departamento = val("ce_departamento") || c.departamento;
  c.municipio = val("ce_municipio") || c.municipio;
  c.nombreAsesor = val("ce_asesor_nombre") || c.nombreAsesor;
  c.telefonoAsesor = val("ce_asesor_telefono") || c.telefonoAsesor;
}

function guardarEdicionCliente(){
  const c = CLIENTES.find(x => x.id === state.clienteEditandoId);
  if(!c) return;
  if(state.role !== "Super Administrativo" && state.role !== "Administrativo"){
    mostrarNotificacion("No tienes permiso para editar este cliente.");
    return;
  }
  leerCamposEdicionCliente(c);
  guardarClienteEnFirestore(c);
  state.clienteEditandoId = null;
  render();
}

function toggleVipManualCliente(id){
  if(state.role !== "Super Administrativo"){
    mostrarNotificacion("Solo el Super Administrativo puede marcar o quitar el VIP manual.");
    render();
    return;
  }
  const c = CLIENTES.find(x => x.id === id);
  if(c){
    c.vipManual = !c.vipManual;
    guardarClienteEnFirestore(c);
  }
  const cont = document.getElementById("clientesTablaWrap");
  if(cont) cont.innerHTML = clientesTablaWrapHtml();
}

function setMetrogaleriaCliente(value){
  state.metrogaleriaTemp = value;
  if(value === "Sí") state.lockersTemp = "No";
  actualizarTogglesMetroLockersCliente();
}

function setLockersCliente(value){
  state.lockersTemp = value;
  if(value === "Sí") state.metrogaleriaTemp = "No";
  actualizarTogglesMetroLockersCliente();
}

function setCondicionesEspecialesCliente(value){
  state.condicionesEspecialesTemp = value;
  const condNo = document.getElementById("condesp_no");
  const condSi = document.getElementById("condesp_si");
  if(condNo && condSi){
    condNo.className = "fragil-btn" + (value === "No" ? " active-no" : "");
    condSi.className = "fragil-btn" + (value === "Sí" ? " active-si" : "");
  }
  const campoDetalle = document.getElementById("campo_condesp_detalle");
  if(campoDetalle){
    campoDetalle.style.display = value === "Sí" ? "" : "none";
  }
}

/* Actualiza únicamente los controles de "¿Es Metro Galerías?" / "¿Es
   Lockers?" y los campos de tarifa/comisión que dependen de ellos, sin
   volver a renderizar toda la pantalla — así no se borra lo que ya se
   escribió en el resto del formulario (nombre del comercio, teléfono,
   correo, dirección, código de asesor, etc.). */

const CODIGOS_ASESOR_PALABRAS = ["ENVIO UNICO","PERSONALIZADO","LOCKERS","METROGALERIA"];
const MENSAJE_CODIGO_ASESOR_INVALIDO = "El código de asesor debe ser un número entre 100 y 200, o una de estas palabras: ENVIO UNICO, PERSONALIZADO, LOCKERS, METROGALERIA.";

function filtrarCodigoAsesor(el){
  el.value = el.value.toUpperCase().replace(/[^0-9A-Z ]/g, "");
}

function codigoAsesorValido(valor){
  const v = (valor || "").trim().toUpperCase();
  if(!v) return false;
  if(CODIGOS_ASESOR_PALABRAS.includes(v)) return true;
  if(/^\d+$/.test(v)){
    const n = parseInt(v, 10);
    return n >= 100 && n <= 200;
  }
  return false;
}

function guardarCliente(){
  const comercio = val("c_comercio");
  const identificacion = val("c_identificacion");
  const telefono = val("c_telefono");
  const correo = val("c_correo");
  const direccion = val("c_direccion");
  const password = val("c_password");
  const esMetro = state.metrogaleriaTemp === "Sí";
  const numeroAsesor = val("c_asesor").trim().toUpperCase();
  const nombreAsesor = val("c_asesor_nombre");
  const telefonoAsesor = val("c_asesor_telefono");
  if(!comercio || !telefono || !correo || !direccion || !password){
    mostrarNotificacion("Completa todos los campos obligatorios.");
    return;
  }
  if(CLIENTES.some(c => c.comercio.trim().toLowerCase() === comercio.trim().toLowerCase())){
    mostrarNotificacion("Nombre existente. Ya hay un cliente/comercio registrado con ese nombre.");
    return;
  }
  if(!esMetro){
    if(!numeroAsesor){
      mostrarNotificacion("Ingresa el código de asesor de la tienda del cliente.");
      return;
    }
    if(!codigoAsesorValido(numeroAsesor)){
      mostrarNotificacion(MENSAJE_CODIGO_ASESOR_INVALIDO);
      return;
    }
    if(!nombreAsesor || !telefonoAsesor){
      mostrarNotificacion("Ingresa el nombre y el teléfono del asesor para que el cliente pueda contactarlo.");
      return;
    }
  }
  const esCondEspeciales = state.condicionesEspecialesTemp === "Sí";
  const condicionesEspecialesDetalle = val("c_condesp_detalle").trim();
  if(esCondEspeciales && !condicionesEspecialesDetalle){
    mostrarNotificacion("Escribe el detalle de las condiciones especiales (número de factura, tipo de producto que vende u otra identificación).");
    return;
  }
  if(password.length < 6){
    mostrarNotificacion("La contraseña debe tener al menos 6 caracteres (mínimo requerido por Firebase Authentication).");
    return;
  }
  const esLockers = state.lockersTemp === "Sí";
  const tarifaEnvio = esLockers ? 1.65 : parseFloat(val("c_tarifa"));
  const comision = esLockers ? 0.00 : parseFloat(val("c_comision"));
  const nuevoClienteId = siguienteIdUnico("C-", CLIENTES);
  /* Nota: ya no se guarda password/passwordReal aquí. La contraseña la
     valida Firebase Authentication (ver crearUsuarioAuthSinCerrarSesion),
     nunca queda escrita en el documento de Firestore. */
  const nuevoCliente = {
    id: nuevoClienteId,
    comercio, identificacion, telefono, correo, direccion,
    departamento: val("c_departamento"),
    municipio: val("c_municipio"),
    numeroAsesor,
    nombreAsesor,
    telefonoAsesor,
    metrogaleria: esMetro,
    lockers: esLockers,
    tarifaEnvio: esMetro ? null : (isNaN(tarifaEnvio) ? TARIFA_ENVIO_DEFAULT : tarifaEnvio),
    comision: esMetro ? null : (isNaN(comision) ? COMISION_DEFAULT : comision),
    condicionesEspeciales: esCondEspeciales,
    condicionesEspecialesDetalle: esCondEspeciales ? condicionesEspecialesDetalle : "",
    vipManual: false,
    fechaRegistro: new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" }),
    creadoPor: nombrePerfilParaHistorial(state.role),
  };
  mostrarNotificacion("Creando la cuenta de acceso…");
  crearUsuarioAuthSinCerrarSesion(correo, password)
    .then(uid => guardarUsuarioRol(uid, "Cliente", nuevoClienteId))
    .then(() => {
      CLIENTES.push(nuevoCliente);
      guardarClienteEnFirestore(nuevoCliente);
      state.metrogaleriaTemp = "No";
      state.lockersTemp = "No";
      state.condicionesEspecialesTemp = "No";
      state.mostrarFormCliente = false;
      mostrarNotificacion("Cliente creado correctamente.");
      render();
    })
    .catch(err => {
      console.error("Error creando la cuenta de acceso del cliente:", err);
      mostrarNotificacion(mensajeErrorAuth(err));
    });
}

function descargarPlantillaClientes(){
  const encabezado = "Comercio,Telefono,Correo,Direccion,Departamento,Municipio,CodigoAsesor,NombreAsesor,TelefonoAsesor,MetroGalerias,Lockers,TarifaEnvio,Comision,Password\n";
  const ejemplo = `Empresa Ejemplo,7000-0000,contacto@ejemplo.com,"Col. Escalón, Calle Principal #12",San Salvador,San Salvador,105,Carlos Ramírez,7000-3333,No,No,4.10,2.5,ClaveTemporal123\n`;
  const contenido = "\uFEFF" + encabezado + ejemplo; // BOM para tildes en Excel
  const blob = new Blob([contenido], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Plantilla_Clientes.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function procesarArchivoClientesMasivo(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const texto = String(e.target.result || "");
    const lineas = texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if(lineas.length < 2){
      mostrarNotificacion("El archivo está vacío o no tiene filas de datos debajo del encabezado.");
      return;
    }
    const filas = lineas.slice(1).map(l => parseCSVLine(l));
    crearClientesMasivo(filas);
    input.value = "";
  };
  reader.readAsText(file, "UTF-8");
}

/* Antes esto era un forEach síncrono: por fila válida escribía
   directamente password/passwordReal en el documento del cliente. Ahora
   cada fila necesita, además, crear una cuenta real en Firebase Auth
   (crearUsuarioAuthSinCerrarSesion) — eso es una llamada de red por
   cliente, así que se procesa una fila a la vez (secuencial, con
   await) en vez de todas en paralelo: crear muchas cuentas de golpe desde
   el navegador puede chocar con los límites de tasa de Firebase para
   señales repetidas desde la misma IP/dispositivo. Para lotes grandes (más
   de 20-30 filas) puede tardar unos segundos más que antes; es el costo
   esperado de que ya no haya contraseñas en texto plano. */
async function crearClientesMasivo(filas){
  let creados = 0;
  const errores = [];
  state.mostrarCreacionMasivaClientes = false;
  mostrarNotificacion(`Procesando ${filas.length} fila(s), esto puede tardar unos segundos…`);
  render();

  for(let idx = 0; idx < filas.length; idx++){
    const fila = filas[idx];
    const numeroFila = idx + 2; // +2 porque la fila 1 del archivo es el encabezado
    const [
      comercio, telefono, correo, direccion, departamento, municipio,
      codigoAsesorRaw, nombreAsesor, telefonoAsesor,
      metroRaw, lockersRaw, tarifaRaw, comisionRaw, password,
    ] = fila;

    if(!comercio || !telefono || !correo || !direccion || !password){
      errores.push(`Fila ${numeroFila}: faltan campos obligatorios (Comercio, Telefono, Correo, Direccion o Password).`);
      continue;
    }
    if(password.length < 6){
      errores.push(`Fila ${numeroFila} (${comercio}): la contraseña debe tener al menos 6 caracteres.`);
      continue;
    }
    const codigoAsesor = (codigoAsesorRaw || "").trim().toUpperCase();
    if(!codigoAsesor || !codigoAsesorValido(codigoAsesor)){
      errores.push(`Fila ${numeroFila} (${comercio}): código de asesor inválido. ${MENSAJE_CODIGO_ASESOR_INVALIDO}`);
      continue;
    }
    if(!nombreAsesor || !telefonoAsesor){
      errores.push(`Fila ${numeroFila} (${comercio}): falta el nombre o teléfono del asesor.`);
      continue;
    }
    const yaExiste = CLIENTES.some(c => c.comercio.trim().toLowerCase() === comercio.trim().toLowerCase());
    if(yaExiste){
      errores.push(`Fila ${numeroFila} (${comercio}): ya existe un cliente con ese nombre de comercio, se omitió.`);
      continue;
    }

    const esMetro = ["si","sí"].includes((metroRaw || "").trim().toLowerCase());
    const esLockers = ["si","sí"].includes((lockersRaw || "").trim().toLowerCase());
    const tarifaParsed = parseFloat(tarifaRaw);
    const comisionParsed = parseFloat(comisionRaw);
    const nuevoClienteId = siguienteIdUnico("C-", CLIENTES);
    const nuevoClienteMasivo = {
      id: nuevoClienteId,
      comercio, telefono, correo, direccion,
      departamento: departamento || "-",
      municipio: municipio || "-",
      numeroAsesor: codigoAsesor,
      nombreAsesor, telefonoAsesor,
      metrogaleria: esMetro,
      lockers: esLockers,
      tarifaEnvio: esMetro ? null : (esLockers ? 1.65 : (isNaN(tarifaParsed) ? TARIFA_ENVIO_DEFAULT : tarifaParsed)),
      comision: esMetro ? null : (esLockers ? 0.00 : (isNaN(comisionParsed) ? COMISION_DEFAULT : comisionParsed)),
      vipManual: false,
      fechaRegistro: new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" }),
      creadoPor: nombrePerfilParaHistorial(state.role),
    };
    try{
      const uid = await crearUsuarioAuthSinCerrarSesion(correo, password);
      await guardarUsuarioRol(uid, "Cliente", nuevoClienteId);
      CLIENTES.push(nuevoClienteMasivo);
      guardarClienteEnFirestore(nuevoClienteMasivo);
      creados++;
    }catch(err){
      console.error(`Error creando la cuenta de acceso en la fila ${numeroFila} (${comercio}):`, err);
      errores.push(`Fila ${numeroFila} (${comercio}): ${mensajeErrorAuth(err)}`);
    }
  }

  let msg = `Archivo procesado: ${creados} cliente(s) creado(s) correctamente.`;
  if(errores.length > 0){
    msg += `\n\n⚠️ ${errores.length} fila(s) con problemas:\n` + errores.join("\n");
  }
  mostrarNotificacion(msg);
  render();
}

/* ---- Cambio de contraseña de clientes elegida por el Super Administrativo ---- */
/* Antes esto escribía una contraseña nueva en texto plano directamente en
   el documento de Firestore (passwordReal). Con Firebase Auth real, nadie
   del lado de la app —ni siquiera el Super Administrativo— puede fijar a
   mano la contraseña de otra cuenta desde el navegador (el SDK de cliente
   no lo permite, y no debería: eso es justo lo que hacía insegura la
   versión anterior). Lo correcto es enviarle a cada cliente un correo de
   restablecimiento; ellos mismos eligen la contraseña nueva sin que nadie
   más la vea ni la escriba en Firestore. */
async function confirmarCambioMasivoPasswordsClientes(){
  if(state.role !== "Super Administrativo"){
    mostrarNotificacion("Solo el Super Administrativo puede iniciar el restablecimiento de contraseña de los clientes.");
    return;
  }
  if(CLIENTES.length === 0){
    mostrarNotificacion("No hay clientes registrados todavía.");
    return;
  }
  if(!firebaseAuth){
    mostrarNotificacion("No se pudo conectar con el sistema de autenticación.");
    return;
  }
  const ok = confirm(`Se enviará un correo de restablecimiento de contraseña a los ${CLIENTES.length} clientes registrados. ¿Continuar?`);
  if(!ok) return;
  mostrarNotificacion("Enviando correos de restablecimiento…");
  let enviados = 0;
  const errores = [];
  for(const c of CLIENTES){
    if(!c.correo){ errores.push(`${c.comercio}: sin correo registrado.`); continue; }
    try{
      await firebaseAuth.sendPasswordResetEmail(c.correo);
      enviados++;
    }catch(err){
      errores.push(`${c.comercio} (${c.correo}): ${mensajeErrorAuth(err)}`);
    }
  }
  let msg = `Se enviaron ${enviados} correo(s) de restablecimiento.`;
  if(errores.length) msg += `\n\n⚠️ ${errores.length} con problemas:\n` + errores.join("\n");
  mostrarNotificacion(msg);
  render();
}

function regenerarPasswordCliente(id){
  if(state.role !== "Super Administrativo"){
    mostrarNotificacion("Solo el Super Administrativo puede iniciar el restablecimiento de contraseña de un cliente.");
    return;
  }
  if(!firebaseAuth){
    mostrarNotificacion("No se pudo conectar con el sistema de autenticación.");
    return;
  }
  const c = CLIENTES.find(x => x.id === id);
  if(!c) return;
  if(!c.correo){
    mostrarNotificacion("Este cliente no tiene correo registrado.");
    return;
  }
  const ok = confirm(`¿Enviar un correo de restablecimiento de contraseña a ${c.comercio} (${c.correo})?`);
  if(!ok) return;
  firebaseAuth.sendPasswordResetEmail(c.correo)
    .then(() => mostrarNotificacion(`Correo de restablecimiento enviado a ${c.correo}.`))
    .catch(err => mostrarNotificacion(mensajeErrorAuth(err)));
}

/* ---- Restablecimiento de contraseña de empleados (correo, no texto plano) ---- */

/* Ya no se generan contraseñas aleatorias a mano ni se guardan en
   Firestore: con Firebase Auth real, restablecer la contraseña de otra
   cuenta desde el navegador del admin no es posible (ni deseable) — el
   camino correcto es que Firebase le envíe el enlace directamente a la
   persona dueña de la cuenta. */
async function confirmarCambioMasivoPasswords(){
  if(EMPLEADOS.length === 0){
    mostrarNotificacion("No hay empleados registrados todavía.");
    return;
  }
  if(!firebaseAuth){
    mostrarNotificacion("No se pudo conectar con el sistema de autenticación.");
    return;
  }
  const ok = confirm(`Se enviará un correo de restablecimiento de contraseña a los ${EMPLEADOS.length} empleados registrados. ¿Continuar?`);
  if(!ok) return;
  mostrarNotificacion("Enviando correos de restablecimiento…");
  let enviados = 0;
  const errores = [];
  for(const e of EMPLEADOS){
    if(!e.correo){ errores.push(`${e.nombre}: sin correo registrado.`); continue; }
    try{
      await firebaseAuth.sendPasswordResetEmail(e.correo);
      enviados++;
    }catch(err){
      errores.push(`${e.nombre} (${e.correo}): ${mensajeErrorAuth(err)}`);
    }
  }
  let msg = `Se enviaron ${enviados} correo(s) de restablecimiento.`;
  if(errores.length) msg += `\n\n⚠️ ${errores.length} con problemas:\n` + errores.join("\n");
  mostrarNotificacion(msg);
  render();
}

function regenerarPasswordEmpleado(id){
  const e = EMPLEADOS.find(x => x.id === id);
  if(!e) return;
  if(!firebaseAuth){
    mostrarNotificacion("No se pudo conectar con el sistema de autenticación.");
    return;
  }
  if(!e.correo){
    mostrarNotificacion("Este empleado no tiene correo registrado.");
    return;
  }
  const ok = confirm(`¿Enviar un correo de restablecimiento de contraseña a ${e.nombre} (${e.correo})?`);
  if(!ok) return;
  firebaseAuth.sendPasswordResetEmail(e.correo)
    .then(() => mostrarNotificacion(`Correo de restablecimiento enviado a ${e.correo}.`))
    .catch(err => mostrarNotificacion(mensajeErrorAuth(err)));
}

function guardarEmpleado(){
  const nombre = val("e_nombre");
  const dui = val("e_dui");
  const telefono = val("e_telefono");
  const correo = val("e_correo");
  const password = val("e_password");

  if(!nombre || !dui || !telefono || !correo || !password){
    mostrarNotificacion("Completa todos los campos obligatorios.");
    return;
  }
  if(password.length < 6){
    mostrarNotificacion("La contraseña debe tener al menos 6 caracteres (mínimo requerido por Firebase Authentication).");
    return;
  }
  const nuevoEmpleadoId = siguienteIdUnico("E-", EMPLEADOS);
  // Ya no se guarda "password" en el documento: la valida Firebase Auth.
  const nuevoEmpleado = {
    id: nuevoEmpleadoId,
    nombre, dui, telefono, correo,
    rol,
  };
  mostrarNotificacion("Creando la cuenta de acceso…");
  crearUsuarioAuthSinCerrarSesion(correo, password)
    .then(uid => guardarUsuarioRol(uid, rol, nuevoEmpleadoId))
    .then(() => {
      EMPLEADOS.push(nuevoEmpleado);
      guardarEmpleadoEnFirestore(nuevoEmpleado);
      state.mostrarFormEmpleado = false;
      mostrarNotificacion("Empleado creado correctamente.");
      render();
    })
    .catch(err => {

      mostrarNotificacion(mensajeErrorAuth(err));
    });
}

/* Guarda un destinatario nuevo en DESTINATARIOS evitando duplicados por nombre
   dentro de la misma tienda/cliente. Se usa tanto al agregarlo manualmente desde
   la pantalla de Destinatarios como automáticamente cada vez que un cliente crea
   una guía (incluyendo Guías Xpress 24/h). tiendaId identifica al dueño, para
   que cada cliente solo pueda ver y usar los destinatarios que él mismo ha
   creado. Solo se guardan los datos que interesan del destinatario: nombre,
   teléfono, dirección, municipio y departamento. */
function guardarDestinatarioSiNuevo(nombre, telefono, direccion, departamento, municipio, tiendaId){
  const limpio = (nombre || "").trim();
  if(!limpio) return false;
  const duenio = tiendaId || null;
  const yaExiste = DESTINATARIOS.some(d => d.tiendaId === duenio && d.nombre.trim().toLowerCase() === limpio.toLowerCase());
  if(yaExiste) return false;
  const nuevoDestinatario = {
    id: siguienteIdUnico("D-", DESTINATARIOS),
    nombre: limpio,
    telefono: telefono || "",
    direccion: direccion || "",
    departamento: departamento || "",
    municipio: municipio || "",
    tiendaId: duenio,
  };
  DESTINATARIOS.push(nuevoDestinatario);
  guardarDestinatarioEnFirestore(nuevoDestinatario);
  return true;
}

/* ============ REPORTES ============ */
/* Antes filtraba directamente sobre GUIAS, que para el admin tiene la
   colección completa en memoria. Este reporte en concreto sí se puede
   pedir filtrado en Firestore (estado + piloto son campos indexables de
   igualdad), así que en cuanto dbFirestore esté disponible se pide solo
   ese subconjunto acotado (guías Entregado/Finalizado sin piloto — en
   una operación sana debería ser un número chico, no toda la colección).
   El filtro de fecha (hoy/rango) se sigue aplicando en el navegador sobre
   ese subconjunto ya chico, porque el campo "fecha" se guarda como texto
   "dd/mm/aa" y no se puede usar en una consulta de rango de Firestore tal
   como está.
   Nota para cuando se despliegue: Firestore puede pedir crear un índice
   compuesto la primera vez que corra esta consulta (estado "in" + piloto
   "=="); la consola de Firebase da un enlace directo para crearlo. */
let REPORTE_SIN_PILOTO_ADMIN = null; // null = todavía no se pidió a Firestore
let reporteSinPilotoCargando = false;

function cargarReporteSinPilotoAdmin(){
  if(!dbFirestore || reporteSinPilotoCargando) return;
  reporteSinPilotoCargando = true;
  dbFirestore.collection("guias")
    .where("estado","in",["Entregado","Finalizado"])
    .where("piloto","==","-")
    .get()
    .then(snap => {
      REPORTE_SIN_PILOTO_ADMIN = snap.docs.map(d => d.data()).filter(g => !g.eliminada);
      reporteSinPilotoCargando = false;
      refreshReporteSinPiloto();
    })
    .catch(err => {
      console.error("Error cargando el reporte de entregas sin piloto:", err);
      reporteSinPilotoCargando = false;
    });
}

function entregasSinPilotoFiltered(){
  let data;
  if(dbFirestore && REPORTE_SIN_PILOTO_ADMIN !== null){
    data = REPORTE_SIN_PILOTO_ADMIN;
  } else {
    if(dbFirestore && !reporteSinPilotoCargando) cargarReporteSinPilotoAdmin();
    // mientras llega la respuesta de Firestore (o si no hay Firebase disponible), se usa lo que ya esté en memoria
    data = GUIAS.filter(g => !g.eliminada && (g.estado === "Entregado" || g.estado === "Finalizado") && (!g.piloto || g.piloto === "-"));
  }
  data = aplicarFiltroFecha(data, state.reporteSinPilotoModo, state.reporteSinPilotoDesde, state.reporteSinPilotoHasta);
  return data;
}

function textoFiltroFechaReporteSinPiloto(){
  if(state.reporteSinPilotoModo === "hoy") return "fecha actual";
  if(state.reporteSinPilotoModo === "rango"){
    if(state.reporteSinPilotoDesde && state.reporteSinPilotoHasta) return `${state.reporteSinPilotoDesde} a ${state.reporteSinPilotoHasta}`;
    return "rango de fechas";

  return "histórico";
}

    mostrarNotificacion("✅ Reporte generado: " + lista.length + " guía(s).");
  }catch(err){
    console.error("Error generando reporte Excel:", err);
    mostrarNotificacion("❌ No se pudo generar el reporte.");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "⬇ Descargar Excel histórico"; }
  }
}

/* ============ Helpers de mapa (usados por Inteligencia de Negocio) ============ */
function toXYMapa(loc, width, height){
  const x = (loc.lng - SV_LNG_MIN) / (SV_LNG_MAX - SV_LNG_MIN) * width;
  const y = (SV_LAT_MAX - loc.lat) / (SV_LAT_MAX - SV_LAT_MIN) * height;
  return { x, y };
}

   coordenada real del MUNICIPIO si ya la tenemos en el catálogo de arriba,
   o si no, el centro del departamento como respaldo (comportamiento
   anterior, ya casi nunca debería aplicar con la tabla completa de arriba).
   Centralizar esto en una sola función permite ir ajustando coordenadas
   puntuales sin tocar el resto del código. */
function centroMunicipio(depto, municipio){
  const porMunicipio = MUNICIPIO_COORDS[depto] && MUNICIPIO_COORDS[depto][municipio];
  if(porMunicipio) return porMunicipio;
  return DEPTO_COORDS[depto] || null;
}

/* Patrón horario de referencia (franjas de creación de guías). Sirve de base
   visual mientras el sistema acumula más registros de horas reales de
   creación; se puede sustituir por el conteo real apenas exista suficiente
   volumen de datos en HISTORIAL. */
const PATRON_HORARIO_DEMO = [
  { franja:"6-8h", valor:4 }, { franja:"8-10h", valor:14 }, { franja:"10-12h", valor:22 },
  { franja:"12-14h", valor:18 }, { franja:"14-16h", valor:26 }, { franja:"16-18h", valor:19 },
  { franja:"18-20h", valor:9 }, { franja:"20-22h", valor:3 },
];

function biKPIs(){
  const activas = GUIAS.filter(g => !g.eliminada);
  const total = activas.length;
  const entregadas = activas.filter(g => ["Entregado","Finalizado"].includes(g.estado)).length;
  const enProceso = activas.filter(g => !["Entregado","Finalizado","Devolución","Creado"].includes(g.estado)).length;
  const devoluciones = activas.filter(g => g.estado === "Devolución").length;
  const tasaEntrega = total ? Math.round((entregadas/total)*100) : 0;
  const clientesActivos = new Set(activas.map(g => g.cliente)).size;
  return { total, entregadas, enProceso, devoluciones, tasaEntrega, clientesActivos };
}

function biVolumenPorFecha(){
  const conteo = {};
  GUIAS.filter(g => !g.eliminada).forEach(g => {
    if(!parseFechaGuia(g.fecha)) return;
    conteo[g.fecha] = (conteo[g.fecha]||0) + 1;
  });
  const fechas = Object.keys(conteo).sort((a,b) => parseFechaGuia(a) - parseFechaGuia(b));
  return fechas.map(f => ({ fecha:f, total:conteo[f] }));
}

/* Pronóstico simple por regresión lineal sobre el histórico diario de guías. */
function biPronosticoEnvios(dias){
  dias = dias || 5;
  const historico = biVolumenPorFecha();
  if(historico.length === 0) return { historico:[], pronostico:[], tendencia:"stable" };
  const valores = historico.map(h => h.total);
  const n = valores.length;
  const sumX = valores.reduce((a,_,i) => a+i, 0);
  const sumY = valores.reduce((a,v) => a+v, 0);
  const sumXY = valores.reduce((a,v,i) => a+v*i, 0);
  const sumX2 = valores.reduce((a,_,i) => a+i*i, 0);
  const denom = (n*sumX2 - sumX*sumX) || 1;
  const m = (n*sumXY - sumX*sumY) / denom;
  const b = (sumY - m*sumX) / n;
  const promedio = sumY / n;
  const ultimaFecha = parseFechaGuia(historico[historico.length-1].fecha);
  const pronostico = [];
  for(let i=1;i<=dias;i++){
    const idx = n - 1 + i;
    let val = Math.round(m*idx + b);
    if(!isFinite(val) || val < Math.round(promedio*0.6)) val = Math.round(promedio*0.6);
    const f = new Date(ultimaFecha);
    f.setDate(f.getDate()+i);
    const fechaStr = `${String(f.getDate()).padStart(2,"0")}/${String(f.getMonth()+1).padStart(2,"0")}/${String(f.getFullYear()).slice(-2)}`;
    pronostico.push({ fecha:fechaStr, total:val });
  }
  const tendencia = m > 0.15 ? "up" : (m < -0.15 ? "down" : "stable");
  return { historico, pronostico, tendencia };
}

/* Antes escaneaba TODO GUIAS para contar por departamento. Ahora lee del
   contador pre-calculado (agregados/porDepartamento, ver
   incrementarAgregadoDepartamento) — 1 sola lectura sin importar cuántas
   guías existan. No es un listener en vivo: se pide de nuevo cada vez que
   se entra a la pantalla de Inteligencia de Negocio (ver navigate()). */
let MAPA_CALOR_AGREGADO = null; // null = todavía no se pidió a Firestore
let mapaCalorCargando = false;

function cargarMapaCalorAgregado(){
  if(!dbFirestore || mapaCalorCargando) return;
  mapaCalorCargando = true;
  dbFirestore.collection("agregados").doc("porDepartamento").get()
    .then(snap => {
      MAPA_CALOR_AGREGADO = snap.exists ? snap.data() : {};
      mapaCalorCargando = false;
      render(); // el render ya vuelve a llamar initMapaCalorEntregas() si la vista sigue siendo "inteligencia"
    })
    .catch(err => {
      console.error("Error cargando el contador de mapa de calor:", err);
      mapaCalorCargando = false;
    });
}

function biMapaCalorDepartamentos(){
  if(dbFirestore && MAPA_CALOR_AGREGADO !== null){
    return Object.keys(DEPTO_COORDS).map(d => ({ depto:d, total: MAPA_CALOR_AGREGADO[d] || 0 }));
  }
  if(dbFirestore && !mapaCalorCargando) cargarMapaCalorAgregado();
  // mientras llega la respuesta de Firestore (o si no hay Firebase disponible), se usa lo que ya esté en memoria
  const activas = GUIAS.filter(g => !g.eliminada);
  const conteo = {};
  activas.forEach(g => {
    if(!g.departamento || g.departamento === "-") return;
    conteo[g.departamento] = (conteo[g.departamento]||0) + 1;
  });
  return Object.keys(DEPTO_COORDS).map(d => ({ depto:d, total: conteo[d]||0 }));
}

/* Mapa real (Leaflet + OpenStreetMap) del mapa de calor de entregas por
   departamento, en vez de la silueta SVG dibujada a mano que se usaba antes.
   Sigue el mismo patrón que initMapaDireccionGuia(): como el contenedor se
   reemplaza por completo en cada render (innerHTML), la instancia anterior
   de Leaflet debe destruirse y recrearse cada vez. */
let mapaCalorEntregasInstancia = null;
function initMapaCalorEntregas(){
  const el = document.getElementById("mapaCalorEntregas");
  if(!el || typeof L === "undefined") return;
  if(mapaCalorEntregasInstancia){ mapaCalorEntregasInstancia.remove(); mapaCalorEntregasInstancia = null; }
  const datos = biMapaCalorDepartamentos();
  const maxT = Math.max(...datos.map(d => d.total), 1);
  const centro = [13.85, -88.9];
  mapaCalorEntregasInstancia = L.map(el, { attributionControl:false, scrollWheelZoom:false }).setView(centro, 8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18 }).addTo(mapaCalorEntregasInstancia);
  datos.forEach(d => {
    const coord = DEPTO_COORDS[d.depto];
    if(!coord) return;
    const r = d.total === 0 ? 6 : 10 + (d.total/maxT)*22;
    let fill = "#cbd5e1";
    if(d.total > 0){
      const hue = 45 - (d.total/maxT)*45; // amarillo (bajo) → rojo (alto)
      fill = `hsl(${hue.toFixed(0)},85%,55%)`;
    }
    L.circleMarker([coord.lat, coord.lng], {
      radius: r, color:"#fff", weight:1.5, fillColor: fill, fillOpacity:0.82
    }).addTo(mapaCalorEntregasInstancia)
      .bindTooltip(`${d.depto}: ${d.total} guía(s)`, { direction:"top" });
  });
  /* Agencias/hubs físicos de Xpress (catálogo AGENCIAS_XPRESS), como capa
     aparte encima del calor de entregas — para ubicar dónde está la red de
     agencias frente a dónde se concentra la demanda. */
  const iconoAgenciaBI = L.divIcon({
    className: "",
    html: `<div style="background:#1a2247;color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.4);">🏢</div>`,
    iconSize:[20,20], iconAnchor:[10,10]
  });
  AGENCIAS_XPRESS.forEach(a => {
    L.marker([a.lat, a.lng], { icon: iconoAgenciaBI })
      .addTo(mapaCalorEntregasInstancia)
      .bindTooltip(`🏢 ${a.nombre}`, { direction:"top" });
  });
  setTimeout(() => { if(mapaCalorEntregasInstancia) mapaCalorEntregasInstancia.invalidateSize(); }, 150);
}

function biCrecimientoClientes(){
  const activas = GUIAS.filter(g => !g.eliminada);
  return CLIENTES.map(c => {
    const guiasCliente = activas.filter(g => g.cliente === c.comercio);
    const total = guiasCliente.length;
    const diasDesde = (fechaStr) => {
      const f = parseFechaGuia(fechaStr);
      if(!f) return null;
      return Math.round((FECHA_REF_HOY - f)/86400000);
    };
    const recientes = guiasCliente.filter(g => { const d = diasDesde(g.fecha); return d !== null && d >= 0 && d <= 1; }).length;
    const previas = guiasCliente.filter(g => { const d = diasDesde(g.fecha); return d !== null && d >= 2 && d <= 3; }).length;
    let crecimiento;
    if(previas === 0) crecimiento = recientes > 0 ? 100 : 0;
    else crecimiento = Math.round(((recientes - previas)/previas)*100);
    return { cliente:c.comercio, vip:esClienteVip(c), total, recientes, previas, crecimiento };
  }).sort((a,b) => b.crecimiento - a.crecimiento || b.total - a.total);
}

function biPronosticoChart(historico, pronostico){
  const items = historico.map(h => ({ label:h.fecha, valor:h.total, tipo:"real" }))
    .concat(pronostico.map(p => ({ label:p.fecha, valor:p.total, tipo:"pronostico" })));
  const width = 640, height = 220, padBottom = 30, padTop = 16;
  const maxV = Math.max(...items.map(i => i.valor), 1);
  const gap = width / items.length;
  const barW = gap * 0.6;
  const bars = items.map((it,i) => {
    const h = (it.valor/maxV) * (height - padBottom - padTop);
    const x = i*gap + (gap-barW)/2;
    const y = height - padBottom - h;
    const color = it.tipo === "real" ? "#1a2247" : "#ff6b35";
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}" opacity="${it.tipo==='real'?1:0.8}"><title>${esc(it.label)}: ${it.valor} guía(s)${it.tipo==="pronostico" ? " · proyectado" : ""}</title></rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${height-12}" font-size="9" fill="#94a3b8" text-anchor="middle">${esc(it.label).slice(0,5)}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="700">${it.valor}</text>
    `;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:100%;display:block;">${bars}</svg>`;
}

function biMapaCalorSvg(datos){
  const width = 600, height = 300;
  const maxT = Math.max(...datos.map(d => d.total), 1);
  const bubbles = datos.map(d => {
    const { x, y } = toXYMapa(DEPTO_COORDS[d.depto], width, height);
    const r = d.total === 0 ? 5 : 8 + (d.total/maxT)*22;
    let fill = "#cbd5e1";
    if(d.total > 0){
      const hue = 45 - (d.total/maxT)*45; // amarillo (bajo) → rojo (alto)
      fill = `hsl(${hue.toFixed(0)},85%,55%)`;
    }
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${fill}" fill-opacity="0.82" stroke="#fff" stroke-width="1.5"><title>${esc(d.depto)}: ${d.total} guía(s)</title></circle>`;
  }).join("");
  return `
    <svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:640px;display:block;margin:0 auto;">
      <path d="${ELSALVADOR_PATH}" fill="#eef1f8" stroke="#1e2761" stroke-width="2.5"/>

}

function biHorarioChart(datos){
  const width = 460, height = 220, padBottom = 28, padTop = 12;
  const maxV = Math.max(...datos.map(d => d.valor), 1);
  const gap = width / datos.length;
  const barW = gap * 0.55;
  const bars = datos.map((d,i) => {
    const h = (d.valor/maxV) * (height - padBottom - padTop);
    const x = i*gap + (gap-barW)/2;
    const y = height - padBottom - h;
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="#ff6b35"><title>${esc(d.franja)}: ${d.valor} guía(s)</title></rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${height-12}" font-size="9" fill="#94a3b8" text-anchor="middle">${esc(d.franja)}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="9.5" fill="#374151" text-anchor="middle" font-weight="700">${d.valor}</text>
    `;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:100%;display:block;">${bars}</svg>`;
}

function descargarSolicitudAfiliacionPdf(id){

  if(!s) return;
  try{
    const doc = generarPdfSolicitudAfiliacion({
      comercio: s.comercio, telefono: s.telefono, correo: s.correo, direccion: s.direccion,
      contactoNombre: s.contactoNombre, contactoTelefono: s.contactoTelefono,

      fotos: { duiFrente: s.duiFrente, duiReverso: s.duiReverso, nitFrente: s.nitFrente, nitReverso: s.nitReverso },

  }catch(e){
    console.error("Error generando el PDF de la solicitud:", e);
    mostrarNotificacion("No se pudo generar el PDF de esta solicitud.");
    return;
  }
  s.descargada = true;
  guardarSolicitudAfiliacionEnFirestore(s);
  render();
}

/* Pendiente/Atendida: control manual para que el equipo comercial lleve
   seguimiento de a cuáles solicitudes ya les dio trámite. Todas las
   solicitudes quedan siempre en este histórico (nunca se borran), solo
   cambia su estado. */
function cambiarEstadoSolicitudAfiliacion(id, nuevoEstado){
  const s = SOLICITUDES_AFILIACION.find(x => x.id === id);
  if(!s) return;
  s.estado = nuevoEstado;
  guardarSolicitudAfiliacionEnFirestore(s);
  render();
}

const MIS_GUIAS_POR_PAGINA = 25;

function screenMisGuias(){

  const activas = GUIAS.filter(g => g.cuenta === CLIENTE_ACTUAL && !g.eliminada);

      <button class="tab-btn ${enPapelera ? 'active' : ''}" onclick="setMisGuiasTab('papelera')">🗑️ Papelera <span class="count">${eliminadas.length}</span></button>
    </div>

      <div class="search-box">
        🔎 <input id="misGuiasFiltro" type="text" placeholder="Buscar por número de guía, estado, dirección, municipio o departamento..." value="${esc(state.misGuiasFiltro || "")}" oninput="onMisGuiasFiltro(this.value)" />
      </div>
      <div id="misGuiasListaWrap">${misGuiasListaHtml(state.misGuiasFiltro || "")}</div>
    </div>
  `;
}

function misGuiasFiltered(filtro){
  const enPapelera = state.misGuiasTab === "papelera";
  const todas = GUIAS.filter(g => g.cuenta === CLIENTE_ACTUAL);
  const base = todas.filter(g => enPapelera ? g.eliminada : !g.eliminada);
  const f = (filtro || "").trim().toLowerCase();
  const lista = !f ? base : base.filter(g =>
    String(g.id).toLowerCase().includes(f) ||
    (g.estado || "").toLowerCase().includes(f) ||
    (g.estadoPago || "").toLowerCase().includes(f) ||
    (g.direccion || "").toLowerCase().includes(f) ||
    (g.municipio || "").toLowerCase().includes(f) ||
    (g.departamento || "").toLowerCase().includes(f) ||
    (g.nombre || "").toLowerCase().includes(f)
  );
  return lista.slice().sort((a,b) => (b.id||"").localeCompare(a.id||""));
}

function misGuiasPaginadas(filtro){
  const data = misGuiasFiltered(filtro===undefined ? state.misGuiasFiltro : filtro);
  const totalPaginas = Math.max(1, Math.ceil(data.length / MIS_GUIAS_POR_PAGINA));
  if(state.misGuiasPagina > totalPaginas) state.misGuiasPagina = totalPaginas;
  if(state.misGuiasPagina < 1) state.misGuiasPagina = 1;
  const inicio = (state.misGuiasPagina - 1) * MIS_GUIAS_POR_PAGINA;
  const pageData = data.slice(inicio, inicio + MIS_GUIAS_POR_PAGINA);
  return { data, pageData, totalPaginas, inicio };
}

function cambiarPaginaMisGuias(delta){
  state.misGuiasPagina += delta;
  refreshMisGuiasTabla();
}

function toggleSeleccionMisGuia(id){
  const idx = state.misGuiasSeleccionadas.indexOf(id);
  if(idx === -1) state.misGuiasSeleccionadas.push(id);
  else state.misGuiasSeleccionadas.splice(idx, 1);
  refreshMisGuiasTabla();
}

function toggleSeleccionarTodasMisGuiasPagina(checked){
  const { pageData } = misGuiasPaginadas();
  pageData.forEach(g => {
    const idx = state.misGuiasSeleccionadas.indexOf(g.id);
    if(checked && idx === -1) state.misGuiasSeleccionadas.push(g.id);
    if(!checked && idx !== -1) state.misGuiasSeleccionadas.splice(idx, 1);
  });
  refreshMisGuiasTabla();
}

function deseleccionarTodasMisGuias(){
  state.misGuiasSeleccionadas = [];
  refreshMisGuiasTabla();
}

function eliminarMisGuiasSeleccionadas(){
  const ids = state.misGuiasSeleccionadas;
  if(ids.length === 0){ mostrarNotificacion("Selecciona al menos una guía para eliminar."); return; }
  const seleccionadas = ids.map(id => GUIAS.find(x => x.id === id)).filter(Boolean);
  const eliminables = seleccionadas.filter(guiaEsEliminable);
  if(eliminables.length === 0){
    mostrarNotificacion("Ninguna de las guías seleccionadas se puede eliminar (las Entregadas/Finalizadas quedan bloqueadas).");
    return;
  }
  if(!confirm(`¿Eliminar ${eliminables.length} guía(s) seleccionada(s)? Podrás restaurarlas luego desde la Papelera.`)) return;
  const fecha = new Date().toLocaleString("es-SV", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
  eliminables.forEach(g => {
    if(g.eliminada) return;
    const estadoAnterior = g.estado;
    g.eliminada = true;
    g.fechaEliminacion = fecha;
    g.eliminadaPor = state.role;
    registrarCambioGuia(g, "Guía eliminada", estadoAnterior, "Eliminada", state.role);
  });
  state.misGuiasSeleccionadas = [];
  render();
}

function refreshMisGuiasTabla(filtro){

  if(wrap) wrap.innerHTML = misGuiasListaHtml(filtro===undefined ? state.misGuiasFiltro : filtro);

/* ============ MIS RUTAS (Piloto) ============ */
/* ============ ESCANEO DE QR ============
   Dos modos completamente separados según el rol, porque el uso real es distinto:

   - PILOTO (celular): no usa lector físico. Solo la cámara del celular
     (Android o iPhone). No hay campo de búsqueda manual: se escanea un QR
     a la vez y, al detectarlo, se busca la guía y se muestra la misma
     tarjeta/lógica que ya usa el piloto en "Mis Rutas" para cambiar el
     estado (screenPilotoGuiaCard): Entregado exige foto + firma +
     confirmación de cambio de precio/depósitos; Pendiente y Devolución se
     aplican directo.

   - ADMINISTRATIVO / SUPER ADMINISTRATIVO (computadora): pensado para un
     lector físico de QR (USB o Bluetooth) conectado a la computadora, que
     funciona como un teclado. Aquí NO se abre el detalle de cada guía: el
     lector escanea de forma constante, una guía tras otra, y cada código
     se agrega a una lista de texto en pantalla, lista para seleccionar y
     copiar/pegar donde se necesite (por ejemplo, a un Excel o un correo). */
let escaneoStream = null;
let escaneoDetectorInterval = null;
let escaneoUltimoCodigoCamara = null;
let escaneoUltimoCodigoCamaraHora = 0;

function screenEscaneoQR(){
  return state.role === "Piloto" ? screenEscaneoQRPiloto() : screenEscaneoQRAdmin();
}

/* ---- Piloto: solo cámara, escaneo de una guía a la vez ---- */
function contextoInseguroCamara(){
  // getUserMedia solo funciona en https o localhost. Si el archivo se abrió
  // haciendo doble clic (file://) o desde un http:// sin cifrar, el navegador
  // bloquea la cámara sin ni siquiera mostrar el diálogo de permiso.
  return typeof location !== "undefined" && location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1";
}

function screenEscaneoQRPiloto(){
  const g = state.escaneoGuiaId ? GUIAS.find(x => x.id === state.escaneoGuiaId) : null;
  const inseguro = contextoInseguroCamara();
  return `
    <div class="page-header"><div><h1>📷 Escaneo de QR</h1><p>Escanea el QR de la guía con la cámara de tu celular para consultarla y actualizar su estado.</p></div></div>

    <div class="card pad" style="max-width:420px;">
      ${inseguro ? `
        <p class="subtle-note" style="margin:0 0 10px 0;color:#b91c1c;">⚠️ Esta página se abrió sin conexión segura (no es https). Por seguridad, los navegadores bloquean el acceso a la cámara en ese caso. Pide que te compartan el enlace https:// del sistema, o instálalo en un servidor con https, para poder usar la cámara.</p>
      ` : ""}
      ${!state.escaneoCamaraActiva ? `
        <button class="btn btn-navy" style="width:100%;" onclick="toggleCamaraEscaneo()" ${inseguro ? "disabled" : ""}>📷 Activar cámara y escanear</button>
        <p class="subtle-note" style="margin-top:8px;">Al tocar el botón, el navegador te pedirá permiso para usar la cámara — debes elegir "Permitir". Si antes elegiste "Bloquear", toca el ícono de cámara o candado en la barra de direcciones, cambia el permiso a "Permitir" y vuelve a intentar.</p>
      ` : `
        <video id="escaneoVideo" autoplay playsinline muted style="width:100%;border-radius:10px;background:#000;"></video>
        <p id="escaneoCamaraAviso" class="subtle-note" style="margin-top:8px;">Apunta la cámara al QR de la guía…</p>
        <button class="btn btn-outline" style="width:100%;margin-top:8px;" onclick="toggleCamaraEscaneo()">✕ Cerrar cámara</button>
      `}
      ${g ? `<button class="btn btn-outline" style="width:100%;margin-top:8px;" onclick="limpiarEscaneo()">🧹 Escanear otra guía</button>` : ""}
      ${state.escaneoError ? `<p class="subtle-note" style="margin-top:10px;color:#b91c1c;">${esc(state.escaneoError)}</p>` : ""}
    </div>

    ${g ? `
      <p style="font-size:13.5px;font-weight:700;color:#374151;margin:20px 0 10px 0;">Guía encontrada</p>
      <div style="max-width:640px;">${screenPilotoGuiaCard(g)}</div>
    ` : ""}
  `;
}

/* ---- Administrativo / Super Administrativo: dos pestañas —
   1) Cámara: idéntica a la del Piloto (escanea y consulta la guía).
   2) Lector físico: detecta un lector USB/Bluetooth conectado a la
      computadora para escanear una guía tras otra, fuera del sistema. ---- */
function screenEscaneoQRAdmin(){
  const modo = state.escaneoModoAdmin || "camara";
  return `
    <div class="page-header"><div><h1>📷 Escaneo de QR</h1><p>Elige cómo quieres escanear: con la cámara para consultar una guía, o con un lector físico para capturar códigos fuera del sistema.</p></div></div>

    <div class="tab-bar">
      <button class="tab-btn ${modo === "camara" ? "active" : ""}" onclick="cambiarModoEscaneoAdmin('camara')">📷 Cámara</button>
      <button class="tab-btn ${modo === "lector" ? "active" : ""}" onclick="cambiarModoEscaneoAdmin('lector')">🔌 Lector físico (fuera del sistema)</button>
    </div>

    ${modo === "camara" ? screenEscaneoQRPiloto() : screenEscaneoQRLectorFisico()}
  `;
}

/* ---- Lector físico (USB/Bluetooth): escaneo constante de varias guías,
   solo para extraer el texto (copiar/pegar) fuera del sistema. ---- */
function screenEscaneoQRLectorFisico(){
  const lista = state.escaneoLista || [];
  const texto = lista.join("\n");
  return `
    <div class="card pad" style="max-width:520px;">
      <label style="display:block;font-size:11px;font-weight:600;color:var(--gray);margin-bottom:4px;">Escaneo constante con lector físico</label>
      <input id="escaneoInput" type="text" autofocus placeholder="Toca aquí y escanea con el lector físico" value="${esc(state.escaneoCodigo)}" oninput="onEscaneoCodigoInput(this.value)" onkeydown="onEscaneoKeydown(event)" />
      <p class="subtle-note" style="margin:6px 0 0 0;">Conecta el lector USB/Bluetooth a la computadora, deja este campo enfocado y escanea sin tocar nada más entre guía y guía.</p>
      ${state.escaneoError ? `<p class="subtle-note" style="margin-top:8px;color:#b91c1c;">${esc(state.escaneoError)}</p>` : ""}
    </div>

    <div class="card pad" style="max-width:520px;margin-top:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <label style="font-size:11px;font-weight:600;color:var(--gray);">Códigos escaneados (${lista.length})</label>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" onclick="copiarListaEscaneo()">📋 Copiar todo</button>
          <button class="btn btn-outline" onclick="limpiarListaEscaneo()">🧹 Limpiar lista</button>
        </div>
      </div>
      <textarea id="escaneoListaTexto" readonly style="width:100%;min-height:180px;margin-top:8px;font-family:monospace;font-size:12.5px;" placeholder="Aquí aparecerán los códigos a medida que los escanees…">${esc(texto)}</textarea>
      <p class="subtle-note" style="margin-top:6px;">Por seguridad, aquí solo se captura el código de la guía — nunca destinatario, teléfono, dirección ni precio — igual que en la consulta pública del QR sin acceso al sistema.</p>
      ${state.escaneoCopiadoAviso ? `<p class="subtle-note" style="margin-top:6px;color:#047857;">✅ Lista copiada al portapapeles.</p>` : ""}
    </div>
  `;
}

function cambiarModoEscaneoAdmin(modo){
  state.escaneoModoAdmin = modo;
  state.escaneoError = "";
  if(modo !== "camara"){
    detenerCamaraEscaneo();
    state.escaneoCamaraActiva = false;
    state.escaneoGuiaId = null;
  }
  render();
}

function onEscaneoCodigoInput(v){
  state.escaneoCodigo = v;
}

function onEscaneoKeydown(event){
  // Los lectores de QR/código de barras envían el texto y luego un Enter
  // automático — así detectamos que terminó de escanear.
  if(event.key === "Enter"){
    event.preventDefault();
    procesarCodigoEscaneadoLector(state.escaneoCodigo);
  }
}

/* Lector físico (USB/Bluetooth), pestaña "fuera del sistema": solo agrega
   el código a la lista de texto — no abre ni modifica ninguna guía. */
function procesarCodigoEscaneadoLector(valor){
  const codigo = String(valor || "").trim();
  if(!codigo){
    state.escaneoError = "Escanea el código con el lector físico.";
    render();
    return;
  }
  if(!state.escaneoLista) state.escaneoLista = [];
  state.escaneoLista.push(codigo);
  state.escaneoCodigo = "";
  state.escaneoError = "";
  state.escaneoCopiadoAviso = false;
  render();
  const input = document.getElementById("escaneoInput");
  if(input) input.focus();
}

/* Cámara (Piloto, y pestaña "Cámara" de Administrativo/Super
   Administrativo): busca la guía y abre la tarjeta para cambiar su
   estado — un escaneo a la vez, igual para todos los roles. */
/* Extrae el número/código de guía a partir de lo leído por el lector o la
   cámara. Desde que el QR codifica toda la información de la guía en JSON
   (ver datosQrGuia), lo escaneado ya no es directamente el número de guía
   sino un texto como {"guia":"G-001","codigo":"...",...}. Esta función
   detecta ese caso y devuelve el valor de "guia" (o "codigo" si "guia" no
   viene) para poder seguir buscando la guía normalmente. Si el texto no es
   JSON (QR viejo, o un código de barras plano leído con lector físico), se
   devuelve tal cual, sin cambios. */
function extraerCodigoGuiaDeTexto(valor){
  const texto = String(valor || "").trim();
  if(texto.startsWith("{")){
    try{
      const datos = JSON.parse(texto);
      return String(datos.guia || datos.codigo || texto).trim();
    }catch(e){
      return texto; // JSON incompleto/corrupto (mala lectura de cámara): se sigue con el texto crudo
    }
  }
  return texto;
}

/* Si el código no se encuentra Y el dispositivo está sin internet en ese
   momento, lo más probable es que la guía exista pero aún no se haya
   sincronizado en este teléfono (o que se haya creado mientras estaba sin
   conexión). Se agrega esa aclaración al aviso para que el piloto no piense
   que el código está mal, sino que revise su conexión. */
function avisoSinConexionGuia(){
  if(typeof navigator !== "undefined" && navigator.onLine === false){
    return " Tu dispositivo está sin conexión a internet: si esta guía se creó hace poco, puede que aún no se haya sincronizado en este teléfono. Conéctate a internet e inténtalo de nuevo.";
  }
  return "";
}

function procesarCodigoEscaneado(valor){
  const codigo = extraerCodigoGuiaDeTexto(valor);
  if(!codigo){
    state.escaneoError = "Escanea el QR de la guía con la cámara.";
    render();
    return;
  }

  const g = GUIAS.find(x => !x.eliminada && (String(x.id).toLowerCase() === codigo.toLowerCase() || String(x.codigoBarra).toLowerCase() === codigo.toLowerCase()));
  if(!g){
    state.escaneoError = `No se encontró ninguna guía con el código "${codigo}".` + avisoSinConexionGuia();
    state.escaneoGuiaId = null;
    render();
    return;
  }
  g.escaneos = (g.escaneos || 0) + 1;
  state.escaneoError = "";
  state.escaneoGuiaId = g.id;
  state.escaneoCodigo = "";
  render();
}

function limpiarEscaneo(){
  state.escaneoGuiaId = null;
  state.escaneoCodigo = "";
  state.escaneoError = "";
  render();
}

function copiarListaEscaneo(){
  const lista = state.escaneoLista || [];
  if(lista.length === 0) return;
  const texto = lista.join("\n");
  const marcarCopiado = () => { state.escaneoCopiadoAviso = true; render(); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(marcarCopiado).catch(() => {
      const area = document.getElementById("escaneoListaTexto");
      if(area){ area.removeAttribute("readonly"); area.select(); document.execCommand("copy"); area.setAttribute("readonly", "true"); marcarCopiado(); }
    });
  } else {
    const area = document.getElementById("escaneoListaTexto");
    if(area){ area.removeAttribute("readonly"); area.select(); document.execCommand("copy"); area.setAttribute("readonly", "true"); marcarCopiado(); }
  }
}

function limpiarListaEscaneo(){
  state.escaneoLista = [];
  state.escaneoCopiadoAviso = false;
  render();
  const input = document.getElementById("escaneoInput");
  if(input) input.focus();
}

function toggleCamaraEscaneo(){
  state.escaneoCamaraActiva = !state.escaneoCamaraActiva;
  state.escaneoError = "";
  if(!state.escaneoCamaraActiva) detenerCamaraEscaneo();
  render();
}

function detenerCamaraEscaneo(){
  if(escaneoDetectorInterval){ clearInterval(escaneoDetectorInterval); escaneoDetectorInterval = null; }
  if(escaneoStream){ escaneoStream.getTracks().forEach(t => t.stop()); escaneoStream = null; }
  escaneoUltimoCodigoCamara = null;
}

/* Lee el QR con la cámara (celular o computadora con webcam). Usa
   BarcodeDetector cuando el navegador lo soporta; si no, avisa claramente
   en pantalla. Se llama de nuevo después de cada render mientras la cámara
   esté activa, porque el <video> se destruye y se vuelve a crear cada vez
   que la pantalla cambia — por eso reutiliza el mismo stream ya autorizado
   en vez de pedir permiso de cámara otra vez, y siempre reinicia la
   detección apuntando al <video> más reciente.
   Igual para todos los roles que pueden usar la cámara (Piloto, y la
   pestaña "Cámara" de Administrativo/Super Administrativo): al detectar
   un código, se detiene la cámara y se abre la tarjeta para consultar y
   cambiar el estado de esa guía (un escaneo a la vez). */
async function initCamaraEscaneo(){
  const video = document.getElementById("escaneoVideo");
  const aviso = document.getElementById("escaneoCamaraAviso");
  if(!video) return;
  if(!("BarcodeDetector" in window)){
    if(aviso) aviso.textContent = "Este navegador no soporta lectura de QR por cámara. Prueba con Chrome en Android, o actualiza tu navegador.";
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.escaneoCamaraActiva = false;
    state.escaneoError = "Este navegador no permite acceder a la cámara desde esta página (falta conexión segura https). Abre el sistema desde su enlace https:// para poder escanear.";
    render();
    return;
  }
  if(!escaneoStream){
    try{
      // Esto es lo que dispara el permiso nativo del navegador ("Permitir"/"Bloquear").
      escaneoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      state.escaneoError = "";
    }catch(e){
      state.escaneoCamaraActiva = false;
      const nombre = e && e.name;
      if(nombre === "NotAllowedError" || nombre === "SecurityError" || nombre === "PermissionDeniedError"){
        state.escaneoError = "Bloqueaste el permiso de cámara para este sitio. Toca el ícono de cámara o candado en la barra de direcciones del navegador, cambia el permiso a \"Permitir\" y vuelve a tocar \"Activar cámara\".";
      } else if(nombre === "NotFoundError" || nombre === "DevicesNotFoundError"){
        state.escaneoError = "No se encontró ninguna cámara disponible en este dispositivo.";
      } else if(nombre === "NotReadableError" || nombre === "TrackStartError"){
        state.escaneoError = "La cámara está siendo usada por otra aplicación en este momento. Ciérrala e inténtalo de nuevo.";
      } else {
        state.escaneoError = "No se pudo acceder a la cámara. Revisa los permisos de cámara del navegador para este sitio e inténtalo de nuevo.";
      }
      render();
      return;
    }
  }
  video.srcObject = escaneoStream;
  try{ await video.play(); }catch(e){ /* puede lanzar si ya estaba reproduciéndose; se ignora */ }

  if(escaneoDetectorInterval) clearInterval(escaneoDetectorInterval);
  const detector = new BarcodeDetector({ formats: ["qr_code"] });
  escaneoDetectorInterval = setInterval(async () => {
    if(!state.escaneoCamaraActiva) return;
    try{
      const codigos = await detector.detect(video);
      if(codigos.length > 0 && codigos[0].rawValue){
        const texto = codigos[0].rawValue;
        state.escaneoCamaraActiva = false;
        detenerCamaraEscaneo();
        procesarCodigoEscaneado(texto);
      }
    }catch(e){ /* el cuadro aún no está listo para analizarse; se reintenta */ }
  }, 400);
}

/* Actualiza SOLO el mensaje de error y la lista de guías escaneadas en el
   DOM, sin volver a llamar a render() (que reescribe TODA la app,
   incluido el <video> de la cámara). Antes, cada código escaneado —
   incluso los que daban error, como "guía ya escaneada"— llamaba a
   render(), lo que destruía y recreaba el <video>, volvía a pedir la
   cámara y reiniciaba el detector de QR en cada escaneo. En el navegador
   del celular eso acumulaba <video> "fantasma" (desconectados del DOM
   pero aún decodificando el stream de cámara) hasta agotar memoria/recursos
   de video del dispositivo, y la app terminaba cerrándose sola. Ahora la
   cámara y su stream se quedan intactos mientras el piloto escanea varias
   guías seguidas; solo se repinta el pedacito de la lista y del error. */
function actualizarUIEscaneoRecoleccion(){
  const resumen = document.getElementById("recoleccionResumenCard");
  if(resumen) resumen.innerHTML = htmlResumenEscaneoRecoleccion();
  const errorArea = document.getElementById("recoleccionErrorArea");
  if(errorArea) errorArea.innerHTML = htmlErrorEscaneoRecoleccion();
}

function cerrarEscaneoRecoleccion(){
  detenerCamaraEscaneoRecoleccion();
  state.escaneoRecoleccionCamaraActiva = false;
  state.escaneoRecoleccionId = null;

function toggleCamaraEscaneoRecoleccion(){
  state.escaneoRecoleccionCamaraActiva = !state.escaneoRecoleccionCamaraActiva;
  state.escaneoRecoleccionError = "";
  if(!state.escaneoRecoleccionCamaraActiva) detenerCamaraEscaneoRecoleccion();
  render();
}

let recoleccionEscaneoStream = null;
let recoleccionEscaneoDetectorInterval = null;
let recoleccionUltimoCodigo = null;
let recoleccionUltimoCodigoHora = 0;

/* Escaneo continuo (varias guías seguidas sin cerrar la cámara). A
   diferencia del escaneo de "📷 Escaneo de QR" (que se detiene tras el
   primer código), aquí la cámara sigue activa después de cada detección,
   para que el piloto pueda ir escaneando todos los paquetes que recibe
   en esa recolección uno tras otro. */
async function initCamaraEscaneoRecoleccion(){
  const video = document.getElementById("recoleccionEscaneoVideo");
  const aviso = document.getElementById("recoleccionEscaneoAviso");
  if(!video) return;
  if(!("BarcodeDetector" in window)){
    if(aviso) aviso.textContent = "Este navegador no soporta lectura de QR por cámara. Prueba con Chrome en Android, o actualiza tu navegador.";
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.escaneoRecoleccionCamaraActiva = false;
    state.escaneoRecoleccionError = "Este navegador no permite acceder a la cámara desde esta página (falta conexión segura https). Abre el sistema desde su enlace https:// para poder escanear.";
    render();
    return;
  }
  if(!recoleccionEscaneoStream){
    try{
      recoleccionEscaneoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      state.escaneoRecoleccionError = "";
    }catch(e){
      state.escaneoRecoleccionCamaraActiva = false;
      const nombre = e && e.name;
      if(nombre === "NotAllowedError" || nombre === "SecurityError" || nombre === "PermissionDeniedError"){
        state.escaneoRecoleccionError = "Bloqueaste el permiso de cámara para este sitio. Toca el ícono de cámara o candado en la barra de direcciones, cambia el permiso a \"Permitir\" y vuelve a intentarlo.";
      } else if(nombre === "NotFoundError" || nombre === "DevicesNotFoundError"){
        state.escaneoRecoleccionError = "No se encontró ninguna cámara disponible en este dispositivo.";
      } else if(nombre === "NotReadableError" || nombre === "TrackStartError"){
        state.escaneoRecoleccionError = "La cámara está siendo usada por otra aplicación en este momento. Ciérrala e inténtalo de nuevo.";
      } else {
        state.escaneoRecoleccionError = "No se pudo acceder a la cámara. Revisa los permisos de cámara del navegador para este sitio e inténtalo de nuevo.";
      }
      render();
      return;
    }
  }
  video.srcObject = recoleccionEscaneoStream;
  try{ await video.play(); }catch(e){ /* puede lanzar si ya estaba reproduciéndose; se ignora */ }

  if(recoleccionEscaneoDetectorInterval) clearInterval(recoleccionEscaneoDetectorInterval);
  const detector = new BarcodeDetector({ formats: ["qr_code"] });
  recoleccionEscaneoDetectorInterval = setInterval(async () => {
    if(!state.escaneoRecoleccionCamaraActiva) return;
    try{
      const codigos = await detector.detect(video);
      if(codigos.length > 0 && codigos[0].rawValue){
        procesarCodigoEscaneadoRecoleccion(codigos[0].rawValue);
      }
    }catch(e){ /* el cuadro aún no está listo para analizarse; se reintenta */ }
  }, 400);
}

function detenerCamaraEscaneoRecoleccion(){
  if(recoleccionEscaneoDetectorInterval){ clearInterval(recoleccionEscaneoDetectorInterval); recoleccionEscaneoDetectorInterval = null; }
  if(recoleccionEscaneoStream){ recoleccionEscaneoStream.getTracks().forEach(t => t.stop()); recoleccionEscaneoStream = null; }
}

/* Valida cada código escaneado contra la solicitud activa: debe existir,
   pertenecer a la misma cuenta/tienda de la recolección, no estar ya
   escaneado en esta sesión, y seguir en "Creado". Si algo no calza, se
   muestra el aviso pero la cámara sigue activa para continuar escaneando. */
function procesarCodigoEscaneadoRecoleccion(valor){
  const codigo = extraerCodigoGuiaDeTexto(valor);
  if(!codigo) return;
  const ahora = Date.now();
  if(codigo === recoleccionUltimoCodigo && (ahora - recoleccionUltimoCodigoHora) < 2000){
    return; // mismo código detectado en cuadros seguidos de la cámara; se ignora
  }
  recoleccionUltimoCodigo = codigo;
  recoleccionUltimoCodigoHora = ahora;

  const s = SOLICITUDES_RECOLECCION.find(x => x.id === state.escaneoRecoleccionId);
  if(!s) return;

  const g = GUIAS.find(x => !x.eliminada && (String(x.id).toLowerCase() === codigo.toLowerCase() || String(x.codigoBarra).toLowerCase() === codigo.toLowerCase()));
  if(!g){
    state.escaneoRecoleccionError = `No se encontró ninguna guía con el código "${codigo}".` + avisoSinConexionGuia();
    actualizarUIEscaneoRecoleccion();
    return;
  }
  if(g.cuenta !== s.cliente){
    state.escaneoRecoleccionError = `La guía ${g.id} pertenece a otra cuenta (${g.cuenta}) y no a ${s.cliente}. No se agregó.`;
    actualizarUIEscaneoRecoleccion();
    return;
  }
  if(!state.escaneoRecoleccionGuiasEscaneadas) state.escaneoRecoleccionGuiasEscaneadas = [];
  if(state.escaneoRecoleccionGuiasEscaneadas.includes(g.id)){
    state.escaneoRecoleccionError = `La guía ${g.id} ya fue escaneada en esta recolección.`;
    actualizarUIEscaneoRecoleccion();
    return;
  }
  if(g.estado !== "Creado"){
    state.escaneoRecoleccionError = `La guía ${g.id} ya está en estado "${g.estado}", no puede recolectarse de nuevo.`;
    actualizarUIEscaneoRecoleccion();
    return;
  }

  g.escaneos = (g.escaneos || 0) + 1;
  state.escaneoRecoleccionGuiasEscaneadas.push(g.id);
  state.escaneoRecoleccionError = "";
  actualizarUIEscaneoRecoleccion();
}

/* Al finalizar, solo las guías realmente escaneadas (recibidas) en esta
   sesión pasan de "Creado" a "Recolectado" — así el número de guías
   recolectadas refleja exactamente lo que el piloto contó con la cámara. */
function finalizarEscaneoRecoleccion(){
  const s = SOLICITUDES_RECOLECCION.find(x => x.id === state.escaneoRecoleccionId);
  const escaneadas = state.escaneoRecoleccionGuiasEscaneadas || [];
  if(s && escaneadas.length > 0){
    s.estado = "Recolectado";
    guardarSolicitudRecoleccionEnFirestore(s);
    escaneadas.forEach(id => {
      const g = GUIAS.find(x => x.id === id);
      if(g && g.estado === "Creado"){
        const anterior = g.estado;
        g.estado = "Recolectado";
        g.piloto = s.piloto || g.piloto;
        registrarCambioGuia(g, "Paquete recolectado por " + (s.piloto || "piloto asignado") + " (escaneo QR en recolección)", anterior, "Recolectado", state.role || s.piloto);
      }
    });
  }
  detenerCamaraEscaneoRecoleccion();
  state.escaneoRecoleccionCamaraActiva = false;
  state.escaneoRecoleccionId = null;
  state.escaneoRecoleccionGuiasEscaneadas = [];
  state.escaneoRecoleccionError = "";
  render();
}

function marcarRecoleccionCompletada(id){
  const s = SOLICITUDES_RECOLECCION.find(x => x.id === id);
  if(!s) return;
  s.estado = "Recolectado";
  guardarSolicitudRecoleccionEnFirestore(s);

  if(s.guiaId){
    /* Recolección generada automáticamente al crear la guía: está ligada
       a una sola guía, que avanza de "Creado" a "Recolectado" apenas el
       piloto confirma, y queda registrada en su historial. */
    const g = GUIAS.find(x => x.id === s.guiaId);
    if(g && g.estado === "Creado"){
      const anterior = g.estado;
      g.estado = "Recolectado";
      g.piloto = s.piloto || g.piloto;
      registrarCambioGuia(g, "Paquete recolectado por " + (s.piloto || "piloto asignado"), anterior, "Recolectado", state.role || s.piloto);
    }
  } else {
    /* Recolección solicitada manualmente desde "Solicitar Recolección":
       no está ligada a una sola guía, sino a la recogida de todos los
       paquetes de esa tienda/cliente. Al confirmarla el piloto, TODAS las
       guías de esa cuenta que sigan en "Creado" pasan automáticamente a
       "Recolectado", sin que un administrativo tenga que cambiarlas una
       por una, y queda registrado en el historial de cada guía. */
    const guiasDeLaTienda = GUIAS.filter(g => !g.eliminada && g.cuenta === s.cliente && g.estado === "Creado");
    guiasDeLaTienda.forEach(g => {
      const anterior = g.estado;
      g.estado = "Recolectado";
      g.piloto = s.piloto || g.piloto;
      registrarCambioGuia(g, "Paquete recolectado por " + (s.piloto || "piloto asignado"), anterior, "Recolectado", state.role || s.piloto);
    });
  }
  render();
}

/* ============ RECORDATORIO HORARIO DE RECOLECCIONES (Piloto) ============
   Mientras el piloto tenga recolecciones "Asignada" sin marcar como recolectadas,
   el sistema le muestra un aviso cada hora (toast en pantalla + notificación del
   navegador si el piloto autorizó permisos) para que no se le olvide pasar por la tienda. */
const RECORDATORIO_INTERVALO_MS = 60 * 60 * 1000; // cada hora
let recordatorioIntervalId = null;

function iniciarRecordatorioRecolecciones(){
  detenerRecordatorioRecolecciones();
  if(window.Notification && Notification.permission !== "granted" && Notification.permission !== "denied"){
    Notification.requestPermission();
  }
  recordatorioIntervalId = setInterval(verificarRecordatorioRecolecciones, RECORDATORIO_INTERVALO_MS);
}

function detenerRecordatorioRecolecciones(){
  if(recordatorioIntervalId){
    clearInterval(recordatorioIntervalId);
    recordatorioIntervalId = null;
  }
}

function verificarRecordatorioRecolecciones(){
  if(state.role !== "Piloto") return;
  const pendientesTodasFechas = SOLICITUDES_RECOLECCION.filter(s => s.piloto === PILOTO_ACTUAL && s.estado === "Asignada");
  const pendientes = aplicarFiltroFecha(pendientesTodasFechas, "hoy", null, null, "fecha");
  if(pendientes.length === 0) return;
  const mensaje = pendientes.length === 1
    ? `Tienes 1 recolección pendiente en ${pendientes[0].tienda}. No se te olvide pasar por el paquete.`
    : `Tienes ${pendientes.length} recolecciones de paquetería pendientes. No se te olviden.`;
  mostrarToastRecordatorio(mensaje);
  if(window.Notification && Notification.permission === "granted"){
    new Notification("📦 Recordatorio de recolección", { body: mensaje });
  }
}

function mostrarToastRecordatorio(mensaje){
  let toast = document.getElementById("toastRecordatorio");
  if(!toast){
    toast = document.createElement("div");
    toast.id = "toastRecordatorio";
    toast.className = "toast-recordatorio";
    document.body.appendChild(toast);
  }
  toast.innerHTML = `
    <div class="ico">⏰</div>
    <div><b>Recordatorio de recolección</b><p>${mensaje}</p></div>
    <button onclick="ocultarToastRecordatorio()">✕</button>
  `;
  requestAnimationFrame(() => toast.classList.add("show"));
  clearTimeout(toast._hideTimeout);
  toast._hideTimeout = setTimeout(ocultarToastRecordatorio, 8000);
}

function ocultarToastRecordatorio(){
  const toast = document.getElementById("toastRecordatorio");
  if(toast) toast.classList.remove("show");
}

/* Arma el enlace de WhatsApp para que el piloto contacte al destinatario con
   un mensaje ya redactado (pidiendo ubicación / indicaciones de entrega).
   Usa el teléfono primario y, si no existe, el secundario. Los teléfonos se
   guardan en formato local (8 dígitos, ej. 7222-3333); wa.me exige el número
   completo con código de país, así que se antepone 503 (El Salvador) cuando
   el número no lo trae ya. Devuelve null si la guía no tiene ningún teléfono. */
function whatsappGuiaLink(g){
  const telCrudo = g.telPrimario || g.telSecundario;
  if(!telCrudo) return null;
  let digitos = String(telCrudo).replace(/\D/g, "");
  if(!digitos) return null;
  if(digitos.length === 8) digitos = "503" + digitos;
  const nombre = g.nombre || g.cliente || "";
  const mensaje = `Hola${nombre ? " " + nombre : ""}, te saluda tu repartidor asignado para la entrega de tu paquete${g.id ? " (guía " + g.id + ")" : ""}. ¿Serías tan amable de brindarme tu ubicación? Si hay alguna otra indicación que deba seguir, también me la puedes compartir. ¡Gracias!`;
  return `https://wa.me/${digitos}?text=${encodeURIComponent(mensaje)}`;
}
